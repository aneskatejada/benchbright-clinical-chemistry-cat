b (Herceptin) therapy for breast cancer?","options":["PR","CEA","HER-2/neu","Myc"],"answer":"C","rationale":"Trastuzumab is an antibody to the HER-2/neu gene\nproduct, a tyrosine kinase receptor protein. HER-\n2/neu is an oncogene that is overexpressed in some\nbreast cancers. Overexpression is associated with a\nmore aggressive clinical course but responds to\ntreatment with trastuzumab, which blocks the\nattachment of growth factor to the receptor. The\nprogesterone receptor, like the ER, is used to identify\npersons with breast cancer who are more likely to\nrespond to estrogen-suppression therapy. Myc is a\ngroup of oncogenes that are activated in various\ncancers, including lung, breast, colon, stomach,\nleukemia, and lymphoma. HER-2/neu is measured in\nplasma by immunoassay. ER, PR, and myc are\nmeasured in tissue and not plasma using\nimmunohistological stains or FISH.","difficulty":3},{"id":"HARR-5.10-Q011","topic":"5.10 Tumor Markers","question":"A person is suspected of having testicular cancer. Which type of hCG test would be most useful?","options":["Plasma immunoassay for intact hCG only","Plasma immunoassay for intact hCG and the β-hCG subunit","Plasma immunoassay for the free alpha and β-hCG subunits","Urine assay for hCG β core"],"answer":"B","rationale":"In addition to testicular cancer, hCG is produced by\ntrophoblastic tumors and choriocarcinomas. Some of\nthese tumors secrete the β-subunit without intact\nhCG. This is especially true after treatment when \nhCG is used to monitor for recurrence. The use of an\nimmunoassay that measures both the intact and free\nβ hCG will have greater sensitivity than an assay for\nintact hCG or an assay for only free subunits. Free α\nhCG subunits may be produced in persons with\ntesticular and urinary bladder (urothelial) cancer, \nbut the incidence of α hCG subunit secretion only is\nrelatively low. Urinary β core (urinary gonadotropin\npeptide) is a metabolic product of the β subunit \nand has been used to monitor for persistence of\ntrophoblastic disease and recurrence of some \nhCG-producing tumors.","difficulty":3},{"id":"HARR-5.10-Q012","topic":"5.10 Tumor Markers","question":"A patient treated for a germ cell tumor has a total and free β-hCG assay performed prior to surgery. The result is 40,000 mIU/mL. One week following surgery, the hCG is 5,000 mIU/mL. Chemotherapy is started, and the hCG is measured 1 week later and found to be 10,000 mIU/mL. What does this indicate?","options":["Recurrence of the tumor","Falsely increased hCG owing to drug interference with the assay","Analytical error with the test reported as 5,000 mIU/mL","Transient hCG increase caused by chemotherapy"],"answer":"D","rationale":"Treatment of tumors with chemotherapy often\ncauses a transient increase in the production of\ntumor markers as the drugs destroy tumor cells. \nThe half-life of hCG is 24–36 hours; therefore, the\nexpected decline 1 week postsurgery was consistent\nwith the result of 5,000 mIU/mL. Initiation of\nchemotherapy probably caused the hCG to double \nin the following week. The hCG assay should be\nmonitored at regular intervals for several months,\nsince a failure for it to decline or an increased level\nwould suggest recurrence.","difficulty":5},{"id":"HARR-5.10-Q013","topic":"5.10 Tumor Markers","question":"Which set of results for ER and PR is associated with the highest likelihood of a favorable response to treatment with estrogen-suppression therapy (tamoxifen)?","options":["ER positive, PR positive","ER positive, PR negative","ER negative, PR positive","ER negative, PR negative"],"answer":"A","rationale":"Both ER and PR receptor assays are performed on\nbreast tissue biopsies to determine the probability of\nresponse to tamoxifen. The PR receptor is produced\nfrom the ER receptor and expression of both predicts\na positive response to the drug. Less than 15% of\npersons who are ER negative and PR negative have a\nfavorable response, whereas over 75% of those who\nare positive for both receptors have a favorable\nresponse to tamoxifen.","difficulty":4},{"id":"HARR-5.10-Q014","topic":"5.10 Tumor Markers","question":"Which type of cancer is associated with the highest level of AFP?","options":["Hepatoma","Ovarian cancer","Testicular cancer","Breast cancer"],"answer":"A","rationale":"AFP is increased in all persons with yolk sac tumors \nand over 80% of those with hepatoma. Levels above\n1000 ng/mL are diagnostic of hepatoma. Ectopic \nAFP-secreting tumors are produced by ovarian,\ntesticular, breast, GI, and bladder cancers, and these\nsources should be considered when 10-fold or higher\nelevations are seen in the absence of abnormal liver\nfunction. AFP is used along with hCG to increase the\ndiagnostic sensitivity of nonseminoma testicular tumors\nand to stage the disease. Approximately 42% of persons\nwith nonseminoma testicular cancer are positive for\nhCG but over 70% are positive for hCG or AFP.","difficulty":2},{"id":"HARR-5.10-Q015","topic":"5.10 Tumor Markers","question":"Which of the following assays is recommended as a screening test for colorectal cancer in persons over 50 years old?","options":["CEA","AFP","Occult blood","Fecal trypsin"],"answer":"C","rationale":"Bleeding in the gastrointestinal tract occurs during \nthe early stages of colorectal cancer when treatment\ncan be most effective. Although occult blood can be\ncaused by many other GI problems, it is not associated\nwith benign polyps and has a sensitivity of over 80%\nfor detection of colorectal cancer. CEA is elevated in\nless than 60% of such cases. AFP is elevated in only\nabout 5% of colon cancers. Fecal trypsin is not a\nmarker for colorectal cancer, but α1-antitrypsin is\npresent in the stool in a majority of malignant colon\ntumors owing to intestinal protein loss.","difficulty":3},{"id":"HARR-5.10-Q016","topic":"5.10 Tumor Markers","question":"Which of the following assays is used to determine the risk of developing cancer?","options":["Epidermal growth factor receptor (EGF-R)","Squamous cell carcinoma antigen (SCC)","c-erb B-2 gene expression","p53 gene mutation"],"answer":"D","rationale":"The p53 gene (tumor suppressor gene) is located \non chromosome 17 and produces a protein that\ndown-regulates the cell cycle. A mutation of p53 is\nassociated with an increased incidence of many\ncancers. The c-erb B-2 gene is the same as HER-2/neu; it\ncodes for a growth factor receptor with tyrosine kinase\nactivity on the cell membrane. EGF-R is a receptor for\nepidermal growth factor and its overexpression in\nbreast tissue is associated with a poorer prognosis. SCC\nis a glycoprotein antigen found in the cytoplasm of\ntumors of squamous origin and is secreted in the\nplasma of persons with uterine cancer.","difficulty":1},{"id":"HARR-5.10-Q017","topic":"5.10 Tumor Markers","question":"A person has an elevated 24-hour urinary homovanillic acid (HVA) and vanillymandelic acid (VMA). Urinary metanephrines, chromogranin A, and neuron-specific enolase are also elevated but 5-hydroxyindoleacetic acid is within the reference range. What is the most likely diagnosis?","options":["Carcinoid tumors of the intestine","Pheochromocytoma","Neuroblastoma","Pancreatic cancer"],"answer":"C","rationale":"Neuron-specific enolase is an isoenzyme containing\ntwo gamma polypeptides that are specific for\nnervous tissue and are found in neuroendocrine\ncells. Plasma levels are increased in neuroblastomas,\ncarcinoid tumors, thyroid medullary carcinomas, \nand in some lung cancers and seminomas. Urinary\nVMA, catecholamines, and metanephrines are\nincreased in both pheochromocytoma (a tumor of\nchromaffin cells) and neuroblastoma (also a tumor \nof neuroectodermal cells derived from the neural\ncrest neuroblasts of the sympathetic ganglia). \nUrinary HVA is increased in about 75% of persons\nwith neuroblastoma but is not usually increased in\npheochromocytoma. Chromogranin A is a protein\nthat inhibits release of catecholamines and is\nincreased in pheochromocytoma, neuroblastoma,\nand carcinoid tumors. Urinary 5-hydroxyindoleacetic\nacid is increased in carcinoid tumors (enterochromaffin\ntumors).","difficulty":5},{"id":"HARR-5.10-Q018","topic":"5.10 Tumor Markers","question":"In which of the following conditions is PSA least likely to be increased?","options":["Precancerous lesions of the prostate","Postprostate biopsy","Benign prostatic hypertrophy","Post–digital rectal examination"],"answer":"D","rationale":"PSA is a serine protease responsible for liquefaction of\nthe seminal fluid. PSA has been used successfully to\nmonitor for recurrence and follow the response of\npatients to androgen-suppression therapy. Currently,\nit is one of the few FDA-approved tumor markers for\ncancer screening. Although digital rectal examination\nraises the prostatic acid phosphatase level, it does not\nincrease the concentration of PSA in the plasma. In\naddition to prostate cancer, PSA may be increased in\nacute or chronic prostate inflammation, benign\nprostate hypertrophy, and after transurethral prostate\nresection or prostate biopsy. As a result, the specificity\nof PSA is approximately 60% and the predictive value\nof a positive result approximately 30%.","difficulty":2},{"id":"HARR-5.10-Q019","topic":"5.10 Tumor Markers","question":"Which of the following statements regarding PSA is true?","options":["Complexed PSA in plasma is normally less than free PSA","Free PSA below 25% is associated with malignant disease","A total PSA below 4 ng/mL rules out malignant disease","A total PSA above 10 ng/mL is diagnostic of malignant disease"],"answer":"B","rationale":"In normal plasma, 55%–95% of the PSA is bound to\nprotease inhibitors, primarily α1-antichymotrypsin,\nand the remainder is called free PSA. At a cutoff of \n4 ng/mL commonly used for the upper reference\nlimit, total PSA has a sensitivity of approximately 60%,\nand 22% of men with a PSA below 4 ng/mL have\nevidence of early prostate cancer on biopsy. For this\nreason, some laboratories prefer a cutoff of 2.5 ng/mL\nfor total PSA. However, based upon this cutoff alone,\nthe number of false-positive findings (unnecessary\nbiopsies) would be extremely high. A PSA of \n2.6 ng/mL that was 2.6 ng/mL the previous year\nwould not likely be significant; however, a PSA of \n2.6 ng/mL that was only 1.6 ng/mL the previous year\nwould warrant further testing. In persons with a total\nPSA between 2.6 and 10.0 ng/mL, a low ratio of free\nPSA:total PSA (<25% fPSA) or a high level of\ncomplexed PSA increases the diagnostic sensitivity\nand specificity. Persons with a PSA between 2.6 and\n10.0 ng/mL are selected for biopsy if either the fPSA is\nlow or the cPSA is high. Initial studies also indicate\nthat the incomplete cleavage of the proenzyme of\nPSA (proPSA) in persons with cancer results in a high\nratio of proPSA to fPSA. This ratio was reported to\nhave better diagnostic sensitivity and specificity than\nthe percentage of fPSA alone. The probability of\ncancer when the total PSA is higher than 10 ng/mL is\napproximately 50%, and this necessitates a biopsy to\ndetermine if the prostate is malignant.","difficulty":4},{"id":"HARR-5.10-Q020","topic":"5.10 Tumor Markers","question":"A 55-year-old male with early stage prostate cancer diagnosed by biopsy had his prostate gland removed (simple prostatectomy). His PSA prior to surgery was 10.0 ng/mL. If the surgery was successful in completely removing the tumor cells, what would the PSA result be 1 month after surgery?","options":["Undetectable","1–3 ng/mL","Less than 4 ng/mL","Less than 10 ng/mL"],"answer":"A","rationale":"If the tumor were confined to the prostate, the PSA\nwould be undetectable 1 month following successful\nsurgery, since there is no other tissue source of PSA.\nThe half-life of PSA is 2.2–3.2 days, and the minimum\ndetection limit of most assays is 0.2 ng/mL or lower.\nTherefore, it would require at least 2 weeks before the\nPSA level would be undetectable. The low minimum\ndetection limit of the PSA assay, combined with the\nhigh tissue specificity of PSA, makes the test very\nsensitive in detecting recurrence.","difficulty":5},{"id":"HARR-5.11-Q001","topic":"5.11 Clinical Chemistry Problem Solving","question":"Which of the following procedures can be used to detect proportional error in a new method for glucose?","options":["Compare the standard deviation of 40 patient samples to the hexokinase method","Measure a mixture made from equal parts of normal and high-QC sera","Add 5.0 mg of glucose to 1.0 mL of a serum of known concentration and measure","Compare the mean of 40 normal samples to the hexokinase method"],"answer":"C","rationale":"Proportional error is percentage deviation from \nthe expected result, and affects the slope of the\ncalibration curve. It causes a greater absolute error\n(loss of accuracy) as concentration increases. It is\nmeasured by a recovery study in which a sample is\nspiked with known amounts of analyte. In the\nexample, the concentration should increase by \n500 mg/dL.","difficulty":1},{"id":"HARR-5.11-Q002","topic":"5.11 Clinical Chemistry Problem Solving","question":"Which of two instruments can be assumed to have the narrower bandpass? Assume that wavelength is accurately calibrated.","options":["The instrument giving the highest absorbance for a solution of 0.1 mmol/L NADH at 340 nm","The instrument giving the lowest %T for a solution of nickel sulfate at 700 nm","The instrument giving the highest %T reading for 1.0% v/v HCl at 350 nm","The instrument giving the most linear plot of absorbance versus concentration"],"answer":"A","rationale":"Bandpass is defined by the range of wavelengths\npassed through the sample at the specified\nwavelength setting. It can be measured using \nany solution having a narrow absorbance peak \n(e.g., NADH at 340 nm). The instrument producing\nthe purest monochromatic light will have the highest\nabsorbance reading.","difficulty":1},{"id":"HARR-5.11-Q003","topic":"5.11 Clinical Chemistry Problem Solving","question":"A lipemic sample gives a sodium of 130 mmol/L on an analyzer that uses a 1:50 dilution of serum or plasma before introducing it to the ion selective electrodes. The same sample gives a sodium of 142 mmol/L using a direct (undiluted) ion selective electrode. Assuming acceptable quality control, which of the following is the most appropriate course of action?","options":["Report a sodium result of 136 mmol/L","Ultracentrifuge the sample and repeat by ISE","Dilute the sample 1:4 and repeat by ISE","Report the undiluted ion selective electrode result"],"answer":"D","rationale":"Lipemic samples give lower results for sodium\n(pseudohyponatremia) when diluted prior to\nmeasurement because the H2O phase is mostly\ndiluent and a significant component of the sample\nvolume is displaced by lipid. Direct ISEs measure\nsodium in the plasma water, more accurately\nreflecting patient status.","difficulty":5},{"id":"HARR-5.11-Q004","topic":"5.11 Clinical Chemistry Problem Solving","question":"SITUATION: A 22S QC error occurs for serum calcium by atomic absorption. Fresh standards prepared in 5.0% w/v albumin are found to be linear, but repeating the controls with fresh material does not improve the QC results. Select the most likely cause of this problem.","options":["Matrix effect caused by a viscosity difference between the standards and QC sera","Chemical interference caused incomplete atomization","Incomplete deconjugation of protein-bound calcium","Ionization interference caused by excessive heat"],"answer":"B","rationale":"Poor recovery of calcium by atomic absorption is\noften caused by failure to break thermostable bonds\nbetween calcium and phosphate (a form of chemical\ninterference). This may be caused by failure to \nadd lanthanum to the diluent or by low atomizer\ntemperature. The use of 5.0 % w/v albumin in the\ncalibrator produces viscosity and protein-binding\ncharacteristics similar to plasma, helping to eliminate\nmatrix interference.","difficulty":4},{"id":"HARR-5.11-Q005","topic":"5.11 Clinical Chemistry Problem Solving","question":"SITUATION: A serum osmolality measured in the emergency department is 326 mOsm/kg. Two hours later, chemistry results are: What do these results suggest?","options":["Laboratory error in electrolyte or glucose measurement","Drug or alcohol intoxication","Specimen misidentification","Successful rehydration of the patient"],"answer":"B","rationale":"The osmolal gap is the difference between calculated\nand measured osmolality. Here, the osmolal gap is \n38 mOsm/kg. When the osmolal gap is greater \nthan 10 mOsm/kg, an unmeasured solute is present \nor an analytical error occurred when measuring the\nosmolality, electrolytes, urea, or glucose. The reference\nrange for serum osmolality is 280–295 mOsm/kg. Both\nosmolality measurements are above the URL. These\nresults point to the presence of an unmeasured\nsolute. A significant osmolal gap in samples from\nemergency department patients usually results from\nalcohol or drug consumption. The difference in\nosmolality between the two samples is 8 mOsm/kg\nand can be explained by alcohol metabolism during\nthe 2 hours between samples.","difficulty":3},{"id":"HARR-5.11-Q006","topic":"5.11 Clinical Chemistry Problem Solving","question":"When calibrating a pH meter, unstable readings occur for both pH 7.00 and 4.00 calibrators, although both can be set to within 0.1 pH unit. Select the most appropriate course of action.","options":["Measure the pH of the sample and report to the nearest 0.1 pH","Replace both calibrators with unopened buffers and recalibrate","Examine the reference electrode junction for salt crystals","Move the electrodes to another pH meter and calibrate"],"answer":"C","rationale":"Noise in pH measurements often results from a\nblocked junction between the reservoir of the\nreference electrode and test solution. This occurs\nwhen salt crystals collect at the junction or when \nKCl concentration in the reservoir increases due to\nevaporation of water. The fluid in the reference\nelectrode should be replaced with warm deionized\nwater. After the crystals have dissolved, the water is\nreplaced with fresh reference electrolyte solution.","difficulty":3},{"id":"HARR-5.11-Q007","topic":"5.11 Clinical Chemistry Problem Solving","question":"A method calls for extracting an acidic drug from urine with an anion exchange column. The pKa of the drug is 6.5. Extraction is enhanced by adjusting the sample pH to:","options":["8.5","6.5","5.5","4.5"],"answer":"A","rationale":"Extraction of a negatively charged drug onto an\nanion exchange (positively charged) column is\noptimal when more than 99% of the drug is in the\nform of anion. The extraction pH should be 2 pH units\nabove the pKa of an acidic drug. When pH = pKa the\ndrug will be 50% ionized, and when pH is greater\nthan pKa the majority of drug is anionic.","difficulty":2},{"id":"HARR-5.11-Q008","topic":"5.11 Clinical Chemistry Problem Solving","question":"SITUATION: A patient who has a positive urinalysis for glucose and ketones has a glycated Hgb of 4.0%. A fasting glucose performed the previous day was 180 mg/dL. Assuming acceptable QC, you would:","options":["Report the glycosylated Hgb","Request a new specimen and repeat the glycosylated Hgb","Perform a Hgb electrophoresis on the sample","Perform a glucose measurement on the sample"],"answer":"B","rationale":"The glycated Hgb is at the lowest normal limit \n(4%–5.5%), but the fasting glucose indicates frank\ndiabetes mellitus. Although the glycosylated Hgb\nreflects the average blood glucose 2–3 months\nearlier, the value reported is inconsistent with the\nother laboratory results. A high probability of sample\nmisidentification or analytical error necessitates that\nthe test be repeated.","difficulty":3},{"id":"HARR-5.11-Q009","topic":"5.11 Clinical Chemistry Problem Solving","question":"Quality control results for uric acid are as follows: Results should be reported from:","options":["Run 1 only","Runs 1 and 2","Runs 1, 2, and 3","Runs 1, 2, 3, and 4"],"answer":"C","rationale":"Although no single result exceeds the 2s limit, the 41s\nrule is broken on Run 4. This means that both QC1\nand QC2 exceeded +1s on Run 3 and Run 4.","difficulty":1},{"id":"HARR-5.11-Q010","topic":"5.11 Clinical Chemistry Problem Solving","question":"SITUATION: A peak blood level for orally administered theophylline (therapeutic range 8–20 mg/L) measured at 8 a.m. is 5.0 mg/L. The preceding trough level was 4.6 mg/L. What is the most likely explanation of these results?","options":["Laboratory error made on peak measurement","Specimen for peak level was collected from wrong patient","Blood for peak level was drawn too soon","Elimination rate has reached maximum"],"answer":"C","rationale":"Sample collection time is critical for accurate\ntherapeutic drug monitoring. Blood for trough levels\nmust be collected immediately before the next dose.\nBlood collection time for peak levels must not occur\nprior to complete absorption and distribution of \ndrug. This usually requires 1–2 hours for orally\nadministered drugs. The therapeutic range for\ntheophylline is 8–20 mg/L. These results are most\nconsistent with a peak sample having been drawn\nprior to complete absorption of the drug.","difficulty":4},{"id":"HARR-5.11-Q011","topic":"5.11 Clinical Chemistry Problem Solving","question":"SITUATION: A patient breathing room air has the following arterial blood gas and electrolyte results: The best explanation for these results is:","options":["Blood for electrolytes was drawn above an IV","Serum sample was hemolyzed","Venous blood was sampled for arterial blood gases","Blood gas sample was exposed to air"],"answer":"D","rationale":"A patient breathing room air cannot have an arterial\nPO2 greater than 105 mm Hg because alveolar PO2 is\n110 mm Hg when breathing 20% O2. Exposure to air\ncaused loss of CO2 gas and increased pH.","difficulty":2},{"id":"HARR-5.11-Q012","topic":"5.11 Clinical Chemistry Problem Solving","question":"SITUATION: The following lab results are reported. Which result is most likely to be erroneous?","options":["pH","Na","K","TCO2"],"answer":"D","rationale":"The pH, pCO2, and bicarbonate are normal, and\ntherefore, agree. The electrolytes are normal also, but\nthe TCO2 is increased significantly. The reference\nrange for venous TCO2 is 22–28 mmol/L. Although\nTCO2 is the sum of bicarbonate and dissolved CO2, the\nvenous TCO2 is determined almost entirely by the\nbicarbonate, since dCO2 is lost as CO2 gas when the\nvenous blood is exposed to air during processing. A\nTCO2 value of 32 mmol/L would be expected in a\nperson with metabolic alkalosis.","difficulty":2},{"id":"HARR-5.11-Q013","topic":"5.11 Clinical Chemistry Problem Solving","question":"SITUATION: Laboratory results on a patient from the emergency department are: What is the most likely explanation of these results?","options":["Sample drawn above an IV","Metabolic acidosis with increased anion gap","Diabetic ketoacidosis","Laboratory error measuring electrolytes caused by hyperglycemia"],"answer":"A","rationale":"These results are consistent with dilution of venous\nblood by intravenous fluid containing 5% dextrose\nand normal saline. The intravenous fluid is free of\npotassium and bicarbonate, accounting for the low\nlevel of these electrolytes (incompatible with life).","difficulty":2},{"id":"HARR-5.11-Q014","topic":"5.11 Clinical Chemistry Problem Solving","question":"SITUATION: A plasma sample from a person in a coma as a result of an automobile accident gave the following results: What is the best interpretation of these results?","options":["The person had a heart attack that caused the accident","The accident caused traumatic injury, but no heart attack occurred","A heart attack occurred in addition to a stroke","It is not possible to tell whether a heart attack occurred because of the extensive trauma"],"answer":"B","rationale":"The automobile accident caused both brain damage\n(coma) and muscle damage (myoglobin). The\nsandwich assay for MB uses antibodies to both the \nM and B subunits of CK-MB and therefore, is not\nsubject to interference from CK-BB that could have\nresulted from brain injury. The CK relative index is \n1.6, which is lower than would be expected if the \nCK-MB were derived from heart damage. Since the\nTnI is within normal limits, the slight increase in\nCK-MB is due to the gross release of CK from skeletal\nmuscle.","difficulty":3},{"id":"HARR-5.11-Q015","topic":"5.11 Clinical Chemistry Problem Solving","question":"SITUATION: A patient has the following electrolyte results: Assuming acceptable QC, select the best course of action.","options":["Report these results","Check the albumin, total protein, Ca, P, and Mg results; if normal, repeat the sodium test","Request a new sample","Recalibrate and repeat the potassium test"],"answer":"B","rationale":"The anion gap of this sample is < 4 mmol/L. This may\nresult from laboratory error, retention of an\nunmeasured cation (e.g., calcium), or low level of\nunmeasured anion such as phosphorus or albumin.\nThe sodium is inappropriately low for the chloride\nand bicarbonate and should be repeated if no\nbiochemical cause is apparent.","difficulty":1},{"id":"HARR-5.11-Q016","topic":"5.11 Clinical Chemistry Problem Solving","question":"A stat plasma lithium determined using an ion-selective electrode is measured at 14.0 mmol/L. Select the most appropriate course of action.","options":["Immediately report this result","Check sample for hemolysis","Call for a new specimen","Rerun the lithium calibrators"],"answer":"C","rationale":"Lithium in excess of 2.0 mmol/L is toxic (in some\nlaboratories 1.5 mmol/L is the upper therapeutic\nlimit). A level of 14 mmol/L would not occur unless\nthe sample were contaminated with lithium. \nThis would most likely result from collection in a\ngreen-stoppered tube containing the lithium salt \nof heparin.","difficulty":2},{"id":"HARR-5.11-Q017","topic":"5.11 Clinical Chemistry Problem Solving","question":"A chromatogram for blood alcohol (GC) gives broad trailing peaks and increased retention times for ethanol and internal standard. This is most likely caused by:","options":["A contaminated injection syringe","Water contamination of the column packing","Carrier gas flow rate that is too fast","Oven temperature that is too high"],"answer":"B","rationale":"Increased oven temperature or gas flow rate will\nshorten retention times and decrease peak widths.\nSyringe contamination may cause the appearance \nof ghost peaks. Water in a PEG column such as\nCarbowax used for measuring volatiles causes \nlonger retention times and loss of resolution.","difficulty":1},{"id":"HARR-5.11-Q018","topic":"5.11 Clinical Chemistry Problem Solving","question":"SITUATION: An amylase result is 550 U/L. A 1:4 dilution of the specimen in NaCl gives 180 U/L (before mathematical correction for dilution). The dilution is repeated with the same results. The technologist should:","options":["Report the amylase as 550 U/L","Report the amylase as 720 U/L","Report the amylase as 900 U/L","Dilute the sample 1:10 in distilled water and repeat"],"answer":"B","rationale":"A 1:4 dilution refers to 1 part serum and 3 parts\ndiluent; the result is multiplied by 4 to determine \nthe serum concentration. Serum may contain wheat\ngerm gluten or other natural amylase inhibitors that,\nwhen diluted, result in increased enzyme activity.\nSerum for amylase should always be diluted with\nnormal saline because chloride ions are needed for\namylase activity.","difficulty":4},{"id":"HARR-5.11-Q019","topic":"5.11 Clinical Chemistry Problem Solving","question":"SITUATION: A patient’s biochemistry results are: Select the best course of action.","options":["Report results along with an estimate of the degree of hemolysis","Repeat LD but report all other results","Request a new sample","Dilute the serum 1:2 and repeat AST and LD"],"answer":"A","rationale":"Results indicate a moderately hemolyzed sample.\nBecause sodium, calcium, and glucose are not\nsignificantly affected, results should be reported\nalong with an estimate of visible hemolysis. The\nphysician may reorder affected tests of interest.","difficulty":1},{"id":"HARR-5.11-Q020","topic":"5.11 Clinical Chemistry Problem Solving","question":"A blood sample is left on a phlebotomy tray for 4.5 hours before it is delivered to the laboratory. Which group of tests could be performed?","options":["Glucose, Na, K, Cl, TCO2","Uric acid, BUN, creatinine","Total and direct bilirubin","CK, ALT, ALP, AST"],"answer":"B","rationale":"Glucose in serum is metabolized by cells at a rate \nof about 7% per hour. Bilirubin levels will fall if the\nsample is exposed to sunlight. Transaminases should\nbe measured within 4 hours and ALP within 2 hours if\nthe sample is stored at room temperature. Uric acid,\nBUN, and creatinine are least likely to be affected.","difficulty":2},{"id":"HARR-5.11-Q021","topic":"5.11 Clinical Chemistry Problem Solving","question":"An HPLC assay for procainamide gives an internal standard peak that is 15% greater in area and height for sample 1 than sample 2. The technologist should suspect that:","options":["The column pressure increased while sample 2 was being analyzed","Less recovery from sample 2 occurred in the extraction step","The pH of the mobile phase increased during chromatography of sample 2","There was more procainamide in sample 1 than sample 2"],"answer":"B","rationale":"The internal standard compensates for variation in\nextraction, evaporation, reconstitution, and injection\nvolume. The same amount of internal standard is\nadded to all samples and standards prior to assay.\nIncreased column pH or pressure usually alters\nretention time, and may not affect peak quantitation.","difficulty":2},{"id":"HARR-5.11-Q022","topic":"5.11 Clinical Chemistry Problem Solving","question":"After staining a silica gel plate to determine the L/S ratio, the technologist notes that the lipid standards both migrated 1 cm faster than usual. The technologist should:","options":["Repeat the separation on a new silica gel plate","Check the pH of the developing solvent","Prepare fresh developing solvent and repeat the assay","Reduce solvent migration time for all subsequent runs"],"answer":"C","rationale":"TLC plates migrate in solvent until the front comes \nto 1 cm of the top of the plate. Separation of lipids \non silica gel is based upon adsorption. Higher Rf\nvalues indicate greater solubility of lipids in the\ndeveloping solvent. This may be caused by\nevaporation of H2O, lowering the polarity of the\nsolvent.","difficulty":3},{"id":"HARR-5.11-Q023","topic":"5.11 Clinical Chemistry Problem Solving","question":"A quantitative urine glucose was determined to be 160 mg/dL by the Trinder glucose oxidase method. The sample was refrigerated overnight. The next day, the glucose is repeated and found to be 240 mg/dL using a polarographic method. What is the most likely cause of this discrepancy?","options":["Poor precision when performing one of the methods","Contamination resulting from overnight storage","High levels of reducing substances interfering with the Trinder reaction","Positive interference in the polarographic method caused by hematuria"],"answer":"C","rationale":"Urine often contains high levels of ascorbate and\nother reducing substances. These may cause\nsignificant negative bias when measuring glucose\nusing a peroxidase-coupled method. The reductants\ncompete with chromogen for H2O2.","difficulty":4},{"id":"HARR-5.11-Q024","topic":"5.11 Clinical Chemistry Problem Solving","question":"SITUATION: Results of an iron profile are: These results indicate:","options":["Error in calculation of TIBC","Serum iron falls before ferritin in iron deficiency","A defect in iron transport and not Fe deficiency","Excess release of ferritin caused by injury"],"answer":"D","rationale":"Serum ferritin levels fall before iron or TIBC in iron\ndeficiency, and a low level of serum ferritin is\ndiagnostic. However, low tissue levels of ferritin may\nbe masked by increased release into the blood in liver\ndisease, infection, and acute inflammation. Although\nthis patient’s serum ferritin is within reference limits,\nserum iron is low and percent saturation is only \n10%. Note that the TIBC and transferrin results are\nboth elevated and agree. TIBC can be estimated by\nmultiplying the serum transferrin by 1.4. These results\npoint to iron deficiency.","difficulty":1},{"id":"HARR-5.11-Q025","topic":"5.11 Clinical Chemistry Problem Solving","question":"SITUATION: Results of an iron profile are: All of the following tests are useful in establishing a diagnosis of Fe deficiency except:","options":["Protein electrophoresis","Erythrocyte zinc protoporphyrin","Serum transferrin","Hgb electrophoresis"],"answer":"D","rationale":"Electrophoresis may show an elevated β-globulin\n(transferrin) characteristic of iron deficiency, or\ninflammation that would help explain a normal ferritin.\nZinc protoporphyrin is elevated in iron deficiency \nand in lead poisoning. Hemoglobinopathies and\nthalassemias are not associated with iron deficiency.","difficulty":1},{"id":"HARR-5.11-Q026","topic":"5.11 Clinical Chemistry Problem Solving","question":"Serum protein and immunofixation electrophoresis are ordered on a patient. The former is performed, but there is no evidence of a monoclonal protein. Select the best course of action.","options":["Perform quantitative Ig G, A, M","Perform the IFE on the serum","Report the result; request a urine sample for protein electrophoresis","Perform IFE on the serum and request a urine sample for IFE"],"answer":"C","rationale":"An area of restricted mobility should be identified \non serum protein electrophoresis before IFE is\nperformed. About one out of four patients with\nmultiple myeloma have monoclonal free λ or κ chains\nin urine only, and therefore, urine electrophoresis\nshould be included in initial testing.","difficulty":2},{"id":"HARR-5.11-Q027","topic":"5.11 Clinical Chemistry Problem Solving","question":"SITUATION: Hgb electrophoresis is performed and all of the Hgbs have greater anodal mobility than usual. A fast Hgb (Hgb H) is at the edge of the gel and bands are blurred. The voltage is set correctly, but the current reading on the ammeter is too low. Select the course of action that would correct this problem.","options":["Reduce the voltage","Dilute the buffer and adjust the pH","Prepare fresh buffer and repeat the test","Reduce the running time"],"answer":"C","rationale":"Increased mobility, decreased resolution, and low\ncurrent result from low ionic strength. Reducing\nvoltage will slow migration but will not improve\nresolution. Diluting the buffer will reduce the current,\nresulting in poorer resolution.","difficulty":3},{"id":"HARR-5.11-Q028","topic":"5.11 Clinical Chemistry Problem Solving","question":"A technologist is asked to use the serum from a clot tube left over from a chemistry profile run at 8 a.m. for a stat ionized calcium (Cai) at 11 a.m. The technologist should:","options":["Perform the assay on the 8 a.m. sample","Perform the test only if the serum container was tightly capped","Perform the assay on the 8 a.m. sample only if it was refrigerated","Request a new sample"],"answer":"D","rationale":"Cai is pH dependent. Heparinized blood is preferred\nbecause it can be assayed immediately. Serum \nmay be used, but the specimen must remain tightly\ncapped while clotting and centrifuging, and analyzed\nas soon as possible.","difficulty":2},{"id":"HARR-5.11-Q029","topic":"5.11 Clinical Chemistry Problem Solving","question":"SITUATION: A patient’s biochemistry results are: Select the most likely cause of these results.","options":["The sample is hemolyzed","Serum was not separated from cells in sufficient time","Lipemia is causing in vitro interference","The specimen is contaminated"],"answer":"C","rationale":"The triglyceride level is about five times normal,\ncausing the sample to be lipemic. This will cause\npseudohyponatremia (unbalanced electrolytes).\nLipemia may cause a falsely high rate reaction when\namylase is measured by turbidimetry; however, the\nhigh amylase may be associated with pancreatitis,\nwhich results in hyperlipidemia.","difficulty":1},{"id":"HARR-5.11-Q030","topic":"5.11 Clinical Chemistry Problem Solving","question":"A gastric fluid from a patient suspected of having taken an overdose of amphetamine is sent to the laboratory for analysis. The technologist should:","options":["Perform an EMIT assay for amphetamine","Refuse the sample and request serum or urine","Dilute 1:10 with H2O and filter; perform TLC for amphetamines","Titrate to pH 7.0, then follow procedure for measuring amphetamine in urine"],"answer":"C","rationale":"The gastric sample can be measured by TLC, but such\na sample should not be used in place of serum or\nurine without documentation of acceptability by \nthe reagent manufacturer or laboratory. A positive\namphetamine result by a screening test such as TLC\nor immunoassay may be caused by a related drug\nwhich interferes, and therefore, the result should be\nconfirmed by GC-MS if there is a medicolegal\nimplication.","difficulty":2},{"id":"HARR-5.11-Q031","topic":"5.11 Clinical Chemistry Problem Solving","question":"SITUATION: Results of biochemistry tests are: What should be done next?","options":["Request a new specimen","Repeat the total protein","Repeat all tests","Perform a protein electrophoresis"],"answer":"B","rationale":"All results are normal except total protein. The\nalbumin level cannot be 94% of the total protein, \nand a random error in total protein measurement\nshould be assumed.","difficulty":1},{"id":"HARR-5.11-Q032","topic":"5.11 Clinical Chemistry Problem Solving","question":"The following chart compares the monthly total bilirubin mean of Laboratory A to the monthly mean of Laboratory B, which uses the same control materials, analyzer, and method. Both laboratories performed controls at the beginning of each shift using commercially prepared liquid QC serum stored at –20°C. Which of the following conditions would explain these differences?","options":["Improper handling of the control material by Laboratory A resulted in loss of bilirubin due to photodegradation","The laboratories used a different source of bilirubin calibrator","Laboratory B obtained higher results because its precision was poorer","Carryover from another reagent falsely elevated the results of Laboratory B"],"answer":"B","rationale":"Interlaboratory variation in bilirubin results is often\ncaused by differences in the assigned value of the\ncalibrator used. Bilirubin calibrators are either \nserum-based material that have been reference\nassayed or unconjugated bilirubin stabilized by\naddition of alkali and albumin. Calibrator differences\nresult in bias and should be suspected when the\nlaboratory's mean differs significantly from the peer\ngroup's mean. The bias in this example is due to\nconstant rather than proportional error. When\nbilirubin calibrator error is suspected, the molar\nabsorptivity of the calibrator should be measured \nand the bilirubin concentration calculated.\nPhotodegradation generally results in a greater \nloss of bilirubin at higher concentration and also\ncontributes to random error.","difficulty":4},{"id":"HARR-5.11-Q033","topic":"5.11 Clinical Chemistry Problem Solving","question":"After installing a new analyzer and reviewing the results of patients for 1 month, the lead technologist notices a greater frequency of patients with abnormally high triglyceride results. Analysis of all chemistry profiles run the next day indicated that triglyceride results are abnormal whenever the test is run immediately after any sample that is measured for lipase. These observations point to which type of error?","options":["Specificity of the triglyceride reagents","Precision in pipetting of lipemic samples","Bias caused by sequence of analysis","Reagent carryover"],"answer":"D","rationale":"Carryover errors are usually attributed to interference\ncaused by a sample with a very high concentration \nof analyte preceding a normal sample. However,\nreagent carryover may also occur on automated\nsystems that use common reagent delivery lines or\nreusable cuvettes. In the case of lipase methods,\ntriglycerides used in the reagent may coat the\nreagent lines or cuvettes interfering with the\ntriglyceride measurements that directly follow.","difficulty":5},{"id":"HARR-5.11-Q034","topic":"5.11 Clinical Chemistry Problem Solving","question":"SITUATION: A digoxin result from a stable patient with a normal electrocardiogram (EKG) is reported as 7.4 ng/mL (URL 2.6 ng/mL) using an immunofluorescent method. Renal function tests were normal and the patient was not taking any other medications. The assay was repeated and results were the same. The sample was frozen and sent to a reference laboratory for confirmation. The result was 1.6 ng/mL measured by a competitive chemiluminescent procedure. Which best explains the discrepancy in results?","options":["The fluorescent immunoassay was performed improperly","Digoxin was lower by the chemiluminescent method because it is less sensitive","An interfering substance was present that cross-reacted with the antibody in the fluorescent immunoassay","Freezing the specimen caused lower results by converting the digoxin to an inactive metabolite"],"answer":"C","rationale":"An error was suspected because there was a\ndiscrepancy between the test result and the patient’s\nclinical status (i.e., signs of digoxin toxicity such as\nventricular arrhythmia were not present.) Some\nsubstances called DLIFs (digoxin-like immunologic\nfactors) can cross-react with antibodies used to\nmeasure digoxin. The extent of interference varies\nwith the source of anti-digoxin used. In addition,\nfalsely elevated digoxin results may result from\naccidental ingestion of plant poisons such as\noleandrin and from administration of Digibind, \na Fab fragment against digoxin that is used to \nreverse digoxin toxicity.","difficulty":5},{"id":"HARR-5.11-Q035","topic":"5.11 Clinical Chemistry Problem Solving","question":"The following results are reported on an adult male patient being evaluated for chest pain: What is the most likely cause of these results?","options":["The wrong sample was assayed for the first myoglobin","The patient did not suffer an MI until after admission","Hemolysis caused interference with the 3-hour and 6-hour myoglobin result","The patient is experiencing unstable angina"],"answer":"A","rationale":"Myoglobin is the first cardiac marker to rise outside\nthe URL following an MI (2–3 hours) followed by \nTnI (4–6 hours) and CK-MB (4–8 hours). The admission\nTnI and CK-MB are both elevated, and they continue\nto rise in all three samples. Because TnI and CK-MB\npeak before 24 hours post-AMI, the infarction likely\noccurred within the last 12–24 hours. The myoglobin\ncan remain elevated for up to 36 hours post-AMI \nand should have been elevated in the admission\nsample.\nMyoglobin Troponin I CK-MB\n(Cutoff = \n(Cutoff = \n(Cutoff = \n100 μg/L)\n0.03 μg/L)\n4 μg/L)\nAdmission\n12 μg/L\n1.1 μg/L\n18 μg/L\n3 hours \n360 μg/L\n1.8 μg/L\n26 μg/L\npostadmission\n6 hours \n300 μg/L\n2.4 μg/L\n40 μg/L\npostadmission","difficulty":3},{"id":"HARR-5.11-Q036","topic":"5.11 Clinical Chemistry Problem Solving","question":"Analysis of normal and abnormal QCs performed at the beginning of the evening shift revealed a 22s error across levels for triglyceride. Both controls were within the 3s limit. The controls were assayed again, and one control was within the acceptable range and the other was slightly above the 2s limit. No further action was taken and the patient results that were part of the run were reported. Which statement best describes this situation?","options":["Appropriate operating procedures were followed","Remedial evaluation should have been taken, but otherwise, the actions were appropriate","Corrective action should have been taken before the controls were repeated","The controls should have been run twice before reporting results"],"answer":"C","rationale":"Quality control limits are chosen to achieve a low\nprobability of false rejection. For example, a 22s error\noccurs only once in 1,600 occurrences by chance.\nTherefore, such an error can be assumed to be\nsignificant. However, this does not mean the error \nwill occur if the controls are repeated again. The error\ndetection rate (power function) of the 22s rule is only\nabout 30% for a single run. This means that there is a\ngreater chance the repeated controls will be within\nrange than outside acceptable limits. Therefore,\ncontrols should never be repeated until the test\nsystem is evaluated for potential sources of error.\nCalibration should have been performed prior to\nrepeating the controls, and patient samples should\nhave been evaluated to determine the magnitude \nof the error before reporting.","difficulty":5},{"id":"HARR-5.11-Q037","topic":"5.11 Clinical Chemistry Problem Solving","question":"A biochemical profile routinely performed bimonthly on a renal dialysis patient showed a decreased serum calcium and decreased PTH level. Such a lab result may be explained by which of the following circumstances?","options":["Malignancy","Aluminum toxicity","Hypervitaminosis D","Acidosis"],"answer":"B","rationale":"Aluminum present in medications and dialysis bath\nfluid can cause aluminum toxicity in patients\nreceiving dialysis. Renal failure patients often display\nhigh PTH levels owing to poor retention of calcium,\nand are at risk of developing osteitis fibrosa (soft\nbones) as a result. Excess aluminum causes\nosteomalacia by inhibiting release of parathyroid\nhormone. The finding of low PTH would not be\nexpected with low serum calcium unless aluminum\npoisoning was present. Malignancy, hypervitaminosis\nD, and acidosis are associated with high serum\ncalcium.","difficulty":3},{"id":"HARR-5.11-Q039","topic":"5.11 Clinical Chemistry Problem Solving","question":"Hemoglobin electrophoresis performed on agarose at pH 8.8 gives the following results: All components of the Hgb C, S, F, A control hemolysate were within the acceptable range. What is the most likely cause of this patient’s result?","options":["HgbLepore","Hgb S-β-thalassemia (Hgb S/β+)","Hgb SC disease post-transfusion","Specimen contamination"],"answer":"C","rationale":"HemoglobinLepore results from a hybridization of the \nβ and δ genes and produces a pattern that is similar\nto Hgb S trait (AS), except that the quantity of\nHgbLepore at the Hgb S position is below 20%.\nHemoglobin S-β-thalassemia minor results in an\nincrease in Hgb A2 (and possibly Hgb F) because\nthere is reduced transcription of the structurally\nnormal β chain. However, the Hgb S should be\ngreater than the Hgb A, and the amount at the Hgb\nA2 is far too high. The concentration of Hgb at the A2\nposition is too high to result from contamination or\nto be considered as Hgb A2. This pattern appears to\nexpress two abnormal Hgbs (Hgb S and C) as well \nas the normal adult Hgb A. Because inheritance of \ntwo abnormal β genes prohibits formation of normal\nHgb A, this pattern would occur only if the patient\nhas been transfused with normal RBCs. Hemoglobin\nSC disease usually produces almost equal amounts of\nHgb C and S (and usually a slight increase in Hgb F),\nand is the most likely cause of these results. This\ncould be confirmed by acid agar electrophoresis or\nisofocusing to identify the abnormal Hgbs, and\nreview of the patient’s medical record for evidence \nof recent blood transfusion.","difficulty":4},{"id":"HARR-5.11-Q040","topic":"5.11 Clinical Chemistry Problem Solving","question":"Two consecutive serum samples give the results shown in the table above (at the top of this page) for a metabolic function profile. The instrument is a random access analyzer that uses two sample probes. The first probe aspirates a variable amount of serum for the spectrophotometric chemistry tests, and the second probe makes a 1:50 dilution of serum for electrolyte measurements. What is the most likely cause of these results?","options":["Both patients have renal failure","There is an insufficient amount of sample in both serum tubes","There is a fibrin strand in the probe used for the spectrophotometric chemistry tests","The same patient’s sample was accidentally run twice"],"answer":"C","rationale":"Electrolyte results for both patients are within the\nphysiological range but are distinctly different. The\nfirst results indicate a high potassium and increased\nanion gap, and one would expect the BUN, uric acid,\nand creatinine to be elevated. However, the results\nfor BUN and glucose are unlikely for any patient, and\nthe creatinine and uric acid signals are below the\ndetection limit of the analyzer, indicating that little or\nno sample was added. This could be caused by a\npartially obstructed sample probe, or insufficient\nsample volume. The results for the second sample are\nbelow detection limits for all spectrophotometric\ntests, which may be the result of complete probe\nobstruction or the inability to generate a detectable\nsignal with the trace quantity of serum that was\nadded. Because all of the low or undetectable signals\nare for tests sampled by the first probe, the only\nexplanation is that the probe is obstructed or\nmalfunctioning.","difficulty":5},{"id":"HARR-5.11-Q041","topic":"5.11 Clinical Chemistry Problem Solving","question":"SITUATION: A blood sample in a red-stoppered tube is delivered to the laboratory for electrolytes, calcium, and phosphorus. The tube is approximately half full and is accompanied by a purple-stoppered tube for a complete blood count that is approximately three-quarters full. The chemistry results are as follows: What is the most likely explanation of these serum calcium results?","options":["Severe hemolysis during sample collection","Laboratory error in the calcium measurement","The wrong order of draw was used for vacuum tube collection","Some anticoagulated blood was added to the red-stoppered tube"],"answer":"D","rationale":"The potassium and the calcium results are above \nand below physiological limit values, respectively.\nAlthough hemolysis could explain the high\npotassium, hemolysis does not cause a significant\nchange in serum calcium. The wrong order of draw\ncould result in the falsely low calcium value but\nwould not be sufficient to cause a result that is\nincompatible with life (and does not explain a grossly\nelevated potassium). The results and the condition \nof the tubes indicate that blood from a full tube\ncollected in K3 EDTA was added to the clot tube,\nchelating the calcium and increasing the potassium.","difficulty":4},{"id":"HARR-5.11-Q042","topic":"5.11 Clinical Chemistry Problem Solving","question":"SITUATION: A patient previously diagnosed with primary hypothyroidism and started on thyroxine replacement therapy is seen for follow-up testing after 2 weeks. The serum-free T4 is normal but the TSH is still elevated. What is the most likely explanation for these results?","options":["Laboratory error in measurement of free T4","Laboratory error in measurement of TSH","In vitro drug interference with the free T4 assay","Results are consistent with a euthyroid patient in the early phase of therapy"],"answer":"D","rationale":"Results of thyroid tests (especially in hospitalized\npatients) may sometimes appear discrepant because\nmedications and nonthyroid illnesses can affect test\nresults. The pituitary is slow to respond to thyroxine\nreplacement, and 6–8 weeks are usually required\nbefore TSH levels fall back to normal. In the early\nstage of therapy, the patient should be monitored \nby the free T4 result. This patient’s free T4 is normal,\nindicating that replacement therapy is adequate. \nThe high TSH sometimes seen in treated patients is\ncalled pituitary lag.","difficulty":4},{"id":"HARR-5.11-Q043","topic":"5.11 Clinical Chemistry Problem Solving","question":"SITUATION: A 6-year-old child being treated with phenytoin was recently placed on valproic acid for better control of seizures. After displaying signs of phenytoin toxicity including ataxia, a stat phenytoin is determined to be 15.0 mg/L (reference range 10–20 mg/L). A peak blood level drawn 5 hours after the last dose is 18.0 mg/L. The valproic acid measured at the same time is within therapeutic limits. Quality control is within acceptable limits for all tests, but the physician questions the accuracy of the results. What is the most appropriate next course of action?","options":["Repeat the valproic acid level using the last specimen","Repeat the phenytoin on both trough and peak samples using a different method","Recommend measurement of free phenytoin using the last specimen","Recommend a second trough level be measured"],"answer":"C","rationale":"Phenytoin levels must be monitored closely because\ntoxic drug levels can occur unexpectedly due to\nchanging pharmacokinetics. Phenytoin follows a\nnonlinear rate of elimination, which means that\nclearance decreases as blood levels increase. At high\nblood levels, saturation of the hepatic hydroxylating\nenzymes can occur, causing an abrupt increase in \nthe blood level from a small increase in dose. The\ndrug half-life estimated from the two drug levels is\napproximately 15 hours, which is within the range\nexpected for children, so decreased clearance is \nnot likely the problem. Valproic acid competes \nwith phenytoin for binding sites on albumin. Free\nphenytoin is the physiologically active fraction and \nis normally very low, so small changes in protein\nbinding can cause a large change in free drug. For\nexample, a 5% fall in protein binding caused by\nvalproic acid can increase the free phenytoin level \nby 50%. This patient’s free phenytoin level should \nbe measured, and the dose of phenytoin reduced \nto produce a free drug level that is within the\ntherapeutic range.","difficulty":5},{"id":"HARR-5.11-Q044","topic":"5.11 Clinical Chemistry Problem Solving","question":"The results shown in the table above are obtained from three consecutive serum samples using an automated random access analyzer that samples directly from a bar-coded tube. Calibration and QC performed at the start of the shift are within the acceptable range, and no error codes are reported by the analyzer for any tests on the three samples. Upon results verification, what is the most appropriate course of action?","options":["Report the results and proceed with other tests since no analytical problems are noted","Repeat the controls before continuing with further testing, but report the results","Check sample identification prior to reporting","Do not report BUN results for these patients or continue BUN testing"],"answer":"D","rationale":"BUN is elevated 5- to 10-fold for three consecutive\npatients in the absence of any other laboratory\nevidence of renal disease. The glucose results show\nconclusively that the samples are not from the same\npatient. Therefore, the BUN results must be caused \nby a systematic error, and should not be reported.\nFurther testing for BUN should cease until the\nanalytical components of the BUN assay are\ncompletely evaluated and the cause of these results\nidentified and corrected. This is demonstrated by\nsuccessful recalibration and performance of controls\nwithin acceptable limits. Following this, the BUN\nassay should be repeated on the three samples along\nwith all other specimens with a spurious BUN result\nthat have occurred since the start of the shift.","difficulty":5},{"id":"HARR-5.11-Q045","topic":"5.11 Clinical Chemistry Problem Solving","question":"An AFP measured on a 30-year-old pregnant woman at approximately 12 weeks gestation is 2.5 multiples of the median (MOM). What course of action is most appropriate?","options":["Repeat the serum AFP in 2 weeks","Recommend AFP assay on amniotic fluid","Repeat the AFP using the same sample by another method","Repeat the AFP using the sample by the same method"],"answer":"A","rationale":"The analytical sensitivity of immunochemical AFP\ntests is approximately 5 ng/mL. The maternal serum\nAFP at 12 weeks’ gestation is barely above the\nanalytical detection limit. Therefore, to achieve the\nneeded sensitivity, the test should be repeated at \n14 weeks. If the result is still equal to or greater than\n2.5 MOM, then ultrasound should be performed to\nverify last menstrual period dating. AFP normally \nfirst becomes detectable in maternal serum at \nweek 12 and increases by 15% per week through \nthe 26th week. Levels of 2.5 MOM or greater are\nassociated with spina bifida but also occur in ventral\nwall and abdominal wall defects, fetal death, Turner’s\nsyndrome, trisomy 13, congenital hypothyroidism,\ntyrosinemia, and several other fetal conditions. A\npositive serum test should always be repeated, and if\npositive again, followed by ultrasound. If ultrasound\ndoes not explain the elevation, amniotic fluid testing\nincluding AFP and acetylcholinesterase is usually\nrecommended.","difficulty":3},{"id":"HARR-5.11-Q046","topic":"5.11 Clinical Chemistry Problem Solving","question":"SITUATION: Biochemistry tests are performed 24 hours apart on a patient and delta-check flag is reported for inorganic phosphorus by the laboratory information system. Given the results shown in the table above, identify the most likely cause.","options":["Results suggest altered metabolic status caused by poor insulin control","The patient was not fasting when the sample was collected on day 2","The samples were drawn from two different patients","The delta-check limit is invalid when samples are collected 24 or more hours apart"],"answer":"B","rationale":"The delta check compares the difference of the\npatient’s two most recent laboratory results within a\n3-day period to a delta limit usually determined as a\npercentage difference. The purpose of the delta\ncheck is to detect sample identification errors. A\ndelta-check flag can also be caused by random\nanalytical errors and interfering substances such as\nhemolysis, icterus, and lipemia, and by metabolic\nchanges associated with disease or treatment.\nTherefore, results should be carefully considered\nbefore determining the cause. In this case, hemolysis\nand icterus can be ruled out because enzymes\nsensitive to hemolysis interference (AST, ALT, and LD)\nand bilirubin are within normal limits. Tests showing a\nsignificant difference are inorganic phosphorus, \nALP, triglycerides, and glucose. These four tests are\nelevated by diet (the ALP from postprandial secretion\nof intestinal ALP). All other tests show a high level of\nagreement between days, and the differences are\nattributable to normal physiological and analytical\nvariation.","difficulty":4},{"id":"HARR-5.11-Q047","topic":"5.11 Clinical Chemistry Problem Solving","question":"A quantitative sandwich enzyme immunoassay for intact serum hCG was performed on week 4 and the result was 40,000 mIU/mL (reference range 10,000–80,000 mIU/mL). The physician suspected a molar pregnancy and requested that the laboratory repeat the test checking for the hook effect. Which process would identify this problem?","options":["Obtain a new plasma specimen and heat inactivate before testing","Obtain a urine specimen and perform the assay","Perform a qualitative pregnancy test","Perform a serial dilution of the sample and repeat the test"],"answer":"D","rationale":"The hook effect is the result of excessive antigen\nconcentration and results in a dose response\n(calibration) curve that reverses direction at very \nhigh antigen concentrations. It occurs in two-site\ndouble antibody sandwich assays when both the\ncapture antibody and the enzyme-conjugated\nantibody are incubated with the antigen at the same\ntime. The excess antigen saturates both antibodies\npreventing formation of a double antibody sandwich.\nThe hook effect can cause results to be sufficiently\nlow to cause misdiagnosis. It can be detected by\ndiluting the sample (antigen) in which case the assay\nresult will be greater than in the undiluted sample. \nAn alternative solution is to perform the test using a\ncompetitive binding assay or a sandwich assay in\nwhich the enzyme-labeled antibody is not added\nuntil after separation of free and bound antigen.","difficulty":5},{"id":"HARR-5.11-Q048","topic":"5.11 Clinical Chemistry Problem Solving","question":"A patient presents to the emergency department with symptoms of intoxication including impaired speech and movement. The plasma osmolality was measured and found to be 330 mOs/kg. The osmolal gap was 40 mOsm/Kg. A blood alcohol was measured by the alcohol dehydrogenase method and found to be 0.15% w/v (150 mg/dL). Electrolyte results showed an increased anion gap. Ethylene glycol intoxication was suspected because the osmolal gap was greater than could be explained by ethanol alone, but gas chromatography was not available. Which of the following would be abnormal if this suspicion proved correct?","options":["Arterial blood gases","Lactic acid","Urinary ketones","Glucose"],"answer":"A","rationale":"Ethylene glycol is sometimes used as a substitute for\nethanol by alcoholics. It is metabolized to formic acid\nand glycolic acid by the liver, resulting in metabolic\nacidosis and an increased anion gap. Lactic acid,\nglucose, and urinary ketones would be useful in\nruling out other causes of metabolic acidosis, but\nwould not be abnormal as a result of ethylene glycol\nintoxication.","difficulty":5},{"id":"HARR-5.11-Q050","topic":"5.11 Clinical Chemistry Problem Solving","question":"Serial TnI assays are ordered on a patient at admission, 3 hours, and 6 hours afterwards. The samples were collected in heparinized plasma separator tubes. Following are the results (reference range 0–0.03 μg/L) These results indicate:","options":["A positive test for acute myocardial infarction","Unstable angina","Cardiac injury of severity less than myocardial infarction","Random error with the 3-hour sample"],"answer":"D","rationale":"Troponin assays produce very little fluorescence \nor chemiluminescence when plasma levels are\nwithin the reference range and near the minimum\ndetection limit of the assay. Fibrin, tube additives,\nand heterophile antibodies have been known to\ncause spurious elevations, and this result should be\ntreated as a random error because the result before\nand after are both normal.","difficulty":4}]}</script>
<script>
(()=>{'use strict';
const DATA=JSON.parse(document.getElementById('question-data').textContent);
const BANK=DATA.questions;const VERSION=DATA.version;const COUNT=Math.min(100,BANK.length);
const KEY='benchbright-chemistry-cat-v1';const app=document.getElementById('app');
const lookup=new Map(BANK.map(q=>[q.id,q]));
let state=null;let chosen=null;let showingResults=false;
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const shuffle=a=>{const z=[...a];for(let i=z.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[z[i],z[j]]=[z[j],z[i]]}return z};
const sigmoid=x=>1/(1+Math.exp(-Math.max(-20,Math.min(20,x))));
const bval=q=>(Number(q.difficulty)-3)*.85;
function posterior(answered){const grid=[];let best=-Infinity;for(let theta=-4.0;theta<=4.001;theta+=.1){let lp=-(theta*theta)/(2*1.25**2);for(const a of answered){let q=lookup.get(a.id);if(!q)continue;let p=sigmoid(theta-bval(q));lp+=a.correct?Math.log(Math.max(1e-12,p)):Math.log(Math.max(1e-12,1-p))}grid.push([theta,lp]);best=Math.max(best,lp)}let w=0,m=0,second=0;for(let [t,p] of grid){let z=Math.exp(p-best);w+=z;m+=t*z;second+=t*t*z}m/=w;return {theta:m,se:Math.sqrt(Math.max(.00001,second/w-m*m))}}
function quotas(){let cats=[...new Set(BANK.map(q=>q.topic))].sort();let raw=cats.map(t=>{let count=BANK.filter(q=>q.topic===t).length;return {t,n:count,w:count/BANK.length*COUNT}});let remaining=COUNT;raw.forEach(x=>{x.target=Math.min(x.n,Math.floor(x.w));remaining-=x.target});raw.sort((a,b)=>(b.w-b.target)-(a.w-a.target));while(remaining>0){let found=false;for(const x of raw){if(x.target<x.n){x.target++;remaining--;found=true;if(!remaining)break}}if(!found)break}return shuffle(raw.flatMap(x=>Array(x.target).fill(x.t)))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(_){}}
function load(){try{let st=JSON.parse(localStorage.getItem(KEY));if(st&&st.version===VERSION&&Array.isArray(st.answers)&&st.plan?.length===COUNT&&(!st.current||lookup.has(st.current.id))&&st.answers.length<=COUNT)return st}catch(_){}return null}
function choice(){const ix=state.answers.length;if(ix>=COUNT){state.completed=true;state.current=null;return}let topic=state.plan[ix], used=new Set(state.answers.map(a=>a.id));let pool=BANK.filter(q=>q.topic===topic&&!used.has(q.id));if(!pool.length){pool=BANK.filter(q=>!used.has(q.id))}if(!pool.length){state.completed=true;state.current=null;return}let theta=posterior(state.answers).theta;let scored=pool.map(q=>({q,dist:Math.abs(theta-bval(q))})).sort((a,b)=>a.dist-b.dist);let top=scored.slice(0,Math.min(14,scored.length));let weights=top.map(item=>Math.exp(-1.45*item.dist));let total=weights.reduce((a,b)=>a+b,0);let roll=Math.random()*total;let pick=top[top.length-1].q;for(let i=0;i<top.length;i++){roll-=weights[i];if(roll<=0){pick=top[i].q;break}}state.current={id:pick.id, order:shuffle([0,1,2,3])};chosen=null}
function fresh(){state={version:VERSION,startedAt:new Date().toISOString(),completed:false,answers:[],plan:quotas(),current:null};choice();save();showingResults=false;render()}
function sectionLabel(t){return t.replace(/^5\.\d+\s+/,'')}
function stat(k,v){return `<div class="stat"><strong>${esc(v)}</strong><small>${esc(k)}</small></div>`}
function renderStart(){const saved=load();const canResume=!!saved&&!saved.completed&&saved.current&&saved.answers.length<COUNT;return `<div class="hero"><span class="eyebrow">New · computerized adaptive practice</span><h1>Clinical Chemistry<br>Adaptive Exam</h1><p>Build confidence with an exam that selects your next question based on your previous answers. Designed for MLS / MLT (ASCP) chemistry review.</p><div class="tagline">A SMARTER WAY TO STUDY CLINICAL CHEMISTRY</div></div><div class="stats">${stat('Reviewed items available',BANK.length)}${stat('Questions per attempt',COUNT)}${stat('Difficulty bands',5)}</div><div class="content"><h2>Make every question count</h2><div class="features"><div class="feature"><span class="check">✓</span><span>Adaptive selection recalculates estimated ability after each response.</span></div><div class="feature"><span class="check">✓</span><span>Questions and answer choices are randomized with no repeats per attempt.</span></div><div class="feature"><span class="check">✓</span><span>Questions span ${new Set(BANK.map(q=>q.topic)).size} clinical chemistry sections.</span></div><div class="feature"><span class="check">✓</span><span>Full results, subject strengths and explanations at the end.</span></div></div><div class="actions"><button class="btn" id="new-exam">Start ${COUNT}-question exam →</button>${canResume?'<button class="btn secondary" id="resume">Resume saved exam</button>':''}</div><div class="note">This exam is for educational practice, not a certified or psychometrically calibrated ASCP test. Question difficulty is provisionally assigned and may not match actual exam difficulty. Your progress stays in this browser.</div></div>`}
function renderQuestion(){if(!state?.current){return `<div class="content"><p>No question is available. Please start a new attempt.</p><button class="btn" id="new-exam">Start again</button></div>`}let q=lookup.get(state.current.id),idx=state.answers.length;let choices=state.current.order.map((oi,pos)=>`<button type="button" class="option ${chosen===oi?'selected':''}" data-opt="${oi}" aria-pressed="${chosen===oi}"><span class="letter">${'ABCD'[pos]}</span><span>${esc(q.options[oi])}</span></button>`).join('');return `<div class="content"><div class="examhead"><b>Question ${idx+1} of ${COUNT}</b><span class="badge">${esc(sectionLabel(q.topic))}</span></div><div class="progress" aria-label="Exam progress"><div style="width:${100*idx/COUNT}%"></div></div><div class="muted">Select the single best answer. You cannot return to answered questions.</div><div class="prompt">${esc(q.question)}</div><div id="choices">${choices}</div><div class="examfoot"><span class="muted">${COUNT-idx-1} questions after this one</span><button class="btn" id="submit-answer" ${chosen===null?'disabled':''}>Submit &amp; continue →</button></div></div>`}
function duration(){return state?.startedAt?Math.round((Date.now()-new Date(state.startedAt).getTime())/60000):0}
function exportCsv(){const fields=['Question number','Question ID','Subject','Question','Selected option','Correct option','Correct','Difficulty','Rationale'];let lines=[fields,...state.answers.map((a,i)=>{let q=lookup.get(a.id);return [i+1,q.id,sectionLabel(q.topic),q.question,q.options[a.selected],q.options['ABCD'.indexOf(q.answer)],a.correct?'Yes':'No',q.difficulty,q.rationale]})].map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');let blob=new Blob(['\ufeff',lines],{type:'text/csv;charset=utf-8'});let url=URL.createObjectURL(blob);let link=document.createElement('a');link.href=url;link.download='BenchBright_Chemistry_CAT_results.csv';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function renderResults(){const correct=state.answers.filter(a=>a.correct).length,score=Math.round(correct/COUNT*100),p=posterior(state.answers);let cats=[...new Set(state.answers.map(a=>lookup.get(a.id).topic))].sort();let table=cats.map(t=>{let a=state.answers.filter(x=>lookup.get(x.id).topic===t),c=a.filter(x=>x.correct).length,perc=Math.round(c/a.length*100);return `<tr><td>${esc(sectionLabel(t))}</td><td>${c}/${a.length}</td><td style="min-width:100px"><div class="chartbar"><i style="width:${perc}%"></i></div><div class="mini-line">${perc}%</div></td></tr>`}).join('');let items=state.answers.map((a,i)=>{let q=lookup.get(a.id),correctText=q.options['ABCD'.indexOf(q.answer)],yourText=q.options[a.selected];return `<details><summary><span class="${a.correct?'good':'bad'}">${a.correct?'✓':'✕'}</span> Q${i+1}: ${esc(q.question.slice(0,115))}${q.question.length>115?'…':''}</summary><div class="answerbody"><p class="topic-label">${esc(sectionLabel(q.topic))} · provisional difficulty ${q.difficulty}/5</p><p class="review-question">${esc(q.question)}</p><ol type="A" class="review-options">${q.options.map(o=>`<li>${esc(o)}</li>`).join('')}</ol><p><b>Your answer:</b> <span class="${a.correct?'good':'bad'}">${esc(yourText)}</span></p><p><b>Correct answer:</b> <span class="good">${esc(correctText)}</span></p><p><b>Rationale:</b> ${esc(q.rationale)}</p></div></details>`}).join('');return `<div class="content"><span class="badge">Exam completed</span><h2 style="margin-top:12px">Your Clinical Chemistry Results</h2><div class="results-top"><div class="resultbox"><strong>${score}%</strong><small>${correct} of ${COUNT} correct</small></div><div class="resultbox"><strong>${p.theta>=0?'+':''}${p.theta.toFixed(2)}</strong><small>Estimated ability θ (practice only)</small></div><div class="resultbox"><strong>± ${p.se.toFixed(2)}</strong><small>Estimated standard error (provisional)</small></div></div><h3>Performance by subject</h3><table class="results-table"><thead><tr><th>Subject</th><th>Correct</th><th>Accuracy</th></tr></thead><tbody>${table}</tbody></table><div class="actions"><button class="btn" id="new-exam">Start another ${COUNT}-question attempt</button><button class="btn secondary" id="download">Download results CSV ↓</button></div><div class="alert">The difficulty settings are approximate rather than calibrated using student-response data. The θ estimate and score are learning indicators, not official ASCP scaled scores or pass/fail predictions.</div><div class="review"><h3>Review every question</h3><p class="muted">Expand an item to see your answer, the correct option, and its rationale. Answers are shown only after completing the exam.</p>${items}</div></div>`}
function render(){app.innerHTML=showingResults&&state?.completed?renderResults():state&&!state.completed?renderQuestion():renderStart();let newbtn=app.querySelector('#new-exam');if(newbtn)newbtn.addEventListener('click',fresh);let resume=app.querySelector('#resume');if(resume)resume.addEventListener('click',()=>{state=load();chosen=null;showingResults=false;render()});let sub=app.querySelector('#submit-answer');if(sub)sub.addEventListener('click',()=>{if(chosen===null)return;let q=lookup.get(state.current.id);let correct='ABCD'[chosen]===q.answer;state.answers.push({id:q.id,selected:chosen,correct});chosen=null;state.current=null;if(state.answers.length>=COUNT){state.completed=true;showingResults=true}else{choice()}save();render();window.scrollTo?.(0,0)});app.querySelectorAll('[data-opt]').forEach(el=>el.addEventListener('click',()=>{chosen=Number(el.dataset.opt);render()}));let dl=app.querySelector('#download');if(dl)dl.addEventListener('click',exportCsv)}
document.getElementById('brand-home').addEventListener('click',e=>{e.preventDefault();if(state&&!state.completed){if(!confirm('Leave this in-progress exam? Your answers will remain saved.'))return}state=null;showingResults=false;render()});
if(BANK.length<100){app.innerHTML='<div class="content"><h2>Question bank needs review</h2><p>This exam needs at least 100 approved questions. Update the CSV and rebuild the site.</p></div>';return}
state=load();if(state?.completed){showingResults=true;render()}else if(state){state=null;showingResults=false;render()}else render();
})();
</script>
</body>
</html>
