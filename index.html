n C?","options":["Diabetic patient","Chronic renal failure","Post–renal transplant","Chronic hepatitis"],"answer":"C","rationale":"Cystatin C is eliminated almost exclusively by the\nkidneys and plasma levels are not dependent on age,\nsex, or nutritional status. However, plasma levels are\naffected by some drugs, including those used to\nprevent renal transplant rejection. Increased plasma\nlevels have been reported in chronic inflammatory\ndiseases and cancer. Formulas are available to\ncalculate eGFR from plasma cystatin C, but unlike for\ncreatinine, the formulas must be matched to the\nmethod of assay. The eGFR derived from cystatin C\ncan detect a fall in GFR sooner and may be more\nsensitive for diabetic and other populations at risk for\nchronic kidney disease. As a screening test for eGFR, it\nhas about the same predictive value as eGFR derived\nfrom creatinine.","difficulty":5},{"id":"HARR-5.5-Q013","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"A sample of amniotic fluid collected for fetal lung maturity studies from a woman with a pregnancy compromised by hemolytic disease of the newborn (HDN) has a creatinine of 88 mg/dL. What is the most likely cause of this result?","options":["The specimen is contaminated with blood","Bilirubin has interfered with the measurement of creatinine","A random error occurred when the absorbance signal was being processed by the analyzer","The fluid is urine from accidental puncture of the urinary bladder"],"answer":"D","rationale":"Creatinine levels in this range are found only in urine\nspecimens. Adults usually excrete between 1.2 and\n1.5 g of creatinine per day. For this reason, creatinine\nis routinely measured in 24-hour urine samples to\ndetermine the completeness of collection. A 24-hour\nurine with less than 0.8 g/day indicates that some \nof the urine was probably discarded. Creatinine is \nalso used to evaluate fetal maturity. As gestation\nprogresses, more creatinine is excreted into the\namniotic fluid by the fetus. Although a level above \n2 mg/dL is not a specific indicator of maturity, a level\nbelow 2 mg/dL indicates immaturity.","difficulty":5},{"id":"HARR-5.5-Q014","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Which analyte should be reported as a ratio using creatinine concentration as a reference?","options":["Urinary microalbumin","Urinary estriol","Urinary sodium","Urinary urea"],"answer":"A","rationale":"Measurement of urinary microalbumin concentration\nshould be reported as a ratio of albumin to creatinine\n(e.g., mg albumin per g creatinine). This eliminates the\nneed for 24-hour collection in order to avoid variation\ncaused by differences in fluid intake. A dry reagent\nstrip test for creatinine is available that measures the\nability of a creatinine–copper complex to break down\nH2O2 , forming a colored complex. The strip uses\nbuffered copper II sulfate, tetramethylbenzidine, and\nanhydrous peroxide. Binding of creatinine in urine to\ncopper forms a peroxidase-like complex that results in\noxidation of the benzidine compound. Also, 24-hour\nurinary metanephrines, vanillylmandelic acid, and\nhomovanillic acid are reported per gram creatinine\nwhen measured in infants and children in order to\ncompensate for differences in body size.","difficulty":5},{"id":"HARR-5.5-Q015","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Urea is produced from:","options":["The catabolism of proteins and amino acids","Oxidation of purines","Oxidation of pyrimidines","The breakdown of complex carbohydrates"],"answer":"A","rationale":"Urea is generated by deamination of amino acids.\nMost is derived from the hepatic catabolism of\nproteins. Uric acid is produced by the catabolism \nof purines. Oxidation of pyrimidines produces \norotic acid.","difficulty":1},{"id":"HARR-5.5-Q016","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Urea concentration is calculated from the BUN by multiplying by a factor of:","options":["0.5","2.14","6.45","14"],"answer":"B","rationale":"BUN is multiplied by 2.14 to give the urea\nconcentration in mg/dL.","difficulty":4},{"id":"HARR-5.5-Q017","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Which of the statements below about serum urea is true?","options":["Levels are independent of diet","Urea is not reabsorbed by the renal tubules","High BUN levels can result from necrotic liver disease","BUN is elevated in prerenal as well as renal failure"],"answer":"D","rationale":"Urea is completely filtered by the glomeruli but\nreabsorbed by the renal tubules at a rate dependent\nupon filtrate flow and tubular status. Urea levels are a\nsensitive indicator of renal disease, becoming\nelevated by glomerular injury, tubular damage, or\npoor blood flow to the kidneys (prerenal failure).\nSerum urea (and BUN) levels are influenced by diet\nand are low in necrotic liver disease.","difficulty":3},{"id":"HARR-5.5-Q018","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"A patient’s BUN is 60 mg/dL and serum creatinine is 3.0 mg/dL. These results suggest:","options":["Laboratory error measuring BUN","Renal failure","Prerenal failure","Patient was not fasting"],"answer":"C","rationale":"BUN is affected by renal blood flow as well as by\nglomerular and tubular function. When blood flow to\nthe kidneys is diminished by circulatory insufficiency\n(prerenal failure), glomerular filtration decreases and\ntubular reabsorption increases due to slower filtrate\nflow. Because urea is reabsorbed, BUN levels rise\nhigher than creatinine. This causes the BUN:creatinine\nratio to be greater than 10:1 in prerenal failure.","difficulty":5},{"id":"HARR-5.5-Q019","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Urinary urea measurements may be used for calculation of:","options":["Glomerular filtration","Renal blood flow","Nitrogen balance","All of these options"],"answer":"C","rationale":"Because BUN is handled by the tubules, serum levels\nare not specific for glomerular filtration rate. Urea\nclearance is influenced by diet and liver function as\nwell as renal function. Protein intake minus excretion\ndetermines nitrogen balance. A negative balance\n(excretion exceeds intake) occurs in stress, starvation,\nfever, cachexia, and chronic illness.\nNitrogen balance = (Protein intake in grams \nper day ÷ 6.25) – (Urine urea nitrogen in grams \nper day + 4), where 4 estimates the protein\nnitrogen lost in the feces per day and dividing \nby 6.25 converts protein to protein nitrogen.","difficulty":2},{"id":"HARR-5.5-Q020","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"BUN is determined electrochemically by coupling the urease reaction to measurement of:","options":["Potential with a urea-selective electrode","The timed rate of increase in conductivity","The oxidation of ammonia","Carbon dioxide"],"answer":"B","rationale":"A conductivity electrode is used to measure the\nincrease in conductance of the solution as urea is\nhydrolyzed by urease in the presence of sodium\ncarbonate.","difficulty":2},{"id":"HARR-5.5-Q021","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"In the ultraviolet enzymatic method for BUN, the urease reaction is coupled to a second enzymatic reaction using:","options":["AST","Glutamate dehydrogenase","Glutamine synthetase","Alanine aminotransferase (ALT)"],"answer":"B","rationale":"BUN is most frequently measured by the urease-UV\nmethod in which the urease reaction is coupled \nto the glutamate dehydrogenase reaction, \ngenerating NAD+.","difficulty":2},{"id":"HARR-5.5-Q022","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Which product is measured in the coupling step of the urease-UV method for BUN?","options":["CO2","Dinitrophenylhydrazine","Diphenylcarbazone","NAD+"],"answer":"D","rationale":"In the urease-UV method, urease is used to hydrolyze\nurea, forming CO2 and ammonia. Glutamate\ndehydrogenase catalyzes the oxidation of NADH,\nforming glutamate from 2-oxoglutarate and\nammonia. The glutamate dehydrogenase reaction is\nused for measuring both BUN and ammonia.","difficulty":2},{"id":"HARR-5.5-Q023","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Which enzyme deficiency is responsible for phenylketonuria (PKU)?","options":["Phenylalanine hydroxylase","Tyrosine transaminase","p-Hydroxyphenylpyruvic acid oxidase","Homogentisic acid oxidase"],"answer":"A","rationale":"PKU is an overflow aminoaciduria resulting from \nthe accumulation of phenylalanine. It is caused by \na deficiency of phenylalanine hydroxylase, which\nconverts phenylalanine to tyrosine. Excess\nphenylalanine accumulates in blood. This is\ntransaminated, forming phenylpyruvic acid, \nwhich is excreted in the urine.","difficulty":1},{"id":"HARR-5.5-Q024","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Which of the following conditions is classified as a renal-type aminoaciduria?","options":["Fanconi syndrome","Wilson’s disease","Hepatitis","Homocystinuria"],"answer":"A","rationale":"Fanconi  syndrome is an inherited disorder\ncharacterized by anemia, mental retardation, rickets,\nand aminoaciduria. Because the aminoaciduria\nresults from a defect in the renal tubule, it is\nclassified as a (secondary-inherited) renal-type\naminoaciduria. Wilson’s disease  (inherited\nceruloplasmin deficiency) causes hepatic failure. It \nis classified as a secondary-inherited overflow-type\naminoaciduria because the aminoaciduria results\nfrom urea cycle failure. Hepatitis is classified as a\nsecondary-acquired overflow-type aminoaciduria.\nHomocystinuria is a primary-inherited overflow-type\naminoaciduria, and is caused by a deficiency of\ncystathionine synthase.","difficulty":4},{"id":"HARR-5.5-Q025","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Which aminoaciduria results in the overflow of branched chain amino acids?","options":["Hartnup’s disease","Alkaptonuria","Homocystinuria","Maple syrup urine disease"],"answer":"D","rationale":"Valine, leucine, and isoleucine accumulate due to\nbranched-chain decarboxylase deficiency in maple\nsyrup urine disease. These are transaminated to\nketoacids that are excreted, giving urine a maple\nsugar odor. Alkaptonuria is caused by homogentisic\nacid oxidase deficiency, causing homogentisic\naciduria. Homocystinuria is a no-threshold-type\naminoaciduria that usually results from cystathionine\nsynthase deficiency.","difficulty":4},{"id":"HARR-5.5-Q026","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"In addition to phenylketonuria, maple syrup urine disease, and homocystinuria, what other aminoaciduria can be detected by tandem MS?","options":["Alkaptonuria","Hartnup disease","Citrullinemia","Cystinuria"],"answer":"C","rationale":"Most states use electrospray ionization tandem-mass\nspectroscopy (MS/MS), which can detect over 20\ninborn errors of metabolism from a single blood spot.\nTypically, this includes phenylketonuria, tyrosinemia,\nmaple syrup urine disease, homocystinuria,\ncitrullinemia, and argininosuccinate acidemia. The\nlatter two are errors of the urea cycle.","difficulty":3},{"id":"HARR-5.5-Q027","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Of the methods used to measure amino acids, which is capable of measuring fatty acids simultaneously?","options":["Tandem-mass spectroscopy","High-performance liquid chromatography","Capillary electrophoresis","Two-dimensional thin-layer chromatography"],"answer":"A","rationale":"All four methods are able to separate each amino \nacid (up to 40 species); however, tandem-mass\nspectroscopy with electrospray ionization can measure\namino acids, organic acids such as methylmalonic \nacid, and fatty acids. The acids are eluted from the\ndried blood spot with methanol after addition of\ninternal standards and then derivatized with \nbutanol–hydrochloric acid. Soft ionization of the butyl\nesters of the amino acids and butyl acylcarnitines of\norganic and fatty acids yields parent ions, and these are\nfragmented by collision with argon in the second mass\nfilter to produce daughter ions. A process called\nmultiple reaction monitoring identifies both parent \nions and neutral fragments that identify the acids.\nCarnitines are quarternary ammonium compounds\nthat carry the acids across the mitochondrial membrane.","difficulty":4},{"id":"HARR-5.5-Q028","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Blood ammonia levels are usually measured in order to evaluate:","options":["Renal failure","Acid–base status","Hepatic coma","Gastrointestinal malabsorption"],"answer":"C","rationale":"Hepatic coma is caused by accumulation of\nammonia in the brain as a result of liver failure. The\nammonia increases central nervous system pH and is\ncoupled to glutamate, a central nervous system\nneurotransmitter, forming glutamine. Blood and\ncerebrospinal fluid ammonia levels are used to\ndistinguish encephalopathy caused by cirrhosis or\nother liver disease from nonhepatic causes and to\nmonitor patients with hepatic coma.","difficulty":3},{"id":"HARR-5.5-Q030","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Which statement about ammonia is true?","options":["Normally, most of the plasma ammonia is derived from peripheral blood deamination of amino acids","Ammonia-induced coma can result from salicylate poisoning","Hepatic coma can result from Reye’s syndrome","High plasma ammonia is usually caused by respiratory alkalosis"],"answer":"C","rationale":"Ammonia produced in the intestines from the\nbreakdown of proteins by bacterial enzymes is the\nprimary source of plasma ammonia. Most of the\nammonia absorbed from the intestines is transported\nto the liver via the portal vein and converted to urea.\nBlood ammonia levels will rise in any necrotic liver\ndisease including hepatitis, Reye’s syndrome, and\ndrug-induced injury such as acetaminophen\npoisoning. In hepatic cirrhosis, shunting of portal\nblood to the general circulation causes blood\nammonia levels to rise. Ammonia crosses the blood–\nbrain barrier, which accounts for the frequency of\ncentral nervous system complications and, if severe,\nhepatic coma.","difficulty":1},{"id":"HARR-5.5-Q031","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"SITUATION: A sample for ammonia assay is taken from an IV line that had been capped and injected with lithium heparin (called a heparin lock). The sample is drawn in a syringe containing lithium heparin, and immediately capped and iced. The plasma is separated and analyzed within 20 minutes of collection, and the result is 50 μg/dL higher than one measured 4 hours before. What is the most likely explanation of these results?","options":["Significantly greater physiological variation is seen with patients having systemic, hepatic, and gastrointestinal diseases","The syringe was contaminated with ammonia","One of the two samples was collected from the wrong patient","Stasis of blood in the line caused increased ammonia"],"answer":"D","rationale":"Falsely elevated blood ammonia levels are commonly\ncaused by improper specimen collection. Venous\nstasis and prolonged storage cause peripheral\ndeamination of amino acids, causing a falsely high\nammonia level. Plasma is the sample of choice since\nammonia levels increase with storage. Lithium\nheparin and EDTA are acceptable anticoagulants; the\nanticoagulant used should be tested to make sure it\nis free of ammonia. A vacuum tube can be used if\nfilled completely. Serum may be used provided the\ntube is iced immediately, and the serum is separated\nas soon as the sample clots. The patient should be\nfasting and must not have smoked for 8 hours\nbecause tobacco smoke can double the plasma\nammonia level.","difficulty":5},{"id":"HARR-5.5-Q032","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Uric acid is derived from the:","options":["Oxidation of proteins","Catabolism of purines","Oxidation of pyrimidines","Reduction of catecholamines"],"answer":"B","rationale":"Uric acid is the principal product of purine (adenosine\nand guanosine) metabolism. Oxidation of proteins\nyields urea along with CO2, H2O, and inorganic acids.\nCatecholamines are oxidized, forming vanillylmandelic\nacid (VMA) and homovanillic acid (HVA).","difficulty":1},{"id":"HARR-5.5-Q033","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Which of the following conditions is associated with hyperuricemia?","options":["Renal failure","Chronic liver disease","Xanthine oxidase deficiency","Paget’s disease of the bone"],"answer":"A","rationale":"Excessive retention of uric acid results from renal\nfailure and diuretics (or other drugs) that block uric\nacid excretion. Hyperuricemia may result from\noverproduction of uric acid in primary essential \ngout or excessive cell turnover associated with\nmalignancy and chemotherapy. Overproduction\nmay also result from an enzyme deficiency in the\npathway forming guanosine triphosphate (GTP) \nor adenosine monophosphate (AMP) (purine\nsalvage). Hyperuricemia is also associated with\nketoacidosis and lactate acidosis, hypertension, \nand hyperlipidemia. Xanthine oxidase converts\nxanthine to uric acid; therefore, a deficiency of this\nenzyme results in low serum levels of uric acid.\nPaget’s disease of bone causes cyclic episodes of\nbone degeneration and regeneration and is\nassociated with very high serum ALP and urinary\ncalcium levels.","difficulty":3},{"id":"HARR-5.5-Q034","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Orders for uric acid are legitimate stat requests because:","options":["Levels above 10 mg/dL cause urinary tract calculi","Uric acid is hepatotoxic","High levels induce aplastic anemia","High levels cause joint pain"],"answer":"A","rationale":"Uric acid calculi form quickly when the serum uric\nacid level reaches 10 mg/dL. They are translucent\ncompact stones that often lodge in the ureters,\ncausing postrenal failure.","difficulty":1},{"id":"HARR-5.5-Q035","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Which uric acid method is associated with negative bias caused by reducing agents?","options":["Uricase coupled to the Trinder reaction","Ultraviolet uricase reaction coupled to catalase and alcohol dehydrogenase reactions","Measurement of the rate of absorbance decrease at 290 nm after addition of uricase","Phosphotungstic acid using a protein-free filtrate"],"answer":"A","rationale":"The peroxidase-coupled uricase reaction is the most\ncommon method for measuring uric acid in serum or\nplasma. Uricase methods form allantoin, carbon\ndioxide, and hydrogen peroxide from the oxidation of\nuric acid. When peroxide is used to oxidize a Trinder\ndye (e.g., a phenol derivative and 4-aminoantipyrine),\nsome negative bias may occur when high levels of\nascorbate or other reducing agents are present. Rate\nUV methods are free from this interference. Reduction\nof phosphotungstic acid by uric acid forms tungsten\nblue. This colorimetric reaction is nonspecific,\nresulting in falsely elevated uric acid caused by\nproteins and many other reducing substances.","difficulty":3},{"id":"HARR-5.6-Q001","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Kjeldahl’s procedure for total protein is based upon the premise that:","options":["Proteins are negatively charged","The pKa of proteins is the same","The nitrogen content of proteins is constant","Proteins have similar tyrosine and tryptophan content"],"answer":"C","rationale":"Kjeldahl’s method measures the nitrogen content of\nproteins as ammonium ion by back titration following\noxidation of proteins by sulfuric acid and heat. It\nassumes that proteins average 16% nitrogen by\nweight. Protein in grams per deciliter is calculated by\nmultiplying protein nitrogen by 6.25. The Kjeldahl\nmethod is a reference method for total protein that is\nused to assign a protein assay value to calibrators.","difficulty":1},{"id":"HARR-5.6-Q002","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Upon which principle is the biuret method based?","options":["The reaction of phenolic groups with CuIISO4","Coordinate bonds between Cu+2 and carbonyl and imine groups of peptide bonds.","The protein error of indicator effect producing color when dyes bind protein","The reaction of phosphomolybdic acid with protein"],"answer":"B","rationale":"Biuret is a compound with two carbonyl groups and\nthree amino groups and forms coordinate bonds\nwith Cu+2 in the same manner as does protein.\nTherefore, proteins and peptides are both measured\nin the biuret reaction. The biuret reagent consists \nof an alkaline solution of copper II sulfate. Tartrate\nsalts are added to keep the copper in solution and\nprevent turbidity. Potassium iodide prevents\nautoreduction of Cu+2.","difficulty":1},{"id":"HARR-5.6-Q003","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which statement about the biuret reaction for total protein is true?","options":["It is sensitive to protein levels below 0.1 mg/dL","It is suitable for urine, exudates, and transudates","Polypeptides and compounds with repeating imine groups react","Hemolysis will not interfere"],"answer":"C","rationale":"The biuret reaction is not sensitive to protein levels\nbelow 0.1 g/dL and, therefore, is not sensitive enough\nfor assays of total protein in CSF, urine, or transudates.\nSlight hemolysis does not cause falsely high results, \nif the absorbance of the Cu+2-protein complexes \nis measured bichromatically. However, frankly\nhemolyzed samples contain sufficient globin to \ncause positive interference. The reagent reacts with\npeptides containing at least two peptide bonds, but\ndue to the high concentration of proteins in plasma\nrelative to peptides present this reactivity causes\ninsignificant bias.","difficulty":2},{"id":"HARR-5.6-Q004","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following protein methods has the highest analytical sensitivity?","options":["Refractometry","Folin–Lowry","Turbidimetry","Direct ultraviolet absorption"],"answer":"B","rationale":"The Folin–Lowry (Lowry’s) method uses both biuret\nreagent and phosphotungstic and molybdic acids to\noxidize the aromatic side groups on proteins. The\nacids oxidize the phenolic rings of tyrosine and\ntryptophan. These, in turn, reduce the Cu+2 in the\nbiuret reagent, increasing sensitivity about 100-fold.","difficulty":1},{"id":"HARR-5.6-Q005","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following statements regarding proteins is true?","options":["Total protein and albumin are about 10% higher in ambulatory patients","Plasma total protein is about 20% higher than serum levels","Albumin normally accounts for about one-third of the cerebrospinal fluid total protein","Transudative serous fluid protein is about two-thirds of the serum total protein"],"answer":"A","rationale":"Water pools in the vascular bed in nonambulatory\npatients, lowering the total protein, albumin,\nhematocrit, and calcium. Plasma levels of total protein\nare 0.2–0.4 g/dL higher than serum (about 5%) owing\nto fibrinogen. Cerebrospinal fluid albumin levels \nare normally 10–30 mg/dL, which is approximately\ntwo-thirds of the CSF total protein. Transudates have \na total protein below 3.0 g/dL and less than 50% of\nthe serum total protein.","difficulty":2},{"id":"HARR-5.6-Q006","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Hyperalbuminemia is caused by:","options":["Dehydration syndromes","Liver disease","Burns","Gastroenteropathy"],"answer":"A","rationale":"A high serum albumin level is caused only by\ndehydration or administration of albumin. \nLiver disease, burns, gastroenteropathy, \nnephrosis, starvation, and malignancy cause\nhypoalbuminemia.","difficulty":1},{"id":"HARR-5.6-Q007","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"High serum total protein but low albumin is usually seen in:","options":["Multiple myeloma","Hepatic cirrhosis","Glomerulonephritis","Nephrotic syndrome"],"answer":"A","rationale":"In multiple myeloma, synthesis of large quantities of\nmonoclonal immunoglobulin by plasma cells often\nresults in decreased synthesis of albumin. In\nglomerulonephritis and nephrotic syndrome, both\ntotal protein and albumin are low owing to loss of\nproteins through the glomeruli. In hepatic cirrhosis,\ndecreased hepatic production of protein results in\nlow total protein and albumin.","difficulty":3},{"id":"HARR-5.6-Q008","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following conditions is most commonly associated with an elevated level of total protein?","options":["Glomerular disease","Starvation","Liver failure","Malignancy"],"answer":"D","rationale":"Malignant disease is usually associated with increased\nimmunoglobulin and acute-phase protein\nproduction. However, nutrients required for protein\nsynthesis are consumed, causing reduced hepatic\nalbumin production. Glomerular damage causes\nalbumin and other low molecular weight proteins \nto be lost through the kidneys. Liver failure and\nstarvation result in decreased protein synthesis.","difficulty":4},{"id":"HARR-5.6-Q009","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following dyes is the most specific for measurement of albumin?","options":["Bromcresol green (BCG)","Bromcresol purple (BCP)","Tetrabromosulfophthalein","Tetrabromphenol blue"],"answer":"B","rationale":"Tetrabromphenol blue and tetrabromosulfophthalein\nare dyes that change pKa in the presence of protein.\nAlthough they have greater affinity for albumin than\nglobulins, they are not sufficiently specific to apply to\nmeasurement of serum albumin. BCG and BCP are\nanionic dyes that undergo a spectral shift when they\nbind albumin at acid pH. BCP is more specific for\nalbumin than BCG. Reaction of both dyes with\nglobulins requires a longer incubation time than with\nalbumin, and reaction times are kept at 30 seconds or\nless to increase specificity. Both dyes are free of\ninterference from bilirubin. However, BCG is the\nmethod used most often. One reason for this is that\nrenal dialysis patients produce an organic acid that\ncompetes with BCP for the binding site on albumin,\ncausing a falsely low result.","difficulty":4},{"id":"HARR-5.6-Q010","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following factors is most likely to cause a falsely low result when using the BCG dye-binding assay for albumin?","options":["The presence of penicillin","An incubation time of 120 seconds","The presence of bilirubin","Lipemia"],"answer":"A","rationale":"BCG and BCP are not significantly affected by bilirubin\nor hemolysis, although negative interference caused by\nfree Hgb has been reported with some BCG methods.\nLipemic samples may cause positive interference,\nwhich can be eliminated by serum blanking. Incubation\ntimes as long as 2 minutes result in positive interference\nfrom globulins, which react with the dye. Penicillin and\nsome other anionic drugs bind to albumin at the same\nsite as the dye, causing falsely low results.","difficulty":5},{"id":"HARR-5.6-Q011","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"At pH 8.6, proteins are _________ charged and migrate toward the _________.","options":["Negatively, anode","Positively, cathode","Positively, anode","Negatively, cathode"],"answer":"A","rationale":"Proteins are amphoteric owing to ionization of acidic\nand basic side chains of amino acids. When the pH \nof the solution equals the isoelectric point (pI), the\nprotein will have no net charge and is insoluble.\nWhen the pH of the solution is above the pI, the\nprotein will have a net negative charge. Anions\nmigrate toward the anode (positive electrode).","difficulty":2},{"id":"HARR-5.6-Q012","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Electrophoretic movement of proteins toward the anode will decrease by increasing the:","options":["Buffer pH","Ionic strength of the buffer","Current","Voltage"],"answer":"B","rationale":"Electrophoresis is the migration of charged molecules\nin an electric field. Increasing the strength of the field\nby increasing voltage (or current) increases migration.\nHowever, increasing ionic strength decreases the\nmigration of proteins. Counterions (cations) in the\nbuffer move with the proteins, reducing their\nelectromagnetic attraction for the anode.","difficulty":2},{"id":"HARR-5.6-Q013","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"At pH 8.6, the cathodal movement of γ globulins is caused by:","options":["Electroendosmosis","Wick flow","A net positive charge","Cathodal sample application"],"answer":"A","rationale":"Agarose and cellulose acetate contain fixed anions\n(e.g., acetate) that attract counterions when hydrated\nwith buffer. When voltage is applied the cations\nmigrate to the cathode, creating an osmotic force\nthat draws H2O with them. This force, called\nelectroendosmosis, opposes protein migration toward\nthe anode and may cause some γ–globulins to be\ndisplaced toward the cathode.","difficulty":1},{"id":"HARR-5.6-Q014","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following conditions will prevent any migration of proteins across an electrophoretic support medium such as agarose?","options":["Using too high a voltage","Excessive current during the procedure","Loss of contact between a buffer chamber and the medium","Evaporation of solvent from the surface of the medium"],"answer":"C","rationale":"Movement of proteins is dependent upon the\npresence of a salt bridge that allows current to flow\nvia transport of ions to the electrodes across the\nsupport medium. If the salt bridge is not intact, there\nwill be no migration, even if voltage is maintained\nacross the electrodes. For agarose and cellulose\nacetate, heat causes evaporation of solvent from the\nbuffer. This increases the ionic strength, causing\ncurrent to rise during the run. Excessive heat can\ndamage the support medium and denature proteins.\nPower = E (voltage) × I (current) × t (time); since \nE = I × R (resistance), heat is proportional to the\nsquare of current (P = I2 × R × t). Constant current or\npower mode is used for long runs to prevent heat\ndamage.","difficulty":5},{"id":"HARR-5.6-Q015","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following proteins has the highest pI?","options":["Albumin","Transferrin","Ceruloplasmin","IgG"],"answer":"D","rationale":"Albumin is the fastest migrating protein toward the\nanode at pH 8.6 followed by α1-, α2-, β-, and γ-globulins.\nBecause albumin is fastest, it has the greatest net\nnegative charge and lowest pI (about 4.6). γ-Globulins\nare predominantly immunoglobulins and have the\nhighest pI (about 7.2).","difficulty":1},{"id":"HARR-5.6-Q016","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following proteins migrates in the β region at pH 8.6?","options":["Haptoglobin","Orosomucoprotein","Antichymotrypsin","Transferrin"],"answer":"D","rationale":"Transferrin, β lipoprotein, C3, and C4 are the dominant\nproteins in the β-globulin region. Haptoglobin and \nα2- macroglobulin are the principal proteins in the \nα2-fraction. α1-Antitrypsin, α1-lipoprotein, and α1-acid\nglycoprotein (orosomucoprotein) make up most of\nthe α1-fraction. Immunoglobulins dominate the \nγ region. Plasma is not used for protein electrophoresis\nbecause fibrinogen will produce a band resembling a\nsmall monoclonal protein in the beta region.","difficulty":3},{"id":"HARR-5.6-Q017","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following is one advantage of high-resolution (HR) agarose electrophoresis over lower-current electrophoresis?","options":["High-resolution procedures detect monoclonal and oligoclonal bands at a lower concentration","A smaller sample volume is used","Results are obtained more rapidly","Densitometric scanning of HR gels is more accurate"],"answer":"A","rationale":"HR agarose procedures use higher current and \na cooling device to resolve 12 or more bands.\nAdvantages include phenotyping of α1-antitrypsin\n(detection of Z and S variants), detection of \nβ2 microglobulin in urine indicating tubular\nproteinuria (often associated with drug-induced\nnephrosis), and greater sensitivity detecting\nmonoclonal gammopathies, immune complexes,\nand oligoclonal bands in CSF associated with\nmultiple sclerosis. Its disadvantage is that\ndensitometric scans of HR gels usually\nunderestimate albumin.","difficulty":4},{"id":"HARR-5.6-Q018","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following conditions is associated with “β-γ bridging”?","options":["Multiple myeloma","Malignancy","Hepatic cirrhosis","Rheumatoid arthritis"],"answer":"C","rationale":"Hepatic cirrhosis produces a polyclonal gammopathy\nassociated with a high IgA level. This obliterates \nthe valley between β and γ zones. Malignancy \nand rheumatoid arthritis produce polyclonal\ngammopathies classified as chronic inflammatory \nor delayed response patterns. Multiple myeloma\nproduces a zone of restricted mobility usually in \nthe γ, but sometimes in the β- or α2-region.","difficulty":2},{"id":"HARR-5.6-Q019","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which support medium can be used to determine the molecular weight of a protein?","options":["Cellulose acetate","Polyacrylamide gel","Agar gel","Agarose gel"],"answer":"B","rationale":"Polyacrylamide gels separate by molecular sieving\nas well as charge. Sodium dodecyl sulfate (SDS) \nis a nonionic detergent that binds to proteins,\nneutralizing their charge. Polyacrylamide gel\nelectrophoresis (PAGE) after treating with SDS\nseparates proteins on the basis of molecular size.\nThe smaller proteins become trapped in the pores\nof the gel and migrate more slowly.","difficulty":1},{"id":"HARR-5.6-Q020","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following stains is used for lipoprotein electrophoresis?","options":["Oil Red O","Coomassie Brilliant Blue","Amido Black","Ponceau S"],"answer":"A","rationale":"Oil Red O and Sudan Black B stain neutral fats and \nare used to stain lipoproteins as well as fat in urine \nor stool. The other stains are used for proteins.\nCoomassie Brilliant Blue is more sensitive than\nPonceau S or Amido Black, and all three stains have\nslightly greater affinity for albumin than globulins. \nIn addition, silver nitrate may be used to stain CSF\nproteins because it has greater sensitivity than the\nother stains.","difficulty":1},{"id":"HARR-5.6-Q022","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following conditions is usually associated with an acute inflammatory pattern?","options":["Myocardial infarction (MI)","Malignancy","Rheumatoid arthritis","Hepatitis"],"answer":"A","rationale":"MI produces a pattern of acute inflammation usually\nassociated with tissue injury. This pattern results \nfrom production of acute phase proteins including\nα1-antitrypsin, α1-antichymotrypsin, and haptoglobin.\nIt is also seen in early infection, pregnancy, and early\nnephritis. Malignancy, rheumatoid arthritis, and\nhepatitis are associated with a chronic inflammatory\npattern. This differs from the acute pattern by the\naddition of a polyclonal gammopathy.","difficulty":2},{"id":"HARR-5.6-Q023","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"The electrophoretic pattern shown in the following densitometric tracing most likely indicates:","options":["α1-Antitrypsin deficiency","Infection","Nephrosis","Systemic sclerosis"],"answer":"A","rationale":"This pattern shows a marked decrease in the \nα1-globulin (slightly less than one-fifth of the\nexpected peak area). Staining of the α1-globulin\nfraction is predominately determined by the \nα1-antitrypsin level. A value of less than 20% of\nnormal (0.2–0.4 g/dL) is usually caused by\nhomozygous α1-antitrypsin deficiency. There is a\nslight decrease in albumin and increase in the \nα2-fraction. Patients with α1-antitrypsin deficiency\noften display elevations in the α2-globulin and \nγ-globulin fraction because the condition is\nassociated with chronic emphysema and hepatic\ncirrhosis.","difficulty":4},{"id":"HARR-5.6-Q024","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"What is the clinical utility of testing for serum prealbumin?","options":["Low levels are associated with increased free cortisol","High levels are an indicator of acute inflammation","Serial low levels indicate compromised nutritional status","Levels correlate with glomerular injury in patients with diabetes mellitus"],"answer":"C","rationale":"Prealbumin (also called transthyretin) is a small\nprotein with a half-life of only 2 days. Serum levels \nfall rapidly in patients with deficient protein nutrition.\nAs a result, prealbumin is used to detect malnutrition\nand to measure the patient’s response to dietary\nsupplementation. The cutpoint used to identify\nnutritional deficiency in elderly patients is usually \n11 mg/dL. Prealbumin is usually measured by\nimmunonephelometry.","difficulty":3},{"id":"HARR-5.6-Q025","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which serum protein should be measured in a patient suspected of having Wilson’s disease?","options":["Hemopexin","Alpha-1 antitrypsin","Haptoglobin","Ceruloplasmin"],"answer":"D","rationale":"α-1 antitrypsin, haptoglobin, and ceruloplasmin \nare acute phase proteins and will be increased \nin inflammatory diseases. Ceruloplasmin is an \nα-2 globulin that binds the majority of the serum\ncopper. Levels are low in almost all patients with\nWilson’s disease, an autosomal recessive disorder\ncaused by accumulation of copper in liver, brain,\nkidney, and other tissues. Low ceruloplasmin may\noccur in patients with nephrosis, malnutrition, \nand hepatobiliary disease. Therefore, the diagnosis\nof Wilson’s disease is made by demonstrating\ndecreased plasma ceruloplasmin, increased urinary\ncopper, and the presence of Kayser–Fleischer rings\n(brown deposits at the edge of the cornea).","difficulty":5},{"id":"HARR-5.6-Q026","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"A patient with hemolytic-uremic syndrome associated with septicemia has a haptoglobin level that is normal, although the plasma free hemoglobin is elevated and hemoglobinuria is present. Which test would be more appropriate than haptoglobin to measure this patient’s hemolytic episode?","options":["Hemopexin","Alpha-1 antitrypsin","C-reactive protein","Transferrin"],"answer":"A","rationale":"Hemopexin is a small β globulin that binds to free\nheme. Haptoglobin is an α-2 globulin that binds to \nfree hemoglobin and disappears from the serum\nwhen intravascular hemolysis produces more than \n3 grams of free plasma hemoglobin. However,\nhaptoglobin is an acute phase protein, and hepatic\nproduction and release are increased in response \nto acute infections. The normal serum haptoglobin \nis most likely the result of increased synthesis and\nwould not accurately estimate the hemolytic \nepisode in this patient.","difficulty":5},{"id":"HARR-5.6-Q027","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Quantitative determination of Hgb A2 and Hgb F are best performed by:","options":["High-performance liquid chromatography","Alkali denaturation","Electrophoresis","Direct bichromatic spectrophotometry"],"answer":"A","rationale":"Hgb A2 and Hgb F are often quantitated to diagnose\npersons with thalassemia. The method of choice is\nHPLC using cation exchange chromatography.\nHemoglobins are eluted from the column in order of\nincreasing positive charge using a sodium phosphate\nbuffer to produce a gradient of increasing ionic\nstrength. Hemoglobin F elutes from the column\nearlier than Hgb A2 because it is less positively\ncharged.","difficulty":2},{"id":"HARR-5.6-Q028","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Select the correct order of Hgb migration on agarose or cellulose acetate at pH 8.6.","options":["– C→F→S→A +","– S→C→A→F +","– C→S→F→A +","– S→F→A→C +"],"answer":"C","rationale":"Hgb A2 is the slowest of the normal Hgbs, \nand Hgb A is the fastest. Hgb F migrates just \nbehind Hgb A. Hgb S migrates midway between\nHgb A2 and Hgb A. Hgbs C, CHarlem (Georgetown), \nO, and E migrate with Hgb A2. Hgbs G and DPunjab\nand Hgb OArab migrate with Hgb S.","difficulty":4},{"id":"HARR-5.6-Q029","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following abnormal types of Hgb migrates to the same position as Hgb S on agarose or cellulose acetate at pH 8.6?","options":["Hgb C","Hgb DPunjab","Hgb OArab","Hgb E"],"answer":"B","rationale":"Hgb D Punjab migrates with Hgb S on cellulose acetate\nor agarose at pH 8.6–9.2. Hgb C, E, OArab, and CHarlem\nmigrate to the same position as Hgb A2 on cellulose\nacetate or agarose at pH 8.6–9.2. Hgb S may be\ndifferentiated from Hgb D Punjab using citrate (acid)\nagar at pH 6.2. Using this technique, Hgb S migrates\nfurther toward the anode than Hgb D Punjab.","difficulty":4},{"id":"HARR-5.6-Q030","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which Hgb is a β-δ chain hybrid and migrates to the same position as Hgb S at pH 8.6?","options":["Hgb CHarlem","HgbLepore","Hgb GPhiladelphia","Hgb DPunjab"],"answer":"B","rationale":"HgbLepore results from translocation of β and δ globin\ngenes, resulting in a polypeptide chain that migrates\nmidway between Hgb A2 and Hgb A. The chain is\ntranscribed more slowly than the β polypeptide\nchain, causing the quantity of HgbLepore to be less\nthan 15%. HgbLepore is suspected when Hgb\nmigrating in the “S” zone comprises less than 20% of\nthe total Hgb. In Hgb S trait, the AS phenotype\nproduces 20%–40% Hgb S.","difficulty":3},{"id":"HARR-5.6-Q031","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Select the correct order of Hgb migration on citrate agar at pH 6.2.","options":["– F→S→C→A +","– F→A→S→C +","– A→S→F→C +","– A→C→S→F +"],"answer":"B","rationale":"In an acid buffer, the hemoglobins are expected to\nmigrate to the cathode, with hemoglobin A being\nthe slowest because it has the weakest net positive\ncharge. However, Hgb C and Hgb S bind to sulfated\npectins in the agar gel, forming a complex that is\nnegatively charged causing them to migrate toward\nthe anode. Hgb C migrates furthest toward the\nanode, followed by Hgb S. Hgb F migrates furthest\ntoward the cathode. Hgbs A, A2, DPunjab, E, G, and\nHgbLepore migrate slightly toward the cathode.","difficulty":4},{"id":"HARR-5.6-Q032","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which Hgb separates from Hgb S on citrate (acid) agar, but not agarose or cellulose acetate?","options":["Hgb DPunjab","Hgb E","Hgb CHarlem (Georgetown)","Hgb OArab"],"answer":"A","rationale":"Hgbs OArab, E, and CHarlem migrate to the same\nposition as Hgbs A2 and C on agarose × or cellulose\nacetate) at pH 8.6. Hgb DPunjab migrates to the same\nposition as Hgb S on agarose, but moves with Hgb A\non citrate agar. Agarose is a purified form of agar; \nit lacks the sulfated pectins required to separate \nHgbs DPunjab and G from Hgb S, and Hgbs E, CHarlem,\nand OArab from Hgb C. Hgb CHarlem is a sickling Hgb\nand it migrates to the same position as Hgb S on\ncitrate (acid) agar.","difficulty":3},{"id":"HARR-5.6-Q033","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which statement best describes immunofixation electrophoresis (IEF)?","options":["Proteins are separated by electrophoresis followed by overlay of monospecific anti-immunoglobulins","Proteins react with monospecific antisera followed by electrophoresis","Antisera are electrophoresed, then diffused against patient’s serum","Serum is electrophoresed; the separated immunoglobulins diffuse against specific antisera placed into troughs"],"answer":"A","rationale":"Immunofixation electrophoresis (IFE) is used to\nidentify monoclonal bands in serum or urine.\nElectrophoresis is performed on the serum or urine\nsample in the same manner as for protein\nelectrophoresis, except that six lanes are used for the\nsame sample. After the proteins are separated, a\ndifferent monospecific antiserum is applied across\nthe surface of each lane. After incubating, the gel is\nwashed and blotted to remove uncomplexed\nproteins and salts. The immune complexes that\nremain are stained. Monoclonal bands will be \nseen only in those lanes where the monoclonal\nimmunoglobulins were recognized by the\ncorresponding antiserum.","difficulty":2},{"id":"HARR-5.6-Q034","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"In double immunodiffusion reactions, the precipitin band is:","options":["Invisible before the equivalence point is reached","Concave to the protein of greatest molecular weight","Closest to the well containing the highest level of antigen","Located in an area of antibody excess"],"answer":"B","rationale":"In double immunodiffusion (Ouchterlony), the\nmolecules of lower molecular weight move fastest\nthrough the gel, causing a visible precipitin arc when\nantigen and antibody approach equivalence. At\nequivalence the precipitin arc remains stationary. If\nthe concentration of antisera is constant, the distance\nof the precipitin arc from the antigen well is\nproportional to antigen concentration.","difficulty":1},{"id":"HARR-5.6-Q035","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following statements regarding the identification of monoclonal proteins by IFE is true?","options":["The monoclonal band must be present in the γ region","When testing for a monoclonal gammopathy, both serum and urine must be examined","A diagnosis of monoclonal gammopathy is based upon quantitation of IgG, IgA, and IgM","A monoclonal band always indicates a malignant disorder"],"answer":"B","rationale":"Quantitation of IgG, IgA, IgM, or IgD indicates the\nconcentration of each class of immunoglobulin \nbut does not distinguish monoclonal from\npolyclonal gammopathies. Monoclonal\ncharacteristics are determined by demonstrating\nrestricted electrophoretic mobility, indicating that \nall immunoglobulins in the band are of the same\namino acid sequence. Monoclonal light chains can\nbe demonstrated in about 60% of monoclonal\ngammopathies. In up to 25% of multiple myeloma\npatients, a heavy chain gene deletion results in\nproduction of monoclonal light chains only. Because\nthese are filtered by the glomerulus, the procedure\nmust be performed on urine as well as serum. Some\npatients with a monoclonal protein fail to develop\nmalignant plasma cell proliferation. This state is\ncalled a monoclonal gammopathy of undetermined\nsignificance (MGUS). Within 10–15 years, 15%–20% \nof persons with MGUS develop some form of\nlymphoproliferative disease.","difficulty":4},{"id":"HARR-5.6-Q036","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following statements regarding paraproteins is true?","options":["Oligoclonal banding is seen in the CSF of greater than 90% of multiple sclerosis cases","The Bence–Jones protein heat test is confirmatory for monoclonal light chains","Light chains found in urine are always derived from monoclonal protein","The IgA band is usually cathodal to the IgG precipitin band"],"answer":"A","rationale":"The α heavy chain is more acidic than γ or μ chains,\ngiving IgA a greater net negative charge at alkaline\npH. The IgA precipitin band is anodal to the IgG or\nIgM band. In hepatic cirrhosis, the β-γ bridging\nobserved on serum protein electrophoresis results\nfrom increased IgA. Light chains in the form of Fab\nfragments are often found in increased amounts in\nthe urine of patients with polyclonal gammopathies,\nespecially from patients with an autoimmune\ndisease. These can cause a positive Bence–Jones\ntest and will produce a polyclonal (spread-out)\nappearance on IFE gels.","difficulty":2},{"id":"HARR-5.6-Q037","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which statement regarding IFE is true?","options":["Serum containing a monoclonal protein should have a κ:λ ratio of 0.5","A monoclonal band seen with monospecific antiserum should not be visible in the lane where polyvalent antiserum or sulfosalicylic acid was added","CSF should be concentrated 50- to100-fold before performing IFE","When oligoclonal bands are seen in the CSF, they must also be present in serum to indicate multiple sclerosis"],"answer":"C","rationale":"Any monoclonal precipitin band formed when\nheavy- or light-chain–specific antiserum reacts with\na sample should also be found in the same position\nwhen sample is fixed with sulfosalicylic acid or\nreacted with polyvalent antihuman Ig. The normal\nfree κ:λ ratio can vary between 0.26 and 1.65. In a\nmonoclonal gammopathy, this ratio always heavily\nfavors the light chain type of M protein. A diagnosis\nof multiple sclerosis is usually confirmed by\ndemonstration of oligoclonal banding in the CSF,\nwhich is not present in the serum. CSF is usually\nconcentrated 50–100 times to increase sensitivity.","difficulty":2},{"id":"HARR-5.6-Q038","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which test is the most sensitive in detecting early monoclonal gammopathies?","options":["High-resolution serum protein electrophoresis","Urinary electrophoresis for monoclonal light chains","Capillary electrophoresis of serum and urine","Serum-free light chain immunoassay"],"answer":"D","rationale":"Immunonephelometric free light chain assays can\ndetect monoclonal protein production before the\nmass is sufficient to cause a monoclonal spike on\nprotein electrophoresis or capillary electrophoresis,\nbut will be positive only in cases where monoclonal\nlight chain production occurs. Therefore,\nmeasurement of free light chains is recommended\nalong with protein electrophoresis when testing \nfor myeloma. Free light chains are normally present in\nserum because L chains are made at a faster rate than\nH chains. However, in cases where free L chains are\nthe result of monoclonal plasma cell proliferation, the\nkappa:lambda ratio will be abnormal in addition to\none of the L chain types being elevated.","difficulty":3},{"id":"HARR-5.6-Q039","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which test is the most useful way to evaluate the response to treatment for multiple myeloma?","options":["Measure of total immunoglobulin","Measurement of 24-hour urinary light chain concentration (Bence–Jones protein)","Capillary electrophoresis of M-protein recurrence","Measurement of serum-free light chains"],"answer":"D","rationale":"Unlike electrophoresis methods, serum free light\nchain assays are quantitative and an increase in \nfree light chain production with an abnormal\nkappa:lambda ratio occurs earliest in recurrence of\nmyeloma. Light chains have a shorter plasma half life\nthan intact Ig and therefore, the reduction in free\nlight chain concentration is an earlier indicator of\ntreatment effect than measurement of intact Ig. It is\nnot subject to the variation in 24-hour urinary light\nchain measurement caused by sample collection\nerror and abnormal renal function. A 50% or more\nreduction in serum free light chain concentration is\nconsidered a partial response to treatment. A full\nresponse is indicated by reduction to within normal\nlimits and a return of the kappa:lambda ratio to\nnormal. An abnormal free light chain ratio has a \n3.5-fold higher risk of progression to myeloma in\npersons with monoclonal gammopathy of\nundetermined significance (MGUS).","difficulty":4},{"id":"HARR-5.6-Q040","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following is more commonly associated with a nonmalignant form of monoclonal gammopathy (MGUS)?","options":["Bone marrow plasma cells comprise 20% of nucleated cells","Monoclonal protein (M-protein) concentration is 3.5 g/dL","M-protein is IgG","Age greater than 60 at the time of monoclonal protein discovery"],"answer":"D","rationale":"MGUS is the most common cause of monoclonal\ngammopathy. About 3% of the U.S. population at \nage 50 and 5% at age 70 have MGUS. The absence \nof bone lesions and organ damage, plasma cells\nbelow 10% of nucleated bone marrow cells, and \nM-protein below 3.0 g/dL are characteristic of \nMGUS as opposed to myeloma or other malignant\ngammopathy. About 50% of persons with MGUS\nhave IgH gene translocations or chromosome \n13 deletion associated with multiple myeloma. The\nrisk of transformation of MGUS to malignant disease is\nabout 1% per year.","difficulty":3},{"id":"HARR-5.6-Q041","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Capillary electrophoresis differs from agarose gel electrophoresis in which respect?","options":["A stationary support is not used","An acidic buffer is used","A low voltage is used","Electroendosmosis does not occur"],"answer":"A","rationale":"Capillary electrophoresis is a rapid automated\nprocedure for separating serum or body fluid\nproteins. Instead of a stationary support, the proteins\nmigrate based upon their charge/mass ratio inside a\nsmall-bore silica capillary tube (20–200 μm). The\ncations in the buffer are attracted to the negatively\ncharged silicates and migrate to the cathode rapidly\nwhen voltage is applied. The electroendosmotic\nforce created moves the proteins toward the\ncathode and they are detected by an in-line UV\nphotometer that measures their absorbance. High\nvoltage (e.g., 9,000 volts) is used to effect separation\nof serum proteins in an 8–10 minute run, giving\nresolution equal to or greater than HR agarose gel\nelectrophoresis.","difficulty":3},{"id":"HARR-5.6-Q042","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Select the order of mobility of lipoproteins electrophoresed on cellulose acetate or agarose at pH 8.6.","options":["– Chylomicrons→pre-β →β→α+","– β→pre-β→α→chylomicrons +","– Chylomicrons →β→pre-β→α +","– α→β→pre-β→chylomicrons +"],"answer":"C","rationale":"Although pre-β lipoprotein is lower in density than\nβ lipoprotein, it migrates faster on agarose or\ncellulose acetate owing to its more negative\napoprotein composition. When lipoproteins are\nseparated on polyacrylamide gel, pre-β moves\nslower than β lipoprotein. Molecular sieving causes\nmigration to correlate with lipoprotein density\nwhen PAGE is used.","difficulty":2},{"id":"HARR-5.6-Q043","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Following ultracentrifugation of plasma, which fraction correlates with pre-β lipoprotein?","options":["Very low-density lipoprotein (VLDL)","Low-density lipoprotein (LDL)","High-density lipoprotein (HDL)","Chylomicrons"],"answer":"A","rationale":"The VLDL (very low-density lipoprotein) migrates in\nthe pre-β zone. The VLDL is about 50% triglyceride,\nwhereas LDL is only 10% triglyceride by weight. LDL\nis formed from VLDL in the circulation. The process\nis initiated by apoC-II on VLDL activating peripheral\nlipoprotein lipase. Hydrolysis of triglycerides and\ntransfer of apoproteins from VLDL to HDL result in\nformation of IDL. Larger IDLs are returned to the\nliver as remnant lipoproteins. Further hydrolysis of\ntriglycerides, transfer cholesterol esters from HDL,\nand transfer of apoproteins to HDL convert IDL \nto LDL.","difficulty":4},{"id":"HARR-5.6-Q044","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Select the lipoprotein fraction that carries most of the endogenous triglycerides.","options":["VLDL","LDL","HDL","Chylomicrons"],"answer":"A","rationale":"The VLDL is formed in the liver largely from\nchylomicron remnants and hepatic-derived\ntriglycerides. Therefore, the VLDL transports the\nmajority of endogenous triglycerides, while the\ntriglycerides of chylomicrons are derived entirely \nfrom dietary absorption.","difficulty":2},{"id":"HARR-5.6-Q045","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"The protein composition of HDL is what percentage by weight?","options":["Less than 2%","25%","50%","90%"],"answer":"C","rationale":"About 50% of the weight of HDL is protein, largely\napo A-I and apo A-II. The HDL is about 30%\nphospholipid and 20% cholesterol by weight. \nThe HDL binds and esterifies free cholesterol from\ncells and transports it to the liver, where it can be\neliminated in the bile.","difficulty":1},{"id":"HARR-5.6-Q046","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which apoprotein is inversely related to risk of coronary heart disease?","options":["Apoprotein A-I","Apoprotein B100","Apoprotein C-II","Apoprotein E4"],"answer":"A","rationale":"Apoprotein A-I and apo A-II are the principal\napoproteins of HDL, and low apo A-I has a high\ncorrelation with atherosclerosis. Conversely, \napo-B100 is the principal apoprotein of LDL, and an\nelevated level is a major risk factor in developing\ncoronary heart disease. Apoprotein assays are not\nrecommended as screening tests because they are\nnot as well standardized as LDL cholesterol assays.\nHowever, apo-B100 assay is more sensitive than LDL\ncholesterol in predicting coronary artery disease \nrisk. Apo-B100 may be abnormal in persons with\nincreased small dense LDL. Small dense LDL is more\natherogenic than large LDL molecules. In addition,\npersons with hyperapobetalipoproteinemia\noverproduce apo-B100 without having significantly\nelevated LDL cholesterol.","difficulty":3},{"id":"HARR-5.6-Q048","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following mechanisms accounts for the elevated plasma level of β lipoproteins seen in familial hypercholesterolemia (formerly type II hyperlipoproteinemia)?","options":["Hyperinsulinemia","ApoB-100 receptor defect","ApoC-II activated lipase deficiency","ApoE3 deficiency"],"answer":"B","rationale":"The production of excess insulin leads to\nhypertriglyceridemia and is one mechanism\nresponsible for familial endogenous\nhypertriglyceridemia. ApoC-II is an activator of\nlipoprotein lipase, and a homozygous deficiency\nresults in high plasma chylomicrons and VLDL. \nApoE3 deficiency is synonymous with inheritance of\ntwo apo-E2 alleles that lead to β dyslipoproteinemia.\nFamilial hypercholesterolemia is inherited as an\nautosomal dominant trait. The classical form results\nfrom one of many mutations affecting the LDL\nreceptor that cause it to have a lower affinity for LDL.\nA related hypercholesterolemia common in people \nof European ancestry results from a mutation of the\napo-B100 gene that causes LDL to have a lower\naffinity for the LDL receptor. Together, they make\nfamilial hypercholesterolemia the most common\ninherited hyperlipoproteinemia with a frequency \nover 1:500.","difficulty":5},{"id":"HARR-5.6-Q049","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which enzyme deficiency is most commonly associated with familial hypertriglyceridemia associated with fasting plasma cholomicrons (formerly type I hyperlipoproteinemia)?","options":["β Glucocerebrosidase deficiency","Post–heparin-activated lipoprotein lipase deficiency","Apo-B deficiency","Apo-C-III deficiency"],"answer":"B","rationale":"Deficiency of capillary endothelial lipase is the \nmost common cause of fasting chylomicronemia.\nThis lipase is also known as post–heparin-\nactivated lipase and apo C-II–activated lipase. \nβ Glucocerebrosidase deficiency results in\naccumulation of glucocerebrosides and is \nthe cause of Gaucher’s disease. ApoC-II deficiency\nresults in decreased activity of peripheral \nand hepatic lipases and is associated with\nhypertriglyceridemia. Apo-B deficiency resulting\nfrom a point mutation in the apo-B gene, is\nresponsible for hypobetalipoproteinemia, and is\ninherited as an autosomal dominant trait. LDL \nlevels are about half normal in heterozygotes, \nand this reduces their risk of coronary artery\ndisease.","difficulty":5},{"id":"HARR-5.6-Q050","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following conditions is most consistently associated with secondary hypercholesterolemia?","options":["Hypothyroidism","Pancreatitis","Oral contraceptive therapy","Diabetes mellitus"],"answer":"A","rationale":"The conditions listed are very commonly encountered\ncauses of secondary hyperlipoproteinemia. Oral\ncontraceptives, pregnancy, and estrogens may cause\nsecondary hypertriglyceridemia owing to increased\nVLDL and endogenous triglycerides. Hypothyroidism\nand obstructive hepatobiliary diseases are usually\nassociated with secondary hypercholesterolemia\nowing to high LDL. Diabetes mellitus and chronic\npancreatitis may produce hypertriglyceridemia,\nchylomicronemia, or mixed hyperlipidemia.","difficulty":3},{"id":"HARR-5.6-Q051","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following is associated with Tangier disease?","options":["Apoprotein C-II deficiency","Homozygous apo-B100 deficiency","Apoprotein C-II activated lipase","Apoprotein A-I deficiency"],"answer":"D","rationale":"Deficiency of apo A-I is seen in Tangier disease, a\nfamilial hypocholesterolemia. Heterozygotes have\nabout half of the normal level of HDL (familial\nhypoalphalipoproteinemia) and homozygotes \nhave almost no detectable HDL. Tangier disease \nis caused by a mutation of the ATP-binding \ncassette gene. The deficient gene prevents apo A-I\nfrom binding lipids, and it is rapidly catabolized.\nAbetalipoproteinemia results from defective\nhepatic transport of apo-B100, and is also inherited\nas an autosomal recessive condition. LDL is absent,\nand the condition is associated with hemolytic\nanemia and central nervous system damage.","difficulty":2},{"id":"HARR-5.6-Q052","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following statements is correct?","options":["Both HDL and LDL are homogenous","There are several subfractions of LDL but not HDL","There are several subfractions of HDL but not LDL","There are several subfractions of both HDL and LDL"],"answer":"D","rationale":"There are 7 subfractions of LDL and 10 subfractions \nof HDL. These are grouped into subclasses defined \nby their molecular sizes. In general, the small, dense\nLDL subclasses contain more oxidized LDL and are\nmore atherogenic than the larger LDL molecules. \nThe larger HDL subfractions comprising the HDL-3\nsubclass are associated with a lower risk of coronary\nartery disease.","difficulty":1},{"id":"HARR-5.6-Q053","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"What is the lipid testing protocol for adults recommended by the National Cholesterol Education Program (NCEP) to evaluate risk for atherosclerosis beginning at age 20?","options":["Total cholesterol, fasting or nonfasting every year","Total cholesterol, fasting, every 2 years","Lipid profile, fasting, every 5 years","LDL cholesterol, fasting, every 2 years"],"answer":"C","rationale":"Because LDL cholesterol, HDL cholesterol, VLDL\ncholesterol, and triglycerides are all risk factors for\ncoronary artery disease, NCEP recommends a fasting\nlipid profile to include triglycerides, total cholesterol,\nHDL cholesterol, and LDL cholesterol be performed\nevery 5 years beginning at age 20. However, because\nLDL cholesterol is the target of treatment, therapeutic\ngoals are based on the LDL cholesterol. New\nguidelines recommend an LDL cholesterol goal\nbelow 70 mg/dL for the highest-risk persons.","difficulty":5},{"id":"HARR-5.6-Q054","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"What is the most appropriate fasting procedure when a lipid study of triglyceride, total cholesterol, HDL cholesterol, and LDL cholesterol tests are ordered?","options":["8 hours; nothing but water allowed","10 hours; water, smoking, coffee, tea (no sugar or cream) allowed","12 hours; nothing but water allowed","16 hours; water, smoking, coffee, tea (no sugar or cream) allowed"],"answer":"C","rationale":"Lipid orders that include triglyceride and LDL\ncholesterol should always be performed using a\nplasma or serum specimen collected after a \n12–14 hour fast. The patient should be instructed \nto drink nothing but water during this period.\nFasting specimens are preferred for total and \nHDL cholesterol as well, but nonfasting specimens\nmay be used for initial screening purposes.","difficulty":5},{"id":"HARR-5.6-Q055","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Treatment recommendations for patients with coronary heart disease are based upon measurement of which analyte?","options":["HDL cholesterol","Apo-B100","LDL cholesterol","Total cholesterol"],"answer":"C","rationale":"NECP has identified LDL cholesterol as the target of\ntherapy for reducing the risk of heart attack because\nlowering LDL cholesterol has proven to be an\neffective intervention. The greater the risk of coronary\nheart disease, the lower the cutpoint for intervention.\nFor persons at high risk (a 10-year risk of heart attack\n> 20%) the cutpoint is ≥ 100 mg/dL for initiation of\nstatin therapy. For highest-risk persons (those that\nhave acute coronary syndrome, and multiple or\nuncontrolled risk factors) the treatment goal is LDL\ncholesterol below 70 mg/dL.","difficulty":5},{"id":"HARR-5.6-Q056","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"What is the HDL cholesterol cutpoint recommend by NCEP?","options":["<30 mg/dL","<40 mg/dL","<30 mg/dL for males and < 40 mg/dL for females","<45 mg/dL for males and < 50 mg/dL for females"],"answer":"B","rationale":"The HDL cholesterol cutpoint recommended by\nNCEP is < 40 mg/dL regardless of sex. A result\nbelow 40 mg/dL counts as a risk factor for coronary\nartery disease. Conversely, if the HDL cholesterol \nis ≥ 60 mg/dL, then one risk factor is subtracted\nfrom the total number. The therapeutic goal for\nsomeone with low HDL cholesterol is still reduction\nof LDL cholesterol (if elevated), weight loss, and\nincreased exercise.","difficulty":1},{"id":"HARR-5.6-Q057","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"An EDTA blood sample is collected from a nonfasting person for a CBC. The physician collected the sample from the femoral vein because venipuncture from the arm was unsuccessful. He called the lab 15 minutes after the sample arrived and requested a lipid study including triglyceride, total cholesterol, HDL cholesterol, and LDL cholesterol. Which test results should be used to evaluate the patient’s risk for coronary artery disease?","options":["Total cholesterol and LDL cholesterol","LDL cholesterol and triglyceride","Total cholesterol and HDL cholesterol","Total cholesterol and triglyceride"],"answer":"C","rationale":"NCEP recommends a 12-hour fasting sample when\nscreening persons for risk of coronary artery disease.\nHowever, if a fasting sample is unavailable, NCEP\nrecommends performing the total cholesterol \nand HDL cholesterol because these tests are least\naffected by recent ingestion of food. If the total\ncholesterol is ≥ 200 mg/dL or the HDL cholesterol \nis < 40 mg/dL, then testing for LDL cholesterol and\ntriglycerides should be performed when a fasting\nsample can be obtained. An EDTA plasma sample \nis acceptable for most enzymatic cholesterol and\ntriglyceride assays.","difficulty":5},{"id":"HARR-5.6-Q058","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following diseases is caused by a deficiency of sphingomyelinase?","options":["Gaucher disease","Fabry disease","Niemann–Pick disease","Tay–Sachs disease"],"answer":"C","rationale":"The diseases mentioned result from inborn errors of\nlipid metabolism (lipidoses) caused by deficiency of an\nenzyme needed for lipid degradation. Specific lipids\naccumulate in the lysosomes. Niemann–Pick disease\nresults from a deficiency of sphingomyelinase;\nGaucher disease from β-glucocerebrosidase; Fabry\ndisease (sex linked) from α-galactosidase A; and \nTay–Sachs from N acetylglucosaminidase A.","difficulty":1},{"id":"HARR-5.6-Q059","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which method is considered the candidate reference method for triglyceride measurement?","options":["Glycerol kinase-ultraviolet","CDC modification of van Handel and Zilversmit","Hantzsch condensation","Glycerol kinase coupled to peroxidase"],"answer":"B","rationale":"Enzymatic methods for triglyceride measurement\nare widely used because they eliminate the need\nfor extraction and saponification. However, they are\nsubject to positive interference from endogenous\nglycerol and variations in the efficiency of lipase,\nwhich can result in under- or overestimation of\ntriglycerides. The most accurate method for\ntriglyceride assay is the nonenzymatic method\nbased upon reaction of formaldehyde with\nchromotropic acid. In this method, extraction with\nsilicic acid and chloroform separates triglycerides\nfrom lipoproteins, phospholipids, and glycerol.\nSaponification with alcoholic potassium hydroxide\n(KOH) produces glycerol, which is oxidized to\nformaldehyde by periodate. The formaldehyde\nreacts with chromotropic acid to form a pink\nproduct.","difficulty":4},{"id":"HARR-5.6-Q060","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following enzymes is common to all enzymatic methods for triglyceride measurement?","options":["Glycerol phosphate oxidase","Glycerol phosphate dehydrogenase","Glycerol kinase","Pyruvate kinase"],"answer":"C","rationale":"All enzymatic triglyceride methods require lipase to\nhydrolyze triglycerides, and glycerol kinase to\nphosphorylate glycerol, forming glycerol-3-phosphate.\nThe most common method couples glycerol kinase\nwith glycerol phosphate oxidase and peroxidase.\n1. Triglyceride + H2O  Lipase  \nglycerol + fatty acids\n2. Glycerol + ATP GK  \nglycerol-3-phosphate + ADP\n3. Glycerol-3-phosphate + O2 GPO\ndihydroxyacetone\nphosphate + H2O2\nH2O2 + phenol + 4-aminophenazone Px \nquinoneimine dye + H2O\nGK = glycerol kinase; GPO = glycerol phosphate \noxidase; Px = peroxidase","difficulty":3},{"id":"HARR-5.6-Q061","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Select the reagent needed in the coupling enzyme reaction used to generate a colored product in the cholesterol oxidase method for cholesterol.","options":["Cholestahexaene","H2O2","4-Aminoantipyrine","Cholest-4-ene-3-one"],"answer":"C","rationale":"In the cholesterol oxidase method, cholesterol ester\nhydrolase converts cholesterol esters to free\ncholesterol by hydrolyzing the fatty acid from the\nC3-OH group. Cholesterol oxidase catalyzes the\noxidation of free cholesterol at the C3-OH group\nforming cholest-4-ene-3-one and hydrogen\nperoxide. The peroxide is used in a peroxidase\nreaction to oxidize a dye (e.g., 4-aminoantipyrine),\nwhich couples to phenol, forming a red\nquinoneimine complex.","difficulty":4},{"id":"HARR-5.6-Q062","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"What is the purpose of the saponification step used in the Abell–Kendall method for cholesterol measurement?","options":["Remove phospholipids","Reduce sterol molecules structurally similar to cholesterol","Convert cholesterol esters to free cholesterol","Remove proteins that can interfere with color formation"],"answer":"C","rationale":"The Abell–Kendall method is the reference method\nfor cholesterol assay because differences in esterase\nactivity and interference in the peroxidase step are\npotential sources of error in enzymatic assays.\nSaponification is performed to hydrolyze the fatty\nacid esters of cholesterol, forming free cholesterol.\nThis is required because the reagents react more\nintensely with cholesterol esters than with free\ncholesterol. Saponification is followed by extraction\nof cholesterol in petroleum ether to separate it from\nproteins and interfering substances. The extract is\nreacted with sulfuric acid, acetic anhydride, and acetic\nacid (Liebermann–Burchard reagent), which oxidizes\nthe cholesterol and forms a colored product.","difficulty":4},{"id":"HARR-5.6-Q063","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following methods for HDL cholesterol is the reference method?","options":["Manganese–heparin","Magnesium–phosphotungstate","Magnesium–dextran","Ultracentrifugation"],"answer":"D","rationale":"Ultracentrifugation of plasma in a potassium bromide\nsolution with a density of 1.063 is used to separate\nHDL from LDL and VLDL. The HDL fraction is\ntransferred from the bottom of the tube and assayed\nfor cholesterol content by the Abell–Kendall method.\nThe remaining three methods rely upon selective\nprecipitation of lipoproteins containing apoprotein B\nusing a polyanionic solution. All of these methods are\nsubject to interference by very high triglycerides and\nvary somewhat in specificity depending on the\nefficiency of precipitation.","difficulty":3},{"id":"HARR-5.6-Q064","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Cholesterol esterase is used in enzymatic assays to:","options":["Oxidize cholesterol to form peroxide","Hydrolyze fatty acids bound to the third carbon atom of cholesterol","Separate cholesterol from apoproteins A-I and A-II by hydrolysis","Reduce NAD+ to NADH"],"answer":"B","rationale":"Approximately two-thirds of the serum cholesterol\nhas a fatty acid esterified to the hydroxyl group of \nthe third carbon atom of the cholesterol molecule.\nCholesterol esterase hydrolyzes fatty acids and is\nrequired because cholesterol oxidase cannot utilize\nesterified cholesterol as a substrate.","difficulty":1},{"id":"HARR-5.6-Q065","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which of the following reagents is used in the direct HDL cholesterol method?","options":["Sulfated cyclodextrin","Magnesium sulfate and dextran sulfate","Anti-apoA-I","Manganese heparin"],"answer":"A","rationale":"The direct HDL cholesterol method most commonly\nemployed uses cholesterol esterase and oxidase\nenzymes conjugated to polyethylene glycol. In \nthe presence of sulfated cyclodextrin, the enzymes\ndo not react with non-HDL cholesterol molecules.\nAnti-apoA-I binds to HDL and is not used in HDL\nassays.","difficulty":2},{"id":"HARR-5.6-Q066","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"What do “direct” or homogenous methods for LDL cholesterol assay have in common?","options":["They are inaccurate when plasma triglyceride is above 250 mg/dL","All use a detergent to facilitate selective reactivity with reagent enzymes","All use monoclonal antibodies to apo A1 and C","All are free of interference from abnormal lipoproteins"],"answer":"B","rationale":"The direct LDL cholesterol assays are all detergent\nbased methods. One commonly used method\nemploys a polyanionic detergent to release\ncholesterol from HDL, chylomicrons, and VLDL. The\ndetergent binds to LDL and blocks its reaction with\nthe esterase and oxidase enzymes in the reagent.\nCholesterol oxidase oxidizes the non-LDL cholesterol,\nforming H2O2, and peroxidase catalyzes the oxidation\nof an electron donor by the H2O2,which does not\nresult in color formation. A second nonionic\ndetergent and chromogen is added. The second\ndetergent removes the first from the LDL, allowing it\nto react with the enzymes. The resulting H2O2 reacts\nwith the chromogen, forming a colored product.","difficulty":3},{"id":"HARR-5.6-Q067","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Lipoprotein (a), or Lp(a), is significant when elevated in serum because it:","options":["Is an independent risk factor for atherosclerosis","Blocks the clearance of VLDLs","Displaces apo-AI from HDLs","Is linked closely to a gene for obesity"],"answer":"A","rationale":"Lp(a) is a complex of apo-B100 and protein (a) \nformed by a disulfide bridge. The complex is\nstructurally similar to plasminogen and is thought to\npromote coronary heart disease by interfering with\nthe normal fibrinolytic process. Lp(a) is measured by\nimmunoassay; however, the measurement will vary\ndepending on the type of antibodies used and their\nepitope specificity.","difficulty":4},{"id":"HARR-5.6-Q068","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"Which type of dietary fatty acid is not associated with an increase in serum LDL cholesterol production?","options":["Monounsaturated trans fatty acids","Saturated fatty acids","Monounsaturated cis fatty acids","Monounsaturated trans Ω-9 fatty acids"],"answer":"C","rationale":"Polyunsaturated and cis monounsaturated fatty\nacids are not associated with increased production\nof LDL cholesterol. On the other hand, saturated\nand trans monounsaturated fatty acids are both\nassociated with increased LDL. Cis fatty acids are\nthose in which the H atoms belonging to the\ndouble-bonded carbons are on the same side of\nthe molecule. Ω-9 (n-9) fatty acids are those with a\ndouble bond located 9 carbons from the terminal\nmethyl group. Ω Fatty acids are associated with\nincreased cholesterol, if the hydrogens attached \nto the double-bonded carbons are in the trans\nposition.","difficulty":5},{"id":"HARR-5.6-Q069","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"SITUATION: A lipemic specimen collected from an adult after a 12-hour fast was assayed for total cholesterol, triglycerides, and HDL cholesterol using a direct HDL method. Following are the results: The physician requests an LDL cholesterol assay after receiving the results. How should the LDL cholesterol be determined?","options":["Dilute the specimen 1:10 and repeat all tests; calculate LDL cholesterol using the Friedewald equation","Perform a direct LDL cholesterol assay","Ultracentrifuge the sample and repeat the HDL cholesterol on the infranate. Use the new result to calculate the LDL cholesterol","Repeat the HDL cholesterol using the manganese heparin precipitation method. Use the new result to calculate the LDL cholesterol"],"answer":"B","rationale":"An accurate LDL cholesterol can be reported, if the\ndirect (detergent) method for LDL cholesterol is\nemployed. These methods are not subject to\ninterference by triglycerides at a concentration \nbelow 700 mg/dL.","difficulty":5},{"id":"HARR-5.6-Q070","topic":"5.6 Proteins, Electrophoresis, and Lipids","question":"A person has a fasting triglyceride level of 240 mg/dL. The physician wishes to know the patient’s non-HDL cholesterol level. What cholesterol fractions should be measured?","options":["Total cholesterol and HDL cholesterol","Total cholesterol and LDL cholesterol","HDL cholesterol and LDL cholesterol","Total cholesterol and chylomicrons"],"answer":"A","rationale":"When the HDL cholesterol is subtracted from the\ntotal cholesterol, the result is called the non-HDL\ncholesterol. This result, the sum of LDL cholesterol \nand VLDL cholesterol, represents the fraction with\natherogenic remnant lipoproteins as well as LDL\ncholesterol. People who have a fasting triglyceride \n≥ 200 mg/dL are at increased risk for coronary artery\ndisease owning to atherogenic VLDL remnants, and\nthe treatment goal is to have a non-HDL cholesterol\nno more than 30 mg/dL greater than the LDL\ncholesterol.","difficulty":5},{"id":"HARR-5.7-Q001","topic":"5.7 Enzymes and Cardiac Markers","question":"An international unit (IU) of enzyme activity is the quantity of enzyme that:","options":["Converts 1 μmol of substrate to product per liter","Forms 1 mg of product per deciliter","Converts 1 μmol of substrate to product per minute","Forms 1 μmol of product per
