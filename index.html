\nare low only in iron deficiency. However, concurrent\nillness such as malignancy, infection, and\ninflammation may promote ferritin release from \nthe tissues, causing the serum ferritin to be normal \nin iron deficiency.","difficulty":2},{"id":"HARR-5.3-Q043","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which formula provides the best estimate of serum TIBC?","options":["Serum transferrin in mg/dL × 0.70 = TIBC (μg/dL)","Serum transferrin in mg/dL × 1.43 = TIBC (μg/dL)","Serum iron (μg/dL)/1.2 + 0.06 = TIBC (μg/dL)","Serum Fe (μg/dL) × 1.25 = TIBC (μg/dL)"],"answer":"B","rationale":"Transferrin, a β-globulin, has a molecular size of \nabout 77,000. Transferrin is the principal iron\ntransport protein, and TIBC is determined by the\nserum transferrin concentration. One mole of\ntransferrin binds two moles of Fe+3, so the transferrin\nconcentration can be used to predict the TIBC. Since\nthe direct measurement of TIBC requires manual\npretreatment to remove the excess iron added and is\nprone to overestimation if all of the unbound iron is\nnot removed, some labs prefer to measure transferrin\nimmunochemically and calculate TIBC. This formula\nmay underestimate TIBC because albumin and other\nproteins will bind iron when the percent iron\nsaturation of transferrin is abnormally high.","difficulty":4},{"id":"HARR-5.3-Q044","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which statement regarding the diagnosis of iron deficiency is correct?","options":["Serum iron levels are always higher at night than during the day","Serum iron levels begin to fall before the body stores become depleted","A normal level of serum ferritin rules out iron deficiency","A low serum ferritin is diagnostic of iron deficiency"],"answer":"D","rationale":"Serum iron levels are falsely elevated by hemolysis\nand subject to diurnal variation. Levels are highest in\nthe morning and lowest at night, but this pattern is\nreversed in persons who work at night. A low ferritin\nis specific for iron deficiency. However, only about \n1% of ferritin is in the vascular system. Any disease\nthat increases ferritin release may mask iron\ndeficiency.","difficulty":2},{"id":"HARR-5.3-Q045","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which statement about iron methods is true?","options":["Interference from Hgb can be corrected by a serum blank","Colorimetric methods measure binding of Fe2+ to a ligand such as ferrozine","Atomic absorption is the method of choice for measurement of serum iron","Serum iron can be measured by potentiometry"],"answer":"B","rationale":"Atomic absorption is not the method of choice for\nserum iron because matrix error and variation of \niron recovered by extraction cause bias and poor\nprecision. Most methods use HCl to deconjugate Fe3+","difficulty":1},{"id":"HARR-5.3-Q046","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following statements regarding the TIBC assay is correct?","options":["All TIBC methods require addition of excess iron to saturate transferrin","All methods require the removal of unbound iron","Measurement of TIBC is specific for transferrin- bound iron","The chromogen used must be different from the one used for measuring serum iron"],"answer":"A","rationale":"All TIBC methods require addition of excess iron \nto saturate transferrin. Excess iron is removed by ion\nexchange or alumina gel columns or precipitation\nwith MgCO3 and the bound iron is measured by \nthe same procedure as is used for serum iron.\nAlternatively, excess iron in the reduced state can \nbe added at an alkaline pH. Under these conditions,\ntransferrin will bind Fe2+ and the unbound Fe2+ can\nbe measured directly.","difficulty":1},{"id":"HARR-5.3-Q047","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following statements regarding the metabolism of bilirubin is true?","options":["It is formed by hydrolysis of the α methene bridge of urobilinogen","It is reduced to biliverdin prior to excretion","It is a by-product of porphyrin production","It is produced from the destruction of RBCs"],"answer":"D","rationale":"Synthesis of porphyrins results in production of \nheme and metabolism of porphyrins other than\nprotoporphyrin IX yields uroporphyrins and\ncoproporphyrins, not bilirubin. Reticuloendothelial\ncells in the spleen digest Hgb and release the iron\nfrom heme. The tetrapyrrole ring is opened at \nthe α methene bridge by heme oxygenase, forming\nbiliverdin. Bilirubin is formed by reduction of\nbiliverdin at the γ methene bridge. It is complexed \nto albumin and transported to the liver.","difficulty":2},{"id":"HARR-5.3-Q048","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Bilirubin is transported from reticuloendothelial cells to the liver by:","options":["Albumin","Bilirubin-binding globulin","Haptoglobin","Transferrin"],"answer":"A","rationale":"Albumin transports bilirubin, haptoglobin transports\nfree Hgb, and transferrin transports ferric iron. When\nalbumin binding is exceeded, unbound bilirubin,\ncalled free bilirubin, increases. This may cross the\nblood–brain barrier, resulting in kernicterus.","difficulty":1},{"id":"HARR-5.3-Q049","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"In the liver, bilirubin is conjugated by addition of:","options":["Vinyl groups","Methyl groups","Hydroxyl groups","Glucuronyl groups"],"answer":"D","rationale":"The esterification of glucuronic acid to the propionyl\nside chains of the inner pyrrole rings (I and II) makes\nbilirubin water soluble. Conjugation is required\nbefore bilirubin can be excreted via the bile.","difficulty":1},{"id":"HARR-5.3-Q050","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which enzyme is responsible for the conjugation of bilirubin?","options":["β-Glucuronidase","UDP-glucuronyl transferase","Bilirubin oxidase","Biliverdin reductase"],"answer":"B","rationale":"UDP-glucuronyl transferase esterifies glucuronic acid\nto unconjugated bilirubin, making it water soluble.\nMost conjugated bilirubin is diglucuronide; however,\nthe liver makes a small amount of monoglucuronide\nand other glycosides. β-Glucuronidase hydrolyzes\nglucuronide from bilirubin, hormones, or drugs. It is\nused prior to organic extraction to deconjugate\nurinary metabolites (e.g., total cortisol). Biliverdin\nreductase forms bilirubin from biliverdin (and heme\noxygenase forms biliverdin from heme). Bilirubin\noxidase is used in an enzymatic bilirubin assay in\nwhich bilirubin is oxidized back to biliverdin and the\nrate of biliverdin formation is measured at 410 nm.","difficulty":3},{"id":"HARR-5.3-Q051","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"The term δ-bilirubin refers to:","options":["Water-soluble bilirubin","Free unconjugated bilirubin","Bilirubin tightly bound to albumin","Direct-reacting bilirubin"],"answer":"C","rationale":"HPLC separates bilirubin into four fractions: \nα = unconjugated, β = monoglucuronide,\nγ = diglucuronide, and δ = irreversibly albumin\nbound. δ Bilirubin is a separate fraction from the\nunconjugated bilirubin, which is bound loosely to\nalbumin. δ Bilirubin and conjugated bilirubin react\nwith diazo reagent in the direct bilirubin assay.","difficulty":1},{"id":"HARR-5.3-Q052","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following processes is part of the normal metabolism of bilirubin?","options":["Both conjugated and unconjugated bilirubin are excreted into the bile","Methene bridges of bilirubin are reduced by intestinal bacteria forming urobilinogens","Most of the bilirubin delivered into the intestine is reabsorbed","Bilirubin and urobilinogen reabsorbed from the intestine are mainly excreted by the kidneys"],"answer":"B","rationale":"Most of the conjugated bilirubin delivered into \nthe intestine is deconjugated by β-glucuronidase \nand then reduced by intestinal flora to form three\ndifferent reduction products collectively called\nurobilinogens. The majority of bilirubin and\nurobilinogen in the intestine are not reabsorbed.\nMost of that which is reabsorbed is re-excreted by \nthe liver. The portal vein delivers blood from the\nbowel to the sinusoids. Hepatocytes take up about\n90% of the returned bile pigments and secrete \nthem again into the bile. This process is called the\nenterohepatic circulation.","difficulty":3},{"id":"HARR-5.3-Q053","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following is a characteristic of conjugated bilirubin?","options":["It is water soluble","It reacts more slowly than unconjugated bilirubin","It is more stable than unconjugated bilirubin","It has the same absorbance properties as unconjugated bilirubin"],"answer":"A","rationale":"Conjugated bilirubin refers to bilirubin mono- and\ndiglucuronides. Conjugated bilirubin reacts almost\nimmediately with the aqueous diazo reagent \nwithout need for a nonpolar solvent. Historically,\nconjugated bilirubin has been used synonymously\nwith direct-reacting bilirubin, although the latter\nincludes the δ-bilirubin fraction when measured \nby the Jendrassik–Grof method. Conjugated \nbilirubin is excreted in both bile and urine. It is easily\nphoto-oxidized and has very limited stability. For this\nreason, bilirubin standards are usually prepared from\nunconjugated bilirubin stabilized by the addition of\nalkali and albumin.","difficulty":3},{"id":"HARR-5.3-Q054","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following statements regarding urobilinogen is true?","options":["It is formed in the intestines by bacterial reduction of bilirubin","It consists of a single water-soluble bile pigment","It is measured by its reaction with p-aminosalicylate","In hemolytic anemia, it is decreased in urine and feces"],"answer":"A","rationale":"Urobilinogen is a collective term given to the reduction\nproducts of bilirubin formed by the action of enteric\nbacteria. Urobilinogen excretion is increased in\nextravascular hemolytic anemias and decreased \nin obstructive jaundice (cholestatic disease).\nUrobilinogen is measured using Ehrlich’s reagent, an\nacid solution of p-dimethylaminobenzaldehyde.","difficulty":1},{"id":"HARR-5.3-Q055","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which statement regarding bilirubin metabolism is true?","options":["Bilirubin undergoes rapid photo-oxidation when exposed to daylight","Bilirubin excretion is inhibited by barbiturates","Bilirubin excretion is increased by chlorpromazine","Bilirubin is excreted only as the diglucuronide"],"answer":"A","rationale":"Samples for bilirubin analysis must be protected from\ndirect sunlight. Drugs may have a significant in vivo\neffect on bilirubin levels. Barbiturates lower serum\nbilirubin by increasing excretion. Other drugs that\ncause cholestasis, such as chlorpromazine, increase the\nserum bilirubin. Although most conjugated bilirubin is\nin the form of diglucuronide, some monoglucuronide\nand other glycosides are excreted. In glucuronyl\ntransferase deficiency, some bilirubin is excreted as\nsulfatides.","difficulty":1},{"id":"HARR-5.3-Q056","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which condition is caused by deficient secretion of bilirubin into the bile canaliculi?","options":["Gilbert’s disease","Neonatal hyperbilirubinemia","Dubin–Johnson syndrome","Crigler–Najjar syndrome"],"answer":"C","rationale":"Dubin–Johnson syndrome is an autosomal recessive\ncondition arising from mutation of an ABC\ntransporter gene. It produces mild jaundice from\naccumulation of conjugated bilirubin that is not\nsecreted into the bile canaliculi. Total and direct\nbilirubin are elevated, but other liver function is\nnormal. Rotor syndrome is an autosomal recessive\ncondition that also results in retention of conjugated\nbilirubin. The mechanism in Rotor syndrome is\nunknown, and like Dubin–Johnson syndrome it is\ncommonly asymptomatic. It can be differentiated\nfrom Dubin–Johnson syndrome by the pattern of\nurinary coproporphyrin excretion and because it\nproduces no black pigmentation in the liver.","difficulty":3},{"id":"HARR-5.3-Q057","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"In hepatitis, the rise in serum conjugated bilirubin can be caused by:","options":["Secondary renal insufficiency","Failure of the enterohepatic circulation","Enzymatic conversion of urobilinogen to bilirubin","Extrahepatic conjugation"],"answer":"B","rationale":"Conjugated bilirubin is increased in hepatitis and\nother causes of hepatic necrosis due to failure to \nre-excrete conjugated bilirubin reabsorbed from \nthe intestine. Increased direct bilirubin can also be\nattributed to accompanying intrahepatic obstruction,\nwhich blocks the flow of bile.","difficulty":3},{"id":"HARR-5.3-Q058","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following is a characteristic of obstructive jaundice?","options":["The ratio of direct to total bilirubin is greater than 1:2","Conjugated bilirubin is elevated, but unconjugated bilirubin is normal","Urinary urobilinogen is increased","Urinary bilirubin is normal"],"answer":"A","rationale":"Obstruction prevents conjugated bilirubin from\nreaching the intestine, resulting in decreased\nproduction, excretion, and absorption of\nurobilinogen. Conjugated bilirubin regurgitates into\nsinusoidal blood and enters the general circulation\nvia the hepatic vein. The level of serum direct\n(conjugated) bilirubin becomes greater than\nunconjugated bilirubin. The unconjugated form is \nalso increased because of accompanying necrosis,\ndeconjugation, and inhibition of UDP-glucuronyl\ntransferase","difficulty":1},{"id":"HARR-5.3-Q059","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following would cause an increase in only the unconjugated bilirubin?","options":["Hemolytic anemia","Obstructive jaundice","Hepatitis","Hepatic cirrhosis"],"answer":"A","rationale":"Conjugated bilirubin increases as a result of\nobstructive processes within the liver or biliary \nsystem or from failure of the enterohepatic\ncirculation. Hemolytic anemia (prehepatic jaundice)\npresents a greater bilirubin load to a normal liver,\nresulting in increased bilirubin excretion. When the\nrate of bilirubin formation exceeds the rate of\nexcretion, the unconjugated bilirubin rises.","difficulty":2},{"id":"HARR-5.3-Q060","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which form of hyperbilirubinemia is caused by an inherited absence of UDP-glucuronyl transferase?","options":["Gilbert’s syndrome","Rotor syndrome","Crigler–Najjar syndrome","Dubin–Johnson syndrome"],"answer":"C","rationale":"Crigler–Najjar syndrome is a rare condition that\noccurs in two forms. Type 1 is inherited as an\nautosomal recessive trait and causes a total deficiency\nof UDP-glucuronyl transferase. Life expectancy is less\nthan 1 year. Type 2 is an autosomal dominant trait\nand is characterized by lesser jaundice and usually\nthe absence of kernicterus. Bilirubin levels can be\ncontrolled with phenobarbital, which promotes\nbilirubin excretion. Gilbert’s syndrome is an\nautosomal recessive condition characterized by\ndecreased bilirubin uptake and decreased formation\nof bilirubin diglucuronide. It is the most common\nform of inherited jaundice. UDP glucuronyl\ntransferase activity is reduced owing to an increase in\nthe number of AT repeats in the promoter region of\nthe gene. Dubin–Johnson and Rotor syndromes are\nautosomal recessive disorders associated with\ndefective delivery of bilirubin into the biliary system.","difficulty":5},{"id":"HARR-5.3-Q061","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which statement regarding total and direct bilirubin levels is true?","options":["Total bilirubin level is a less sensitive and specific marker of liver disease than the direct level","Direct bilirubin exceeds 3.5 mg/dL in most cases of hemolytic anemia","Direct bilirubin is normal in cholestatic liver disease","The ratio of direct to total bilirubin exceeds 0.40 in hemolytic anemia"],"answer":"A","rationale":"Direct bilirubin measurement is a sensitive and\nspecific marker for hepatic and posthepatic jaundice\nbecause it is not elevated by hemolytic anemia. In\nhemolytic anemia, the total bilirubin does not exceed\n3.5 mg/dL, and the ratio of direct to total is less than\n0.20. Unconjugated bilirubin is the major fraction in\nnecrotic liver disease because microsomal enzymes\nare lost. Unconjugated bilirubin is elevated along\nwith direct bilirubin in cholestasis because some\nnecrosis takes place and some conjugated bilirubin is\nhydrolyzed back to unconjugated bilirubin.","difficulty":4},{"id":"HARR-5.3-Q062","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which statement best characterizes serum bilirubin levels in the first week following delivery?","options":["Serum bilirubin 24 hours after delivery should not exceed the upper reference limit for adults","Jaundice is usually first seen 48–72 hours postpartum in neonatal hyperbilirubinemia","Serum bilirubin above 5.0 mg/dL occurring 2–5 days after delivery indicates hemolytic or hepatic disease","Conjugated bilirubin accounts for about 50% of the total bilirubin in neonates"],"answer":"B","rationale":"Bilirubin levels may reach as high as 2–3 mg/dL in \nthe first 24 hours after birth owing to the trauma of\ndelivery, such as resorption of a subdural hematoma.\nNeonatal hyperbilirubinemia occurs 2–3 days after\nbirth due to increased hemolysis at birth and\ntransient deficiency of the microsomal enzyme, \nUDP-glucuronyl transferase. Normally, levels rise \nto about 5–10 mg/dL but may be greater than \n15 mg/dL, requiring therapy with UV light to \nphoto-oxidize the bilirubin. Neonatal jaundice can\nlast up to 1 week in a mature neonate and up to \n2 weeks in prematures babies. Neonatal bilirubin is\nalmost exclusively unconjugated.","difficulty":5},{"id":"HARR-5.3-Q063","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which form of jaundice occurs within days of delivery and usually lasts 1–3 weeks, but is not due to normal neonatal hyperbilirubinemia or hemolytic disease of the newborn?","options":["Gilbert syndrome","Lucey –Driscoll syndrome","Rotor syndrome","Dubin–Johnson syndrome"],"answer":"B","rationale":"Lucey–Driscoll syndrome is a rare form of jaundice\ncaused by unconjugated bilirubin that presents\nwithin 2–4 days of birth and can last several weeks. \nIt is caused by an inhibitor of UDP-glucuronyl\ntransferase in maternal plasma that crosses the\nplacenta. Jaundice is usually severe enough to \nrequire treatment.","difficulty":5},{"id":"HARR-5.3-Q064","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"A lab measures total bilirubin by the Jendrassik–Grof bilirubin method with sample blanking. What would be the effect of moderate hemolysis on the test result?","options":["Falsely increased due to optical interference","Falsely increased due to release of bilirubin from RBCs","Falsely low due to inhibition of the diazo reaction by hemoglobin","No effect due to correction of positive interference by sample blanking"],"answer":"C","rationale":"The sample blank measures the absorbance of the\nsample and reagent in the absence of azobilirubin\nformation and corrects the measurement for optical\ninterference caused by hemoglobin absorbing the\nwavelength of measurement. However, hemoglobin\nis an inhibitor of the diazo reaction and will cause\nfalsely low results in a blank corrected sample. For this\nreason, direct bichromatic spectrophotometric\nmethods are preferred when measuring bilirubin in\nneonatal samples, which are often hemolyzed.","difficulty":5},{"id":"HARR-5.3-Q065","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which reagent is used in the Jendrassik–Grof method to solubilize unconjugated bilirubin?","options":["50% methanol","N-butanol","Caffeine","Acetic acid"],"answer":"C","rationale":"A polarity modifier is required to make unconjugated\nbilirubin soluble in diazo reagent. The Malloy–Evelyn\nmethod uses 50% methanol to reduce the polarity \nof the diazo reagent. Caffeine is used in the\nJendrassik–Grof method. This method is\nrecommended because it is not falsely elevated \nby hemolysis and gives quantitative recovery of \nboth conjugated and unconjugated bilirubin.","difficulty":2},{"id":"HARR-5.3-Q066","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which statement about colorimetric bilirubin methods is true?","options":["Direct bilirubin must react with diazo reagent under alkaline conditions","Most methods are based upon reaction with diazotized sulfanilic acid","Ascorbic acid can be used to eliminate interference caused by Hgb","The color of the azobilirubin product is independent of pH"],"answer":"B","rationale":"Unconjugated bilirubin is poorly soluble in acid, and\ntherefore, direct bilirubin is assayed using diazotized\nsulfanilic acid diluted in weak HCl. The direct diazo\nreaction should be measured after no longer than \n3 minutes to prevent reaction of unconjugated\nbilirubin, or the diazo group can be reduced using\nascorbate or hydroxylamine preventing any further\nreaction.","difficulty":1},{"id":"HARR-5.3-Q067","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which statement regarding the measurement of bilirubin by the Jendrassik–Grof method is correct?","options":["The same diluent is used for both total and direct assays to minimize differences in reactivity","Positive interference by Hgb is prevented by the addition of HCl after the diazo reaction","The color of the azobilirubin product is intensified by the addition of ascorbic acid","Fehling’s reagent is added after the diazo reaction to reduce optical interference by hemoglobin"],"answer":"D","rationale":"The Jendrassik–Grof method uses HCl as the diluent\nfor the measurement of direct bilirubin because\nunconjugated bilirubin is poorly soluble at low pH.\nTotal bilirubin is measured using an acetate buffer\nwith caffeine added to increase the solubility of the\nunconjugated bilirubin. After addition of diazotized\nsulfanilic acid and incubatiion, the diazo group is\nreduced by ascorbic acid, and Fehling’s reagent is\nadded to alkalinize the diluent. At an alkaline pH the\nproduct changes from pink to blue, shifting the\nabsorbance maximum to 600 nm where Hgb does\nnot contribute significantly to absorbance.","difficulty":3},{"id":"HARR-5.3-Q068","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"A neonatal bilirubin assay performed at the nursery by bichromatic direct spectrophotometry is 4.0 mg/dL. Four hours later, a second sample assayed for total bilirubin by the Jendrassik–Grof method gives a result of 3.0 mg/dL. Both samples are reported to be hemolyzed. What is the most likely explanation of these results?","options":["Hgb interference in the second assay","δ-Bilirubin contributing to the result of the first assay","Falsely high results from the first assay caused by direct bilirubin","Physiological variation owing to premature hepatic microsomal enzymes"],"answer":"A","rationale":"The Jendrassik–Grof method is based upon a diazo\nreaction that may be suppressed by Hgb. Because\nserum blanking and measurement at 600 nm correct\nfor positive interference from Hgb, the results may \nbe falsely low when significant hemolysis is present.\nDirect spectrophometric bilirubin methods\nemploying bichromatic optics correct for the\npresence of Hgb. These are often called “neonatal\nbilirubin” tests. A commonly used approach is to\nmeasure absorbance at 454 nm and 540 nm. The\nabsorbance contributed by Hgb at 540 nm is equal \nto the absorbance contributed by Hgb at 454 nm.\nTherefore, the absorbance difference will correct for\nfree Hgb. Neonatal samples contain little or no direct\nδ-bilirubin. They also lack carotene pigments that\ncould interfere with the direct spectrophotometric\nmeasurement of bilirubin.","difficulty":5},{"id":"HARR-5.3-Q069","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"In the enzymatic assay of bilirubin, how is measurement of both total and direct bilirubin accomplished?","options":["Using different pH for total and direct assays","Using UDP glucuronyl transferase and bilirubin reductase","Using different polarity modifiers","Measuring the rate of absorbance decrease at different time intervals"],"answer":"A","rationale":"Enzymatic methods use bilirubin oxidase to convert\nbilirubin back to biliverdin, and measure the decrease\nin absorbance that results. At pH 8, both conjugated,\nunconjugated, and delta bilirubin react with the\nenzyme, but at pH 4 only the conjugated form reacts.","difficulty":2},{"id":"HARR-5.3-Q070","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"What is the principle of the transcutaneous bilirubin assay?","options":["Conductivity","Amperometric inhibition","Multiwavelength reflectance photometry","Infrared spectroscopy"],"answer":"C","rationale":"Measurement of bilirubin concentration through \nthe skin requires the use of multiple wavelengths \nto correct for absorbance by melanin and other \nlight-absorbing constituents of skin and blood. More\nthan 100 wavelengths and multiple reflectance\nmeasurements at various sites may be used to derive\nthe venous bilirubin concentration in mg/dL. Such\ndevices have been shown to have a high specificity.\nThey can be used to identify neonates with\nhyperbilirubinemia, and to monitor treatment.","difficulty":2},{"id":"HARR-5.4-Q001","topic":"5.4 Calculations, Quality Control, and Statistics","question":"How many grams of sodium hydroxide (NaOH) are required to prepare 150.0 mL of a 5.0% w/v solution?","options":["1.5 g","4.0 g","7.5 g","15.0 g Clinical chemistry/Calculate/Solutions/2"],"answer":"C","rationale":"A percent solution expressed in w/v (weight/volume)\nrefers to grams of solute per 100.0 mL of solution. To\ncalculate, multiply the percentage (as grams) by the\nvolume needed (mL), then divide by 100.0 (mL).","difficulty":1},{"id":"HARR-5.4-Q002","topic":"5.4 Calculations, Quality Control, and Statistics","question":"How many milliliters of glacial acetic acid are needed to prepare 2.0 L of 10.0% v/v acetic acid?","options":["10.0 mL","20.0 mL","100.0 mL","200.0 mL Clinical chemistry/Calculate/Solutions/2"],"answer":"D","rationale":"The expression percent v/v refers to the volume of\none liquid in mL present in 100.0 mL of solution. To\ncalculate, multiply the percentage (as mL) by the\nvolume required (mL), then divide by 100 (mL).","difficulty":2},{"id":"HARR-5.4-Q003","topic":"5.4 Calculations, Quality Control, and Statistics","question":"A biuret reagent requires preparation of a stock solution containing 9.6 g of copper II sulfate (CuSO4) per liter. How many grams of CuSO4 • 5H2O are needed to prepare 1.0 L of the stock solution? Atomic weights: H = 1.0; Cu = 63.6; O = 16.0; S = 32.1","options":["5.4 g","6.1 g","15.0 g","17.0 g Clinical chemistry/Calculate/Reagent preparation/2"],"answer":"C","rationale":"Determine the mass of CuSO4 • 5H2O containing 9.6 g\nof anhydrous CuSO4. First, calculate the percentage \nof CuSO4 in the hydrate, then divide the amount\nneeded (9.6 g) by the percentage.","difficulty":5},{"id":"HARR-5.4-Q004","topic":"5.4 Calculations, Quality Control, and Statistics","question":"How many milliliters of HNO3 (purity 68.0%, specific gravity 1.42) are needed to prepare 1.0 L of a 2.0 N solution? Atomic weights: H = 1.0; N = 14.0; O = 16.0","options":["89.5 mL","126.0 mL","130.5 mL","180.0 mL Clinical chemistry/Calculate/Reagent preparation/2"],"answer":"C","rationale":"The molecular weight of HNO3 is 63.0 g. Because \nthe valance of the acid is 1 (1 mol of hydrogen is\nproduced per mole of acid), the equivalent weight is\nalso 63.0 g. The mass is calculated by multiplying the\nnormality (2.0 N) by the equivalent weight (63.0 g)\nand volume (1.0 L); therefore, 126.0 g of acid are\nrequired.\nBecause the purity is 68.0% and the specific gravity\n1.42, the amount of HNO3 in grams per milliliter is\n0.68 × 1.42 g/mL or 0.9656 g/mL. The volume\nrequired to give 126.0 g is calculated by dividing the\nmass needed (grams) by the grams per milliliter.","difficulty":4},{"id":"HARR-5.4-Q005","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Convert 10.0 mg/dL calcium (atomic weight = 40.1) to International System of Units (SI).","options":["0.25","0.40","2.5","0.4 Clinical chemistry/Calculate/SI unit conversion/2"],"answer":"C","rationale":"The SI unit is the recommended method of reporting\nclinical laboratory results. The SI unit for all electrolytes\nis millimole per liter. To convert from milligrams per\ndeciliter to millimoles per liter, multiply by 10 to\nconvert to milligrams per liter, then divide by the\natomic mass expressed in milligrams.","difficulty":1},{"id":"HARR-5.4-Q006","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Convert 2.0 mEq/L magnesium (atomic weight = 24.3) to milligrams per deciliter.","options":["0.8 mg/dL","1.2 mg/dL","2.4 mg/dL","4.9 mg/dL Clinical chemistry/Calculate/Unit conversion/2"],"answer":"C","rationale":"To convert from milliequivalent per liter to milligrams\nper deciliter, first calculate the milliequivalent weight\n(equivalent weight expressed in milligrams), which is\nthe atomic mass divided by the valence. Because\nmagnesium is divalent, each mole has the charge\nequivalent of 2 mol of hydrogen. Then, multiply the\nmilliequivalent per liter by the milliequivalent weight\nto convert to milligrams per liter. Next, divide by 10 to\nconvert milligrams per liter to milligrams per deciliter.","difficulty":2},{"id":"HARR-5.4-Q007","topic":"5.4 Calculations, Quality Control, and Statistics","question":"How many milliliters of a 2,000.0 mg/dL glucose stock solution are needed to prepare 100.0 mL of a 150.0 mg/dL glucose working standard?","options":["1.5 mL","7.5 mL","15.0 mL","25.0 mL Clinical chemistry/Calculate/Solutions/2"],"answer":"B","rationale":"To calculate the volume of stock solution needed,\ndivide the concentration of working standard by the\nconcentration of stock standard, then multiply by \nthe volume of working standard that is needed.","difficulty":2},{"id":"HARR-5.4-Q008","topic":"5.4 Calculations, Quality Control, and Statistics","question":"What is the pH of a solution of HNO3, if the hydrogen ion concentration is 2.5 × 10–2 M?","options":["1.0","1.6","2.5","2.8 Clinical chemistry/Calculate/pH/2"],"answer":"B","rationale":"For a strong acid, the pH is equal to the negative\nlogarithm of the hydrogen ion concentration.","difficulty":4},{"id":"HARR-5.4-Q009","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Calculate the pH of a solution of 1.5 × 10–5 M NH4OH.","options":["4.2","7.2","9.2","11.2 Clinical chemistry/Calculate/pH/2"],"answer":"C","rationale":"First, calculate the pOH of the solution.\npOH = -Log [OH–]\npOH = - Log 1.5 x 10–5 = 4.82\npH = 14 - pOH\npH = 14 - 4.8 = 9.2","difficulty":2},{"id":"HARR-5.4-Q010","topic":"5.4 Calculations, Quality Control, and Statistics","question":"How many significant figures should be reported when the pH of a 0.060 M solution of nitric acid is calculated?","options":["1","2","3","4 Clinical chemistry/Calculate/Significant figures/2"],"answer":"B","rationale":"When zeros appear by themselves to the left of \nthe decimal point, they are not significant. When\nthey are to the left of the decimal point and are\npreceded by a number, they are significant. Zeros\nafter the decimal point preceding a number are \nnot significant. However, they are significant if \nthey follow another number or are between \ntwo numbers. Therefore, 0.060 M has only \ntwo significant figures (the underlined digits). In\nlaboratory practice, most analytes are reported \nwith two significant figures. Routine analytes \nthat are exceptions are pH, which includes \nthree significant figures, and analytes with \nwhole numbers above 100 such as sodium,\ncholesterol, triglycerides, and glucose.","difficulty":4},{"id":"HARR-5.4-Q011","topic":"5.4 Calculations, Quality Control, and Statistics","question":"What is the pH of a 0.05 M solution of acetic acid? Ka = 1.75 × 10–5, pKa = 4.76","options":["1.7","3.0","4.3","4.6 Clinical chemistry/Calculate/pH/2"],"answer":"B","rationale":"Weak acids are not completely ionized, and pH must\nbe calculated from the dissociation constant of the\nacid (in this case 1.75 × 10–5).","difficulty":1},{"id":"HARR-5.4-Q012","topic":"5.4 Calculations, Quality Control, and Statistics","question":"What is the pH of a buffer containing 40.0 mmol/L NaHC2O4 and 4.0 mmol/L H2C2O4? (pKa = 1.25)","options":["1.35","2.25","5.75","6.12 Clinical chemistry/Calculate/pH/2"],"answer":"B","rationale":"The Henderson–Hasselbalch equation can be used to\ndetermine the pH of a buffer containing a weak acid\nand a salt of the acid.","difficulty":1},{"id":"HARR-5.4-Q013","topic":"5.4 Calculations, Quality Control, and Statistics","question":"A solvent needed for HPLC requires a 20.0 mmol/L phosphoric acid buffer, pH 3.50, made by mixing KH2PO4 and H3PO4. How many grams of KH2PO4 are required to make 1.0 L of this buffer? Formula weights: KH2PO4 = 136.1; H3PO4 = 98.0; pKa H3PO4 = 2.12","options":["1.96 g","2.61 g","2.72 g","19.2 g Clinical chemistry/Calculate/Buffers/2"],"answer":"B","rationale":"The Henderson–Hasselbalch equation is used to\ncalculate the ratio of salt to acid needed to give a \npH of 3.50.","difficulty":4},{"id":"HARR-5.4-Q014","topic":"5.4 Calculations, Quality Control, and Statistics","question":"A procedure for cholesterol is calibrated with a serum-based cholesterol standard that was determined by the Abell–Kendall method to be 200.0 mg/dL. Assuming the same volume of sample and reagent are used, calculate the cholesterol concentration in the patient’s sample from the following results.","options":["123 mg/dL","172 mg/dL","232 mg/dL","314 mg/dL Clinical chemistry/Calculate/Beer’s law/2"],"answer":"B","rationale":"Cu = Au/As × Cs where Cu = concentration of unknown,\nAu = absorbance of unknown, As = absorbance of\nstandard, and Cs = concentration of standard.\nCu = 0.740/0.860 × 200 mg/dL\n= 172 mg/dL","difficulty":5},{"id":"HARR-5.4-Q015","topic":"5.4 Calculations, Quality Control, and Statistics","question":"A glycerol kinase method for triglyceride calls for a serum blank in which normal saline is substituted for lipase in order to measure endogenous glycerol. Given the following results, and assuming the same volume of sample and reagent are used for each test, calculate the triglyceride concentration in the patient’s sample.","options":["119 mg/dL","131 mg/dL","156 mg/dL","180 mg/dL Clinical chemistry/Calculate/Beer’s law/2"],"answer":"B","rationale":"The serum blank absorbance is subtracted from the\nresult for the patient’s serum before applying the\nratiometric formula to calculate concentration.","difficulty":5},{"id":"HARR-5.4-Q016","topic":"5.4 Calculations, Quality Control, and Statistics","question":"A procedure for aspartate aminotransferase (AST) is performed manually because of a repeating error code for nonlinearity obtained on the laboratory’s automated chemistry analyzer; 0.05 mL of serum and 1.0 mL of substrate are used. The reaction rate is measured at 30°C at 340 nm using a 1.0 cM light path, and the delta absorbance (-ΔA) per minute is determined to be 0.382. Based upon a molar absorptivity coefficient for NADH at 340 nm of 6.22 X 103 M–1 cM–1 L–1, calculate the enzyme activity in international units (IUs) per liter.","options":["26 IU/L","326 IU/L","1228 IU/L","1290 IU/L Clinical chemistry/Calculate/International units/2"],"answer":"D","rationale":"An IU is defined as 1 μmol of substrate consumed or\nproduct produced per minute. The micromoles of\nNADH consumed in this reaction are determined by\ndividing the change in absorbance per minute by the\nabsorbance of 1 μmol of NADH. Because 1 mol/L/cm\nwould have an absorbance of 6.22 X 103 absorbance\nunits, then 1 μmol/mL/cm would produce an\nabsorbance of 6.22. Therefore, dividing the δA per\nminute by 6.22 gives the micromoles of NADH\nconsumed in the reaction. This is multiplied by the\ndilution of serum to determine the micromoles per\nmilliliter, and multiplied by 1,000 to convert to\nmicromoles per liter.","difficulty":5},{"id":"HARR-5.4-Q017","topic":"5.4 Calculations, Quality Control, and Statistics","question":"When referring to quality control (QC) results, what parameter usually determines the acceptable range?","options":["The 95% confidence interval for the mean","The range that includes 50% of the results","The central 68% of results","The range encompassed by ±2.5 standard deviations"],"answer":"A","rationale":"The acceptable range for quality control results is\nusually set at the 95% confidence interval. This is\ndefined as the range between –1.96s and +1.96s. This\nmeans that we can expect a QC result to fall within\nthis range 95 out of 100 times. For practical purposes,\nthis is the same as ±2 s (95.4 out of 100 results should\nfall within ±2 s of the mean on the basis of chance).","difficulty":4},{"id":"HARR-5.4-Q018","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Which of the following quality control (QC) rules would be broken 1 out of 20 times by chance alone?","options":["12s","22s","13s","14s"],"answer":"A","rationale":"The notation 12S means that one control is outside ±2\nstandard deviation units. QC results follow the bell-\nshaped curve called the Gaussian (normal) distribution.\nIf a control is assayed 100 times, 68 out of 100 results\nwould fall within +1 s and –1 s of the mean. Ninety-\nfive (95.4) out of 100 results would fall within +2 s \nand –2 s. This leaves only 5 out of 100 results (1:20)\nthat fall outside the ±2 s limit. Also, 99.7 out of \n100 results fall within ±3 s of the mean.","difficulty":3},{"id":"HARR-5.4-Q019","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Which of the following conditions is cause for rejecting an analytical run?","options":["Two consecutive controls greater than 2 s above or below the mean","Three consecutive controls greater than 1 s above the mean","Four controls steadily increasing in value but less than ±1 s from the mean","One control above +1 s and the other below –1 s from the mean"],"answer":"A","rationale":"Rejecting a run when three consecutive controls fall\nbetween 1 and 2 s or when a trend of four increasing\nor decreasing control results occurs would lead to\nfrequent rejection of valid analytical runs. Appropriate\ncontrol limits are four consecutive controls above or\nbelow 1 s (41s) to detect a significant shift, and a\ncusum result exceeding the ±2.7 s limit to detect a\nsignificant shift or trend. When controls deviate in\nopposite directions, the difference should exceed 4s\nbefore the run is rejected.","difficulty":1},{"id":"HARR-5.4-Q020","topic":"5.4 Calculations, Quality Control, and Statistics","question":"One of two controls within a run is above +2s and the other control is below –2s from the mean. What do these results indicate?","options":["Poor precision has led to random error (RE)","A systematic error (SE) is present","Proportional error is present","QC material is contaminated"],"answer":"A","rationale":"When control results deviate from the mean in\nopposite directions, the run is affected by RE, which\nresults from imprecision. An analytical run is rejected\nwhen two controls within the same run have an\nalgebraic difference in excess of 4s (R4s). The R4S\nrule is applied only to controls within a run \n(Level 1 – Level 2), never across runs or days.","difficulty":4},{"id":"HARR-5.4-Q021","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Two consecutive controls are both beyond –2s from the mean. How frequently would this occur on the basis of chance alone?","options":["1:100","5:100","1:400","1:1,600"],"answer":"D","rationale":"QC results follow a Gaussian or normal distribution.\nNinety-five percent of the results fall within ±2s of the\nmean; therefore, 2.5 out of 100 (1:40) are above +2s\nand 2.5 out of 100 are below –2s. The probability of\ntwo consecutive controls being beyond –2s is \nthe product of their individual probabilities. \n1/40 × 1/40 = 1/1,600 trials by chance.","difficulty":3},{"id":"HARR-5.4-Q022","topic":"5.4 Calculations, Quality Control, and Statistics","question":"The term R4S means that:","options":["Four consecutive controls are greater than ±1 standard deviation from the mean","Two controls in the same run are greater than 4s units apart","Two consecutive controls in the same run are each greater than ±4s from the mean","There is a shift above the mean for four consecutive controls"],"answer":"B","rationale":"The R4s rule is applied to two control levels within\nthe same run. The rule is violated when the\nalgebraic difference between them (level 1 – \nlevel 2) exceeds 4s. The rule is never applied across\ndifferent runs. The R4s rule detects random error\n(error due to poor precision).","difficulty":1},{"id":"HARR-5.4-Q023","topic":"5.4 Calculations, Quality Control, and Statistics","question":"A trend in QC results is most likely caused by:","options":["Deterioration of the reagent","Miscalibration of the instrument","Improper dilution of standards","Electronic noise"],"answer":"A","rationale":"A trend occurs when six or more consecutive quality\ncontrol results either increase or decrease in the same\ndirection; however, this is not cause for rejection until\na multirule is broken. Trends are systematic errors\n(affecting accuracy) linked to an unstable reagent,\ncalibrator, or instrument condition. For example, loss\nof volatile acid from a reagent causes a steady pH\nincrease, preventing separation of analyte from\nprotein. This results in lower QC results each day.","difficulty":3},{"id":"HARR-5.4-Q024","topic":"5.4 Calculations, Quality Control, and Statistics","question":"In most circumstances, when two controls within a run are both greater than ±2s from the mean, what action should be taken first?","options":["Recalibrate, then repeat controls followed by selected patient samples if quality control is acceptable","Repeat the controls before taking any corrective action","Change the reagent lot, then recalibrate","Prepare fresh standards and recalibrate"],"answer":"A","rationale":"When a 22s rule is broken an SE is present and\ncorrective action is required (repeating just the QC\nwill not correct the problem). If recalibration yields\nacceptable QC results, both sets of QC results and the\ncorrective action taken are documented in the QC\nlog. If the magnitude of the error is large enough to\nbe medically significant, then all patient samples\nsince the last previously acceptable QC should be\nrepeated. If in question, the magnitude of the error\ncan be evaluated by repeating abnormal patient\nsamples. If the average difference between results\nbefore and after recalibration is > 2s, then all samples\nshould be repeated since the last acceptable QC.","difficulty":4},{"id":"HARR-5.4-Q025","topic":"5.4 Calculations, Quality Control, and Statistics","question":"When establishing QC limits, which of the following practices is inappropriate?","options":["Using last month’s QC data to determine current target limits","Exclusion of any QC results greater than ±2s from the mean","Using control results from all shifts on which the assay is performed","Using limits determined by reference laboratories using the same method"],"answer":"B","rationale":"Data between ±2 and ±3s must be included in\ncalculations of the next month’s acceptable range.\nElimination of these values would continuously\nreduce the distribution of QC results, making \n“out-of-control” situations a frequent occurrence.\nGenerally, QC results greater than 3s are not used \nto calculate next month’s mean.","difficulty":1},{"id":"HARR-5.4-Q027","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Given the following data, calculate the coefficient of variation for glucose.","options":["3.0%","4.6%","7.6%","33.0% Clinical chemistry/Calculate/Statistics/2"],"answer":"A","rationale":"The coefficient of variation is calculated by dividing\nthe standard deviation by the mean and multiplying\nby 100.","difficulty":3},{"id":"HARR-5.4-Q028","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Which of the following plots is best for detecting all types of QC errors?","options":["Levy–Jennings","Tonks–Youden","Cusum","Linear regression"],"answer":"A","rationale":"The Levy–Jennings plot is a graph of all QC results\nwith concentration plotted on the y axis and run\nnumber on the x axis. The mean is at the center of \nthe y axis, and concentrations corresponding \nto –2 and +2s are highlighted. Results are evaluated\nfor multirule violations across both levels and runs.\nCorrective action for shifts and trends can be taken\nbefore QC rules are broken.","difficulty":1},{"id":"HARR-5.4-Q029","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Which of the following plots is best for comparison of precision and accuracy among laboratories?","options":["Levy–Jennings","Tonks–Youden","Cusum","Linear regression"],"answer":"B","rationale":"The Tonks–Youden plot is used for interlaboratory\ncomparison of monthly means. The method mean for\nlevel 1 is at the center of the y axis and mean for level\n2 at the center of the x axis. Lines are drawn from the\nmeans of both levels across the graph, dividing it into\nfour equal quadrants. If a laboratory’s monthly means\nboth plot in the lower left or upper right, then\nsystematic error (SE) exists in its method.","difficulty":2},{"id":"HARR-5.4-Q030","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Which plot will give the earliest indication of a shift or trend?","options":["Levy–Jennings","Tonks–Youden","Cusum","Histogram"],"answer":"C","rationale":"Cusum points are the algebraic sum of the difference\nbetween each QC result and the mean. The y axis is\nthe sum of differences and the x axis is the run\nnumber. The center of the y axis is 0. Because QC\nresults follow a random distribution, the points\nshould distribute about the zero line. Results are out\nof control when the slope exceeds 45° or a decision\nlimit (e.g., ±2.7s) is exceeded.","difficulty":1},{"id":"HARR-5.4-Q031","topic":"5.4 Calculations, Quality Control, and Statistics","question":"All of the following are requirements for a QC material except:","options":["Long-term stability","The matrix is similar to the specimens being tested","The concentration of analytes reflects the clinical range","Analyte concentration must be independent of the method of assay"],"answer":"D","rationale":"Quality control materials are stable, made of the \nsame components as the specimen, cover the\ndynamic linear range of the assay, and can be used\nfor multiple analytes. The target mean for QC samples\nis determined from replicate assays by the user‘s\nmethod, not the “true” concentration of the analyte.\nOut-of-control results are linked to analytic\nperformance rather than to the inherent accuracy \nof the method.","difficulty":1},{"id":"HARR-5.4-Q032","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Examine the Levy–Jennings chart at the bottom of the previous page and identify the QC problem that occurred during the first half of the month.","options":["Shift","Trend","Random error","Kurtosis"],"answer":"B","rationale":"A trend is characterized by six consecutive decreasing\nor increasing control results. The value for both\ncontrols becomes progressively higher from day 4 \nto day 9. Trends are caused by changes to the test\nsystem that increase over time, such as deterioration\nof reagents or calibrators, progressive changes in\ntemperature, evaporation, light exposure, and\nbacterial contamination. A trend is a type of SE\nbecause all results are affected. Conversely, \nRE affects some results (but not others) in an\nunpredictable manner. Control rules affected \nby RE are 13s and R4s.","difficulty":2},{"id":"HARR-5.4-Q033","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Referring to the Levy–Jennings chart, what is the first day in the month when the run should be rejected and patient results should be repeated?","options":["Day 6","Day 7","Day 8","Day 9"],"answer":"C","rationale":"Although the trend is apparent across QC levels by\nday 7, the patient results would not be rejected until\nday 8 when the 41s rule is broken. An advantage to\nplotting control data is that trends can be identified\nbefore results are out of control and patient data\nmust be rejected. In this case, corrective steps should\nhave been implemented by day 7 to avoid the delay\nand expense associated with having to repeat the\nanalysis of patient samples.","difficulty":4},{"id":"HARR-5.4-Q034","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Referring to the Levy–Jennings chart, what analytical error is present during the second half of the month?","options":["Shift","Trend","Random error","Kurtosis"],"answer":"A","rationale":"A shift is characterized by six consecutive points \nlying on the same side of the mean. This occurs \nfrom day 15 to day 20. Shifts are caused by a change\nin the assay conditions that affect the accuracy of all\nresults, such as a change in the concentration of the\ncalibrator; change in reagent; a new lot of reagent\nthat differs in composition; or improper temperature\nsetting, wavelength, or sample volume. The term\nkurtosis refers to the degree of flatness or sharpness \nin the peak of a set of values having a Gaussian\ndistribution.","difficulty":2},{"id":"HARR-5.4-Q035","topic":"5.4 Calculations, Quality Control, and Statistics","question":"What is the first day in the second half of the month that patient results would be rejected?","options":["Day 16","Day 17","Day 18","Day 19"],"answer":"B","rationale":"The 41s rule is broken across QC levels on day 17. \nThis means that four consecutive controls are greater\nthan ±1s from the mean. QC rules that are sensitive to\nSE are applied across both runs and levels to increase\nthe probability of error detection. These \nare 22s, 41s, and 10×.","difficulty":2},{"id":"HARR-5.4-Q036","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Given the following QC chart, identify the day in which a violation of the R4s QC rule occurs. 1 16 15 14 13 12 11 10 9 8 7 6 5 4 3 2","options":["Day 3","Day 8","Day 10","Day 15"],"answer":"D","rationale":"An R4s error is defined as the algebraic difference\nbetween two controls within the same run. In this\nLevy–Jennings plot, on day 15, Level 1 is above the\n+2s limit (approximately +2.5s) and Level 2 is below\nthe –2s limit (approximately –2.5s). These controls are\napproximately 5s apart (+2.5s minus –2.5s = +5s).","difficulty":3},{"id":"HARR-5.4-Q037","topic":"5.4 Calculations, Quality Control, and Statistics","question":"What is the minimum requirement for performing QC for a total protein assay?","options":["One level assayed every 8 hours","Two levels assayed within 8 hours","Two levels assayed within 24 hours","Three levels assayed within 24 hours"],"answer":"C","rationale":"The minimum requirement for frequency of quality\ncontrol for a general chemistry analyte (based upon\nthe Clinical Laboratory Improvement Act, 1988) is\ntwo levels of control assayed every 24 hours. Some\nlaboratories prefer to assay two control levels \nevery 8 hours to increase the opportunity for error\ndetection. Two controls every 8 hours are required\nfor blood gases, automated hematology, and \npoint-of-care glucose testing to comply with\nCollege of American Pathology requirements.\nAnalytes that display different CVs at the low,\nnormal, and high ranges require 3 levels of control\nin 24 hours. These include blood gases, therapeutic\ndrugs, and hormones.","difficulty":2},{"id":"HARR-5.4-Q038","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Which of the following statistical tests is used to compare the means of two methods?","options":["Student’s t test","F distribution","Correlation coefficient (r)","Linear regression analysis"],"answer":"A","rationale":"Student’s t test is the ratio of mean difference to \nthe standard error of the mean difference\n(bias/random error) and tests for a significant\ndifference in means. The F test is the ratio of\nvariances and determines if one method is\nsignificantly less precise. The correlation coefficient\nis a measure of the association between two\nvariables and should be high in any method\ncomparison. An r value less than 0.90 in method\ncomparisons usually occurs when the range of\nresults is too narrow.","difficulty":1},{"id":"HARR-5.4-Q039","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Two freezing point osmometers are compared by running 40 paired patient samples one time on each instrument, and the following results are obtained: If the critical value for F = 2.8, then what conclusion can be drawn regarding the precision of the two instruments?","options":["There is no statistically significant difference in precision","Osmometer A demonstrates better precision that is statistically significant","Osmometer B demonstrates better precision that is statistically significant","Precision cannot be evaluated statistically when single measurements are made on samples"],"answer":"A","rationale":"The F test determines whether there is a statistically\nsignificant difference in the variance of the two\nsampling distributions. Assuming the samples are\ncollected and stored in the same way and the analysis\nis done by a technologist who is familiar with the\ninstrument, then differences in variance can be\nattributed to a difference in instrument precision. \nThe F test is calculated by dividing the variance (s1)2","difficulty":5},{"id":"HARR-5.4-Q040","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Two methods for total cholesterol are compared by running 40 paired patient samples in duplicate on each instrument. The following results are obtained: Assuming the samples are collected and stored in the same way and the analysis done by a technologist who is familiar with both methods, what is the bias of method y?","options":["0.4","7.2","10.6","11.0"],"answer":"D","rationale":"The bias is defined as the difference between the\nmeans of the two methods and is calculated using\nthe formula: bias = y – ×. The bias is an estimate \nof SE. The student’s t test is used to determine \nif bias is statistically significant. The t statistic \nis the ratio of bias to the standard error of the \nmean difference. The greater the bias, the higher\nthe t score.","difficulty":5},{"id":"HARR-5.4-Q041","topic":"5.4 Calculations, Quality Control, and Statistics","question":"When the magnitude of error increases with increasing sample concentration, it is called:","options":["Constant error","Proportional error","Random error","Bias"],"answer":"B","rationale":"Proportional error (slope or percent error) results \nin greater absolute error (deviation from the target\nvalue) at higher sample concentration. Constant\nerror refers to a difference between the target value\nand the result, which is independent of sample\nconcentration. For example, if both level 1 and \nlevel 2 controls for laboratory A average 5 mg/dL\nbelow the cumulative mean reported by all \nother laboratories using the same method, then\nlaboratory A has a constant error of –5 mg/dL for\nthat method.","difficulty":4},{"id":"HARR-5.4-Q042","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Which explanation is the best interpretation of the following BUN bias plot?","options":["The new method consistently overestimates the BUN by a constant concentration","The new method is greater than the reference method but not by a statistically significant margin","The new method is lower than the reference method by 5 mg/dL","The new method is lower than the reference and the magnitude is concentration dependent"],"answer":"D","rationale":"A bias plot compares the bias (candidate method\nminus reference method) to the result of the\nreference method. Ideally, points should be\nscattered equally on both sides of the zero line.\nWhen the majority of points is below the zero line,\nthe candidate method is negatively biased (lower\nthan the reference). In this case, the difference\nbetween the methods increases in proportion to\nthe BUN concentration. This type of plot occurs\nwhen the slope of the linear regression line \nis low.","difficulty":2},{"id":"HARR-5.4-Q043","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Serum samples collected from hospitalized patients over a 2-week period are split into two aliquots and analyzed for prostate specific antigen (PSA) by two methods. Each sample was assayed by both methods within 30 minutes of collection by a technologist familiar with both methods. The reference method is method × (upper reference limit = 4.0 μg/L). Linear regression analysis was performed by the least-squares method, and results are as follows: Which statement best characterizes the relationship between the methods?","options":["There is a significant bias caused by constant error","There is a significant proportional error","There is no disagreement between the methods because the correlation coefficient approaches 1.0","There is no systematic error, but the random error of the new method is unacceptable"],"answer":"A","rationale":"The linear regression analysis is the most useful\nstatistic to compare paired patient results because\nit estimates the magnitude of specific errors. \nThe y intercept of the regression line is a measure \nof constant error, and the slope is a measure of\nproportional error. Together, these represent the\nbias or SE of the new method. The correlation\ncoefficient is influenced by the range of the sample\nand the RE. Two methods that measure the same\nanalyte will have a high correlation coefficient,\nprovided the concentrations are measured over a\nwide range, and this statistic should not be used \nto judge the acceptability of the new method. \nThe standard error of estimate is a measure of \nthe closeness of data points to the regression line\nand is an expression of RE.","difficulty":5},{"id":"HARR-5.4-Q044","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Which statement best summarizes the relationship between the new BUN method and reference method based upon the following linear regression scatterplot?","options":["The methods agree very well but show a high standard error of estimate","There is little or no constant error, but some proportional error","There will be a significant degree of uncertainty in the regression equation","There is significant constant and proportional error but little random error"],"answer":"B","rationale":"The scatterplot shows that each sample produces a\ncoordinate (x corresponds to the reference result \nand y to the candidate method result) that is very\nclose to the regression line. This means that the\nvariance of regression is low and there is a high\ndegree of certainty that the predicted value \nof y will be close to its measured value. Near-zero\nconcentration there is good agreement between\nmethods; however, the higher the result, the greater\nthe difference between x and y. The regression\nequation for this scatterplot is y = –0.01 + 0.90 x,\nindicating a proportional error of –10%.","difficulty":3},{"id":"HARR-5.4-Q045","topic":"5.4 Calculations, Quality Control, and Statistics","question":"A new method for BUN is evaluated by comparing the results of 40 paired patient samples to the urease-UV method. Normal and high controls were run on each shift for 5 days, five times per day. The results are as follows: What is the total analytical error estimate for a sample having a concentration of 50 mg/dL?","options":["–2.2 mg/dL","–2.8 mg/dL","–7.5 mg/dL","–10.0 mg/dL"],"answer":"C","rationale":"Linear regression analysis gives an estimate of SE,\nwhich is equal to (ŷ – xc) where xc is the expected\nconcentration, and ŷ is the value predicted by the\nlinear regression equation.","difficulty":5},{"id":"HARR-5.4-Q046","topic":"5.4 Calculations, Quality Control, and Statistics","question":"In addition to the number of true negatives (TN), which of the following measurements is needed to calculate specificity?","options":["True positives","Prevalence","False negatives","False positives"],"answer":"D","rationale":"The clinical specificity of a laboratory test is defined \nas the true negatives divided by the sum of true\nnegatives and false positives (FP).","difficulty":3},{"id":"HARR-5.4-Q047","topic":"5.4 Calculations, Quality Control, and Statistics","question":"A new tumor marker for ovarian cancer is evaluated for sensitivity by testing serum samples from patients who have been diagnosed by staging biopsy as having malignant or benign lesions. The following results were obtained: Number of malignant patients who are positive for CA 125 = 21 out of 24 Number of benign patients who are negative for CA 125 = 61 out of 62 What is the sensitivity of the new CA 125 test?","options":["98.4%","95.3%","87.5%","85.0% Clinical chemistry/Calculate/Sensitivity/2"],"answer":"C","rationale":"Sensitivity is defined as the percentage of persons\nwith the disease who have a positive test result. It is\ncalculated as true positives (TP) divided by the sum of\nTP and false negatives (FN).","difficulty":5},{"id":"HARR-5.4-Q048","topic":"5.4 Calculations, Quality Control, and Statistics","question":"A new test for prostate cancer is found to have a sensitivity of 80.0% and a specificity of 84.0%. If the prevalence of prostate cancer is 4.0% in men over 42 years old, what is the predictive value of a positive test result (PV+) in this group?","options":["96.0%","86.0%","32.4%","17.2%"],"answer":"D","rationale":"The predictive value of a positive test (PV+) is defined\nas the percentage of persons with a positive test\nresult who will have the disease or condition. It is\ndependent upon the sensitivity of the test and the\nprevalence of the disease in the population tested.\nPV+ is calculated by multiplying the true positives by\n100, then dividing by the sum of true positives and\nfalse positives.","difficulty":4},{"id":"HARR-5.4-Q049","topic":"5.4 Calculations, Quality Control, and Statistics","question":"What measurement in addition to true negatives and prevalence is required to calculate the predictive value of a negative test result (PV–)?","options":["False negatives","Variance","True positives","False positives"],"answer":"A","rationale":"The PV– is defined as the probability that a person\nwith a negative test result is free of disease. A high\nPV– is a characteristic of a good screening test. The\npredictive value of a negative test is calculated by\nmultiplying the true negatives by 100, then dividing\nby the sum of the true negatives and false negatives.","difficulty":3},{"id":"HARR-5.4-Q050","topic":"5.4 Calculations, Quality Control, and Statistics","question":"A laboratory is establishing a reference range for a new analyte and wants the range to be determined by the regional population of adults age 18 and older. The analyte concentration is known to be independent of race and gender. Which is the most appropriate process to follow?","options":["Determine the mean and standard deviation of the analyte from 40 healthy adults and calculate the ±2s limit","Measure the analyte in 120 healthy adults and calculate the central 95th percentile","Measure the analyte in 120 healthy adults and use the lowest and highest as the reference range limits","Measure the analyte in 60 healthy adults and 60 adults with conditions that affect the analyte concentration; calculate the concentration of least overlap"],"answer":"B","rationale":"Since the concentration of an analyte may not be\nnormally distributed in a population, the reference\nrange should not be determined from the standard\ndeviation. It is more appropriate to determine the\ncentral 95th percentile (the range that encompasses\n95% of the results). A minimum of 120 samples is\nneeded for statistical significance. Results are rank\nordered from lowest to highest. The 3rd result is the\nlowest value and the 118th is the highest value in\nthe reference range. The laboratory can verify a\npreexisting reference range (e.g., as determined \nby the manufacturer’s study) by testing 20 healthy\npersons. If no more than 10% fall outside the \nrange, it can be considered valid for the patient\npopulation.","difficulty":5},{"id":"HARR-5.4-Q051","topic":"5.4 Calculations, Quality Control, and Statistics","question":"When comparing the laboratory’s monthly mean to its peer group to determine if bias is present, what statistic is most appropriate?","options":["F test","Linear regression analysis","Correlation coefficient","Standard deviation index"],"answer":"D","rationale":"The standard deviation index (SDI) compares the\nlab’s mean to the peer group’s mean in terms of\nstandard deviations instead of concentration. This\nnormalizes the value so that it is independent of\nmean, and allows performance comparisons for any\nanalyte. The SDI equals the lab’s mean minus the\npeer group’s mean divided by the peer group’s\nstandard deviation. It has a similar probability\ndistribution to a t test and a value greater than 2.0 \nis considered significant.","difficulty":3},{"id":"HARR-5.4-Q052","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Which of the following methods is most useful in order to detect sample misidentification?","options":["Cumulative summation","Critical limit","Delta limit","Significant change limit"],"answer":"C","rationale":"Cumulative summation is a statistical method used\nin quality assurance to detect a trend in QC results.\nCritical limits are used to define when medical\nintervention is likely needed to prevent injury or\ndeath. The significant change limit is the difference\nin test results that is medically significant, or that\nwhich cannot be attributed to the sum of normal\nphysiological and analytical variation. The delta\nlimit (delta check) determines whether the\ndifference between two measurements usually \n24–48 hours apart exceeds the expected. Although\nthis can result from an abrupt change in the\npatient’s status, other causes are sample\nmisidentification, contamination, and random \nerror. Delta limits are expressed in percent and \nvary depending on analyte stability.","difficulty":3},{"id":"HARR-5.4-Q053","topic":"5.4 Calculations, Quality Control, and Statistics","question":"Which of the following total quality management tools can be used to calculate the analytical error rate for an analyte in the clinical laboratory?","options":["LEAN","Six sigma","ISO 9000","Laboratory information system"],"answer":"B","rationale":"All four of the answer choices are total quality\nmanagement (TQM) tools used in the clinical\nlaboratory to improve performance. Six sigma is a\nmeasurement of the frequency of product defects. \nIn clinical laboratories, it refers to the frequency of an\nerroneous result. At the six-sigma level, the analytical\nprocess has such small variance that an error of six\ntimes the standard deviation would still be within\nacceptable limits for total allowable error. For example,\na six-sigma process for an analyte produces a\nsignificant error in test result only 3.4 out of 1 million\ntimes the test is performed. Conversely, a method\nperforming at the three-sigma level would give \n66,807 errors per million. The sigma of a method is\ncalculated by subtracting its bias from the total\nmethod error and dividing by its standard deviation. It\nis the method’s random error divided by its standard\ndeviation.","difficulty":4},{"id":"HARR-5.4-Q054","topic":"5.4 Calculations, Quality Control, and Statistics","question":"In which circumstances is a validation study (versus performing routine quality control) required?","options":["Instrument recalibration","Source lamp or ion selective electrode change","Change in reagent lot","Change in calibrator lot"],"answer":"C","rationale":"All of the listed conditions except a change in the\nreagent lot number can be validated by assaying\ntwo levels of control material following the\nprocedure. A change in reagent lot number may\nalter the test system more dramatically, especially\nwhen the reagent was subjected to storage and\nshipping conditions that alter its performance.\nTherefore, both controls and patient samples \nshould be analyzed and the results compared to \nthe reagent in current use using criteria determined\nby the total allowable error for the analyte.","difficulty":2},{"id":"HARR-5.5-Q001","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Creatinine is formed from the:","options":["Oxidation of creatine","Oxidation of protein","Deamination of dibasic amino acids","Metabolism of purines"],"answer":"A","rationale":"Creatinine is produced at a rate of approximately \n2% daily from the oxidation of creatine mainly in\nskeletal muscle. Creatine can be converted to\ncreatinine by addition of strong acid or alkali or by \nthe enzyme creatine hydroxylase.","difficulty":1},{"id":"HARR-5.5-Q002","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Creatinine is considered the substance of choice to measure endogenous renal clearance because:","options":["The rate of formation per day is independent of body size","It is completely filtered by the glomeruli","Plasma levels are highly dependent upon diet","Clearance is the same for both men and women"],"answer":"B","rationale":"Creatinine concentration is dependent upon muscle\nmass, but varies by less than 15% per day. Creatinine\nis not metabolized by the liver, or dependent on diet,\nand is 100% filtered by the glomeruli. It is not\nreabsorbed significantly but is secreted slightly,\nespecially when filtrate flow is slow. Plasma creatinine\nand cystatin C are the two substances of choice for\nevaluating the glomerular filtration rate (GFR).","difficulty":2},{"id":"HARR-5.5-Q003","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Which statement regarding creatinine is true?","options":["Serum levels are elevated in early renal disease","High serum levels result from reduced glomerular filtration","Serum creatine has the same diagnostic utility as serum creatinine","Serum creatinine is a more sensitive measure of renal function than creatinine clearance"],"answer":"B","rationale":"Serum creatinine is a specific but not a sensitive\nmeasure of glomerular function. About 60% of \nthe filtration capacity of the kidneys is lost when\nserum creatinine becomes elevated. Because urine\ncreatinine diminishes as serum creatinine increases\nin renal disease, the creatinine clearance is more\nsensitive than serum creatinine in detecting\nglomerular disease. A creatinine clearance below \n60 mL/min indicates loss of about 50% functional\nnephron capacity and is classified as moderate\n(stage 3) chronic kidney disease.","difficulty":1},{"id":"HARR-5.5-Q004","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Which of the following formulas is the correct expression for creatinine clearance?","options":["Creatinine clearance = U/P X V X 1.73/A","Creatinine clearance = P/V X U X A/1.73","Creatinine clearance = P/V X U X 1.73/A","Creatinine clearance = U/V X P X 1.73/A"],"answer":"A","rationale":"Clearance is the volume of plasma that contains the\nsame quantity of substance that is excreted in the\nurine in 1 minute. Creatinine clearance is calculated\nas the ratio of urine creatinine to plasma creatinine in\nmilligrams per deciliter. This is multiplied by the\nvolume of urine produced per minute and corrected\nfor lean body mass by multiplying by 1.73/A, where A\nis the patient’s body surface area in square meters.\nSeparate reference ranges are needed for males,\nfemales, and children because each has a different\npercentage of lean muscle mass.","difficulty":3},{"id":"HARR-5.5-Q005","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Which of the following conditions is most likely to cause a falsely high creatinine clearance result?","options":["The patient uses the midstream void procedure when collecting his or her urine","The patient adds tap water to the urine container because he or she forgets to save one of the urine samples","The patient does not empty his or her bladder at the conclusion of the test","The patient empties his or her bladder at the start of the test and adds the urine to the collection"],"answer":"D","rationale":"Urine in the bladder should be eliminated and not\nsaved at the start of the test because it represents\nurine formed prior to the test period. The other\nconditions (choices A–C) will result in falsely low urine\ncreatinine or volume and, therefore, falsely lower\nclearance results. Error is introduced by incomplete\nemptying of the bladder when short times are used to\nmeasure clearance. A 24-hour timed urine is the\nspecimen of choice. When filtrate flow falls below \n2 mL/min, error is introduced because tubular\nsecretion of creatinine occurs. The patient must be\nkept well hydrated during the test to prevent this.","difficulty":4},{"id":"HARR-5.5-Q006","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"The modification of diet in renal disease (MDRD) formula for calculating eGFR requires which four parameters?","options":["Urine creatinine, serum creatinine, height, weight","Serum creatinine, age, gender, race","Serum creatinine, height, weight, age","Urine creatinine, gender, weight, age"],"answer":"B","rationale":"The National Kidney Foundation recommends\nscreening for chronic kidney disease using the\nestimated glomerular filtration rate (eGFR) because \nof the high frequency of sample collection errors\nassociated with measuring creatinine clearance. The\neGFR should be calculated according to the MDRD\nformula, and reported along with the serum or\nplasma creatinine.","difficulty":3},{"id":"HARR-5.5-Q007","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"What substance may be measured as an alternative to creatinine for evaluating GFR?","options":["Plasma urea","Cystatin C","Uric acid","Potassium"],"answer":"B","rationale":"Although all of the analytes listed are increased in\nchronic kidney disease as a result of low GFR,\npotassium, urea, and uric acid may be increased by\nother mechanisms and therefore, they are not specific\nfor glomerular function. Cystatin C is an inhibitor \nof cysteine proteases. Being only 13 kilodaltons, it \nis completely filtered by the glomerulus then\nreabsorbed by the tubules. The plasma level is highly\ncorrelated to GFR because little is eliminated by\nnonrenal routes. Plasma levels are not influenced \nby diet, age, gender, or nutritional status. Low GFR\ncauses retention of cystatin C in plasma and levels\nbecome abnormally high at clearance rates below \n90 mL/min, making the test more sensitive than\ncreatinine.","difficulty":4},{"id":"HARR-5.5-Q008","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Which of the following enzymes allows creatinine to be measured by coupling the creatinine amidohydrolase (creatininase) reaction to the peroxidase reaction?","options":["Glucose-6-phosphate dehydrogenase","Creatinine iminohydrolase","Sarcosine oxidase","Creatine kinase"],"answer":"C","rationale":"The peroxidase-coupled enzymatic assay of creatinine\nis based upon the conversion of creatinine to creatine\nby creatinine amidohydrolase (creatininase). The\nenzyme creatinine amidinohydrolase (creatinase) then\nhydrolyzes creatine to produce sarcosine and urea.\nThe enzyme sarcosine oxidase converts sarcosine to\nglycine producing formaldehyde and hydrogen\nperoxide. Peroxidase then catalyzes the oxidation of a\ndye (4-aminophenazone and phenol) by the peroxide\nforming a red-colored product. This method is more\nspecific than the Jaffe reaction, which tends to\noverestimate creatinine by about 5% in persons with\nnormal renal function.","difficulty":5},{"id":"HARR-5.5-Q009","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Select the primary reagent used in the Jaffe method for creatinine.","options":["Alkaline copper II sulfate","Saturated picric acid and NaOH","Sodium nitroprusside and phenol","Phosphotungstic acid"],"answer":"B","rationale":"The Jaffe method uses saturated picric acid, which\noxidizes creatinine in alkali, forming creatinine picrate.\nThe reaction is nonspecific; ketones, ascorbate,\nproteins, and other reducing agents contribute to the\nfinal color. Alkaline CuSO4 is used in the biuret\nmethod for protein.","difficulty":2},{"id":"HARR-5.5-Q010","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Interference from other reducing substances can be partially eliminated in the Jaffe reaction by:","options":["Measuring the product at 340 nm","Measuring the product with an electrode","Measuring the timed rate of product formation","Performing a sample blank"],"answer":"C","rationale":"The Jaffe reaction is nonspecific; proteins and other\nreducing substances such as pyruvate, protein, and\nascorbate cause positive interference. Much of this\ninterference is reduced by using a timed rate\nreaction. Ketoacids react with alkaline picrate almost\nimmediately, and proteins react slowly. Therefore,\nreading the absorbance at 20 and 80 seconds and\nusing the absorbance difference minimizes the\neffects of those compounds. Creatinine can be\nmeasured using an amperometric electrode.\nHowever, this requires the enzymes creatininase,\ncreatinase, and sarcosine oxidase. The last enzyme\nproduces hydrogen peroxide from sarcosine, which is\noxidized. This produces current in proportion to\ncreatinine concentration. Performing a sample blank\ndoes not correct for interfering substances that react\nwith alkaline picrate.","difficulty":4},{"id":"HARR-5.5-Q011","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"Which of the following statements is true?","options":["Cystatin C is measured immunochemically","The calibrator used for cystatin C is traceable to the National Bureau of Standards calibrator","Cystatin C assays have a lower coefficient of variation than plasma creatinine","Enzymatic and rate Jaffe reactions for creatinine give comparable results"],"answer":"A","rationale":"Cystatin C can be measured by enzyme\nimmunoassay, immunonephelometry, and\nimmunoturbidimetry. However, there is no\nstandardized calibrator as for creatinine, and\ntherefore, results vary considerably from lab to lab.\nThe coefficient of variation for these methods tends\nto be slightly higher than for creatinine. Since the\nenzymatic methods are specific, they give lower\nplasma creatinine results than the Jaffe method in\npersons with normal renal function. However, they\ntend to give higher clearance results than for inulin or\niohexol clearance because some creatinine is\nsecreted by the renal tubules.","difficulty":2},{"id":"HARR-5.5-Q012","topic":"5.5 Creatinine, Uric Acid, BUN, and Ammonia","question":"In which case would eGFR derived from the plasma creatinine likely give a more accurate measure of GFR than measurement of plasma cystati
