fied as a combined\nacid–base disturbance. In answer C, the pH is almost\nnormal, and both bicarbonate and PCO2 are increased.\nThis can occur in the early stage of a metabolic acid–\nbase disturbance when full respiratory compensation\noccurs or in a combined acid–base disorder. In\nanswer D, both bicarbonate and PCO2 are within\nnormal limits (22–26 mmol/L, 35–45 mm Hg,\nrespectively) as is the pH.","difficulty":4},{"id":"HARR-5.2-Q021","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following will shift the O2 dissociation curve to the left?","options":["Anemia","Hyperthermia","Hypercapnia","Alkalosis"],"answer":"D","rationale":"A left shift in the oxyhemoglobin dissociation curve\nsignifies an increase in the affinity of Hgb for O2. \nThis occurs in alkalosis, hypothermia, and in those\nhemoglobinopathies such as Hgb Chesapeake that\nincrease the binding of O2 to heme. A right shift in\nthe oxyhemoglobin dissociation curve lowers the\naffinity of Hgb for O2. This occurs in anemia due to\nincreased 2,3-diphosphoglycerate (2,3-DPG), with\nincreased body temperature, increased hydrogen ion\nconcentration, hypercapnia (increased PCO2), and in\nsome hemoglobinopathies, such as Hgb Kansas.","difficulty":3},{"id":"HARR-5.2-Q022","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"In which circumstance will the reporting of calculated oxygen saturation of hemoglobin based on PO2, PCO2, pH, temperature, and hemoglobin be in error?","options":["Carbon monoxide poisoning","Diabetic ketoacidosis","Patient receiving oxygen therapy","Assisted ventilation for respiratory failure"],"answer":"A","rationale":"CO has about 200 times the affinity as O2 for\nhemoglobin and will displace O2 from hemoglobin \nat concentrations that have no significant effect on\nthe PAO2. Consequently, calculated oxygen saturation\nwill be erroneously high. Other cases in which the\ncalculated O2Sat should not be used include any\nhemoglobinopathy that affects oxygen affinity and\nmethemoglobinemia. The other situations above\naffect the O2 saturation of hemoglobin in a manner\nthat can be predicted by the effect of pH, PO2, and\nPCO2 on the oxyhemoglobin dissociation curve.","difficulty":5},{"id":"HARR-5.2-Q023","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which would be consistent with partially compensated respiratory acidosis?","options":["pH PCO2 Bicarbonate increased increased increased","pH PCO2 Bicarbonate increased decreased decreased","pH PCO2 Bicarbonate decreased decreased decreased","pH PCO2 Bicarbonate decreased increased increased"],"answer":"D","rationale":"Acidosis = low pH; respiratory = disturbance of PCO2;\na low pH is caused by increased PCO2. In partially\ncompensated respiratory acidosis, the metabolic\ncomponent of the buffer system, bicarbonate, is\nretained. This helps to compensate for retention of\nPCO2 by titrating hydrogen ions. The compensatory\ncomponent always moves in the same direction as\nthe cause of the acid–base disturbance.","difficulty":1},{"id":"HARR-5.2-Q024","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which condition results in metabolic acidosis with severe hypokalemia and chronic alkaline urine?","options":["Diabetic ketoacidosis","Phenformin-induced acidosis","Renal tubular acidosis","Acidosis caused by starvation"],"answer":"C","rationale":"Metabolic acidosis can be caused by any condition\nthat lowers bicarbonate. In nonrenal causes, the\nkidneys will attempt to compensate by increased acid\nexcretion. However, in renal tubular acidosis (RTA), an\nintrinsic defect in the tubules prevents bicarbonate\nreabsorption. This causes alkaline instead of acidic\nurine. Excretion of bicarbonate as potassium\nbicarbonate (KHCO3) results in severe hypokalemia.","difficulty":4},{"id":"HARR-5.2-Q025","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following mechanisms is responsible for metabolic acidosis?","options":["Bicarbonate deficiency","Excessive retention of dissolved CO2","Accumulation of volatile acids","Hyperaldosteronism"],"answer":"A","rationale":"Metabolic acidosis is caused by bicarbonate deficiency\nand metabolic alkalosis by bicarbonate excess.\nRespiratory acidosis is caused by PCO2 retention\n(defective ventilation), and respiratory alkalosis is\ncaused by PCO2 loss (hyperventilation). Important\ncauses of metabolic acidosis include renal failure,\ndiabetic ketoacidosis, lactate acidosis, and diarrhea.","difficulty":1},{"id":"HARR-5.2-Q026","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following disorders is associated with lactate acidosis?","options":["Diarrhea","Renal tubular acidosis","Hypoaldosteronism","Alcoholism"],"answer":"D","rationale":"Lactate acidosis often results from hypoxia, which\ncauses a deficit of nicotinamide adenine dinucleotide,\nthe oxidized form (NAD+). This promotes the\nreduction of pyruvate to lactate, regenerating NAD+","difficulty":1},{"id":"HARR-5.2-Q027","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following is the primary mechanism of compensation for metabolic acidosis?","options":["Hyperventilation","Release of epinephrine","Aldosterone release","Bicarbonate excretion"],"answer":"A","rationale":"In metabolic acidosis, the respiratory center is\nstimulated by chemoreceptors in the carotid sinus,\ncausing hyperventilation. This results in increased\nrelease of CO2. Respiratory compensation begins\nalmost immediately unless blocked by pulmonary\ndisease or respiratory therapy. Hyperventilation can\nbring the PCO2 down to approximately 10–15 mm Hg.","difficulty":1},{"id":"HARR-5.2-Q028","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"The following conditions are all causes of alkalosis. Which condition is associated with respiratory (rather than metabolic) alkalosis?","options":["Anxiety","Hypovolemia","Hyperaldosteronism","Hypoparathyroidism"],"answer":"A","rationale":"Respiratory alkalosis is caused by hyperventilation,\nwhich leads to decreased PCO2. Anxiety and drugs\nsuch as epinephrine that stimulate the respiratory\ncenter are common causes of respiratory alkalosis.\nExcess aldosterone increases net acid excretion by\nthe kidneys. Low parathyroid hormone causes\nincreased bicarbonate reabsorption, resulting in\nalkalosis. Hypovolemia increases the relative\nconcentration of bicarbonate. This is common and \nis called dehydrational alkalosis, chloride responsive\nalkalosis, or alkalosis of sodium deficit.","difficulty":4},{"id":"HARR-5.2-Q029","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following conditions is associated with both metabolic and respiratory alkalosis?","options":["Hyperchloremia","Hypernatremia","Hyperphosphatemia","Hypokalemia"],"answer":"D","rationale":"Hypokalemia is both a cause and result of alkalosis. \nIn alkalosis, hydrogen ions may move from the cells\ninto the extracellular fluid and potassium into the\ncells. In hypokalemia caused by overproduction of\naldosterone, hydrogen ions are secreted by the renal\ntubules. This increase in net acid excretion results in\nmetabolic alkalosis.","difficulty":2},{"id":"HARR-5.2-Q030","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"In uncompensated metabolic acidosis, which of the following will be normal?","options":["Plasma bicarbonate","PCO2","p50","Total CO2"],"answer":"B","rationale":"The normal compensatory mechanism for\nmetabolic acidosis is respiratory hyperventilation. \nIn uncompensated cases, the PCO2 is not reduced,\nindicating a concomitant problem in respiratory\ncontrol.","difficulty":1},{"id":"HARR-5.2-Q031","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following conditions is classified as normochloremic acidosis?","options":["Diabetic ketoacidosis","Chronic pulmonary obstruction","Uremic acidosis","Diarrhea"],"answer":"A","rationale":"Bicarbonate deficit will lead to hyperchloremia unless\nthe bicarbonate is replaced by an unmeasured anion.\nIn diabetic ketoacidosis, acetoacetate and other\nketoacids replace bicarbonate. The chloride remains\nnormal or low and there is an increased anion gap.","difficulty":1},{"id":"HARR-5.2-Q032","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which PCO2 value would be seen in maximally compensated metabolic acidosis?","options":["15 mm Hg","30 mm Hg","40 mm Hg","60 mm Hg"],"answer":"A","rationale":"In metabolic acidosis, hyperventilation increases the\nratio of bicarbonate to dissolved CO2. The extent of\ncompensation is limited by the rate of both gas\ndiffusion and diaphragm contraction. The lower \nlimit is between 10 and 15 mm Hg PCO2, which is \nthe maximum compensatory effect.","difficulty":2},{"id":"HARR-5.2-Q033","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"A patient has the following arterial blood gas results: These results are most likely the result of which condition?","options":["Improper specimen collection","Prolonged storage","Hyperventilation","Hypokalemia"],"answer":"C","rationale":"The pH is alkaline (reference range 7.35–7.45) and \nthis can be caused by either low PCO2 or increased\nbicarbonate. This patient has a normal bicarbonate\n(reference range 22–26 mmol/L) and a low PCO2\n(reference range 35–45 mm Hg). Low PCO2 is always\ncaused by hyperventilation, and therefore, this is a\ncase of uncompensated respiratory alkalosis. The\nacute stages of respiratory disorders are often\nuncompensated. Prolonged storage would cause \nthe pH and PO2 to fall, and the PCO2 to rise.\nHypokalemia causes alkalosis, but usually is\nassociated with the retention of CO2 as\ncompensation.","difficulty":5},{"id":"HARR-5.2-Q034","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Why are three levels used for quality control of pH and blood gases?","options":["Systematic errors can be detected earlier than with two controls","Analytical accuracy needs to be greater than for other analytes","High, normal, and low ranges must always be evaluated","A different level is needed for pH, PCO2, and PO2"],"answer":"A","rationale":"Error detection occurs sooner when more controls\nare used. Some errors, such as those resulting from\ntemperature error and protein coating of electrodes,\nare not as pronounced near the calibration point, as\nin the acidosis and alkalosis range. The minimum\nrequirement for blood gas QC is one sample every \n8 hours and three levels (acidosis, normal, alkalosis)\nevery 24 hours. Three levels of control are also used\ncommonly for therapeutic drug monitoring and\nhormone assays because precision differs significantly\nin the high and low ranges.","difficulty":4},{"id":"HARR-5.2-Q035","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"A single-point calibration is performed between each blood gas sample in order to:","options":["Correct the electrode slope","Correct electrode and instrument drift","Compensate for temperature variance","Prevent contamination by the previous sample"],"answer":"B","rationale":"Calibration using a single standard corrects the\ninstrument for error at the labeled value of the\ncalibrator but does not correct for analytic errors\naway from the set point. A two-point calibration\nadjusts the slope response of the electrode,\neliminating proportional error caused by poor\nelectrode performance.","difficulty":5},{"id":"HARR-5.2-Q036","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"In which condition would hypochloremia be expected?","options":["Respiratory alkalosis","Metabolic acidosis","Metabolic alkalosis","All of these options"],"answer":"C","rationale":"Chloride is the major extracellular anion and is\nretained or lost to preserve electroneutrality. Low\nchloride will occur in metabolic alkalosis because\nexcess bicarbonate is present. Low chloride also will\noccur in partially compensated respiratory acidosis\nbecause the kidneys compensate by increased\nretention of bicarbonate.","difficulty":1},{"id":"HARR-5.2-Q037","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Given the following serum electrolyte data, determine the anion gap.","options":["12 mmol/L","20 mmol/L","64 mmol/L","Cannot be determined from the information provided"],"answer":"B","rationale":"The anion gap is defined as unmeasured anions\nminus unmeasured cations. It is calculated by\nsubtracting the measured anions (bicarbonate \nand chloride) from the serum sodium (or sodium \nplus potassium). A normal anion gap is \napproximately 8–16 mmol/L (12–20 mmol/L \nwhen potassium is used).","difficulty":4},{"id":"HARR-5.2-Q038","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following conditions will cause an increased anion gap?","options":["Diarrhea","Hypoaldosteronism","Hyperkalemia","Renal failure"],"answer":"D","rationale":"An increased anion gap occurs when there is\nproduction or retention of anions other than\nbicarbonate or chloride (measured anions). For\nexample, in renal failure, retention of phosphates and\nsulfates (as sodium salts) increases the anion gap.\nOther common causes of metabolic acidosis with an\nincreased anion gap are diabetic ketoacidosis and\nlactate acidosis. The anion gap may also be increased\nin the absence of an acid–base disorder. Common\ncauses include hypocalcemia, drug overdose, and\nlaboratory error when measuring electrolytes.","difficulty":3},{"id":"HARR-5.2-Q039","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Alcoholism, liver failure, and hypoxia induce acidosis by causing:","options":["Depletion of cellular NAD+","Increased excretion of bicarbonate","Increased retention of PCO2","Loss of carbonic anhydrase"],"answer":"A","rationale":"Oxygen debt and liver failure block oxidative\nphosphorylation, preventing  NADH from being\noxidized back to NAD+. Oxidation of ethanol to\nacetate results in accumulation of NADH. When \nNAD+ is depleted, glycolysis cannot proceed. It is\nregenerated by reduction of pyruvate to lactate,\ncausing lactate acidosis.","difficulty":1},{"id":"HARR-5.2-Q040","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following is the primary mechanism causing respiratory alkalosis?","options":["Hyperventilation","Deficient alveolar diffusion","Deficient pulmonary perfusion","Parasympathetic inhibition"],"answer":"A","rationale":"Hyperventilation via stimulation of the respiratory\ncenter (or induced by a respirator) is the mechanism\nof respiratory alkalosis. Causes include low PO2,\nanxiety, fever, and drugs that stimulate the\nrespiratory center. Acute respiratory alkalosis is \noften uncompensated because renal compensation\nis not rapid. Uncompensated respiratory alkalosis is\ncharacterized by an elevated pH and a low PCO2\nwith normal bicarbonate.","difficulty":2},{"id":"HARR-5.2-Q041","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which condition can result in acidosis?","options":["Cystic fibrosis","Vomiting","Hyperaldosteronism","Excessive O2 therapy"],"answer":"D","rationale":"When O2 saturation of venous blood is greatly\nelevated, Hgb cannot release O2. Oxyhemoglobin\ncannot bind CO2 or hydrogen ions and acidosis\nresults. Pure O2 may cause neurological damage,\nleading to convulsion and blindness, especially in\ninfants. It can induce respiratory failure by causing\npulmonary hemorrhage, edema, and hyalinization.\nThe other three conditions cause alkalosis. Vomiting\nand cystic fibrosis cause loss of chloride, resulting in\nhypovolemia and intestinal bicarbonate absorption.\nHyperaldosteronism causes hypokalemia; this results\nin increased renal H+ excretion and a shift of H+ into\ncells in exchange for K+.","difficulty":2},{"id":"HARR-5.2-Q042","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following conditions is associated with an increase in ionized calcium (Cai) in the blood?","options":["Alkalosis","Hypoparathyroidism","Hyperalbuminemia","Malignancy"],"answer":"D","rationale":"Increased Cai occurs in hyperparathyroidism,\nmalignancy, and acidosis. Cai is elevated in primary\nhyperparathyroidism due to resorption of calcium\nfrom bone. Many nonparathyroid malignancies create\nproducts called parathyroid hormone-related proteins\nthat stimulate the parathyroid receptors of cells.\nAcidosis alters the equilibrium between bound and\nfree calcium, favoring ionization. Hyperalbuminemia\nincreases the total calcium by increasing the protein-\nbound fraction, but does not affect the Cai.","difficulty":3},{"id":"HARR-5.2-Q043","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following laboratory results is consistent with primary hypoparathyroidism?","options":["Low calcium; high inorganic phosphorus Pi","Low calcium; low Pi","High calcium; high Pi","High calcium; low Pi"],"answer":"A","rationale":"Parathyroid hormone deficiency causes reduced\nresorption of calcium from bone, increased renal\nexcretion of calcium, and decreased renal excretion\nof phosphorus. It is distinguished from other causes\nof hypocalcemia by Cai, which is reduced only by\nprimary hypoparathyroidism and alkalosis.","difficulty":3},{"id":"HARR-5.2-Q044","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following conditions is associated with hypophosphatemia?","options":["Rickets","Multiple myeloma","Renal failure","Hypervitaminosis D"],"answer":"A","rationale":"Rickets can result from dietary phosphate deficiency,\nvitamin D deficiency, or an inherited disorder of \neither vitamin D or phosphorus metabolism. \nVitamin D–dependent rickets (VDDR) can be reversed\nby megadoses of vitamin D. Type 1 is caused by a\ndeficiency in renal cells of 1-α-hydroxylase, an\nenzyme that converts 25 hydroxyvitamin D to the\nactive form, 1,25 hydroxyvitamin D. Type 2 is caused\nby a deficiency in the vitamin D receptor of bone\ntissue. Vitamin D–resistant rickets (VDRR) is caused by\na deficiency in the renal reabsorption of phosphate.\nConsequently, affected persons (usually men because\nit is most commonly X-linked) have a normal serum\ncalcium and a low Pi.","difficulty":3},{"id":"HARR-5.2-Q045","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following tests is consistently abnormal in osteoporosis?","options":["High urinary calcium","High serum Pi","Low serum calcium","High urine or serum N-telopeptide of type 1 collagen"],"answer":"D","rationale":"Commonly used markers for other bone \ndiseases such as serum or urinary calcium, \ninorganic phosphorus, total alkaline phosphatase\n(ALP), and vitamin D are neither sensitive nor\nspecific for osteoporosis. Calcium and phosphorus\nare usually within normal limits. Although \nestrogen deficiency reduces formation of \n1,25 hydroxyvitamin D (1,25 hydroxycholecalciferol),\npromoting postmenopausal osteoporosis, the \n1,25 hydroxyvitamin D is low in only 30%–35% of \ncases, and low levels may be caused by other bone\ndisorders. Serum markers for osteoporosis include\nboth N-telopeptide of type 1 collagen (NTx) and \nC-telopeptide of type 1 collagen (CTx). These \ncan be used to follow treatment with resorption\nantagonists (bisphosphonates) because they\ndecrease significantly when therapy is successful.","difficulty":4},{"id":"HARR-5.2-Q046","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following is a marker for bone formation?","options":["Osteocalcin","Tartrate resistant acid phosphatase (TRAP)","Urinary pyridinoline and deoxypyridinoline","Urinary C-telopeptide and N-telopeptide crosslinks (CTx and NTx)"],"answer":"A","rationale":"Biochemical markers for osteoporosis are classified \nas either markers for bone formation or resorption.\nOsteocalcin is a protein hormone that stimulates\nosteoblasts and increases bone mineralization.\nPyridinoline is formed when hydroxylysine groups \non adjacent fibrils are joined together, and\ndeoxypyridinoline when hydroxylysine and lysine\ngroups are joined. These form crosslinks between \nthe C and N terminal ends of one fibril (which are\nnonhelical) and the helical portion of an adjacent\nfibril. The resulting products are called C- and \nN-telopeptide crosslinks of type 1 collagen.\nOsteoclasts cause cleavage of these bonds, resulting\nin loss of both telopeptides—deoxypyridinoline \nand pyridinoline—in the urine. TRAP is an enzyme\n(produced by osteoclasts) that hydrolyzes phosphate\nin the hydroxyapatite matrix of the bone.","difficulty":3},{"id":"HARR-5.2-Q047","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"What role do CTx and NTx play in the management of osteoporosis?","options":["Increased urinary excretion is diagnostic of early stage disease","Increased levels indicate a low risk of developing osteoporosis","Decreased urinary excretion indicates a positive response to treatment","The rate of urinary excretion correlates with the stage of the disease"],"answer":"C","rationale":"Markers for both bone formation and resorption are\nused to monitor treatment for osteoporosis. Serum\nand urinary measurements of CTx and NTx and\nurinary deoxypyridinoline are used to monitor\nmedications such as biphosphonates that inhibit\nbone resorption. Levels fall with successful treatment.\nDEXA scan, an x-ray procedure based on subtraction\nof surrounding tissue, is the most sensitive diagnostic\ntest for osteoporosis and can show bone loss as small\nas 1%. However, it takes months before a DEXA scan\nshows increased bone remodeling following\ntreatment.","difficulty":1},{"id":"HARR-5.2-Q048","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"What role does vitamin D measurement play in the management of osteoporosis?","options":["Vitamin D deficiency must be demonstrated to establish the diagnosis","Vitamin D is consistently elevated in osteoporosis","A normal vitamin D level rules out osteoporosis","Vitamin D deficiency is a risk factor for developing osteoporosis"],"answer":"D","rationale":"Vitamin D assay is not used to diagnose osteoporosis.\nVitamin D deficiency is a cause of secondary\nosteoporosis, and together with low PTH, calcium,\nand estrogen are important risk factors. If one or more\nof these is abnormal, then bone resorption or\nremodeling may be abnormal, predisposing one to\nosteoporosis. Deficiency of vitamin D also causes\nrickets (called osteomalacia in adults), a condition in\nwhich bones become soft owing to reduced\ndeposition of hydroxyapatite.","difficulty":2},{"id":"HARR-5.2-Q049","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which statement best describes testing recommendations for vitamin D?","options":["Vitamin D testing should be reserved only for those persons who demonstrate hypercalcemia of an undetermined cause","Vitamin D testing should be specific for the 1,25(OH)D3 form","Testing should be for total vitamin D when screening for deficiency","Vitamin D testing should not be performed if the patient is receiving a vitamin D supplement"],"answer":"C","rationale":"Vitamin D deficiency is far more common than\nvitamin D excess, and screening for vitamin D\ndeficiency is advocated especially for dark-skinned\npersons and people who do not get adequate\nsunlight. Provitamin D is a steroid, and vitamin D is\nnow considered a hormone rather than a vitamin.\nThe hormone regulates transcription of over \n200 genes and has pronounced effects on both\ndendritic cells and T lymphocytes. Deficiency is\nassociated with many chronic diseases including\nautoimmune diseases, cancers, hypertension, and\nheart disease. There are two forms of the vitamin,\nergocalciferol (D2) and cholecalciferol (D3). Active D2\nand D3 are formed when two hydroxyl groups are\nadded, the first being at the 25 position by the liver\nand the second at the α-1 position by the kidney. \nThe majority of the circulating vitamin D is in the \n25-hydroxylated form of D2 and D3, called 25(OH)D.\nThe plasma 25(OH)D concentration is an expression\nof both dietary and endogenous vitamin D and is \nthe most appropriate test for detecting nutritional\nvitamin D deficiency. Since the effect on calcium is\nderived from the active 1,25 form of the vitamin,\nplasma 1,25(OH)D concentration is a more specific\ntest for hypervitaminosis D.","difficulty":5},{"id":"HARR-5.2-Q050","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"The serum level of which of the following laboratory tests is decreased in both VDDR and VDRR?","options":["Vitamin D","Calcium","Pi","Parathyroid hormone"],"answer":"C","rationale":"Persons with VDDR and VDRR have a low Pi. However,\npersons with VDDR have decreased serum calcium, \nas well. Parathyroid hormone (PTH) is increased in\npersons with VDDR because calcium is the primary\nstimulus for PTH release, but not in persons with\nVDRR. Vitamin D levels vary depending upon the \ntype of rickets and the vitamin D metabolite that is\nmeasured. 1,25(OH)D, the active form of vitamin D, \nis low in type 1 but high in type 2 VDDR. It may be\neither normal or low in VDRR.","difficulty":4},{"id":"HARR-5.2-Q051","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following is the most accurate measurement of Pi in serum?","options":["Rate of unreduced phosphomolybdate formation at 340 nm","Measurement of phosphomolybdenum blue at 680 nm","Use of aminonaptholsulfonic acid to reduce phosphomolybdate","Formation of a complex with malachite green dye"],"answer":"A","rationale":"The colorimetric method (Fiske and SubbaRow)\nused previously for Pi reacted ammonium\nmolybdate with Pi, forming ammonium\nphosphomolybdate (NH4)3[PO4(MoO3)12]. A\nreducing agent, aminonaptholsulfonic acid (ANS),\nwas added, forming phosphomolybdenum blue.\nThe product was unstable and required sulfuric\nacid, making precipitation of protein a potential\nsource of error. These problems are avoided by\nmeasuring the rate of formation of unreduced\nphosphomolybdate at 340 nm.","difficulty":3},{"id":"HARR-5.2-Q052","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"What is the percentage of serum calcium that is ionized (Cai)?","options":["30%","45%","60%","80%"],"answer":"B","rationale":"Calcium exists in serum in three forms: protein\nbound, ionized, and complexed (as undissociated\nsalts). Only Cai is physiologically active. Protein bound\nand Cai each account for approximately 45% of total\ncalcium, and the remaining 10% is complexed.","difficulty":3},{"id":"HARR-5.2-Q053","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following conditions will cause erroneous Cai results? Assume that the samples are collected and stored anaerobically, kept at 4°C until measurement, and stored for no longer than 1 hour.","options":["Slight hemolysis during venipuncture","Assay of whole blood collected in sodium oxalate","Analysis of serum in a barrier gel tube stored at 4°C until the clot has formed","Analysis of whole blood collected in sodium heparin, 20 U/mL (low-heparin tube)"],"answer":"B","rationale":"Unlike Pi, the intracellular calcium level is not\nsignificantly different from plasma calcium, and\ncalcium is not greatly affected by diet. Whole blood\ncollected with 5–20 U/mL heparin and stored on ice\nno longer than 2 hours is the sample of choice for Cai.\nBlood gas syringes prefilled with 100 U/mL heparin\nshould not be used because the high heparin\nconcentration will cause low results. Citrate, oxalate,\nand ethylenediaminetetraacetic acid (EDTA) must not\nbe used because they chelate calcium. Serum may be\nused provided that the sample is iced, kept capped\nwhile clotting, and assayed within 2 hours (barrier gel\ntubes may be stored longer).","difficulty":5},{"id":"HARR-5.2-Q054","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following conditions is associated with a low serum magnesium?","options":["Addison’s disease","Hemolytic anemia","Hyperparathyroidism","Pancreatitis"],"answer":"D","rationale":"Low magnesium can be caused by gastrointestinal\nloss, as occurs in diarrhea and pancreatitis (loss of \nMg and Ca as soaps). Hyperparathyroidism causes\nincreased release of both calcium and magnesium\nfrom bone. Addison’s disease (adrenocorticosteroid\ndeficiency) may be associated with increased\nmagnesium accompanying hyperkalemia. Hemolytic\nanemia causes increased release of magnesium \nas well as potassium from damaged red blood \ncells (RBCs).","difficulty":4},{"id":"HARR-5.2-Q055","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"When measuring calcium with the complexometric dye o-cresolphthalein complexone, magnesium is kept from interfering by:","options":["Using an alkaline pH","Adding 8-hydroxyquinoline","Measuring at 450 nm","Complexing to EDTA"],"answer":"B","rationale":"o-Cresolphthalein complexone can be used to measure\neither magnesium or calcium. Interference in calcium\nassays is prevented by addition of 8-hydroxyquinoline,\nwhich chelates magnesium. When magnesium is\nmeasured, ethyleneglycol bistetraacetic acid (EGTA) or\nEDTA is used to chelate calcium. Two other dyes that\ncan be used for both magnesium and calcium assays\nare calmagite and methylthymol blue. Arsenazo III dye\nis commonly used to measure calcium. It is more\nspecific for Ca+2 than the others, and does not require\naddition of a Mg+2 chelator.","difficulty":4},{"id":"HARR-5.2-Q056","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which electrolyte measurement is least affected by hemolysis?","options":["Potassium","Calcium","Pi","Magnesium"],"answer":"B","rationale":"Potassium, phosphorus, and magnesium are the\nmajor intracellular ions, and even slight hemolysis \nwill cause falsely elevated results. Serum samples \nwith visible hemolysis (20 mg/dL free Hgb) should \nbe redrawn.","difficulty":1},{"id":"HARR-5.2-Q057","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following conditions is associated with hypokalemia?","options":["Addison’s disease","Hemolytic anemia","Digoxin intoxication","Alkalosis"],"answer":"D","rationale":"Addison’s disease (adrenocortical insufficiency)\nresults in low levels of adrenal corticosteroid\nhormones, including aldosterone and cortisol.\nBecause these hormones promote reabsorption of\nsodium and secretion of potassium by the collecting\ntubules, patients with Addison’s disease display\nhyperkalemia and hyponatremia. Hemolytic anemia\nand digoxin intoxication cause release of intracellular\npotassium. Alkalosis causes potassium to move from\nthe extracellular fluid into the cells as hydrogen ions\nmove from the cells into the extracellular fluid to\ncompensate for alkalosis.","difficulty":2},{"id":"HARR-5.2-Q058","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following conditions is most likely to produce an elevated plasma potassium?","options":["Hypoparathyroidism","Cushing’s syndrome","Diarrhea","Digitalis overdose"],"answer":"D","rationale":"Digitalis toxicity causes potassium to leave the \ncells and enter the extracellular fluid, resulting in\nhyperkalemia. Renal failure, hemolytic anemia \nand Addison’s disease are other frequent causes of\nhyperkalemia. Hypoparathyroidism indirectly causes\nhypokalemia by inducing alkalosis via increased renal\nretention of phosphate and bicarbonate. Cushing’s\nsyndrome (adrenal cortical hyperfunction) results in\nlow potassium and elevated sodium. Diarrhea causes\nloss of sodium and potassium.","difficulty":5},{"id":"HARR-5.2-Q059","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following values is the threshold critical value (alert or action level) for low plasma potassium?","options":["1.5 mmol/L","2.0 mmol/L","2.5 mmol/L","3.5 mmol/L"],"answer":"C","rationale":"The reference range for potassium is 3.6–5.4 mmol/L.\nHowever, values below 2.5 mmol/L require\nimmediate intervention because below that level\nthere is a grave risk of cardiac arrhythmia, which \ncan lead to cardiac arrest. The upper alert level for\npotassium is usually 6.5 mmol/L, except for neonatal\nand hemolyzed samples. Above this level, there is\ndanger of cardiac failure.","difficulty":5},{"id":"HARR-5.2-Q060","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which electrolyte is least likely to be elevated in renal failure?","options":["Potassium","Magnesium","Inorganic phosphorus","Sodium"],"answer":"D","rationale":"Reduced glomerular filtration coupled with\ndecreased tubular secretion causes accumulation of\npotassium, magnesium, and inorganic phosphorus.\nPoor tubular reabsorption of sodium offsets reduced\nglomerular filtration. Unfiltered sodium draws both\nchloride and water, causing osmotic equilibration\nbetween filtrate, serum, and the tissues. In renal\ndisease, serum sodium is often normal, although total\nbody sodium is increased owing to fluid and salt\nretention.","difficulty":2},{"id":"HARR-5.2-Q061","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following is the primary mechanism for vasopressin (ADH) release?","options":["Hypovolemia","Hyperosmolar plasma","Renin release","Reduced renal blood flow"],"answer":"B","rationale":"ADH is released by the posterior pituitary in response\nto increased plasma osmolality. Normally, this is\ntriggered by release of aldosterone caused by\nineffective arterial pressure in the kidney. Aldosterone\ncauses sodium reabsorption, which raises plasma\nosmolality; release of ADH causes reabsorption of\nwater, which increases blood volume and restores\nnormal osmolality. A deficiency of ADH (diabetes\ninsipidus) results in dehydration and hypernatremia.\nAn excess of ADH (syndrome of inappropriate ADH\nrelease [SIADH]) results in dilutional hyponatremia.\nThis may be caused by regional hypovolemia,\nhypothyroidism, central nervous system injury, \ndrugs, and malignancy.","difficulty":3},{"id":"HARR-5.2-Q062","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following conditions is associated with hypernatremia?","options":["Diabetes insipidus","Hypoaldosteronism","Burns","Diarrhea"],"answer":"A","rationale":"Diabetes insipidus results from failure to \nproduce ADH. Because the collecting tubules are\nimpermeable to water in the absence of ADH, severe\nhypovolemia and dehydration result. Hypovolemia\nstimulates aldosterone release, causing sodium\nreabsorption, which worsens the hypernatremia.\nBurns, hypoaldosteronism, diarrhea, and diuretic\ntherapy are common causes of hyponatremia.","difficulty":1},{"id":"HARR-5.2-Q063","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following values is the threshold critical value (alert or action level) for high plasma sodium?","options":["150 mmol/L","160 mmol/L","170 mmol/L","180 mmol/L"],"answer":"B","rationale":"The adult reference range for plasma sodium is\napproximately 135–145 mmol/L. Levels in excess of\n160 mmol/L are associated with severe dehydration,\nhypovolemia, and circulatory and heart failure. The\nthreshold for the low critical value for sodium is \n120 mmol/L. This is associated with edema,\nhypervolemia, and circulatory overload. Alert levels\nmust also be established for potassium, bicarbonate,\ncalcium, pH, PO2, glucose, bilirubin, hemoglobin,\nplatelet count, and prothrombin time. When a\nsample result is below or above the low or high alert\nlevel, respectively, the physician must be notified\nimmediately.","difficulty":5},{"id":"HARR-5.2-Q064","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following conditions is associated with total body sodium excess?","options":["Renal failure","Hyperthyroidism","Hypoparathyroidism","Diabetic ketoacidosis"],"answer":"A","rationale":"Total body sodium excess often occurs in persons\nwith renal failure, congestive heart failure, and\ncirrhosis of the liver. When water is retained along\nwith sodium, total body sodium excess results rather\nthan hypernatremia. Heart failure causes sodium \nand water retention by reducing blood flow to the\nkidneys. Cirrhosis causes obstruction of hepatic\nlymphatics and portal veins, leading to local\nhypertension and accumulation of ascites fluid. \nRenal failure results in poor glomerular filtration \nand isosmotic equilibration of salt and water.","difficulty":2},{"id":"HARR-5.2-Q065","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following conditions is associated with hyponatremia?","options":["Diuretic therapy","Cushing’s syndrome","Diabetes insipidus","Nephrotic syndrome"],"answer":"A","rationale":"Diuretics lower blood pressure by promoting water\nloss. This is accomplished by causing sodium loss\nfrom the proximal tubule and/or loop. Addison’s\ndisease, syndrome of inappropriate ADH release,\nburns, diabetic ketoacidosis, hypopituitarism,\nvomiting, diarrhea, and cystic fibrosis also cause\nhyponatremia. Cushing’s syndrome causes\nhypernatremia by promoting sodium reabsorption \nin the collecting tubule in exchange for potassium.\nDiabetes insipidus and nephrotic syndrome promote\nhypernatremia by causing water loss.","difficulty":2},{"id":"HARR-5.2-Q066","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following conditions involving electrolytes is described correctly?","options":["Pseudohyponatremia occurs only when undiluted samples are measured","Potassium levels are slightly higher in heparinized plasma than in serum","Hypoalbuminemia causes low total calcium but does not affect Cai","Hypercalcemia may be induced by low serum magnesium"],"answer":"C","rationale":"When serum albumin is low, the equilibrium between\nbound and Cai is shifted, producing increased Cai.\nThis inhibits release of PTH by negative feedback until\nthe Cai level returns to normal. Potassium is released\nfrom platelets and leukocytes during coagulation,\ncausing serum levels to be higher than plasma.\nPseudohyponatremia is a measurement error caused\nby diluting samples containing excessive fat or\nprotein. The colloids displace plasma water, resulting\nin less electrolytes being delivered into the diluent.\nOnly ion-selective electrodes that measure whole\nblood or undiluted serum are unaffected. Magnesium\nis needed for release of PTH, and PTH causes release\nof calcium and magnesium from bone. Therefore,\nhypocalcemia can be associated with either\nmagnesium deficiency or magnesium excess.","difficulty":3},{"id":"HARR-5.2-Q067","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following laboratory results is usually associated with cystic fibrosis?","options":["Sweat chloride greater than 60 mmol/L","Elevated serum sodium and chloride","Elevated fecal trypsin activity","Low glucose"],"answer":"A","rationale":"Cystic fibrosis causes obstruction of the exocrine\nglands including the sweat glands, mucus glands,\nand pancreas. Newborns with pancreatic\ninvolvement demonstrate fecal trypsin deficiency,\nwhich may be detected by a low fecal chymotrypsin\nor immunoreactive trypsin result. However, these\ntests require confirmation. Serum sodium and\nchloride levels are low. More than 98% of affected\ninfants have elevated sweat sodium and chloride \nand low serum levels. Sweat chloride in excess of \n60 mmol/L confirms the clinical diagnosis. Some\npersons with the disease have insulin deficiency and\nelevated blood glucose. Genetic tests are available to\ndetect several mutations that occur at the cystic\nfibrosis transmembrane conductance regulator\n(CFTR) locus on chromosome 7.","difficulty":5},{"id":"HARR-5.2-Q068","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"When performing a sweat chloride collection, which of the following steps will result in analytical error?","options":["Using unweighed gauze soaked in pilocarpine nitrate on the inner surface of the forearm to stimulate sweating","Collecting more than 75 mg of sweat in 30 minutes","Leaving the preweighed gauze on the inside of the arm exposed to air during collection","Rinsing the collected sweat from the gauze pad using chloride titrating solution"],"answer":"C","rationale":"The sweat chloride procedure requires the application\nof pilocarpine to stimulate sweating, and the use \nof iontophoresis (application of 0.16-mA current for \n5 minutes) to bring the sweat to the surface. After\niontophoresis, the skin on the inner surface of the\nforearm is washed with deionized water and dried,\nand a preweighed pair of 2-in.2 pads is taped to the\nskin. During the 30-minute collection of sweat, the\ngauze must be completely covered to prevent\ncontamination and loss of sweat by evaporation. The\nGibson–Cooke reference method for sweat chloride\nuses the Schales and Schales method (titration by\nHg[NO3]2 with diphenylcarbazone indicator) to assay\n1.0 mL of sweat eluted from the gauze with 5 mL \nof water. A Cotlove chloridometer is often used to\nmeasure sweat chloride. The sweat is eluted from \nthe gauze with the titrating solution to facilitate\nmeasurement. Alternatively, a macroduct collection\nsystem may be used that does not require weighing.\nA minimum mass of 75 mg sweat is required for\ncollection in gauze and 15 μL sweat for collection in\nmacroduct tubing.","difficulty":5},{"id":"HARR-5.2-Q069","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which electrolyte level best correlates with plasma osmolality?","options":["Sodium","Chloride","Bicarbonate","Calcium"],"answer":"A","rationale":"Sodium and chloride are the major extracellular ions.\nChloride passively follows sodium, making sodium\nthe principal determinant of plasma osmolality.","difficulty":2},{"id":"HARR-5.2-Q070","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which formula is most accurate in predicting plasma osmolality?","options":["Na + 2(Cl) + BUN + glucose","2(Na) + 2(Cl) + glucose + urea","2(Na) + (glucose ÷ 18) + (BUN ÷ 2.8)","Na + Cl + K + HCO3"],"answer":"C","rationale":"Calculated plasma osmolality is based upon\nmeasurement of sodium, glucose, and urea.\nBecause sodium associates with a counter ion, \ntwo times the sodium estimates the millimoles per\nliter of electrolytes. Some laboratories multiply by\n1.86 instead of 2 to correct for undissociated salts.\nDividing glucose by 18 converts from milligrams\nper deciliter to millimoles per liter. Dividing blood\nurea nitrogen (BUN) by 2.8 converts from milligrams\nper deciliter BUN to millimoles per liter urea.","difficulty":3},{"id":"HARR-5.3-Q001","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following biochemical processes is promoted by insulin?","options":["Glycogenolysis","Gluconeogenesis","Lipolysis","Uptake of glucose by cells"],"answer":"D","rationale":"Insulin reduces blood glucose levels by increasing\nglucose uptake by cells. It promotes lipid and\nglycogen production, induces synthesis of glycolytic\nenzymes, and inhibits formation of glucose from\npyruvate and Krebs cycle intermediates.","difficulty":1},{"id":"HARR-5.3-Q002","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following hormones promotes hyperglycemia?","options":["Calcitonin","Growth hormone","Aldosterone","Renin"],"answer":"B","rationale":"Growth hormone and cortisol promote\ngluconeogenesis and epinephrine stimulates\nglycogenolysis. Excess thyroid hormone causes\nhyperglycemia by increasing glucagon and\ninactivation of insulin, thereby promoting both\ngluconeogenesis and glycogenolysis. An increase in\nany of these hormones can cause hyperglycemia.\nCalcitonin opposes the action of parathyroid hormone.\nAldosterone is the primary mineralocorticoid hormone\nand stimulates sodium reabsorption and potassium\nsecretion by the kidneys. Renin is released from the\nkidney due to ineffective arterial pressure and\npromotes activation of angiotensinogen and\naldosterone secretion.","difficulty":1},{"id":"HARR-5.3-Q003","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following is characteristic of type 1 diabetes mellitus?","options":["Requires an oral glucose tolerance test for diagnosis","Is the most common form of diabetes mellitus","Usually occurs after age 40","Requires insulin replacement to prevent ketosis"],"answer":"D","rationale":"Type 1, or juvenile, diabetes is also called insulin-\ndependent diabetes because patients must be given\ninsulin to prevent ketosis. Type 1 accounts for only\nabout 10%–20% of cases of diabetes mellitus, \nand is usually diagnosed by a fasting plasma\nglucose. Two consecutive results ≥126 mg/dL \nis diagnostic. Approximately 95% of patients\nproduce autoantibodies against the beta cells of\nthe pancreatic islets. Other autoantibodies may be\nproduced against insulin, glutamate decarboxylase,\nand tyrosine phosphorylase IA2. There is genetic\nassociation between type 1 diabetes and human\nleukocyte antigens (HLA) DR3 and DR4.","difficulty":3},{"id":"HARR-5.3-Q004","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following is characteristic of type 2 diabetes mellitus?","options":["Insulin levels are consistently low","Most cases require a 3-hour oral glucose tolerance test to diagnose","Hyperglycemia is often controlled without insulin replacement","The condition is associated with unexplained weight loss"],"answer":"C","rationale":"Type 2, or late-onset diabetes, is associated with a\ndefect in the receptor site for insulin. Insulin levels\nmay be low, normal, or high. Patients are usually\nobese and over 40 years of age, although the\nincidence is increasing in both children and young\nadults. The American Diabetes Association (ADA)\nrecommends screening all adults for diabetes who\nare overweight and have one additional risk factor\nand all adults over age 45, and to retest them every \n3 years, if negative. Patients do not require insulin to\nprevent ketosis and hyperglycemia can be controlled\nin most patients by diet and drugs that promote\ninsulin release. Type 2 accounts for 80%–90% of all\ndiabetes mellitus.","difficulty":4},{"id":"HARR-5.3-Q005","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following results falls within the diagnostic criteria for diabetes mellitus?","options":["Fasting plasma glucose of 120 mg/dL","Two-hour postprandial plasma glucose of 160 mg/dL","Two-hour plasma glucose of 180 mg/dL following a 75 g oral glucose challenge","Random plasma glucose of 250 mg/dL and presence of symptoms"],"answer":"D","rationale":"The American Diabetes Association recommends the\nfollowing criteria for diagnosing diabetes mellitus:\nfasting glucose ≥ 126 mg/dL, casual (random)\nglucose ≥ 200 mg/dL in the presence of symptoms\n(polyuria, increased thirst, weight loss), glucose \n≥ 200 mg/dL at 2 hours after an oral dose of 75 g of\nglucose, and hemoglobin A1c ≥ 6.5%. A diagnosis \nof diabetes mellitus is indicated if any one or\ncombination of these four criteria is met on more\nthan a single testing event. The fasting plasma\nglucose test requires at least 8 hours with no food or\ndrink except water. The 2-hour postloading test\nshould be conducted according to the oral glucose\ntolerance guidelines currently recommended by \nthe World Health Organization.","difficulty":5},{"id":"HARR-5.3-Q006","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Select the most appropriate adult reference range for fasting blood glucose.","options":["40–105 mg/dL (2.22–5.82 mmol/L)","60–140 mg/dL (3.33–7.77 mmol/L)","65–99 mg/dL (3.61–5.50 mmol/L)","75–150 mg/dL (4.16–8.32 mmol/L)"],"answer":"C","rationale":"Reference ranges vary slightly depending upon\nmethod and specimen type. Enzymatic methods\nspecific for glucose have an upper limit of normal \nno greater than 99 mg/dL. This is the cutoff value \nfor impaired fasting plasma glucose (prediabetes)\nrecommended by the American Diabetes Association.\nAlthough 65 mg/dL is considered the 2.5 percentile, \na fasting level below 50 mg/dL is often seen without\nassociated clinical hypoglycemia, and neonates have a\nlower limit of approximately 40 mg/dL owing to\nmaternal insulin.","difficulty":5},{"id":"HARR-5.3-Q007","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"When preparing a patient for an oral glucose tolerance test (OGTT), which of the following conditions will lead to erroneous results?","options":["The patient remains ambulatory for 3 days prior to the test","Carbohydrate intake is restricted to below 150 g/day for 3 days prior to test","No food, coffee, tea, or smoking is allowed 8 hours before and during the test","Administration of 75 g of glucose is given to an adult patient following a 10–12-hour fast"],"answer":"B","rationale":"Standardized OGTTs require that patients receive at\nleast 150 grams of carbohydrate per day for 3 days\nprior to the test in order to stabilize the synthesis of\ninducible glycolytic enzymes. The 2-hour OGTT test is\nno longer recommended for screening and should\nbe reserved for confirmation of diabetes in cases that\nare difficult to diagnose, such as persons who lack\nsymptoms and signs of fasting hyperglycemia.","difficulty":5},{"id":"HARR-5.3-Q008","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following 2-hour glucose challenge results would be classified as impaired glucose tolerance (IGT)? Two-hour serum glucose:","options":["130 mg/dL","135 mg/dL","150 mg/dL","204 mg/dL"],"answer":"C","rationale":"With the exception of pregnant females, impaired\nglucose tolerance is defined by the ADA as a serum\nor plasma glucose at 2 hours following a 75-g oral\nglucose load of ≥140 mg/dL and < 200 mg/dL.\nPersons who have a fasting plasma glucose of \n≥100 but < 126 mg/dL are classified as having\nimpaired fasting glucose (IFG). Both IGT and IFG are\nrisk factors for developing diabetes later in life. Such\npersons are classified as having prediabetes and\nshould be tested annually.","difficulty":5},{"id":"HARR-5.3-Q009","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which statement regarding gestational diabetes mellitus (GDM) is correct?","options":["Is diagnosed using the same oral glucose tolerance criteria as in nonpregnancy","Converts to diabetes mellitus after pregnancy in 60%–75% of cases","Presents no increased health risk to the fetus","Is defined as glucose intolerance originating during pregnancy"],"answer":"D","rationale":"Control of GDM reduces perinatal complications\nsuch as respiratory distress syndrome, high birth\nweight, and neonatal jaundice. Women at risk are\nusually screened between 24 and 28 weeks’\ngestation. The screening test can be performed\nnonfasting and consists of an oral 50-g glucose\nchallenge followed by serum or plasma glucose\nmeasurement at 1 hour. A result ≥ 140 mg/dL is\nfollowed by a 2-hour or 3-hour oral glucose\ntolerance test to confirm gestational diabetes. For\nthe 3-hour test, a 100-g dose of glucose is used \nand at least two of the following cutoffs must be\nexceeded: fasting, ≥ 95 mg/dL or higher; 1 hour, \n≥ 180 mg/dL or higher; 2 hour ≥ 155 mg/dL or\nhigher; 3 hour, ≥ 140 mg/dL or higher. The same\ncutpoints are used for the 2-hour test except that \na 75-g dose is used. GDM converts to diabetes\nmellitus within 10 years in 30%–40% of cases. \nADA recommends testing persons with GDM for\ndiabetes 6–12 weeks after delivery.","difficulty":4},{"id":"HARR-5.3-Q010","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following findings is characteristic of all forms of clinical hypoglycemia?","options":["A fasting blood glucose value below 55 mg/dL","High fasting insulin levels","Neuroglycopenic symptoms at the time of low blood sugar","Decreased serum C peptide"],"answer":"C","rationale":"Clinical hypoglycemia can be caused by insulinoma,\ndrugs, alcoholism, and reactive hypoglycemia.\nReactive hypoglycemia is characterized by delayed \nor excessive insulin output after eating and is very\nrare. Fasting insulin is normal but postprandial \nlevels are increased. High fasting insulin levels \n(usually > 6 μg/L) are seen in insulinoma, and patients\nwith insulinoma almost always display fasting\nhypoglycemia, especially when the fast is extended\nto 48–72 hours. C peptide is a subunit of proinsulin\nthat is hydrolyzed when insulin is released. In\nhypoglycemia, low levels indicate an exogenous\ninsulin source, whereas high levels indicate\noverproduction of insulin.","difficulty":4},{"id":"HARR-5.3-Q011","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which statement regarding glycated (glycosylated) Hgb (G-Hgb) is true?","options":["Has a sugar attached to the C-terminal end of the β chain","Is a highly reversible aminoglycan","Reflects the extent of glucose regulation in the 8- to 12-week interval prior to sampling","Will be abnormal within 4 days following an episode of hyperglycemia"],"answer":"C","rationale":"G-Hgb results from the nonenzymatic attachment of\na sugar such as glucose to the N-terminal valine of\nthe β chain. The reaction is nonreversible and is\nrelated to the time-averaged blood glucose\nconcentration over the life span of the RBCs. There\nare three G-Hgb fractions designated A1a, A1b, and \nAlc. Hemoglobin A1c makes up about 80% of \nglycated hemoglobin, and is used to determine \nthe adequacy of insulin therapy. The time-averaged\nblood glucose is approximated by the formula\n(G-Hgb × 33.3) – 86 mg/dL, and insulin adjustments\ncan be made to bring this level to within reference\nlimits. Also, glycated protein assay (called\nfructosamine) provides similar data for the period\nbetween 2 and 4 weeks before sampling.","difficulty":3},{"id":"HARR-5.3-Q012","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"What is the American Diabetes Association recommended cutoff value for adequate control of blood glucose in diabetics as measured by glycated hemoglobin?","options":["5%","6.5%","9.5%","11%"],"answer":"B","rationale":"The ADA recommends that 6.5% be used as the\ncutoff for determining the adequacy of treatment \nfor diabetes. A glycated hemoglobin test should \nbe performed at the time of diagnosis and every \n6 months thereafter if the result is < 6.5%. If the \nresult is 6.5% or more, the treatment plan should be\nadjusted to achieve a lower level, and the test\nperformed every 3 months until control is \nimproved.","difficulty":4},{"id":"HARR-5.3-Q013","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which statement regarding measurement of Hgb A1c is true?","options":["Levels do not need to be done fasting","Both the labile and stable Hgb A1c fractions are measured","Samples should be measured within 2 hours of collection","The assay must be done by chromatography"],"answer":"A","rationale":"Since Hgb A1C represents the average blood glucose\n2–3 months prior to blood collection, the dietary\nstatus of the patient on the day of the test has no\neffect upon the results. Refrigerated whole-blood\nsamples are stable for up to 1 week. Hgb A1C is\nassayed by cation exchange high-performance \nliquid chromatography or immunoassay\n(immunoturbidimetric inhibition) because both\nmethods are specific for stable Hgb A1C, and do \nnot demonstrate errors caused by abnormal\nhemoglobins, temperature of reagents, or fractions\nother than A1c.","difficulty":2},{"id":"HARR-5.3-Q014","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which stationary phase is used for the measurement of hemoglobin A1c by high performance liquid chromatography?","options":["Octadecylsilane (C18)","Cation exchanger","Anion exchanger","Polystyrene divinylbenzene"],"answer":"B","rationale":"HPLC methods for measuring Hgb A1c are performed\nby diluting whole blood with an acid buffer that\nhemolyzes the sample. Normal hemoglobin A has \na weak positive charge at an acidic pH and binds\nweakly to the resin. Glycated hemoglobin has \nan even weaker positive charge and is eluted \nbefore hemoglobin A. Abnormal hemoglobin\nmolecules S, D, E, and C have a higher positive \ncharge than hemoglobin A and are retained \nlonger on the column. Elution is accomplished by\nincreasing the ionic strength of the mobile phase.\nCations in the buffer displace the hemoglobin\npigments from the column.","difficulty":4},{"id":"HARR-5.3-Q015","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Evaluate the following chromatogram of a whole-blood hemolysate, and identify the cause and best course of action.","options":["Result is not reportable because hemoglobin F is present and interferes","The result is not reportable because hemoglobin C is present and interferes","The result is not reportable because labile hemoglobin A1c is present","The result is reportable; neither hemoglobin F or C interfere"],"answer":"D","rationale":"The chromatogram is from a person with\nhemoglobin AC; however, hemoglobin C is\ncompletely separated from Hgb A1c and does not\ninterfere. Hgb F is also present, but does not interfere\nunless its concentration is > 30%. Labile hemoglobin\nis formed initially when the aldehyde of glucose\nreacts with the N-terminal valine of the β globin\nchain. This Shiff base is reversible but is converted to\nHgb A1c by rearrangement to a ketoamine. It is called\nlabile A1c and produces a peak (LA1c) after HgF and\nbefore Hgb A1c. Therefore, it does not interfere.","difficulty":3},{"id":"HARR-5.3-Q017","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"According to American Diabetes Association criteria, which result is consistent with a diagnosis of impaired fasting glucose?","options":["99 mg/dL","117 mg/dL","126 mg/dL","135 mg/dL"],"answer":"B","rationale":"Impaired fasting glucose is defined as a plasma\nglucose ≥100 but <126 mg/dL. A fasting glucose of\n126 or higher on two consecutive occasions indicates\ndiabetes. A fasting glucose of 99 mg/dL is considered\nnormal.\nPeak\nCalibrated \nRetention\nPeak \n% Area\n% Area\nTime\nArea\nAlb\n0.60\n0.25\n12500\nF\n0.50\n0.50\n11300\nLA1c\n0.75\n0.70\n15545\nA1c\n6.2\n0.90\n45112\nP3\n2.6\n1.60\n57489\nAo\n48.0\n1.8\n994813\nC\n43.0\n2.00\n926745","difficulty":3},{"id":"HARR-5.3-Q018","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"What is the recommended cutoff for the early detection of chronic kidney disease in diabetics using the test for microalbuminuria?","options":[">30 mg/g creatinine",">80 mg/g creatinine",">200 mg/g creatinine",">80 mg/L"],"answer":"A","rationale":"Microalbuminuria is the excretion of small\nquantities of albumin in the urine. In diabetics,\nexcretion of albumin that is within allowable limits\nfor healthy persons may signal the onset of chronic\nkidney disease. The term microalbuminuria is\ndefined as albumin excretion ≥ 30 mg/g creatinine\nbut ≤ 300 mg/g creatinine. The use of the albumin\nto creatinine ratio is preferred to measures of\nalbumin excretory rate (μg/min) because the latter\nis subject to error associated with timed specimen\ncollection. ADA recommends the test be done\nannually for all type 2 diabetics and type 1 diabetics\nwho have had the disease for > 5 years.","difficulty":5},{"id":"HARR-5.3-Q019","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"In addition to measuring blood glucose, Hgb A1c, and microalbumin, which test should be done on diabetic persons once per year?","options":["Urine glucose","Urine ketones","Plasma fructosamines","Estimated glomerular filtration rate"],"answer":"D","rationale":"While urinary glucose can identify persons who may\nhave diabetes, it is not sensitive enough to manage\nglucose control on a daily basis, and has been\nreplaced by whole-blood glucose monitoring or\ncontinuous glucose monitoring. While the urinary\nketone test is a useful screening test for diabetic and\nother forms of ketosis, the plasma β hydroxybutyrate\ntest should be used to identify and monitor ketosis in\ndiabetic persons. Fructosamine is a useful adjunct to\nHgb A1c to identify poor control of blood glucose in\nthe past 2–4 weeks, but has not been recommended\nfor routine use in all diabetic patients.","difficulty":5},{"id":"HARR-5.3-Q020","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which testing situation is appropriate for the use of point-of-care whole-blood glucose methods?","options":["Screening for type 2 diabetes mellitus","Diagnosis of diabetes mellitus","Monitoring of blood glucose control in type 1 and type 2 diabetics","Monitoring diabetics for hyperglycemic episodes only"],"answer":"C","rationale":"The ADA does not recommend the use of whole-blood\nglucose monitors for establishing a diagnosis of\ndiabetes or screening persons for diabetes. The\nanalytical measurement range of these devices varies\ngreatly, and whole blood glucose is approximately \n10% lower than serum or plasma glucose. In addition,\nanalytical variance is greater and accuracy less than for\nlaboratory instruments. Whole blood glucose meters\nshould be used by diabetics and caregivers to monitor\nglucose control and can detect both hyper- and\nhypoglycemic states that result from too little or too\nmuch insulin replacement. Therefore, postprandial\nmonitoring with such a device is recommended for \nall persons who receive insulin therapy.","difficulty":4},{"id":"HARR-5.3-Q021","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following is the reference method for measuring serum glucose?","options":["Somogyi–Nelson","Hexokinase","Glucose oxidase","Glucose dehydrogenase"],"answer":"B","rationale":"The hexokinase method is considered more accurate\nthan glucose oxidase methods because the coupling\nreaction using glucose-6-phosphate dehydrogenase\n(G-6-PD) is highly specific. The hexokinase method\nmay be done on serum or plasma collected using\nheparin, EDTA, fluoride, oxalate, or citrate. The\nmethod can also be used for urine, cerebrospinal\nfluid, and serous fluids.","difficulty":3},{"id":"HARR-5.3-Q022","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Polarographic methods for glucose analysis are based upon which principle of measurement?","options":["Nonenzymatic oxidation of glucose","The rate of O2 depletion","Chemiluminescence caused by formation of adenosine triphosphate (ATP)","The change in electrical potential as glucose is oxidized"],"answer":"B","rationale":"Polarographic glucose electrodes measure the\nconsumption of O2 as glucose is oxidized. Glucose\noxidase in the reagent catalyzes the oxidation of\nglucose by O2 under first-order conditions, forming\nhydrogen peroxide (H2O2). As the dissolved O2\ndecreases, less is reduced at the cathode, resulting \nin a decrease in current proportional to glucose\nconcentration. It is important that the H2O2 not\nbreakdown to re-form O2. This is prevented by \nadding molybdate and iodide that react with \nH2O2, forming iodine and water, and by adding\ncatalase and ethanol that react with H2O2, forming\nacetaldehyde and water.","difficulty":3},{"id":"HARR-5.3-Q023","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"In addition to polarography, what other electrochemical method can be used to measure glucose in plasma?","options":["Conductivity","Potentiometry","Anodic stripping voltammetry","Amperometry"],"answer":"D","rationale":"In some critical care analyzers, amperometric\nmeasurement of glucose is used. The glucose oxidase \nis impregnated into the membrane covering the\nelectrode. It reacts with glucose in the sample, \nforming H2O2. This diffuses across the membrane to the\nanode of the electrode, where it is oxidized to O2.The\nelectrons produced are used to reduce oxygen at \nthe cathode, completing the current path. At the anode\n(usually platinum), 2H2O2 →4e– + 2O2 + 4H+. At the\ncathode(usually silver), O2 + 4H+ + 4e– →2H2O. The \nnet equation is 2H2O2 →O2 + 2H2O.","difficulty":5},{"id":"HARR-5.3-Q024","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Select the enzyme that is most specific for β-D-glucose.","options":["Hexokinase","G-6-PD","Phosphohexisomerase","Glucose oxidase"],"answer":"D","rationale":"Glucose oxidase is the most specific enzyme reacting\nwith only β-D-glucose. However, the peroxidase\ncoupling reaction used in the glucose oxidase method\nis subject to positive and negative interference.\nTherefore, hexokinase is used in the reference method.","difficulty":1},{"id":"HARR-5.3-Q025","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Select the coupling enzyme used in the hexokinase method for glucose.","options":["Glucose-6-phosphate dehydrogenase","Peroxidase","Glucose dehydrogenase","Glucose-6-phosphatase"],"answer":"A","rationale":"The hexokinase reference method uses a protein-free\nfiltrate prepared with barium hydroxide (BaOH) \nand zinc sulfate (ZnSO4). Hexokinase catalyzes the\nphosphorylation of glucose in the filtrate using ATP \nas the phosphate donor. Glucose-6-phosphate\n(glucose-6-PO4) is oxidized to 6-phosphogluconate\nand NAD+ is reduced to NADH using G-6-PD. The\nincrease in absorbance at 340 nm is proportional to\nglucose concentration. Although hexokinase will\nphosphorylate some other hexoses including\nmannose, fructose, and glucosamine, the coupling\nreaction is entirely specific for glucose-6-PO4\neliminating interference from other sugars.","difficulty":3},{"id":"HARR-5.3-Q026","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which glucose method is subject to falsely low results caused by ascorbate?","options":["Hexokinase","Glucose dehydrogenase","Trinder glucose oxidase","Polarography"],"answer":"C","rationale":"Although glucose oxidase is specific for β-D-glucose,\nthe coupling (indicator) reaction is prone to negative\ninterference from ascorbate, uric acid, acetoacetic\nacid, and other reducing agents. These compete with\nthe chromogen (e.g., o-dianisidine) for peroxide,\nresulting in less dye being oxidized to chromophore.\nThe choice of chromogen determines the specificity\nand linearity. 4-aminophenazone and phenol is more\nresistant to interference from azo compounds and\nproteins than is o-dianisidine.","difficulty":4},{"id":"HARR-5.3-Q027","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following is a potential source of error in the hexokinase method?","options":["Galactosemia","Hemolysis","Sample collected in fluoride","Ascorbic acid"],"answer":"B","rationale":"The hexokinase method can be performed on serum\nor plasma using heparin, EDTA, citrate, or oxalate.\nRBCs contain glucose-6-PO4 and intracellular\nenzymes that generate NADH, causing positive\ninterference. Therefore, hemolyzed samples require a\nserum blank correction (subtraction of the reaction\nrate with hexokinase omitted from the reagent).","difficulty":2},{"id":"HARR-5.3-Q028","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which statement about glucose in cerebrospinal fluid (CSF) is correct?","options":["Levels below 40 mg/dL occur in septic meningitis, cancer, and multiple sclerosis","CSF glucose is normally the same as the plasma glucose level","Hyperglycorrhachia is caused by dehydration","In some clinical conditions, the CSF glucose can be greater than the plasma glucose"],"answer":"A","rationale":"High glucose in CSF is a reflection of hyperglycemia\nand not central nervous system disease. The CSF\nglucose is usually 50%–65% of the plasma glucose.\nLow levels are significant and are most often\nassociated with bacterial or fungal meningitis,\nmalignancy in the central nervous system, and some\ncases of subarachnoid hemorrhage, rheumatoid\narthritis, and multiple sclerosis.","difficulty":1},{"id":"HARR-5.3-Q029","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"In peroxidase-coupled glucose methods, which reagent complexes with the chromogen?","options":["Nitroprusside","Phenol","Tartrate","Hydroxide"],"answer":"B","rationale":"The coupling step in the Trinder glucose oxidase\nmethod uses peroxidase to catalyze the oxidation \nof a dye by H2O2. Dyes such as 4-aminophenozone or\n4-aminoantipyrine are coupled to phenol to form a\nquinoneimine dye that is red and is measured at\nabout 500 nm.","difficulty":1},{"id":"HARR-5.3-Q030","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Point-of-care-tests (POCTs) for whole-blood glucose monitoring are based mainly on the use of:","options":["Glucose oxidase as the enzyme","Amperometric detection","Immunochromatography","Peroxidase coupling reactions"],"answer":"B","rationale":"All POCT devices for monitoring blood glucose use\neither glucose dehydrogenase (GDH) or glucose\noxidase and are amperometric. For glucose oxidase\nmethods, the electrons derive from the oxidation of\nhydrogen peroxide. For GDH, the electrons are\ntransferred from one of several coenzymes that are\nreduced when glucose is oxidized, FAD+, NAD+, or\nPQQ (pyrroloquinoline quinone). Interferences\ndepend upon which enzyme/coenzyme pair are\nused. For example, maltose and xylose interference\ncan be pronounced with GDH/PQQ-based strips, but\nnot with other GDH or glucose oxidase strips. Uric\nacid depresses glucose oxidase reactions but has no\neffect on GDH reactions.","difficulty":4},{"id":"HARR-5.3-Q031","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"What effect does hematocrit have on POCT tests for whole-blood glucose monitoring?","options":["Low hematocrit decreases glucose readings on all devices","High hematocrit raises glucose readings on all devices","The effect is variable and dependent on the enzyme/coenzyme system","Low hematocrit raises readings and high hematocrit lowers readings unless corrected"],"answer":"D","rationale":"Hematocrit affects POCT glucose measurements.\nHigh hematocrit lowers the glucose because RBC\nglucose concentration is lower than plasma\nconcentration. Other factors include binding of\noxygen to hemoglobin and the slower diffusion of\nglucose onto the solid phase—both of which occur\nwhen the hematocrit is high. Bias due to an abnormal\nhematocrit can be avoided by simultaneously\nmeasuring the conductivity of the sample. The\nhematocrit is calculated and used to mathematically\ncorrect the glucose measurement.","difficulty":2},{"id":"HARR-5.3-Q032","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following is classified as a mucopolysaccharide storage disease?","options":["Pompe’s disease","von Gierke disease","Hers’ disease","Hurler’s syndrome"],"answer":"D","rationale":"Hurler’s syndrome is an autosomal recessive \ndisease resulting from a deficiency of iduronidase.\nGlycosaminoglycans (mucopolysaccharides)\naccumulate in the lysosomes. Multiple organ failure\nand mental retardation occur, resulting in early\nmortality. Excess dermatan and heparin sulfate are\nexcreted in urine. Other mucopolysaccharidoses\n(MPS storage diseases) are Hunter’s, Scheie’s,\nSanfilippo’s, and Morquio’s syndromes.","difficulty":2},{"id":"HARR-5.3-Q033","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Identify the enzyme deficiency responsible for type 1 glycogen storage disease (von Gierke’s disease).","options":["Glucose-6-phosphatase","Glycogen phosphorylase","Glycogen synthetase","β-Glucosidase"],"answer":"A","rationale":"Type 1 glycogen storage disease (von Gierke’s\ndisease) is an autosomal recessive deficiency of\nglucose-6-phosphatase. Glycogen accumulates in\ntissues, causing hypoglycemia, ketosis, and fatty liver.\nThere are seven types of glycogen storage disease,\ndesignated type 1 through type 7, involving\ndeficiency of an enzyme that acts on glycogen. \nTypes 1, 4, and 6 cause deficient glycogen breakdown\nin the liver. Types 2, 5, and 7 involve skeletal muscle \nand are less severe. Type 3 usually involves both liver\nand muscle, although an uncommon subtype (3B)\ninvolves only the liver.","difficulty":4},{"id":"HARR-5.3-Q034","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following abnormal laboratory results is found in von Gierke’s disease?","options":["Hyperglycemia","Increased glucose response to epinephrine administration","Metabolic alkalosis","Hyperlipidemia"],"answer":"D","rationale":"Von Gierke’s disease (type 1 glycogen storage disease)\nresults from a deficiency of glucose-6-phosphatase.\nThis blocks the hydrolysis of glucose-6-PO4 to glucose\nand Pi, preventing degradation of glycogen to\nglucose. The disease is associated with increased\ntriglyceride levels because fats are mobilized for\nenergy and lactate acidosis caused by increased\nglycolysis. A presumptive diagnosis is made when\nintravenous galactose administration fails to \nincrease serum glucose, and can be confirmed by\ndemonstrating glucose-6-phosphatase deficiency \nor decreased glucose production in response to\nepinephrine.","difficulty":4},{"id":"HARR-5.3-Q035","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"The D-xylose absorption test is used for the differential diagnosis of which two diseases?","options":["Pancreatic insufficiency from malabsorption","Primary from secondary disorders of glycogen synthesis","Type 1 and type 2 diabetes mellitus","Generalized from specific carbohydrate intolerance"],"answer":"A","rationale":"Xylose is a pentose that is absorbed without the help\nof pancreatic enzymes and is not metabolized. In\nnormal adults, more than 25% of the dose is excreted\ninto the urine after 5 hours. Low blood or urine levels\nare seen in malabsorption syndrome, sprue, Crohn’s\ndisease, and other intestinal disorders, but not\npancreatitis.","difficulty":2},{"id":"HARR-5.3-Q036","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following statements about carbohydrate intolerance is true?","options":["Galactosemia results from deficiency of galactose-1-phosphate (galactose-1-PO4) uridine diphosphate transferase","Galactosemia results in a positive glucose oxidase test for glucose in urine","Urinary galactose is seen in both galactosemia and lactase deficiency","A galactose tolerance test is used to confirm a diagnosis of galactosemia"],"answer":"A","rationale":"Galactose is metabolized to galactose-1-PO4 by \nthe action of galactokinase. Galactose-1-PO4\nuridine diphosphate (UDP) transferase converts\ngalactose-1-PO4 to glucose. Deficiency of either\nenzyme causes elevated blood and urine galactose.\nLactase deficiency results in the presence of urinary\nlactose because it is not broken down to glucose \nand galactose. Tests for reducing sugars employing\ncopper sulfate are used to screen for galactose,\nlactose, and fructose in urine. Nonglucose-reducing\nsugars are not detected by the glucose oxidase\nreaction. A positive test is followed by TLC to identify\nthe sugar, and demonstration of the enzyme\ndeficiency in RBCs. The galactose tolerance test is\nused (rarely) to evaluate the extent of liver failure\nsince the liver is the site of galactose metabolism.","difficulty":4},{"id":"HARR-5.3-Q037","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following statements regarding iron metabolism is correct?","options":["Iron absorption is decreased by alcohol ingestion","Normally, 40%–50% of ingested iron is absorbed","The daily requirement is higher for pregnant and menstruating women","Absorption increases with the amount of iron in the body stores"],"answer":"C","rationale":"For adult men and nonmenstruating women,\napproximately 1–2 mg/day of iron is needed to\nreplace the small amount lost mainly by exfoliation \nof cells. Because 5%–10% of dietary iron is absorbed\nnormally, the daily dietary requirement in this group\nis 10–20 mg/day. Menstruating women have an\nadditional requirement of 1 mg/day and pregnant\nwomen 2 mg/day. Absorption efficiency will increase\nin iron deficiency and decrease in iron overload. Iron\nabsorption is enhanced by low gastric pH and is\nincreased by alcohol ingestion.","difficulty":2},{"id":"HARR-5.3-Q038","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following processes occurs when iron is in the oxidized (Fe3+) state?","options":["Absorption by intestinal epithelium","Binding to transferrin and incorporation into ferritin","Incorporation into protoporphyrin IX to form functional heme","Reaction with chromogens in colorimetric assays"],"answer":"B","rationale":"Intestinal absorption occurs only if the iron is in the\nreduced (Fe+2) state. After absorption, Fe+2 is oxidized\nto Fe+3 by gut mucosal cells. Transferrin and ferritin\nbind iron efficiently only when in the oxidized state.\nIron within Hgb binds to O2 by coordinate bonding,\nwhich occurs only if the iron is in the reduced state.\nLikewise, in colorimetric methods, Fe+2 forms\ncoordinate bonds with carbon and nitrogen atoms \nof the chromogen.","difficulty":2},{"id":"HARR-5.3-Q039","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following is associated with low serum iron and high total iron-binding capacity (TIBC)?","options":["Iron deficiency anemia","Hepatitis","Nephrosis","Noniron deficiency anemias"],"answer":"A","rationale":"Iron-deficiency anemia is the principal cause of \nlow serum iron and high TIBC because it promotes\nincreased transferrin. Pregnancy without iron\nsupplementation depletes maternal iron stores \nand also results in low serum iron and high TIBC. \nIron-supplemented pregnancy and use of\ncontraceptives increase both iron and TIBC. \nNephrosis causes low iron and TIBC due to loss of\nboth iron and transferrin by the kidneys. Hepatitis\ncauses increased release of storage iron, resulting in\nhigh levels of iron and transferrin. Noniron deficiency\nanemias may cause high iron and usually show low\nTIBC and normal or high ferritin.","difficulty":5},{"id":"HARR-5.3-Q040","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which condition is associated with the lowest percent saturation of transferrin?","options":["Hemochromatosis","Anemia of chronic infection","Iron deficiency anemia","Noniron deficiency anemia"],"answer":"C","rationale":"Percent saturation = Serum Fe × 100/TIBC. Normally,\ntransferrin is one-third saturated with iron. In iron\ndeficiency states, the serum iron falls but transferrin\nrises. This causes the numerator and denominator to\nmove in opposite directions, resulting in very low\npercent saturation (about 10%). The opposite occurs\nin hemochromatosis and sideroblastic anemia,\nresulting in an increased percent saturation.","difficulty":4},{"id":"HARR-5.3-Q041","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which condition is most often associated with a high serum iron level?","options":["Nephrosis","Chronic infection or inflammation","Polycythemia vera","Noniron deficiency anemias"],"answer":"D","rationale":"Anemia associated with chronic infection causes a\nlow serum iron, but unlike iron deficiency, causes a\nlow (or normal) TIBC and does not cause low ferritin.\nNoniron deficiency anemias such as pernicious\nanemia and sideroblastic anemia produce high serum\niron and low TIBC. Nephrosis causes iron loss by the\nkidneys. Polycythemia is associated with increased\niron within the RBCs and depletion of iron stores.","difficulty":3},{"id":"HARR-5.3-Q042","topic":"5.3 Glucose, Hemoglobin, Iron, and Bilirubin","question":"Which of the following is likely to occur first in iron deficiency anemia?","options":["Decreased serum iron","Increased TIBC","Decreased serum ferritin","Increased transferrin"],"answer":"C","rationale":"Body stores must be depleted of iron before serum\niron falls. Thus, serum ferritin falls in the early stages \nof iron deficiency, making it a more sensitive test than\nserum iron in uncomplicated cases. Ferritin levels
