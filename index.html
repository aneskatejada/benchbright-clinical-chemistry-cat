 liter"],"answer":"C","rationale":"The IU is a rate expressed in micromoles per minute.\nActivity is reported as IUs per liter (IU/L) or mIU/mL.\nThe SI unit for enzyme activity is the katal (1 katal\nconverts 1 mol of substrate to product in 1 second).","difficulty":2},{"id":"HARR-5.7-Q002","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following statements describes a nonkinetic enzyme assay?","options":["Initial absorbance is measured followed by a second reading after 5 minutes","Absorbance is measured at 10-second intervals for 100 seconds","Absorbance is monitored continuously for 1 minute using a chart recorder","Reflectance is measured from a xenon source lamp pulsing at 60 Hz"],"answer":"A","rationale":"A kinetic assay uses several evenly spaced\nabsorbance measurements to calculate the change \nin absorbance per unit time. A constant change in\nabsorbance per unit of time occurs only when the\nrate of the reaction is zero order (independent \nof substrate concentration). Enzyme activity is\nproportional to rate only under zero-order conditions.","difficulty":2},{"id":"HARR-5.7-Q003","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following statements regarding enzymatic reactions is true?","options":["The enzyme shifts the equilibrium of the reaction to the right","The enzyme alters the equilibrium constant of the reaction","The enzyme increases the rate of the reaction","The enzyme alters the energy difference between reactants and products"],"answer":"C","rationale":"An enzyme will accelerate the rate of a reaction,\nreducing the time required to reach equilibrium. \nThe concentration of reactants and products at\nequilibrium will be the same with or without the\nenzyme.","difficulty":1},{"id":"HARR-5.7-Q004","topic":"5.7 Enzymes and Cardiac Markers","question":"Which statement about enzymes is true?","options":["An enzyme alters the Gibb’s free energy of the reaction","Enzymes cause a reaction with a positive free energy to occur spontaneously","An enzyme’s natural substrate has the highest Km","A competitive inhibitor will alter the apparent Km of the reaction"],"answer":"D","rationale":"Enzymes alter the energy of activation by forming a\nmetastable intermediate, the enzyme substrate\ncomplex. Enzymes do not alter the free energy or\ndirection of a reaction. Competitive inhibitors bind to\nthe active site where the enzyme binds substrate and\nare overcome by increasing the substrate\nconcentration.","difficulty":1},{"id":"HARR-5.7-Q005","topic":"5.7 Enzymes and Cardiac Markers","question":"Which substrate concentration is needed to achieve zero-order conditions?","options":["Greater than 99 × Km","[S] = Km","Less than 10 × Km","[S] = 0"],"answer":"A","rationale":"A zero-order reaction rate is independent of substrate\nconcentration because there is sufficient substrate to\nsaturate the enzyme. V = Vmax × [S]/Km + [S] where \nV = velocity, Vmax = maximum velocity, [S] = substrate\nconcentration, and Km = substrate concentration\nrequired to give 1/2 Vmax. If [S] >>> Km, then the Km\ncan be ignored. V = Vmax × [S]/[S] = Vmax × [S]° or\nvelocity approaches maximum and is independent \nof substrate concentration.","difficulty":5},{"id":"HARR-5.7-Q007","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following statements about enzymatic reactions is true?","options":["NADH has absorbance maximas at 340 and 366 nm","Enzyme concentration must be in excess to achieve zero-order kinetics","Rate is proportional to substrate concentration in a zero-order reaction","Accumulation of the product increases the reaction rate"],"answer":"A","rationale":"Most enzymes are measured by monitoring the rate\nof absorbance change at 340 nm as NADH is\nproduced or consumed. This rate will be proportional\nto enzyme activity when substrate is in excess. When\nthe enzyme is present in excess, the initial reaction\nrate will be proportional to substrate concentration.\nThis condition, called a first-order reaction, is needed\nwhen the enzyme is used as a reagent to measure a\nspecific analyte.","difficulty":2},{"id":"HARR-5.7-Q008","topic":"5.7 Enzymes and Cardiac Markers","question":"The increase in the level of serum enzymes used to detect cholestatic liver disease is caused mainly by:","options":["Enzyme release from dead cells","Leakage from cells with altered membrane permeability","Decreased perfusion of the tissue","Increased production and secretion by cells"],"answer":"D","rationale":"The amount of enzyme in the serum can be\nincreased by necrosis, altered permeability, secretion,\nor synthesis. It is also dependent upon tissue\nperfusion, enzyme half-life, molecular size, and\nlocation of the enzyme within the cell. Most enzymes\nare liberated by necrosis, but a few, such as ALP and\nγ-glutamyltransferase, are produced and secreted at a\ngreater rate in obstructive liver disease.","difficulty":4},{"id":"HARR-5.7-Q009","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following enzymes is considered most tissue specific?","options":["Creatine kinase (CK)","Amylase","Alkaline phosphatase (ALP)","Alcohol dehydrogenase (ADH)"],"answer":"D","rationale":"No enzyme is truly tissue specific and diagnostic\naccuracy depends upon recognizing changes in plasma\nlevels that characterize different diseases. This includes\nthe mass or activity of enzyme released, its rise, peak,\nand return to normal, the isoenzyme(s) released, and\nthe concomitant changes of other enzymes. Alanine\naminotransferase and alcohol dehydrogenase are\nprimarily increased in necrotic liver disease.","difficulty":2},{"id":"HARR-5.7-Q010","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following enzymes is activated by calcium ions?","options":["CK","Amylase","ALP","LD"],"answer":"B","rationale":"Most enzymes require metals as activators or\ncofactors. CK and ALP require Mg+2 for full activity,\nand amylase requires Ca+2. Metals required for activity\nshould be components of the substrate used for\nenzyme analysis. The substrate must also contain\nanions required (e.g., Cl– for amylase) and should not\ncontain inhibiting cations or anions (e.g., Zn+2 and\nMn+2 for CK).","difficulty":1},{"id":"HARR-5.7-Q011","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following enzymes is a transferase?","options":["ALP","CK","Amylase","LD"],"answer":"B","rationale":"Enzymes are identified by a numeric system called\nthe EC (Enzyme Commission) number. The first\nnumber refers to the class of the enzyme. There are\nsix classes; in order, these are oxidoreductases,\ntransferases, hydrolases, lyases, isomerases, and\nligases. Dehydrogenases are oxidoreductases,\nwhereas kinases and transaminases are transferases.\nCK is EC number 2.7.3.2, which distinguishes it from\nother kinases.","difficulty":1},{"id":"HARR-5.7-Q012","topic":"5.7 Enzymes and Cardiac Markers","question":"Which statement about methods for measuring LD is true?","options":["The formation of pyruvate from lactate (forward reaction) generates NAD+","The pyruvate-to-lactate reaction proceeds at about twice the rate as the forward reaction","The lactate-to-pyruvate reaction is optimized at pH 7.4","The negative-rate reaction is preferred"],"answer":"B","rationale":"Although the rate of the reverse reaction (P →L) is\nfaster, the L →P reaction is more popular because it\nproduces a positive rate (generates NADH), is not\nsubject to product inhibition, and is highly linear. \nThe pH optimum for the forward reaction is\napproximately 8.8.","difficulty":1},{"id":"HARR-5.7-Q013","topic":"5.7 Enzymes and Cardiac Markers","question":"Which condition produces the highest elevation of serum lactate dehydrogenase?","options":["Pernicious anemia","Myocardial infarction","Acute hepatitis","Muscular dystrophy"],"answer":"A","rationale":"Serum LD levels are highest in pernicious anemia,\nreaching 10–50 times the upper reference limit (URL)\nas a result of intramedullary hemolysis. Moderate\nelevations (5–10 × URL) usually are seen in acute\nmyocardial infarction, necrotic liver disease, and\nmuscular dystrophy. Slight increases (2–3 × URL) are\nsometimes seen in obstructive liver disease.","difficulty":4},{"id":"HARR-5.7-Q014","topic":"5.7 Enzymes and Cardiac Markers","question":"In which condition is the LD most likely to be within normal limits?","options":["Hepatic carcinoma","Pulmonary infarction","Acute appendicitis","Crush injury"],"answer":"C","rationale":"LD is increased slightly to moderately in most \ncauses of liver disease. Smallest elevations are seen \nin obstructive jaundice and highest in hepatic\ncarcinoma and toxic hepatitis, where levels can reach\n10-fold the upper reference limit. LD is also increased\nin crush injury and muscular dystrophies due to\nskeletal muscle damage, and in pulmonary infarction\nowing to embolism formation. Amylase is increased\nin a majority of persons with acute appendicitis, \nbut LD is not.","difficulty":3},{"id":"HARR-5.7-Q015","topic":"5.7 Enzymes and Cardiac Markers","question":"The LD pleural fluid:serum ratio for a transudative fluid is usually:","options":["3:1 or higher","2:1","1:1","1:2 or less"],"answer":"D","rationale":"The lactate dehydrogenase activity of body fluids \nis normally less than serum, and a fluid to serum \nLD ratio greater than 1:2 is highly suggestive of an\nexudative process. Elevated lactate dehydrogenase \nin chest fluid is often caused by lung malignancy,\nmetastatic carcinoma, Hodgkin’s disease, and\nleukemia.","difficulty":5},{"id":"HARR-5.7-Q016","topic":"5.7 Enzymes and Cardiac Markers","question":"In which type of liver disease would you expect the greatest elevation of LD?","options":["Toxic hepatitis","Alcoholic hepatitis","Cirrhosis","Acute viral hepatitis"],"answer":"A","rationale":"Liver disease produces an elevated LD-4 and LD-5.\nLevels may reach up to 10 times the URL in toxic\nhepatitis and in hepatoma. However, LD levels are\nlower in viral hepatitis (2–5 × URL), only slightly\nelevated in cirrhosis (2–3 × URL) and not significantly\nelevated in alcoholic liver disease.","difficulty":1},{"id":"HARR-5.7-Q017","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following conditions will interfere with the measurement of LD?","options":["Slight hemolysis during sample collection","Storage at 4°C for 3 days","Storage at room temperature for 16 hours","Use of plasma collected in heparin"],"answer":"A","rationale":"RBCs are rich in LD-1 and LD-2, and even slight\nhemolysis will falsely elevate results. Hemolytic,\nmegaloblastic, and pernicious anemias are associated\nwith LD levels of 10–50 times the URL. LD is stable \nfor 2 days at room temperature or 1 week at 4°C;\nhowever, freezing causes deterioration of LD-5. \nThe activity of LD is inhibited by EDTA, which binds\ndivalent cations; serum or heparinized plasma should\nbe used.","difficulty":3},{"id":"HARR-5.7-Q018","topic":"5.7 Enzymes and Cardiac Markers","question":"In the Oliver–Rosalki method, the reverse reaction is used to measure CK activity. The enzyme(s) used in the coupling reactions is (are):","options":["Hexokinase and G-6-PD","Pyruvate kinase and LD","Luciferase","Adenylate kinase"],"answer":"A","rationale":"The Oliver–Rosalki method for CK is based upon \nthe formation of ATP from creatine phosphate.\nHexokinase catalyzes the phosphorylation of glucose\nby ATP. This produces glucose-6-PO4 and adenosine\ndiphosphate (ADP). The glucose-6-PO4 is oxidized \nto 6-phosphogluconate as NADP+ is reduced to\nNADPH.","difficulty":3},{"id":"HARR-5.7-Q019","topic":"5.7 Enzymes and Cardiac Markers","question":"In the Oliver–Rosalki method for CK, adenosine monophosphate (AMP) is added to the substrate in order to:","options":["Inhibit adenylate kinase","Block the oxidation of glutathione","Increase the amount of ADP that is available","Block the action of diadenosine pentaphosphate"],"answer":"A","rationale":"Positive interference in the Oliver–Rosalki method\ncan occur when adenylate kinase is present in the\nserum from hemolysis or damaged tissue. Adenylate\nkinase hydrolyzes ADP, forming AMP and ATP \n(2 ADP AK\nAMP + ATP). This reaction is inhibited by\nadding AMP and diadenosine pentaphosphate\n(Ap5A) to the substrate.","difficulty":3},{"id":"HARR-5.7-Q020","topic":"5.7 Enzymes and Cardiac Markers","question":"Which substance is used in the CK assay to activate the enzyme?","options":["Flavin adenine dinucleotide (FAD)","Imidazole","N-acetylcysteine","Pyridoxyl-5 ́-phosphate"],"answer":"C","rationale":"In addition to Mg+2, CK requires a thiol compound to\nreduce interchain disulfide bridges and bind heavy\nmetals that inactivate the enzyme. N-acetylcysteine is\nan activator of CK used for this purpose in the IFCC\nrecommended method. Pyridoxyl-5 ́-phosphate is a\nprosthetic group of AST and ALT. FAD is a prosthetic\ngroup of glucose oxidase. Imidazole is used to buffer\nthe CK reagent.","difficulty":1},{"id":"HARR-5.7-Q021","topic":"5.7 Enzymes and Cardiac Markers","question":"SITUATION: A specimen for CK performed on an automated analyzer using an optimized Oliver–Rosalki method gives an error flag indicating substrate depletion. The sample is diluted 1:2 and 1:4 by the serial dilution technique and reassayed. After correcting for the dilution, the results are as follows: Dilutions are made a second time and assayed again but give identical results. What is the most likely explanation?","options":["The serum became contaminated prior to making the 1:4 dilution","The wrong pipet was used to make one of the dilutions","An endogenous competitive inhibitor is present in the serum","An error has been made in calculating the enzyme activity of one of the two dilutions"],"answer":"C","rationale":"When a competitive inhibitor is present in the serum,\na dilution of the sample will cause an increase in the\nreaction rate by reducing the concentration of the\ninhibitor. Dilution of serum frequently increases the\nactivity of CK and amylase. The same effect will occur\nwhen a smaller volume of serum is used in the assay\nbecause less inhibitor will be present in the reaction\nmixture.","difficulty":5},{"id":"HARR-5.7-Q022","topic":"5.7 Enzymes and Cardiac Markers","question":"SITUATION: A physician calls to request a CK on a sample already sent to the laboratory for coagulation studies. The sample is 2-hour-old citrated blood and has been stored at 4°C. The plasma shows very slight hemolysis. What is the best course of action and the reason for it?","options":["Perform the CK assay on the sample because no interferent is present","Reject the sample because it is slightly hemolyzed","Reject the sample because it has been stored too long","Reject the sample because the citrate will interfere"],"answer":"D","rationale":"CK activity is lost with excessive storage, the most\nlabile isoenzyme being CK-1. However, CK in serum is\nstable at room temperature for about 4 hours and up\nto 1 week at 4°C provided that an optimized method\nis used. Slight hemolysis does not interfere because\nCK is absent from RBCs. More significant hemolysis\nmay cause positive interference by contributing ATP,\nglucose-6-PO4, and adenylate kinase to the serum.\nCalcium chelators remove magnesium as well as\ncalcium and should not be used.","difficulty":5},{"id":"HARR-5.7-Q023","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following statements regarding total CK is true?","options":["Levels are unaffected by strenuous exercise","Levels are unaffected by repeated intramuscular injections","Highest levels are seen in Duchenne’s muscular dystrophy","The enzyme is highly specific for heart injury"],"answer":"C","rationale":"Total CK is neither sensitive nor specific for AMI. An\ninfarct can occur without causing an elevated total\nCK. Exercise and intramuscular injections cause a\nsignificant increase in total CK. Crush injuries and\nmuscular dystrophy can increase the total CK up to\n50 times the URL.","difficulty":1},{"id":"HARR-5.7-Q024","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following statements regarding the clinical use of CK-MB (CK-2) is true?","options":["CK-MB becomes elevated before myoglobin after an AMI","CK-MB levels are usually increased in cases of cardiac ischemia","CK-MB is more specific than myoglobin","An elevated CK-MB is always accompanied by an elevated total CK"],"answer":"C","rationale":"Serum myoglobin becomes abnormal within \n1–2 hours after an acute myocardial infarction \n(AMI) before troponin and CK-MB. CK-MB becomes\nabnormal shortly after troponin I (TnI) or troponin \nT (TnT) when a URL of 4 μg/L is used, and peaks \nat around the same time following AMI. However,\ncardiac troponins remain elevated significantly\nlonger than CK-MB after AMI, are not increased in\ncrush injuries. There is less than 5 μg/L CK-MB in \nthe serum of healthy adults, while the total CK\nranges from 10–110 U/L. Consequently, an\nabnormal CK-MB can occur in the absence of an\nelevated total CK.","difficulty":4},{"id":"HARR-5.7-Q025","topic":"5.7 Enzymes and Cardiac Markers","question":"A patient’s CK-MB is reported as 18 μg/L and the total CK as 560 IU/L. What is the CK relative index (CKI)?","options":["0.10%","3.2%","10.0%","30.0%"],"answer":"B","rationale":"The CKI is an expression of the percentage of the \ntotal CK that is attributed to CK-MB.","difficulty":4},{"id":"HARR-5.7-Q026","topic":"5.7 Enzymes and Cardiac Markers","question":"In a nonmyocardial as opposed to a myocardial cause of an increased serum or plasma CK-MB, which would be expected?","options":["An increase in CK-MB that is persistent","An increase in the percent CK-MB as well as concentration","The presence of increased TnI","A more modest increase in total CK than CK-MB"],"answer":"A","rationale":"Plasma CK-MB becomes abnormal 4 hours\npostinfarction, peaks in 16–20 hours, and usually\nreturns to normal within 48 hours. In some\nnoncardiac causes of elevated plasma CK-MB such \nas muscular dystrophy, there is a persistent elevation\nof both total CK and CK-MB. TnI and TnT are \ncardiac-specific markers. They become elevated\nslightly before CK-MB when a CK-MB URL of \n4 μg/L is used, remain elevated for 7–10 days\nfollowing an AMI, and are not increased in muscular\ndystrophy, malignant hyperthermia, or crush \ninjuries that are associated with an increase in the\nconcentration of CK-MB. Absolute CK-MB increases\nare evaluated cautiously, when CK-MB is less than\n2.5% of total enzyme because noncardiac sources\nmay be responsible.","difficulty":5},{"id":"HARR-5.7-Q027","topic":"5.7 Enzymes and Cardiac Markers","question":"Which statement best describes the clinical utility of plasma or serum myoglobin?","options":["Levels greater than 100 μg/L are diagnostic of AMI","Levels below 100 μg/L on admission and 2–4 hours postadmission help to exclude a diagnosis of AMI","Myoglobin peaks after the cardiac troponins but is more sensitive","The persistence of myoglobin > 110 μg/L for 3 days following chest pain favors a diagnosis of AMI"],"answer":"B","rationale":"Myoglobin is a heme-containing pigment in both\nskeletal and cardiac muscle cells. The upper limit of\nnormal is approximately 90 μg/L for males and 75 μg/L\nfor females. The plasma myoglobin is a sensitive\nmarker for AMI. Over 95% of affected persons have a\nvalue higher than the cutoff (typically >110 μg/L).\nHowever, specificity is approximately 75%–85% owing\nto skeletal muscle injury or renal insufficiency. For this\nreason, a plasma myoglobin below the cutoff on\nadmission, and within the first 3 hours following chest\npain helps to rule out AMI. A value above the cutoff\nmust be confirmed using a cardiac specific assay such\nas TnI or TnT.","difficulty":4},{"id":"HARR-5.7-Q028","topic":"5.7 Enzymes and Cardiac Markers","question":"What is the typical time course for plasma myoglobin following an AMI?","options":["Abnormal before 1 hour; peaks within 3 hours; returns to normal in 8 hours","Abnormal within 3 hours; peaks within 6 hours; returns to normal in 18 hours","Abnormal within 2 hours; peaks within 12 hours; returns to normal in 36 hours","Abnormal within 6 hours; peaks within 24 hours; returns to normal in 72 hours"],"answer":"C","rationale":"After AMI, myoglobin usually rises above the cutoff\nwithin 1–2 hours, peaks within 8–12 hours and\nreturns to normal within 36 hours. Typically, levels\nreach a peak concentration that is 10-fold the upper\nreference limit. Since myoglobin is the first marker \nto become abnormal after an AMI, it should be\nmeasured on admission and if negative, again \n2 hours later. If both samples are below the cutoff,\nthe probability of an AMI having occurred is low. If\nthe myoglobin is above the cutoff, a cardiac specific\nmarker such as TnI, or TnT must be performed at\nsome point to confirm the diagnosis.","difficulty":4},{"id":"HARR-5.7-Q029","topic":"5.7 Enzymes and Cardiac Markers","question":"What is the typical time course for plasma TnI or TnT following an AMI?","options":["Abnormal within 3 hours; peaks within 12 hours; returns to normal in 24 hours","Abnormal within 4 hours; peaks within 18 hours; returns to normal in 48 hours","Abnormal within 4 hours; peaks within 24 hours; returns to normal in 1 week","Abnormal within 6 hours; peaks within 36 hours; returns to normal in 5 days"],"answer":"C","rationale":"Troponin is a complex of three polypeptides that\nfunction as a regulator of actin and tropomyosin. The\nthree subunits are designated TnC, TnI, and TnT. All\nare present in both cardiac and some skeletal muscles,\nbut cardiac and skeletal isoforms of TnI and TnT can\nbe differentiated by specific antiseras. TnI and TnT\ncardiac isoforms in plasma will at least double within\n4–6 hours after MI, peak within 24 hours and usually\nremain elevated for 7–10 days. TnT and TnI have the\nsame sensitivity, but TnT is more commonly elevated\nin renal failure patients. Both are increased slightly in\nunstable angina (chest pain while at rest) and cardiac\nischemia.","difficulty":5},{"id":"HARR-5.7-Q030","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following is the most effective serial sampling time for ruling out AMI using both myoglobin and a cardiac specific marker in an emergency department environment?","options":["Admission and every hour for the next 3 hours or until positive","Admission, 2 hours, 4 hours, and 6 hours or until positive","Admission, 3 hours, 6 hours, and a final sample within 12 hours","Admission and one sample every 8 hours for 48 hours"],"answer":"C","rationale":"Since the time between the onset of symptoms \nand arrival in the emergency department is often\nspeculative, serial measurement of cardiac markers \nis required in order to rule out AMI. Since myoglobin\nis the first marker to rise after AMI, if used it should \nbe measured on admission. Since TnI, TnT, and \nCK-MB are more cardiac specific, at least one should\nbe measured starting at 3 hours postadmission, \nand again at 6 hours postadmission. If all results \nare negative to this point, a final assay should be\nperformed 6–12 hours postadmission to conclusively\nrule out the possibility of AMI and evaluate the \nshort-term risk of AMI.","difficulty":5},{"id":"HARR-5.7-Q031","topic":"5.7 Enzymes and Cardiac Markers","question":"What is the recommended troponin T and I cutoff (upper limit of normal) for detecting myocardial infarction?","options":["The cutoff varies with the method of assay but should be no lower than 0.2 ng/mL","The upper 99th percentile or lowest level that can be measured with 10% CV","The concentration corresponding to the lowest level of calibrator used","The highest value fitting under the area of the curve for the 95% confidence interval"],"answer":"B","rationale":"The American College of Cardiology recommends the\ncutoff for an abnormal troponin test be set at the 99th\npercentile of the normal population, 0.013 ng/mL, or\nif the assay precision at this level is >10% then the\ncutoff should be the lowest value measurable with a\nCV of 10% (typically 0.03 ng/mL). An abnormal result\n(0.04 ng/mL or higher) in a patient with other evidence\nof ischemic changes indicates cardiac damage. \nThis typically occurs when a pattern of increasing\ntroponin concentration is seen over the first 6 hours\nafter initial testing.","difficulty":4},{"id":"HARR-5.7-Q032","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following cardiac markers is consistently increased in persons who exhibit unstable angina?","options":["Troponin C","Troponin T","CK-MB","Myoglobin"],"answer":"B","rationale":"Persons with unstable angina (angina at rest) who\nhave an elevated TnT or TnI are at eight times greater\nrisk of having an MI within the next 6 months. This\nproperty is being used to identify short-term risk\npatients who should be considered for coronary\nangioplasty. The reference range for troponin is very\nlow (0–0.03 ng/mL); persons with unstable angina\nusually have values between 0.04 and 0.1 ng/mL\nwithout clinical evidence of AMI. CK-MB and\nmyoglobin have not been useful in identifying\npersons with unstable angina.","difficulty":3},{"id":"HARR-5.7-Q033","topic":"5.7 Enzymes and Cardiac Markers","question":"A patient has a plasma myoglobin of 10 μg/L at admission. Three hours later, the myoglobin is 14 μg/L and the troponin I is 0.02 μg/L (reference range 0–0.03 μg/L). These results are consistent with which condition?","options":["Skeletal muscle injury","Acute myocardial infarction","Unstable angina","No evidence of myocardial or skeletal muscle injury"],"answer":"D","rationale":"This person displays very low plasma myoglobin\n(reference range for females is approximately \n17–75 μg/L). The TnI result is also within normal\nlimits. These results are consistent with baseline\nlevels and no evidence of cardiac or skeletal muscle\ninjury. TnI cutpoints for diagnosis of AMI are\ndependent upon the method, and may be higher\nthan the upper limit of normal. Troponin results\nabove the upper reference limit but below the\ncutpoint for AMI indicate myocardial injury and\nincreased risk for AMI.","difficulty":5},{"id":"HARR-5.7-Q034","topic":"5.7 Enzymes and Cardiac Markers","question":"A patient has a plasma CK-MB of 14 μg/L at admission and a total CK of 170 IU/L. Serum myoglobin is 130 μg/L and TnI is 1.6 μg/L. Three hours later, the TnI is 3.0 μg/L. Which statement best describes this situation?","options":["This patient has had an AMI and further testing is unnecessary","A second CK-MB and myoglobin test should have been performed at 3 hours postadmission to confirm AMI","These results are consistent with skeletal muscle damage associated with a crush injury that elevated the CK-MB","Further testing 6–12 hours postadmission is required to establish a diagnosis of AMI"],"answer":"A","rationale":"Results on admission indicate strongly that the\npatient has suffered an MI. The 3-hour TnI confirms\nthis and rules out the possibility of a sample\ncollection or transcription error for the admission\nsample. Repeat testing of other cardiac markers at \n3 hours was not necessary because admission results\nwere significantly increased for all three markers.\nSkeletal muscle damage or crush injury does not\ncause an increase in cardiac TnI.","difficulty":5},{"id":"HARR-5.7-Q035","topic":"5.7 Enzymes and Cardiac Markers","question":"SITUATION: An EDTA sample for TnI assay gives a result of 0.04 ng/mL (reference range 0–0.03 ng/mL). The test is repeated 3 hours later on a new specimen and the result is 0.06 ng/mL. A third sample collected 6 hours later gives a result of 0.07 ng/mL. The EKG showed no evidence of ST segment elevation (STEMI). What is the most likely explanation?","options":["A false-positive result occurred due to matrix interference","Heparin should have been used instead of EDTA, which causes false positives","The patient has suffered cardiac injury","The patient has had an ischemic episode without cardiac injury"],"answer":"C","rationale":"EDTA is the additive of choice for troponin assays\nbecause it avoids microclots that can lead to false\npositive results when serum or heparinized plasma is\nused. Spurious false positives caused by matrix effects\nusually revert to normal when the test is repeated on\na new sample. An AMI will cause the TnI to increase in\nsubsequent tests. Results between 0.04–0.10 ng/mL\nare the result of cardiac injury, and indicate either AMI\nor an increased short-term risk of AMI.","difficulty":5},{"id":"HARR-5.7-Q036","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following laboratory tests is a marker for ischemic heart disease?","options":["CK-MB isoforms","Myosin light chain 1","Albumin cobalt binding","Free fatty acid binding protein"],"answer":"C","rationale":"When heart muscle suffers reversible damage as \na result of oxygen deprivation, free radicals are\nreleased from the cells and bind to circulating\nalbumin. The albumin is modified at the N-terminus,\ncausing a reduced ability to bind certain metals. \nThis ischemia-modified albumin can be measured \nby its inability to bind cobalt. An excess of cobalt \nis incubated with plasma followed by addition of\ndithiothreitol. The sulfhydryl compound complexes\nwith the free cobalt, forming a colored complex. \nThe absorbance of the reaction mixture is directly\nproportional to the ischemia-modified albumin\nconcentration. In addition to ischemia-modified\nalbumin, glycogen phosphorylase-BB is a marker \nfor ischemia because it is released from heart\nmuscle during an ischemic episode. Myosin light\nchains and fatty acid–binding protein are released\nfrom necrotic heart tissue in the early stages \nof AMI.","difficulty":4},{"id":"HARR-5.7-Q037","topic":"5.7 Enzymes and Cardiac Markers","question":"Which test becomes abnormal in the earliest stage of the acute coronary syndrome?","options":["Myosin light chain 1","CK-MB isoforms","Myoglobin","High-sensitivity C-reactive protein"],"answer":"D","rationale":"The acute coronary syndrome (ACS) refers to the\nevolution of coronary artery events that lead up to\nAMI. Coronary artery disease (CAD) begins with\nformation of a plaque comprised of lipid from dead\nendothelium that proliferates into the artery lumen.\nThe plaque becomes disrupted and the vessel wall\ninflamed in the asymptomatic stage of CAD. If\nplatelet activation occurs and results in thrombosis,\nblood flow becomes significantly reduced, resulting\nin angina. This signals the transition to more\nadvanced disease in which ischemia to heart muscle\noccurs and eventually to AMI. Myoglobin and CK-MB\nisoforms are not increased until the end stage of \nACS. High-sensitivity C-reactive protein (hs-CRP) is an\nultrasensitive CRP assay that accurately measures \nCRP below 1 mg/L. CRP is an acute-phase protein\nincreased in inflammation. Levels of CRP between\n3.2–10 mg/L signal low-grade inflammation, which\noccurs in the asymptomatic phase of ACS. Such\ninflammation occurs when coronary artery plaques\nbecome disrupted, and therefore, persons with CAD\nwho have a mildly increased CRP are at high risk of\ndisease progression. Glycogen phosphorylase-BB \nand albumin cobalt binding are increased by\nischemia. Troponins are increased when there is\nunstable angina and ischemic injury, and indicate \nan increased risk for AMI.","difficulty":5},{"id":"HARR-5.7-Q038","topic":"5.7 Enzymes and Cardiac Markers","question":"Which statement best describes the clinical utility of B-type natriuretic peptide (BNP)?","options":["Abnormal levels may be caused by obstructive lung disease","A positive test indicates prior myocardial damage caused by AMI that occurred within the last 3 months","A normal test result (<100 pg/mL) helps rule out congestive heart failure in persons with symptoms associated with coronary insufficiency","A level above 100 pg/mL is not significant if evidence of congestive heart failure is absent"],"answer":"C","rationale":"B-type natriuretic peptide is a hormone produced by\nthe ventricles in response to increased intracardiac\nblood volume and hydrostatic pressure. It is formed\nin the heart from a precursor peptide (preproBNP) by\nenzymatic hydrolysis, first forming proBNP followed\nby BNP and NT (N-terminal) proBNP which is not\nphysiologically active. Both BNP and NT-proBNP are\nincreased in persons with congestive heart failure\n(CHF). Levels are not increased in pulmonary\nobstruction, hypertension, edema associated with\nrenal insufficiency, and other conditions that cause\nphysical limitation and symptoms that overlap CHF.\nAt a cutoff of <100 pg/mL the BNP test is effective in\nruling out CHF. Diagnostic accuracy in distinguishing\nCHF from nonCHF ranges from 83%–95%. In addition,\npersons with ischemia who have an increased BNP\nare at greater risk for MI. The NTpro-BNP assay is\nsimilar in clinical value, and can be used for persons\nbeing treated with nesiritide, a recombinant form of\nBNP used to treat CHF.","difficulty":5},{"id":"HARR-5.7-Q039","topic":"5.7 Enzymes and Cardiac Markers","question":"Which statement best describes the clinical utility of plasma homocysteine?","options":["Levels are directly related to the quantity of LDL cholesterol in plasma","High plasma levels are associated with atherosclerosis and increased risk of thrombosis","Persons who have an elevated plasma homocysteine will also have an increased plasma Lp(a)","Plasma levels are increased only when there is an inborn error of amino acid metabolism"],"answer":"B","rationale":"Homocysteine includes the monomeric amino acid\nas well as the dimers such as homocystine that\ncontain homocysteine. Plasma levels are measured as\nan independent risk factor for coronary artery disease.\nHigh levels of homocysteine are toxic to vascular\nendothelium and promote inflammation and plaque\nformation. Plasma levels are independent of LDL and\nother cholesterol fractions and help explain why\napproximately 35% of people with first-time AMI \nhave LDL cholesterol levels < 130 mg/dL.","difficulty":4},{"id":"HARR-5.7-Q040","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following cardiac markers derived from neutrophils predicts an increased risk for myocardial infarction?","options":["Phospholipase A2 (PLA2)","Glycogen phosphorylase BB (GPBB)","Soluble CD40 ligand (sCD40l)","Myeloperoxidase (MPO)"],"answer":"D","rationale":"All of the answer choices are markers for acute\ncoronary syndrome and increased risk of AMI. \nMPO is released from neutrophils and is thought to\ndestabilize the arterial plaque by oxidizing both \nLDL and HDL and reducing nitric oxide levels in the\ncoronary arteries. Levels in the upper third quartile\npredict an increased risk of a coronary event even\nwhen troponin is normal. GPBB is released from\nmyocytes early in an ischemic episode and becomes\nabnormal about 2 hours after an AMI. sCD40l is\nreleased from activated platelets and indicates an\nunstable plaque. PLA2 is produced by the arterial \nwall. It removes a fatty acid from phospholipids and\nincreases the amount of oxidized LDL, leading to\nfoam cell formation. Like hs-CRP, it is a marker for an\ninflamed plaque.","difficulty":4},{"id":"HARR-5.7-Q041","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following statements about the aminotransferases (AST and ALT) is true?","options":["Isoenzymes of AST and ALT are not found in humans","Both transfer an amino group to α–ketoglutarate","Both require NADP+ as a coenzyme","Both utilize four carbon amino acids as substrates"],"answer":"B","rationale":"ALT catalyzes the transfer of an amino group \nfrom alanine, a three-carbon amino acid, to\nα–ketoglutarate (2–oxoglutarate), forming pyruvate.\nAST catalyzes the transfer of an amino group from\naspartate (four carbons) to α–ketoglutarate, forming\noxaloacetate. The reactions are highly reversible and\nregulate the flow of aspartate into the urea cycle.\nBoth transaminases require P-5‘-P as an intermediate\namino acceptor (coenzyme). Cytoplasmic and\nmitochondrial isoenzymes are produced but are \nnot differentiated in clinical practice.","difficulty":3},{"id":"HARR-5.7-Q042","topic":"5.7 Enzymes and Cardiac Markers","question":"Select the products formed from the forward reaction of AST.","options":["Alanine and α–ketoglutarate","Oxaloacetate and glutamate","Aspartate and glutamine","Glutamate and NADH"],"answer":"B","rationale":"AST forms oxaloacetate and glutamate from \naspartate and α–ketoglutarate (2–oxoglutarate). \nBoth transaminases use α–ketoglutarate and\nglutamate as a common substrate and product pair.\nBoth aspartate and alanine can be used to generate\nglutamate in the central nervous system, where it\nacts as a neurotransmitter.","difficulty":2},{"id":"HARR-5.7-Q043","topic":"5.7 Enzymes and Cardiac Markers","question":"Select the products formed from the forward reaction of ALT.","options":["Aspartate and alanine","Alanine and α–ketoglutarate","Pyruvate and glutamate","Glutamine and NAD+"],"answer":"C","rationale":"Because glutamate is a common product for\ntransaminases, pyruvate (a three-carbon ketoacid)\nand glutamate would be generated from the\ntransamination reaction between alanine and\nα–ketoglutarate.","difficulty":1},{"id":"HARR-5.7-Q044","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the statements below regarding the methods of Henry for AST and ALT is correct?","options":["Hemolysis will cause positive interference in both AST and ALT assays","Loss of activity occurs if samples are frozen at –20°C","The absorbance at the start of the reaction should not exceed 1.0 A","Reaction rates are unaffected by addition of P-5 ́-P to the substrate"],"answer":"A","rationale":"RBCs are rich in AST and to a lesser extent in ALT.\nHemolysis causes positive interference in both assays,\nalthough the effect on AST is greater. Samples are\nstable for up to 24 hours at room temperature and up\nto 3 days at 4°C, and should be frozen if kept longer.\nThe starting absorbance should be at least 1.5 A for\nboth assays. Substrates with lower concentrations of\nNADH are subject to NADH depletion during the lag\nphase due to side reactions or high transaminase\nactivity. When P-5‘-P is added, a significant increase in\nactivity sometimes occurs because some of the\nenzyme in the serum is in the inactive apoenzyme\nform.","difficulty":3},{"id":"HARR-5.7-Q045","topic":"5.7 Enzymes and Cardiac Markers","question":"Select the coupling enzyme used in the kinetic AST reaction of Henry.","options":["LD","Malate dehydrogenase","Glutamate dehydrogenase","G-6-PD"],"answer":"B","rationale":"The method of Henry for AST uses malate\ndehydrogenase (MD) to reduce oxaloacetate \nto malate. The electrons come from NADH \nforming NAD+.\nAspartate + α–ketoglutarate AST\nOxaloacetate + Glutamate\nOxaloacetate + NADH + H+ MD\nMalate + NAD+","difficulty":1},{"id":"HARR-5.7-Q046","topic":"5.7 Enzymes and Cardiac Markers","question":"What is the purpose of LD in the kinetic method of Henry for AST?","options":["Forms NADH, enabling the reaction to be monitored at 340 nm","Rapidly exhausts endogenous pyruvate in the lag phase","Reduces oxaloacetate, preventing product inhibition","Generates lactate, which activates AST"],"answer":"B","rationale":"Patients with liver disease often have high levels of\npyruvate and LD. The LD can catalyze the reaction of\npyruvate with NADH in the substrate, forming NAD+","difficulty":1},{"id":"HARR-5.7-Q047","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following statements regarding the naming of transaminases is true?","options":["Serum glutamic oxaloacetic transaminase (SGOT) is the older abbreviation for ALT","Serum glutamic pyruvic transaminase (SGPT) is the older abbreviation for AST","SGPT is the older abbreviation for ALT","SGOT is the newer abbreviation for AST"],"answer":"C","rationale":"SGOT refers to the products measured in the in vitro\nreaction, and is more correctly named AST for the\nfour-carbon amino acid substrate aspartate. SGPT is\nthe older name referring to the products of the\nreaction for ALT. SGPT is more correctly named ALT\nfor the three-carbon amino acid substrate alanine.","difficulty":2},{"id":"HARR-5.7-Q048","topic":"5.7 Enzymes and Cardiac Markers","question":"Which statement accurately describes serum transaminase levels in AMI?","options":["ALT is increased 5- to 10-fold after an AMI","AST peaks 24–48 hours after an AMI and returns to normal within 4–6 days","AST levels are usually 20–50 times the upper limit of normal after an AMI","Isoenzymes of AST are of greater diagnostic utility than the total enzyme level"],"answer":"B","rationale":"ALT may be slightly elevated after an AMI. AST levels\ncan be up to 5–10 times the URL after AMI, but\nelevations of this range are also seen in patients \nwith muscular dystrophy, crush injury,  pulmonary\nembolism, infectious mononucleosis, and cancer \nof the liver.","difficulty":3},{"id":"HARR-5.7-Q049","topic":"5.7 Enzymes and Cardiac Markers","question":"Which condition gives rise to the highest serum level of transaminases?","options":["Acute hepatitis","Alcoholic cirrhosis","Obstructive biliary disease","Diffuse intrahepatic cholestasis"],"answer":"A","rationale":"The transaminases usually reach 20–50 times the URL\nin acute viral and toxic hepatitis. Both transaminases\nare moderately increased (5–10 × URL) in infectious\nmononucleosis, toxic hepatitis, diffuse intrahepatic\nobstruction, lymphoma, and cancer of the liver, \nand slightly increased (2–5 × URL) in cirrhosis and\nextrahepatic obstruction.","difficulty":3},{"id":"HARR-5.7-Q050","topic":"5.7 Enzymes and Cardiac Markers","question":"In which liver disease is the DeRitis ratio (ALT:AST) usually greater than 1.0?","options":["Acute hepatitis","Chronic hepatitis","Hepatic cirrhosis","Hepatic carcinoma"],"answer":"A","rationale":"ALT prevails over AST in hepatitis; however, AST is\ngreater than ALT in carcinoma, alcoholic liver disease,\nand cirrhosis of the liver.","difficulty":4},{"id":"HARR-5.7-Q051","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following liver diseases produces the highest levels of transaminases?","options":["Hepatic cirrhosis","Obstructive jaundice","Hepatic cancer","Alcoholic hepatitis"],"answer":"C","rationale":"Elevation of transaminases is greatest in acute\nhepatitis (20–50 × URL). Levels are moderately\nelevated (5–10 × URL) in hepatic cancer. They are\nslightly elevated (2–5 × URL) in chronic hepatitis,\nhepatic cirrhosis, alcoholic hepatitis, and obstructive\njaundice.","difficulty":4},{"id":"HARR-5.7-Q052","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following statements regarding transaminases is true?","options":["ALT is often increased in muscular disease, pancreatitis, and lymphoma","ALT is increased in infectious mononucleosis, but AST is usually normal","ALT is far more specific for liver diseases than is AST","Substrate depletion seldom occurs in assays of serum from hepatitis cases"],"answer":"C","rationale":"ALT is far more specific for liver disease than AST.\nHigh ALT may result from nonhepatic causes such as\nAMI, muscle injury or disease, and severe hemolysis,\nbut nonhepatic sources can be ruled out by a high\ndirect bilirubin. Elevated ALT (e.g., >65 IU/L) is used\nalong with immunologic tests for hepatitis to\ndisqualify blood donors. AST is increased in muscle\ndisease, MI, pancreatitis, and lymphoma. Both\ntransaminases are moderately increased in infectious\nmononucleosis.","difficulty":2},{"id":"HARR-5.7-Q053","topic":"5.7 Enzymes and Cardiac Markers","question":"Select the most sensitive marker for alcoholic liver disease.","options":["GLD","ALT","AST","γ-Glutamyltransferase (GGT)"],"answer":"D","rationale":"Although AST and ALT are elevated in alcoholic\nhepatitis, GGT is a more sensitive indicator of\nalcoholic liver disease. Levels of GGT can reach in\nexcess of 25 times the URL in alcoholic hepatitis. \nIt is also markedly elevated in obstructive jaundice; \na high GGT supports the inference that liver is the\ntissue source of an elevated ALP.","difficulty":2},{"id":"HARR-5.7-Q054","topic":"5.7 Enzymes and Cardiac Markers","question":"Which enzyme is least useful in differentiating necrotic from obstructive jaundice?","options":["GGT","ALT","5’ Nucleotidase","LD"],"answer":"D","rationale":"GGT and 5 ́ nucleotidase are markedly elevated in\nboth intra- and posthepatic obstruction. ALT is\nslightly elevated in obstructive jaundice but is\nmarkedly elevated in necrotic jaundice. Although \nLD is usually greater in necrotic jaundice than in\nobstructive jaundice, elevations in these conditions\noverlap frequently and result from many other\ncauses.","difficulty":2},{"id":"HARR-5.7-Q055","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following statements about the phosphatases is true?","options":["They hydrolyze adenosine triphosphate and related compounds","They are divided into two classes based upon pH needed for activity","They exhibit a high specificity for substrate","They are activated by Pi"],"answer":"B","rationale":"Phosphatases are classified as either alkaline or acid\ndepending upon the pH needed for optimum\nactivity. The phosphatases hydrolyze a wide range \nof monophosphoric acid esters. ALP is inhibited by\nphosphorus (product inhibition). The International\nFederation of Clinical Chemistry (IFCC) recommended\nmethod employs 2-amino-2-methyl-1-propanol, a\nbuffer that binds Pi.","difficulty":1},{"id":"HARR-5.7-Q056","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following statements regarding ALP is true?","options":["In normal adults, the primary tissue source is fast-twitch skeletal muscle","Geriatric patients have a lower serum ALP than other adults","Serum ALP levels are lower in children than in adults","Pregnant women have a higher level of serum ALP than other adults"],"answer":"D","rationale":"ALP is higher in children than in adults due to bone\ngrowth. Children and geriatric patients have higher\nserum ALP due to increased bone isoenzyme.\nSerum ALP levels are often two- or threefold higher\nthan the URL in the third term of pregnancy. In\nnonpregnant normal adults, serum ALP is derived\nfrom liver and bone. Liver, bone, placental, renal,\nand intestinal isoenzymes of ALP can be separated\nby electrophoresis, and many other ALP isoenzymes\nhave been identified by isofocusing.","difficulty":2},{"id":"HARR-5.7-Q057","topic":"5.7 Enzymes and Cardiac Markers","question":"Which isoenzyme of ALP is most heat stable?","options":["Bone","Liver","Intestinal","Placental"],"answer":"D","rationale":"Placental ALP and tumor-associated isoenzymes\nsuch as the Regan isoenzyme associated with lung\ncancer are the only isoenzymes that retain activity\nwhen serum is heated to 65° C for 10 minutes. Heat\ninactivation is used primarily to distinguish liver ALP\nfrom bone ALP. If less than 20% activity remains\nafter heating serum to 56°C for 10 minutes, then\nbone ALP is most likely present.","difficulty":1},{"id":"HARR-5.7-Q058","topic":"5.7 Enzymes and Cardiac Markers","question":"Which isoenzyme of ALP migrates farthest toward the anode when electrophoresed at pH 8.6?","options":["Placental","Bone","Liver","Intestinal"],"answer":"C","rationale":"Liver ALP isoenzymes migrate farthest toward the\nanode, but fast and slow variants occur. The slow \nliver ALP band is difficult to distinguish from placental\nand bone ALP. The order from cathode to anode is:","difficulty":2},{"id":"HARR-5.7-Q059","topic":"5.7 Enzymes and Cardiac Markers","question":"Which statement regarding bone-specific ALP is true?","options":["The bone isoenzyme can be measured immunochemically","Bone ALP is increased in bone resorption","Bone ALP is used for the diagnosis of osteoporosis","There are two distinct bone isoenzymes"],"answer":"A","rationale":"Bone ALP assays (Ostase and Alkphase-B) use\nmonoclonal antibodies to measure the bone\nisoenzyme in mass units. The assays may be used \nto monitor bone remodeling by osteoblasts in\nosteoporosis, and thus, are useful for following\ntreatment. Bone specific ALP is not sufficiently\nsensitive to diagnose osteoporosis, and antibodies\nmay cross-react with other ALP isoenzymes,\ndepending on their source.","difficulty":1},{"id":"HARR-5.7-Q061","topic":"5.7 Enzymes and Cardiac Markers","question":"In which condition would an elevated serum alkaline phosphatase be likely to occur?","options":["Small cell lung carcinoma","Hemolytic anemia","Prostate cancer","Acute myocardial infarction"],"answer":"A","rationale":"The primary diagnostic utility of ALP is to help\ndifferentiate necrotic jaundice (↑ALT) from\nobstructive jaundice (↑ALP). ALP is also increased in\nseveral bone diseases. Large increases are seen in\nPaget’s disease, moderate increases in bone cancer,\nand slight increases in rickets. Total ALP may be\nslightly increased in osteoporosis but often it is not.\nIn addition to obstructive jaundice and bone\ndiseases, alkaline phosphatase is a tumor marker. In\nmost cases, the alkaline phosphatase is the product\nof fetal gene activation, and resembles placental ALP\n(e.g., hepatoma, small cell carcinoma of the lung,\novarian cancer). Leukemia and Hodgkin’s disease may\ncause an elevated leukocyte or bone-derived ALP.","difficulty":5},{"id":"HARR-5.7-Q062","topic":"5.7 Enzymes and Cardiac Markers","question":"Which condition is least likely to be associated with increased serum ALP?","options":["Osteomalacia","Biliary obstruction","Hyperparathyroidism and hyperthyroidism","Osteoporosis"],"answer":"D","rationale":"ALP is elevated in osteomalacia (rickets), bone cancer,\nand bone disease secondary to hyperthyroidism and\nhyperparathyroidism, but total ALP it is high in less\nthan 30% of osteoporosis patients. Pancreatic disease\nassociated with biliary obstruction, such as cancer \nat the head of the pancreas, is associated with\nelevated ALP.","difficulty":3},{"id":"HARR-5.7-Q063","topic":"5.7 Enzymes and Cardiac Markers","question":"Which substrate is used in the Bowers–McComb method for ALP?","options":["p-Nitrophenyl phosphate","β-Glycerophosphate","Phenylphosphate","α-Naphthylphosphate"],"answer":"A","rationale":"The method of Bowers–McComb (Szasz modification)\nis the IFCC-recommended method for ALP. This\nmethod uses 2-amino-2-methyl-1-propanol, pH 10.15,\nand measures the increase in absorbance at 405 nm \nas p-nitrophenyl phosphate is hydrolyzed to \np-nitrophenol.","difficulty":1},{"id":"HARR-5.7-Q064","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following buffers is used in the IFCC recommended method for ALP?","options":["Glycine","Phosphate","2-Amino-2-methyl-1-propanol","Citrate"],"answer":"C","rationale":"The Szasz modification of the Bowers–McComb\nmethod measures the hydrolysis of \np-nitrophenyl phosphate, and continuously\nmonitors the formation of p-nitrophenol at 405 nm.\nAMP buffer chelates phosphorus, preventing\nproduct inhibition; Zn+2 and Mg+2 are added to \nthe substrate to activate ALP. HEDTA is used to\nchelate the excess Zn+2, which is inhibitory at \nhigh concentrations.","difficulty":3},{"id":"HARR-5.7-Q065","topic":"5.7 Enzymes and Cardiac Markers","question":"A serum ALP level greater than twice the elevation of GGT suggests:","options":["Misidentification of the specimen","Focal intrahepatic obstruction","Acute alcoholic hepatitis","Bone disease or malignancy"],"answer":"D","rationale":"In obstructive jaundice, GGT is elevated more than\nALP. A disproportionate increase in ALP points to a\nnonhepatic source of ALP, often bone disease. \nGGT is the most sensitive marker of acute alcoholic\nhepatitis, rising about fivefold higher than ALP or\ntransaminases.","difficulty":2},{"id":"HARR-5.7-Q066","topic":"5.7 Enzymes and Cardiac Markers","question":"In which condition is the measurement of acid phosphatase clinically useful?","options":["Measuring the prostatic isoenzyme to screen for prostate cancer","Measuring the enzyme in a vaginal swab extract","The diagnosis of hemolytic anemia","As a marker for bone regeneration"],"answer":"B","rationale":"The PSA test is clinically more sensitive than prostatic\nacid phosphatase in detecting prostatic cancer. \nThe clinical use of prostatic acid phosphatase is\nconfined to the investigation of sexual assault. \nAcid phosphatase activity > 50 IU/L establishes the\npresence of seminal fluid in the vaginal sample.\nTartrate-resistant acid phosphatase is used as a\ncytochemical marker for hairy-cell leukemia, and \nmay be measured in serum to identify diseases with\nincreased osteoclast activity, particularly malignancies\ninvolving bone.","difficulty":3},{"id":"HARR-5.7-Q067","topic":"5.7 Enzymes and Cardiac Markers","question":"Which definition best describes the catalytic activity of amylase?","options":["Hydrolyzes second α 1–4 glycosidic linkages of starch, glycogen, and other polyglucans","Hydrolyzes all polyglucans completely to produce glucose","Oxidatively degrades polysaccharides containing glucose","Splits polysaccharides and disaccharides by addition of water"],"answer":"A","rationale":"Amylase in humans is a hydrolase that splits the\nsecond α 1-4 glycosidic bonds of polyglucans\nforming maltose. There are two major types of\namylase: P-type derived from the pancreas and \nS-type derived from the salivary glands. These can\nbe differentiated by both electrophoresis and\nimmunoassay. In healthy persons, the principal\nform in plasma is the salivary isoenzyme. There are\nseveral genetic variants of the salivary isoenzyme,\nwhich in part accounts for the broad reference\nrange.","difficulty":3},{"id":"HARR-5.7-Q068","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following amylase substrates is recommended by the IFCC?","options":["Starch","Maltodextrose","Maltotetrose","Blocked maltohepatoside"],"answer":"D","rationale":"Amylase is commonly measured using synthetic\nsubstrates. In the IFCC-recommended method, \np-nitrophenyl maltohepatiside is used. One end of\nthe polymer is covalently linked to p-nitrophenol\nand the other is linked to 4,6 ethylidine to prevent\nits hydrolysis by α-glucosidase. Amylase hydrolyzes\nthe substrate from both ends producing fragments\nof 2, 3, and 4 glucose subunits. α-Glucosidase\nhydrolyzes the subunits containing p-nitrophenyl\ngroups, forming glucose and p-nitrophenol. The\nincrease absorbance at 405 nm is proportional to\namylase activity.","difficulty":2},{"id":"HARR-5.7-Q069","topic":"5.7 Enzymes and Cardiac Markers","question":"How soon following acute abdominal pain due to pancreatitis is the serum amylase expected to rise?","options":["1–2 hours","2–12 hours","3–4 days","5–6 days"],"answer":"B","rationale":"Serum amylase usually peaks 2–12 hours following\nacute abdominal pain resulting from pancreatitis.\nLevels reach 2–6 times the URL and return to normal\nwithin 3–4 days. Urinary amylase peaks concurrently\nwith serum but rises higher and remains elevated for\nup to 1 week.","difficulty":4},{"id":"HARR-5.7-Q070","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following statements regarding the diagnosis of pancreatitis is correct?","options":["Amylase and lipase are as predictive in chronic as in acute pancreatitis","Diagnostic sensitivity is increased by assaying both amylase and lipase","Measuring the urinary amylase:creatinine ratio is useful only when patients have renal failure","Serum lipase peaks several hours before amylase after an episode of acute pancreatitis"],"answer":"B","rationale":"Amylase is not increased in all persons with\npancreatitis and can be increased in several\nnonpancreatic conditions. Lipase adds both\nsensitivity and specificity to the diagnosis of acute\npancreatitis. Plasma or serum lipase becomes\nabnormal within 6 hours, peaks at approximately \n24 hours, and remains abnormal for about 1 week\nfollowing an episode of acute pancreatitis. In acute\npancreatitis, the rate of urinary amylase excretion\nincreases, and the amylase:creatinine clearance ratio\nis helpful in diagnosing some cases of pancreatitis.\nThe normal A:C clearance ratio is 1%–4%. In acute\npancreatitis, the ratio is usually above 4% and can \nbe as high as 15%. In chronic pancreatitis, acinar \ncell degeneration often occurs, resulting in loss of\namylase and lipase production. This lowers the\nsensitivity of amylase and lipase in detecting chronic\ndisease to below 50%. Patients with chronic disease\nhave pancreatic insufficiency giving rise to increased\nfecal fat, and decreased pancreatic digestive enzymes\nsuch as trypsin, chymotrypsin, and elastin.","difficulty":5},{"id":"HARR-5.7-Q071","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following conditions is associated with a high level of S-type amylase?","options":["Mumps","Intestinal obstruction","Alcoholic liver disease","Peptic ulcers"],"answer":"A","rationale":"Both salivary and pancreatic amylases designated \nS-type and P-type, respectively, are present in\nnormal serum. High amylase occurs in mumps,\nectopic pregnancy, biliary obstruction, peptic\nulcers, alcoholism, malignancies, and other\nnonpancreatic diseases. Isoenzymes can be\nseparated by electrophoresis (S-type is faster than\nP-type), but more commonly immunoinhibition \nof S-type amylase is used to rule out mumps,\nmalignancy, and ectopic pregnancy, which give \nrise to high S-type amylase.","difficulty":4},{"id":"HARR-5.7-Q072","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following statements regarding amylase methods is true?","options":["Requires sulfhydryl compounds for full activity","Activity will vary depending on the method used","Amyloclastic methods measure the production of glucose","Overrange samples are diluted in deionized water"],"answer":"B","rationale":"Chloride and Ca2+ ions are required for amylase\nactivity. Samples with high activity should be\ndiluted with NaCl to prevent inactivation. Lipase\nand CK require sulfhydryl activators. Saccharogenic\nmethods measure the production of glucose, \nwhile amyloclastic methods measure the\ndegradation of starch. Starch is a polymer of \nα-D glucose subunits linked together by both \nα 1-4 and α 1-6 glycosidic bonds. Different lots \nmay have more or less branching owing to the\nnumber of α 1-6 bonds. Since amylase hydrolyzes \nat the α 1-4 sites only, the amount of product\nmeasured is influenced by the extent of branching.","difficulty":2},{"id":"HARR-5.7-Q074","topic":"5.7 Enzymes and Cardiac Markers","question":"The reference method for lipase uses olive oil as the substrate because:","options":["Other esterases can hydrolyze triglyceride and synthetic diglycerides","The reaction product can be coupled to NADH generating reactions","Synthetic substrates are less soluble than olive oil in aqueous reagents","Triglyceride substrates cause product inhibition"],"answer":"A","rationale":"Triglycerides may be hydrolyzed by nonspecific\nesterases in serum as well as lipase. Lipase acts only \nat an interface of oil and H2O and requires bile salts\nand colipase for activity. Colipase is a protein secreted\nby the pancreas.","difficulty":2},{"id":"HARR-5.7-Q075","topic":"5.7 Enzymes and Cardiac Markers","question":"Which statement about the clinical utility of plasma or serum lipase is true?","options":["Lipase is not increased in mumps, malignancy, or ectopic pregnancy","Lipase is not increased as dramatically as amylase in acute pancreatitis","Increased plasma or serum lipase is specific for pancreatitis","Lipase levels are elevated in both acute and chronic pancreatitis"],"answer":"A","rationale":"Lipase elevation is of greater magnitude (2-50 × N)\nand duration than amylase in acute pancreatitis.\nWhen the lipase method is optimized by inclusion of\ncolipase and bile salts, the test is more sensitive and\nspecific than serum amylase for detection of acute\npancreatitis. However, lipase is also increased in\npeptic ulcers, renal insufficiency, and intestinal\nobstruction. Lipase levels are often low in chronic\npancreatitis, and are low in cystic fibrosis.","difficulty":4},{"id":"HARR-5.7-Q076","topic":"5.7 Enzymes and Cardiac Markers","question":"The reference method for serum lipase is based upon:","options":["Assay of triglycerides following incubation of serum with olive oil","Rate turbidimetry","Titration of fatty acids with dilute NaOH following controlled incubation of serum with olive oil","Immunochemical assay"],"answer":"C","rationale":"The reference method of Cherry and Crandall is based\nupon the titration of fatty acids formed by the\nhydrolysis of an emulsion of olive oil after incubation\nfor 24 hours at 37°C. Because most of the activity\noccurs within the first 3 hours, the incubation time\nmay be shortened to as little as 1 hour without loss \nof clinical utility.","difficulty":3},{"id":"HARR-5.7-Q077","topic":"5.7 Enzymes and Cardiac Markers","question":"The most commonly employed method of assay for plasma or serum lipase is based on:","options":["Hydrolysis of olive oil","Rate turbidimetry","Immunoassay","Peroxidase coupling"],"answer":"D","rationale":"Although all of the methods cited are available, the\nmost commonly used method for lipase assay is\nbased upon the hydrolysis of a synthetic diglyceride\nsubstrate yielding 2-monoglyceride. This is hydrolyzed\nand forms glycerol, which is phosphorylated and\nforms glycerol-3-phosphate. This is oxidized by\nglycerophosphate oxidase, yielding hydrogen\nperoxide.","difficulty":3},{"id":"HARR-5.7-Q078","topic":"5.7 Enzymes and Cardiac Markers","question":"Which of the following enzymes is usually depressed in liver disease?","options":["Elastase-1","GLD","Pseudocholinesterase","Aldolase"],"answer":"C","rationale":"Pseudocholinesterase is found mainly in the \nliver and functions to hydrolyze acetylcholine. It \nis depressed by organophosphate insecticides \nand drugs that function as cholinesterase inhibitors\nand the serum assay is used to presumptively\nidentify cases of insecticide poisoning. Levels of\npseudocholinesterase are decreased in patients\nwith liver disease as a result of depressed synthesis.\nIn cirrhosis and hepatoma, there is a 50%–70%\nreduction in serum level and a 30%–50% reduction\nin hepatitis. Elastase-1 is a pancreatic digestive\nenzyme that breaks down connective tissue\nprotein. Its level in feces is reduced in persons \nwith pancreatic insufficiency. GLD is increased \nin necrotic jaundice, and aldolase in necrotic\njaundice and muscle disease.","difficulty":3},{"id":"HARR-5.7-Q079","topic":"5.7 Enzymes and Cardiac Markers","question":"Which enzyme is most likely to be elevated in the plasma of a person suffering from a muscle wasting disorder?","options":["5 ́-Nucleotidase","Pseudocholinesterase","Aldolase","Glutamate dehydrogenase"],"answer":"C","rationale":"5‘-Nucleotidase is increased primarily in obstructive\nliver disease and liver cancer. When elevated along\nwith ALP, it identifies the liver as the source of ALP.\nGlutamate dehydrogenase is increased in necrotic\nliver diseases along with transaminases, but because\nof its distribution it is elevated to a greater extent in\ntoxic hepatitis and therefore is useful as a marker for\nhalothane (anesthesia) toxicity. Aldolase is found in all\ntissues and is increased in many conditions including\nmyocardial infarction, viral hepatitis, and myelocytic\nleukemia. However, like CK, the greatest increase is\nseen in skeletal muscle-wasting disease such as\nmuscular dystrophies.","difficulty":5},{"id":"HARR-5.7-Q080","topic":"5.7 Enzymes and Cardiac Markers","question":"Which enzyme is measured in whole blood?","options":["Chymotrypsin","Glucose-6-phosphate dehydrogenase","Glycogen phosphorylase","Lipase"],"answer":"B","rationale":"Glucose-6-phosphate dehydrogenase deficiency is\nthe most common inherited RBC enzyme deficiency\nand is X linked. The enzyme is measured on a whole-\nblood hemolysate using glucose-6-phosphate as the\nsubstrate, and forms 6-phosphogluconate as NADP+\nis converted to NADPH. Persons with the deficiency\nare prone to a hemolytic episode upon exposure to\ncertain oxidative drugs and fava beans and as a result\nof infections. Heinz bodies form in the RBCs, bite cells\nare seen in the circulation, and plasma haptoglobin is\nreduced in severe cases.","difficulty":1},{"id":"HARR-5.8-Q001","topic":"5.8 Clinical Endocrinology","question":"Which of the following hormones is often decreased by approximately 25% in the serum of pregnant women who have a fetus with Down syndrome?","options":["Estriol (E3)","Human chorionic gonadotropin (hCG)","Progesterone","Estradiol (E2)"],"answer":"A","rationale":"E3 is produced in the placenta and fetal liver from\ndehydroepiandrosterone derived from the mother\nand fetal liver. E3 is the major estrogen produced\nduring pregnancy, and levels rise throughout\ngestation. Serum free E3 is often lower than expected\nfor the gestational age in a pregnancy associated\nwith Down syndrome. The combination of low serum\nfree estriol, low-α fetoprotein, high hCG, and high-\ninhibin A is used as a screening test to detect Down\nsyndrome. When one of the four markers is abnormal,\namniocentesis should be performed for the diagnosis\nof Down syndrome by karyotyping or FISH. The four\nmarkers have a combined sensitivity (detection rate)\nof approximately 75%.","difficulty":5},{"id":"HARR-5.8-Q002","topic":"5.8 Clinical Endocrinology","question":"The syndrome of inappropriate antidiuretic hormone secretion (SIADH) causes:","options":["Low serum vasopressin","Hypernatremia","Urine osmolality to be lower than plasma","Low serum electrolytes"],"answer":"D","rationale":"SIADH results in excessive secretion of vasopressin\n(ADH) from the posterior pituitary, causing fluid\nretention and low plasma osmolality, sodium,\npotassium, and other electrolytes by hemodilution. It\nis suspected when urine osmolality is higher than\nplasma, but urine sodium concentration is normal or\nincreased. Patients with sodium depletion have a\nurine osmolality higher than plasma, but low urine\nsodium.","difficulty":2},{"id":"HARR-5.8-Q003","topic":"5.8 Clinical Endocrinology","question":"Select the hormone which when elevated is associated with galactorrhea, pituitary adenoma, and amenorrhea.","options":["E2","Progesterone","Follicle-stimulating hormone (FSH)","Prolactin"],"answer":"D","rationale":"Serum prolactin may be increased from hypothalamic\ndysfunction or pituitary adenoma. When levels are\ngreater than five times the URL, a pituitary tumor is\nsuspected. Prolactin is measured by enzyme\nimmunoassay (EIA).","difficulty":1},{"id":"HARR-5.8-Q004","topic":"5.8 Clinical Endocrinology","question":"Zollinger–Ellison (Z–E) syndrome is characterized by great (e.g., 20-fold) elevation of:","options":["Gastrin","Cholecystokinin","Pepsin","Glucagon"],"answer":"A","rationale":"Z–E syndrome is caused by a pancreatic or intestinal\ntumor secreting gastrin (gastrinoma), and results in\ngreatly increased gastric acid production. A serum\ngastrin level 10-fold greater than the URL in a person\nwith hyperacidity and stomach or duodenal ulcers is\ndiagnostic. Confirmation of gastric hyperacidity is\ndemonstrated using the basal acid output (BAO) test.","difficulty":3},{"id":"HARR-5.8-Q005","topic":"5.8 Clinical Endocrinology","question":"Which statement about multiple endocrine neoplasia (MEN) is true?","options":["It is associated with hyperplasia or neoplasia of at least two endocrine organs","Insulinoma is always present when the pituitary is involved","It is inherited as an autosomal recessive disorder","Plasma hormone levels from affected organs are elevated at least 10-fold"],"answer":"A","rationale":"Multiple-endocrine neoplasia syndrome is inherited\nas an autosomal dominant disease involving excess\nproduction of hormones from several endocrine\nglands. MEN I results from adenomas (usually benign)\nof at least two glands, including the pituitary, adrenal\ncortex, parathyroid, and pancreas. The parathyroid\ngland is the organ most commonly involved, and in\nthose patients an elevated Cai is an early sign. The\npancreas is the next most frequently involved organ,\nbut the hormone most commonly oversecreted \nis gastrin (not insulin). MEN II is characterized by\npheochromocytoma and thyroid carcinoma. MEN II-B\nis a variant of MEN II showing the addition of\nneurofibroma.","difficulty":2},{"id":"HARR-5.8-Q006","topic":"5.8 Clinical Endocrinology","question":"Select the main estrogen produced by the ovaries and used to evaluate ovarian function.","options":["Estriol (E3 )","Estradiol (E2 )","Epiestriol","Hydroxyestrone"],"answer":"B","rationale":"E2 is the major estrogen produced by the ovaries and\ngives rise to both estrone (E1) and E3. E2 is used to\nevaluate both ovarian function and menstrual cycle\ndysfunction.","difficulty":1},{"id":"HARR-5.8-Q007","topic":"5.8 Clinical Endocrinology","question":"Which statement best describes the relationship between luteinizing hormone (LH) and follicle- stimulating hormone (FSH) in cases of dysmenorrhea?","options":["Both are usually increased when there is pituitary adenoma","Increases in both hormones and a decrease in estrogen signal a pituitary cause of ovarian failure","Both hormones normally peak 1–2 days before ovulation","In menopause, the LH level at the midcycle peak is higher than the level of FSH"],"answer":"C","rationale":"In women, serum or urine LH and FSH are measured\nalong with estrogen and progesterone to evaluate\nthe cause of menstrual cycle abnormalities and\nanovulation. Both hormones show a pronounced\nserum peak 1–2 days prior to ovulation and urine\npeak 20–44 hours before ovulation. Normally, the \nLH peak is sharper and greater than the FSH peak;\nhowever, in menopause, the FSH usually becomes\nhigher than LH. In patients with primary ovarian\nfailure, the LH and FSH are elevated because low\nestrogen levels stimulate release of luteinizing\nhormone-releasing hormone (LHRH) from the\nhypothalamus. Conversely, in pituitary failure, levels\nof FSH and LH are reduced, and this reduction causes\na deficiency of estrogen production by the ovaries.","difficulty":5},{"id":"HARR-5.8-Q008","topic":"5.8 Clinical Endocrinology","question":"When pituitary adenoma is the cause of decreased estrogen production, an increase of which hormone is most frequently responsible?","options":["Prolactin","FSH","LH","Thyroid-stimulating hormone (TSH)"],"answer":"A","rationale":"Prolactinoma can result in anovulation because\nhigh levels of prolactin suppress release of LHRH\n(gonadotropin-releasing hormone), causing\nsuppression of growth hormone (GH), FSH, and\nestrogen. Prolactinoma is the most commonly\noccurring pituitary tumor accounting for 40%–60%.\nAdenomas producing FSH have a frequency of\nabout 20%, while those pituitary tumors secreting\nLH and TSH are rare.","difficulty":3},{"id":"HARR-5.8-Q009","topic":"5.8 Clinical Endocrinology","question":"Which set of results is most likely in an adult male with primary testicular failure?","options":["Increased LH, FSH, and decreased testosterone","Decreased LH, FSH, and testosterone","Decreased testosterone, androstenedione, and FSH","Increased androstenedione, decreased testosterone, and normal FSH"],"answer":"A","rationale":"Primary testicular failure produces a picture that is\nhypergonadotropic. The LH and FSH are increased\nbecause the pituitary gland is normal and responds\nto decreased free testosterone. Androstenedione \nis an adrenal androgen and is unaffected. In\ntesticular failure secondary to pituitary deficiency\n(hypogonadotropic testicular failure), the LH, FSH,\nand testosterone are low.","difficulty":4},{"id":"HARR-5.8-Q010","topic":"5.8 Clinical Endocrinology","question":"When should progesterone be measured when evaluating an adult female for anovulation?","options":["At the onset of menses","During the first 7 days of the menstrual cycle","At the midcycle just after LH peaks","At the end of the menstrual cycle"],"answer":"C","rationale":"Progesterone is often measured along with LH, FSH,\nestrogen, and prolactin to evaluate female infertility\nand dysmenorrhea. Progesterone is produced by the\ncorpus luteum and levels are very low during the\nearly follicular phase of the cycle. Progesterone is\nreleased by the corpus luteum following the LH surge\nthat occurs 1–2 days prior to ovulation and is an\nindication that ovulation occurred. Low progesterone\nat midcycle indicates that ovulation did not occur.\nThis is often the case in polyovarian cyst syndrome.","difficulty":3},{"id":"HARR-5.8-Q011","topic":"5.8 Clinical Endocrinology","question":"A female with severe excessive pubic and facial hair growth (hirsutism) should be tested for which of the following hormones?","options":["Estrogen and progesterone","Chorionic gonadotropin","Growth hormone","Testosterone and dehydroepiandrosterone sulfate"],"answer":"D","rationale":"Excessive hair grown in females results from excessive\nandrogen production, and is most commonly seen in\npolycystic ovarian syndrome, which produces high\nlevels of ovarian-derived testosterone. It will also occur\nas a consequence of Cushing’s syndrome and mild\ncongenital adrenal hyperplasia. Therefore, cortisol and\n17 α-hydroxyprogesterone can help identify those\ncauses. Rapid onset of hirsutism can result from an\novarian or adrenal tumor. Dehydroepiandrosterone\nsulfate is produced only by the adrenals and would be\nuseful in identifying those rare cases where the cause\nis an androgen-secreting adrenal tumor.","difficulty":4},{"id":"HARR-5.8-Q012","topic":"5.8 Clinical Endocrinology","question":"Which set of results is most likely in a female with hypogonadotropic ovarian failure?","options":["Increased LH, FSH, and estrogen","Decreased LH, FSH, and estrogen","Decreased prolactin and estrogen","Increased LH and FSH, and decreased estrogen"],"answer":"B","rationale":"Hypogonadotropic ovarian failure is the result of\npituitary dysfunction. It may be caused by low levels\nof both LH and FSH, or it may be caused by high\nlevels of prolactin as in prolactinoma, since prolactin\nwill inhibit LHRH and result in low LH and FSH.","difficulty":4},{"id":"HARR-5.8-Q013","topic":"5.8 Clinical Endocrinology","question":"The onset of menopause is usually associated with what hormone changes?","options":["Decreased estrogen, testosterone, and androgens","Decreased estrogen, FSH, LH, and progesterone","Decreased estrogen and progesterone, and increased LH and FSH","Decreased estrogen and progesterone, normal LH and FSH"],"answer":"C","rationale":"In menopause, estrogen production decreases to\nwhere the menstrual cycle and ovarian follicle\nmaturation stop. The decreased estrogen causes the\npituitary release of LH and FSH. In menopause, the FSH\nat midcycle is higher than LH. The increased LH causes\nthe ovaries to secrete testosterone and androgens.","difficulty":1},{"id":"HARR-5.8-Q014","topic":"5.8 Clinical Endocrinology","question":"Which of the following statements is correct in assessing GH deficiency?","options":["Pituitary failure may involve one, several, or all adenohypophyseal hormones; but GH deficiency is usually found","A normal random serum level of GH in a child under 6 years old rules out GH deficiency","Administration of arginine, insulin, or glucagon will suppress GH release","GH levels in the blood show little variation within a 24-hour period"],"answer":"A","rationale":"Because GH is the most abundant pituitary hormone,\nit may be used as a screening test for pituitary failure\nin adults. Pituitary hormone deficiencies are rare \nand are evaluated by measuring those hormones\nassociated with the specific type of target organ\ndysfunction. GH secretion peaks during sleep, and\npulsed increases are seen following exercise and\nmeals. In adults, a deficiency of GH can be ruled out\nby demonstrating normal or high levels on two\nsuccessive tests. In children, there is extensive overlap\nbetween normal and low GH levels, and a stimulation\n(provocative) test is usually needed to establish a\ndiagnosis of deficiency. Exercise is often used to\nstimulate GH release. If GH levels are greater than \n6 μg/L after vigorous exercise, then deficiency is ruled\nout. In addition to exercise, drugs such as arginine,\ninsulin, propranolol, and glucagon can be used to\nstimulate GH release. Deficiency is documented by\nregistering a subnormal response to two stimulating\nagents.","difficulty":4},{"id":"HARR-5.8-Q015","topic":"5.8 Clinical Endocrinology","question":"Which statement best describes the level of GH in patients with pituitary adenoma associated with acromegaly?","options":["The fasting GH level is always elevated at least twofold","Some patients will require a glucose suppression test to establish a diagnosis","A normal fasting GH level rules out acromegaly","Patients produce a lower concentration of insulin-like growth factor I (IGF-1) than expected from their GH level"],"answer":"B","rationale":"Approximately 90% of patients with acromegaly will\nhave an elevated fasting GH level, but 10% will not. In\naddition, a single measurement is not sufficient to\nestablish a diagnosis of acromegaly because various\nmetabolic and nutritional factors can cause an\nelevated serum GH in the absence of pituitary\ndisease. The glucose suppression test is used to\ndiagnose acromegaly. An oral dose of 100 g of\nglucose will suppress the serum GH level at 1 hour\n(postadministration) to below 1 μg/L in normal\npatients, but not in patients with acromegaly. Patients\nwith acromegaly also have high levels of IGF-1, also\ncalled somatomedin C, which is overproduced by the\nliver in response to excess release of GH.","difficulty":5},{"id":"HARR-5.8-Q016","topic":"5.8 Clinical Endocrinology","question":"Hyperparathyroidism is most consistently associated with:","options":["Hypocalcemia","Hypocalciuria","Hypophosphatemia","Metabolic alkalosis"],"answer":"C","rationale":"Hyperparathyroidism causes increased resorption of\ncalcium and decreased renal retention of phosphate.\nIncreased serum calcium leads to increased urinary\nexcretion. The distal collecting tubule of the nephron\nreabsorbs less bicarbonate as well as phosphate,\nresulting in acidosis.","difficulty":1},{"id":"HARR-5.8-Q017","topic":"5.8 Clinical Endocrinology","question":"Which statement regarding the use of PTH is true?","options":["Determination of serum PTH level is the best screening test for disorders of calcium metabolism","PTH levels differentiate primary and secondary causes of hypoparathyroidism","PTH levels differentiate primary and secondary causes of hypocalcemia","PTH levels are low in patients with pseudohypoparathyroidism"],"answer":"C","rationale":"Serum Cai is the best screening test to determine if a\ndisorder of calcium metabolism is present, and will\ndistinguish primary hyperparathyroidism (high Cai)\nand secondary hyperparathyroidism (low Cai). PTH\nlevels are used to distinguish primary and secondary\ncauses of hypocalcemia. Serum PTH is low in primary\nhypocalcemia (which results from parathyroid gland\ndisease), but is high in secondary hypocalcemia \n(e.g., renal failure). Serum PTH is also used for the \nearly diagnosis of secondary hypocalcemia \nbecause PTH levels rise prior to a decrease in the\nserum Cai. Serum PTH is used to help distinguish\nprimary hyperparathyroidism (high PTH) and\nhypercalcemia of malignancy (usually low PTH), \nand pseudohypoparathyroidism from primary\nhypoparathyroidism. Pseudohypoparathyroidism\nresults from a deficient response
