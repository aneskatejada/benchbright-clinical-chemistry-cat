rong{font-size:30px;line-height:1;display:block;color:var(--navy)}.stat small{font-size:12px;color:var(--muted);display:block;margin-top:9px}.content{padding:34px 46px 42px}h2{font-size:24px;letter-spacing:-.03em;margin:0 0 16px}h3{font-size:18px;margin:0}.features{display:grid;grid-template-columns:1fr 1fr;gap:13px 22px;margin:23px 0 28px}.feature{display:flex;gap:11px;align-items:flex-start;line-height:1.5;font-size:14px}.check{flex:none;border-radius:50%;background:#d9f5ed;color:var(--green);width:25px;height:25px;display:grid;place-items:center;font-weight:850}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:16px}.btn{background:var(--teal);color:white;padding:14px 24px;border:1px solid var(--teal);border-radius:12px;font-size:15px;font-weight:760;box-shadow:0 7px 16px rgba(8,127,132,.14)}.btn:hover:not(:disabled){background:#05686f}.btn.secondary{color:var(--navy);background:white;border-color:#aac4d1;box-shadow:none}.btn.secondary:hover:not(:disabled){background:#edf7f8}.note{margin-top:22px;color:var(--muted);font-size:12px;line-height:1.65}.footer{color:var(--muted);text-align:center;font-size:12px;line-height:1.6;margin-top:28px}.badge{display:inline-block;color:var(--teal);background:#e3f5f2;padding:7px 11px;border-radius:99px;font-size:11px;font-weight:850;letter-spacing:.05em}.examhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.examhead b{font-size:15px;color:var(--navy)}.progress{background:#eaf1f5;height:9px;border-radius:20px;overflow:hidden;margin-bottom:30px}.progress >div{height:100%;background:linear-gradient(90deg,#088991,#5ed5bc);transition:width .3s}.prompt{font-size:clamp(20px,3vw,29px);font-weight:760;line-height:1.36;white-space:pre-line;margin:21px 0 25px;letter-spacing:-.015em}.option{width:100%;text-align:left;background:white;border:1.5px solid var(--border);border-radius:13px;display:flex;gap:17px;align-items:flex-start;padding:17px 19px;margin:12px 0;color:var(--ink);line-height:1.5;transition:.15s}.option:hover{border-color:#6bbebc;background:#f2fbf9}.option.selected{border-color:#0a7d83;background:#e6f6f3;box-shadow:0 0 0 2px rgba(14,131,137,.11)}.option .letter{flex:0 0 28px;height:28px;border:1px solid #bdd2d7;border-radius:7px;display:grid;place-items:center;font-weight:750;color:var(--teal)}.option.selected .letter{background:var(--teal);border-color:var(--teal);color:white}.examfoot{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:25px}.muted{color:var(--muted);font-size:12px}.results-top{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:10px 0 30px}.resultbox{background:#f2f8fa;border:1px solid var(--border);border-radius:14px;padding:20px}.resultbox strong{display:block;color:var(--navy);font-size:29px}.resultbox small{display:block;font-size:12px;color:var(--muted);margin-top:5px}.results-table{width:100%;border-collapse:collapse;margin:18px 0 26px;font-size:13px}.results-table th{text-align:left;background:#ecf4f6;color:var(--navy)}.results-table th,.results-table td{padding:13px 12px;border-bottom:1px solid var(--border)}.topic-label{font-size:12px;color:var(--muted)}.review{margin-top:16px}.review details{border:1px solid var(--border);border-radius:12px;margin:9px 0;background:#fff;overflow:hidden}.review summary{cursor:pointer;padding:16px 19px;font-weight:680;line-height:1.35}.review .answerbody{padding:0 20px 19px;line-height:1.6;font-size:14px}.review .answerbody p{margin:7px 0}.good{color:var(--green)}.bad{color:var(--red)}.review-question{font-weight:650;white-space:pre-line}.review-options{padding-left:20px;margin:12px 0}.review-options li{margin:5px 0}.mini-line{font-size:12px;color:var(--muted)}.chartbar{background:#e9eff2;height:8px;width:100%;border-radius:10px;overflow:hidden}.chartbar>i{height:100%;display:block;background:var(--teal);border-radius:10px}.alert{background:#fff9e8;border:1px solid #f3df9c;border-radius:12px;color:#785d19;padding:13px 15px;font-size:1 <script type="application/json" id="question-data">{"version":"9d5859c66245f8","questions":[{"id":"HARR-5.1-Q001","topic":"5.1 Instrumentation","question":"Which formula correctly describes the relationship between absorbance and %T ?","options":["A = 2 – log %T","A = log 1/T","A = –log T","All of these options"],"answer":"D","rationale":"Absorbance is proportional to the inverse log of\ntransmittance.","difficulty":1},{"id":"HARR-5.1-Q002","topic":"5.1 Instrumentation","question":"A solution that has a transmittance of 1.0 %T would have an absorbance of:","options":["1.0","2.0","1%","99%"],"answer":"B","rationale":"A = 2.0 – log %T\nA = 2.0 – log 1.0\nThe log of 1.0 = 0\nA = 2.0","difficulty":2},{"id":"HARR-5.1-Q003","topic":"5.1 Instrumentation","question":"In absorption spectrophotometry:","options":["Absorbance is directly proportional to transmittance","Percent transmittance is directly proportional to concentration","Percent transmittance is directly proportional to the light path length","Absorbance is directly proportional to concentration"],"answer":"D","rationale":"Beer’s law states that A = a × b × c, where a is the\nabsorptivity coefficient (a constant), b is the path\nlength, and c is concentration. Absorbance is directly\nproportional to both b and c. Doubling the path\nlength results in incident light contacting twice \nthe number of molecules in solution. This causes\nabsorbance to double, the same effect as doubling\nthe concentration of molecules.","difficulty":1},{"id":"HARR-5.1-Q004","topic":"5.1 Instrumentation","question":"Which wavelength would be absorbed strongly by a red-colored solution?","options":["450 nm","585 nm","600 nm","650 nm"],"answer":"A","rationale":"A solution transmits light corresponding in\nwavelength to its color, and usually absorbs light \nof wavelengths complementary to its color. A \nred solution transmits light of 600–650 nm and\nstrongly absorbs 400–500 nm light.","difficulty":1},{"id":"HARR-5.1-Q005","topic":"5.1 Instrumentation","question":"A green-colored solution would show highest transmittance at:","options":["475 nm","525 nm","585 nm","620 nm"],"answer":"B","rationale":"Green light consists of wavelengths from 500–550 nm.\nA green-colored solution with a transmittance\nmaximum of 525 nm and a 50-nm bandpass transmits\nlight of 525 nm and absorbs light below 475 nm \nand above 575 nm. A solution that is green would \nbe quantitated using a wavelength that it absorbs\nstrongly, such as 450 nm.","difficulty":2},{"id":"HARR-5.1-Q006","topic":"5.1 Instrumentation","question":"SITUATION: A technologist is performing an enzyme assay at 340 nm using a visible-range spectrophotometer. After setting the wavelength and adjusting the readout to zero %T with the light path blocked, a cuvette with deionized water is inserted. With the light path fully open and the 100%T control at maximum, the instrument readout will not rise above 90%T. What is the most appropriate first course of action?","options":["Replace the source lamp","Insert a wider cuvette into the light path","Measure the voltage across the lamp terminals","Replace the instrument fuse"],"answer":"A","rationale":"Visible spectrophotometers are usually supplied\nwith a tungsten or quartz halogen source lamp.\nTungsten lamps produce a continuous range of\nwavelengths from about 320–2,000 nm. Output\nincreases as wavelength becomes longer peaking \nat around 1,000 nm, and is poor below 400 nm. As\nthe lamp envelope darkens with age, the amount \nof light reaching the photodetector at 340 nm\nbecomes insufficient to set the blank reading to\n100%T. Quartz halogen lamps produce light from\n300 nm through the infrared region. Deuterium or\nhydrogen lamps produce ultraviolet-rich spectra\noptimal for ultraviolet (UV) work. Mercury vapor\nlamps produce a discontinuous spectrum that\nincludes a high output at around 365 nm that is\nuseful for fluorescent applications. Xenon lamps\ngenerate a continuous spectrum of fairly uniform\nintensity from 300–2,000 nm, making them useful\nfor both visible and UV applications.","difficulty":5},{"id":"HARR-5.1-Q007","topic":"5.1 Instrumentation","question":"Which type of monochromator produces the purest monochromatic light in the UV range?","options":["A diffraction grating and a fixed exit slit","A sharp cutoff filter and a variable exit slit","Interference filters and a variable exit slit","A prism and a variable exit slit"],"answer":"D","rationale":"Diffraction gratings and prisms both produce a\ncontinuous range of wavelengths. A diffraction\ngrating produces a uniform separation of\nwavelengths. A prism produces much better\nseparation of high-frequency light because\nrefraction is greater for higher-energy wavelengths.\nInstruments using a prism and a variable exit slit \ncan produce UV light of a very narrow bandpass.\nThe adjustable slit is required in order to allow\nsufficient light to reach the detector to set 100%T.","difficulty":4},{"id":"HARR-5.1-Q008","topic":"5.1 Instrumentation","question":"Which monochromator specification is required in order to measure the true absorbance of a compound having a natural absorption bandwidth of 30 nm?","options":["50-nm bandpass","25-nm bandpass","15-nm bandpass","5-nm bandpass"],"answer":"D","rationale":"Bandpass refers to the range of wavelengths passing\nthrough the sample. The narrower the bandpass, the\ngreater the photometric resolution. Bandpass can \nbe made smaller by reducing the width of the exit \nslit. Accurate absorbance measurements require a\nbandpass less than one-fifth the natural bandpass \nof the chromophore.","difficulty":4},{"id":"HARR-5.1-Q009","topic":"5.1 Instrumentation","question":"Which photodetector is most sensitive to low levels of light?","options":["Barrier layer cell","Photodiode","Diode array","Photomultiplier tube"],"answer":"D","rationale":"The photomultiplier tube uses dynodes of increasing\nvoltage to amplify the current produced by the\nphotosensitive cathode. It is 10,000 times as sensitive\nas a barrier layer cell, which has no amplification. A\nphotomultiplier tube requires a DC-regulated lamp\nbecause it responds to light fluctuations caused by\nthe AC cycle.","difficulty":3},{"id":"HARR-5.1-Q010","topic":"5.1 Instrumentation","question":"Which condition is a common cause of stray light?","options":["Unstable source lamp voltage","Improper wavelength calibration","Dispersion from second-order spectra","Misaligned source lamp"],"answer":"C","rationale":"Stray light is caused by the presence of any light\nother than the wavelength of measurement reaching\nthe detector. It is most often caused by second-order\nspectra, deteriorated optics, light dispersed by a\ndarkened lamp envelope, and extraneous room \nlight.","difficulty":1},{"id":"HARR-5.1-Q011","topic":"5.1 Instrumentation","question":"A linearity study is performed on a visible spectrophotometer at 650 nm and the following absorbance readings are obtained: The study was repeated using freshly prepared standards and reagents, but results were identical to those shown. What is the most likely cause of these results?","options":["Wrong wavelength used","Insufficient chromophore concentration","Matrix interference","Stray light"],"answer":"D","rationale":"Stray light is the most common cause of loss of\nlinearity at high-analyte concentrations. Light\ntransmitted through the cuvette is lowest when\nabsorption is highest. Therefore, stray light is a greater\npercentage of the detector response when sample\nconcentration is high. Stray light is usually most\nsignificant when measurements are made at the\nextremes of the visible spectrum because lamp\noutput and detector response are low.","difficulty":5},{"id":"HARR-5.1-Q012","topic":"5.1 Instrumentation","question":"Which type of filter is best for measuring stray light?","options":["Wratten","Didymium","Sharp cutoff","Neutral density"],"answer":"C","rationale":"Sharp cutoff filters transmit almost all incident light\nuntil the cutoff wavelength is reached. At that point,\nthey cease to transmit light. Because they give an\n“all or none effect,” only stray light reaches the\ndetector when the selected wavelength is beyond\nthe cutoff.","difficulty":1},{"id":"HARR-5.1-Q013","topic":"5.1 Instrumentation","question":"Which of the following materials is best suited for verifying the wavelength calibration of a spectrophotometer?","options":["Neutral density filters","Potassium dichromate solutions traceable to the National Bureau of Standards reference","Wratten filters","Holmium oxide glass"],"answer":"D","rationale":"Wavelength accuracy is verified by determining \nthe wavelength reading that gives the highest\nabsorbance (or transmittance) when a substance\nwith a narrow natural bandpass (sharp absorbance\nor transmittance peak) is scanned. For example,\ndidymium glass has a sharp absorbance peak at \n585 nm. Therefore, an instrument should give its\nhighest absorbance reading when the wavelength\ndial is set at 585 nm. Holmium oxide produces a\nvery narrow absorbance peak at 361 nm; likewise,\nthe hydrogen lamp of a UV spectrophotometer\nproduces a 656-nm emission line that can be used\nto verify wavelength. Neutral density filters and\ndichromate solutions are used to verify absorbance\naccuracy or linearity. A Wratten filter is a wide-\nbandpass filter made by placing a thin layer of\ncolored gelatin between two glass plates and is\nunsuitable for spectrophotometric calibration.","difficulty":5},{"id":"HARR-5.1-Q014","topic":"5.1 Instrumentation","question":"Why do many optical systems in chemistry analyzers utilize a reference light path?","options":["To increase the sensitivity of the measurement","To minimize error caused by source lamp fluctuation","To obviate the need for wavelength adjustment","To reduce stray light effects"],"answer":"B","rationale":"A reference beam is used to produce an electrical\nsignal at the detector to which the measurement of\nlight absorption by the sample is compared. This\nsafeguards against measurement errors caused\npower fluctuations that change the source lamp\nintensity. Although reference beams increase \nthe accuracy of measurements, they do so at the\nexpense of optical sensitivity since some of \nthe incident light must be used to produce the\nreference beam.","difficulty":2},{"id":"HARR-5.1-Q015","topic":"5.1 Instrumentation","question":"Which component is required in a spectrophotometer in order to produce a spectral absorbance curve?","options":["Multiple monochromators","A reference optical beam","Photodiode array","Laser light source"],"answer":"C","rationale":"There are two ways to perform spectral scanning for\ncompound identification. One is to use a stepping\nmotor that continuously turns the monochromator so\nthat the wavelength aligned with the exit slit changes\nat a constant rate. A more practical method is to use a\ndiode array detector. This consists of a chip embedded\nwith as many as several hundred photodiodes. Each\nphotodiode is aligned with a narrow part of the\nspectrum produced by a diffraction grating, and\nproduces current proportional to the intensity of the\nband of light striking it (usually 1–2 nm in range). The\ndiode signals are processed by a computer to create a\nspectral absorbance or transmittance curve.","difficulty":5},{"id":"HARR-5.1-Q016","topic":"5.1 Instrumentation","question":"The half-band width of a monochromator is defined by:","options":["The range of wavelengths passed at 50% maximum transmittance","One-half the lowest wavelength of optical purity","The wavelength of peak transmittance","One-half the wavelength of peak absorbance"],"answer":"A","rationale":"Half-band width is a measure of bandpass made \nusing a solution or filter having a narrow natural\nbandpass (transmittance peak). The wavelength\ngiving maximum transmittance is set to 100%T\n(or 0 A). Then, the wavelength dial is adjusted\ndownward, until a readout of 50%T (0.301 A) is\nobtained. Next, the wavelength is adjusted upward\nuntil 50%T is obtained. The wavelength difference is\nthe half-band width. The narrower the half-band\nwidth, the better the photometric resolution of the\ninstrument.","difficulty":1},{"id":"HARR-5.1-Q017","topic":"5.1 Instrumentation","question":"The reagent blank corrects for absorbance caused by:","options":["The color of reagents","Sample turbidity","Bilirubin and hemolysis","All of these options"],"answer":"A","rationale":"When a spectrophotometer is set to 100%T with the\nreagent blank instead of water, the absorbance of\nreagents is automatically subtracted from each\nunknown reading. The reagent blank does not\ncorrect for absorbance caused by interfering\nchromogens in the sample such as bilirubin,\nhemolysis, or turbidity.","difficulty":1},{"id":"HARR-5.1-Q018","topic":"5.1 Instrumentation","question":"A plasma sample is hemolyzed and turbid. What is required to perform a sample blank in order to correct the measurement for the intrinsic absorbance of the sample when performing a spectrophotometric assay?","options":["Substitute deionized water for the sample","Dilute the sample 1:2 with a standard of known concentration","Substitute saline for the reagent","Use a larger volume of the sample"],"answer":"C","rationale":"A sample blank is used to subtract the intrinsic\nabsorbance of the sample usually caused by\nhemolysis, icterus, turbidity, or drug interference. \nOn automated analyzers, this is accomplished by\nmeasuring the absorbance after the addition of\nsample and a first reagent, usually a diluent. For \ntests using a single reagent, sample blanking can be\ndone prior to the incubation phase before any color\ndevelops. Substituting deionized water for sample \nis done to subtract the absorbance of the reagent\n(reagent blanking). Diluting the sample with a\nstandard (standard addition) may be done when the\nabsorbance is below the minimum detection limit \nfor the assay. Using a larger volume of sample will\nmake the interference worse.","difficulty":5},{"id":"HARR-5.1-Q019","topic":"5.1 Instrumentation","question":"Which instrument requires a highly regulated DC power supply?","options":["A spectrophotometer with a barrier layer cell","A colorimeter with multilayer interference filters","A spectrophotometer with a photomultiplier tube","A densitometer with a photodiode detector"],"answer":"C","rationale":"When AC voltage regulators are used to isolate\nsource lamp power, light output fluctuates as the\nvoltage changes. Because this occurs at 60 Hz, it is\nnot detected by eyesight or slow-responding\ndetectors. Photomultiplier tubes are sensitive \nenough to respond to the AC frequency and require \na DC-regulated power supply.","difficulty":2},{"id":"HARR-5.1-Q020","topic":"5.1 Instrumentation","question":"Which statement regarding reflectometry is true?","options":["The relation between reflectance density and concentration is linear","Single-point calibration can be used to determine concentration","100% reflectance is set with an opaque film called a white reference","The diode array is the photodetector of choice"],"answer":"C","rationale":"Reflectometry does not follow Beer’s law, but the\nrelationship between concentration and reflectance\ncan be described by a logistic formula or algorithm\nthat can be solved for concentration. For example, \nK/S = (1 – R)2/2R, where K = Kubelka–Munk absorptivity\nconstant, S = scattering coefficient, R = reflectance\ndensity. K/S is proportional to concentration. The \nwhite reference is analogous to the 100%T setting in\nspectrophotometry and serves as a reference signal. \nDr = log R0/R1, where Dr is the reflectance density, R0 is\nthe white reference signal, and R1 is the photodetector\nsignal for the test sample.","difficulty":3},{"id":"HARR-5.1-Q021","topic":"5.1 Instrumentation","question":"Bichromatic measurement of absorbance can correct for interfering substances if:","options":["The contribution of the interferent to absorbance is the same at both wavelengths","Both wavelengths pass through the sample simultaneously","The side band is a harmonic of the primary wavelength","The chromogen has the same absorbance at both wavelengths"],"answer":"A","rationale":"In bichromatic photometry, the absorbance of\nsample is measured at two different wavelengths.\nThe primary wavelength is at or near the absorbance\nmaximum. An interfering substance having the same\nabsorbance at both primary and secondary (side\nband) wavelengths does not affect the absorbance\ndifference (Ad).","difficulty":2},{"id":"HARR-5.1-Q022","topic":"5.1 Instrumentation","question":"Which instrument requires a primary and secondary monochromator?","options":["Spectrophotometer","Atomic absorption spectrophotometer","Fluorometer","Nephelometer"],"answer":"C","rationale":"A fluorometer uses a primary monochromator to\nisolate the wavelength for excitation, and a secondary\nmonochromator to isolate the wavelength emitted\nby the fluorochrome.","difficulty":1},{"id":"HARR-5.1-Q023","topic":"5.1 Instrumentation","question":"Which of the following statements about fluorometry is accurate?","options":["Fluorometry is less sensitive than spectrophotometry","Fluorometry is less specific than spectrophotometry","Unsaturated cyclic molecules are often fluorescent","Fluorescence is directly proportional to temperature"],"answer":"C","rationale":"Increasing temperature results in more random\ncollision between molecules by increasing their\nmotion. This causes energy to be dissipated as heat\ninstead of fluorescence. Temperature is inversely\nproportional to fluorescence. Fluorescence is more\nsensitive than spectrophotometry because the\ndetector signal can be amplified when dilute\nsolutions are measured. It is also more specific than\nspectrophotometry because both the excitation and\nemission wavelengths are characteristics of the\ncompound being measured.","difficulty":3},{"id":"HARR-5.1-Q024","topic":"5.1 Instrumentation","question":"Which of the following components is not needed in a chemiluminescent immunoassay analyzer?","options":["Source lamp","Monochromator","Photodetector","Wash station"],"answer":"A","rationale":"Chemiluminescence is the production of light\nfollowing a chemical reaction. Immunoassays based\nupon chemiluminescence generate light when the\nchemiluminescent molecule becomes excited;\ntherefore, a light source is not used. In immunoassay\nplatforms, chemiluminescent molecules such as\nacridinium can be used to label antigens or\nantibodies. Alternatively, chemiluminescent\nsubstrates such as luminol or dioxetane phosphate\nmay be used. Light will be emitted when the\nenzyme-labeled molecule reacts with the substrate.\nIn such assays, free and bound antigen separation is\nrequired and is usually accomplished using\nparamagnetic particles bound to either antibody or\nreagent antigen.","difficulty":5},{"id":"HARR-5.1-Q025","topic":"5.1 Instrumentation","question":"Which substance is used to generate the light signal in electrochemiluminescence?","options":["Acridinium","Luminol","Dioxetane phosphate","Ruthenium"],"answer":"D","rationale":"All of these substances are chemiluminescent.\nDioxetane phosphate is excited by alkaline\nphosphatase. Acridinium and luminol are excited \nby hydrogen peroxide. In electrochemiluminesence,\nruthenium is used to label antibody or antigen.\nAntigen–antibody complexes containing the\nruthenium label are bound to paramagnetic particles\nvia a strepavidin–biotin reaction. The paramagnetic\nparticles are attracted to an electrode surface. \nThe flowcell is washed with a solution containing\ntripropylamine (TPA) to remove unbound ruthenium\nlabel. At the electrode surface, the TPA is oxidized \nand the electrons excite the ruthenium, causing\nproduction of 620-nm light.","difficulty":4},{"id":"HARR-5.1-Q026","topic":"5.1 Instrumentation","question":"Light scattering when the wavelength is greater than 10 times the particle diameter is described by:","options":["Rayleigh’s law","The Beer–Lambert law","Mie’s law","The Rayleigh–Debye law"],"answer":"A","rationale":"Rayleigh’s law states that when the incident\nwavelength is much longer than the particle\ndiameter, there is maximum backscatter and\nminimum right-angle scatter. The Rayleigh–Debye\nlaw predicts maximum right-angle scatter when\nwavelength and particle diameter approach \nequality. In nephelometry, the relationship between\nwavelength and diameter determines the angle at\nwhich the detector is located.","difficulty":3},{"id":"HARR-5.1-Q027","topic":"5.1 Instrumentation","question":"Which statement regarding nephelometry is true?","options":["Nephelometry is less sensitive than absorption spectrophotometry","Nephelometry follows Beer’s law","The optical design is identical to a turbidimeter except that a HeNe laser light source is used","The detector response is directly proportional to concentration"],"answer":"D","rationale":"In nephelometry, the detector output is proportional\nto concentration (as opposed to turbidimetry where\nthe detector is behind the cuvette). The detector(s) \nis (are) usually placed at an angle between 25° and \n90° to the incident light, depending upon the\napplication. Nephelometers, like fluorometers, are\ncalibrated to read zero with the light path blocked,\nand sensitivity can be increased up to 1,000 times \nby amplification of the detector output or increasing\nthe photomultiplier tube dynode voltage.","difficulty":1},{"id":"HARR-5.1-Q028","topic":"5.1 Instrumentation","question":"The purpose of the nebulizer in an atomic absorption spectrophotometer that uses a flame is to:","options":["Convert ions to atoms","Cause ejection of an outer shell electron","Reduce evaporation of the sample","Burn off organic impurities"],"answer":"A","rationale":"The atomizer of the atomic absorption\nspectrophotometer consists of either a nebulizer\nand flame or a graphite furnace. The nebulizer\ndisperses the sample into a fine aerosol, distributing\nit evenly into the flame. Heat from the flame is \nused to evaporate water and break the ionic \nbonds of salts, forming ground state atoms. The\nflame also excites a small percentage of the atoms,\nwhich release a characteristic emission line.","difficulty":3},{"id":"HARR-5.1-Q029","topic":"5.1 Instrumentation","question":"A flameless atomic absorption spectrophotometer dehydrates and atomizes a sample using:","options":["A graphite capillary furnace","An electron gun","A thermoelectric semiconductor","A thermospray platform"],"answer":"A","rationale":"Flameless atomic absorption uses a hollow tube \nof graphite with quartz ends. The tube is heated in\nstages by an electric current to successively dry, \nash, and atomize the sample. During the ash and\natomization steps, argon is injected into the tube \nto distribute the atoms. The furnace is more sensitive\nthan a flame atomizer and more efficient in atomizing\nthermostable salts. However, it is prone to greater\nmatrix interference and is slower than the flame\natomizer because it must cool down before\nintroduction of the next sample.","difficulty":5},{"id":"HARR-5.1-Q030","topic":"5.1 Instrumentation","question":"When measuring lead in whole blood using atomic absorption spectrophotometry, what reagent is required to obtain the needed sensitivity and precision?","options":["Lanthanum","Lithium","Triton X-100","Chloride"],"answer":"C","rationale":"A graphite furnace is preferred over a flame for\nmeasuring lead because it is sufficiently sensitive to\ndetect levels below 5 μg/dL, the cutoff needed for\nlead screening of children. The matrix modifier\nconsists of Triton X -100, ammonium phosphate and\nnitric acid. This allows for release of Pb from the RBCs,\nand solubilization of cell stroma. The matrix modifier\nalso prevents loss of Pb caused by formation of lead\nhalides and promotes interaction between Pb and\nthe tube wall, preventing its loss during the ashing\ncycle.","difficulty":4},{"id":"HARR-5.1-Q031","topic":"5.1 Instrumentation","question":"Interference in atomic absorption spectrophotometry caused by differences in viscosity is called:","options":["Absorption interference","Matrix effect","Ionization interference","Quenching"],"answer":"B","rationale":"Significant differences in aspiration and atomization\nresult when the matrix of sample and unknowns\ndiffer. Differences in viscosity and protein content are\nmajor causes of matrix error. Matrix effects can be\nreduced by using protein-based calibrators and\ndiluting both standards and samples prior to assay.","difficulty":1},{"id":"HARR-5.1-Q032","topic":"5.1 Instrumentation","question":"All of the following are required when measuring magnesium by atomic absorption spectrophotometry except:","options":["A hollow cathode lamp with a magnesium cathode","A chopper to prevent optical interference from magnesium emission","A monochromator to isolate the magnesium emission line at 285 nm","A 285-nm reference beam to correct for background absorption"],"answer":"D","rationale":"Atomic absorption requires a lamp with a cathode\nmade from the metal to be assayed. The lamp \nemits the line spectrum of the metal, providing \nthe wavelength that the atoms can absorb. The\nchopper pulses the source light, allowing it to be\ndiscriminated from light emitted by excited atoms.\nA monochromator eliminates light emitted by the\nideal gas in the lamp. Deuterium (wide bandpass\nlight) or Zeeman correction (splitting the incident\nlight into side bands by a magnetic field) may be\nused to correct for background absorption.","difficulty":4},{"id":"HARR-5.1-Q033","topic":"5.1 Instrumentation","question":"When measuring calcium by atomic absorption spectrophotometry, which is required?","options":["An organic extraction reagent to deconjugate calcium from protein","An internal standard","A magnesium chelator","Lanthanum oxide to chelate phosphates"],"answer":"D","rationale":"An acidic diluent such as hydrochloric acid (HCl) \nwill displace calcium bound to albumin. However,\ncalcium forms a thermostable bond with phosphate\nthat causes chemical interference in atomic\nabsorption. Lanthanum displaces calcium, forming\nlanthanum phosphate, and eliminates interference\nfrom phosphates. Unlike in some colorimetric\nmethods for calcium (e.g., o-cresolphthalein\ncomplexone), magnesium does not interfere \nbecause it does not absorb the 422.7 nm emission\nline from the calcium-hollow cathode lamp.","difficulty":3},{"id":"HARR-5.1-Q034","topic":"5.1 Instrumentation","question":"Ion selective analyzers using undiluted samples have what advantage over analyzers that use a diluted sample?","options":["Can measure over a wider range of concentration","Are not subject to pseudohyponatremia caused by high lipids","Do not require temperature equilibration","Require less maintenance"],"answer":"B","rationale":"Ion-selective analyzers measure the electrolyte\ndissolved in the fluid phase of the sample in\nmillimoles per liter of plasma water. When undiluted\nblood is assayed, the measurement is independent \nof colloids such as protein and lipid. Hyperlipemic\nsamples cause falsely low sodium measurements\nwhen assayed by flame photometry and ion-selective\nanalyzers requiring dilution because lipids displace\nplasma water containing the electrolytes. One\ndrawback to undiluted or direct measuring systems \nis that the electrodes require more frequent\ndeproteinization and usually have a shorter duty\ncycle.","difficulty":5},{"id":"HARR-5.1-Q035","topic":"5.1 Instrumentation","question":"Select the equation describing the potential that develops at the surface of an ion-selective electrode.","options":["van Deemter equation","van Slyke equation","Nernst equation","Henderson–Hasselbalch equation"],"answer":"C","rationale":"The van Deemter equation describes the \nrelation between the velocity of mobile phase to\ncolumn efficiency in gas chromatography. The\nHenderson–Hasselbalch equation is used to\ndetermine the pH of a solution containing a weak\nacid and its salt. van Slyke developed an apparatus\nto measure CO2 and O2 content using a\nmanometer.","difficulty":3},{"id":"HARR-5.1-Q036","topic":"5.1 Instrumentation","question":"The reference potential of a silver–silver chloride electrode is determined by the:","options":["Concentration of the potassium chloride filling solution","Surface area of the electrode","Activity of total anion in the paste covering the electrode","The concentration of silver in the paste covering the electrode"],"answer":"A","rationale":"The activity of any solid or ion in a saturated solution\nis unity. For a silver electrode covered with silver\nchloride paste, the Nernst equation is E = E° – RT/nF ×\n2.3 log10 [Ag° × Cl–]/[AgCl]. Because silver and silver\nchloride have an activity of 1.0, and all components\nexcept chloride are constants, the potential of the\nreference electrode is determined by the chloride\nconcentration of the filling solution.","difficulty":3},{"id":"HARR-5.1-Q037","topic":"5.1 Instrumentation","question":"The term RT/nF in the Nernst equation defines the:","options":["Potential at the ion-selective membrane","Slope of the electrode","Decomposition potential","Isopotential point of the electrode"],"answer":"B","rationale":"In the term RT/nF, R = the molar gas constant, \nT = temperature in degrees Kelvin, F = Faraday’s\nconstant, and n = the number of electrons donated\nper atom of reductant. The slope depends upon the\ntemperature of the solution and the valence of the\nreductant. At room temperature, the slope is 59.2 mV\nfor a univalent ion and 29.6 mV for a divalent ion.","difficulty":1},{"id":"HARR-5.1-Q038","topic":"5.1 Instrumentation","question":"The ion-selective membrane used to measure potassium is made of:","options":["High-borosilicate glass membrane","Polyvinyl chloride dioctylphenyl phosphonate ion exchanger","Valinomycin gel","Calomel"],"answer":"C","rationale":"Valinomycin is an antibiotic with a highly selective\nreversible-binding affinity for potassium ions. Sodium\nelectrodes are usually composed of a glass membrane\nwith a high content of aluminum silicate. Calcium and\nlithium ion-selective electrodes are made from organic\nliquid ion exchangers called neutral carrier ionophores.\nCalomel is made of mercury covered with a paste of\nmercurous chloride (Hg°/Hg2Cl2) and is used as a\nreference electrode for pH.","difficulty":2},{"id":"HARR-5.1-Q039","topic":"5.1 Instrumentation","question":"The response of a sodium electrode to a 10-fold increase in sodium concentration should be:","options":["A 10-fold drop in potential","An increase in potential of approximately 60 mV","An increase in potential of approximately 10 mV","A decrease in potential of approximately 10 mV"],"answer":"B","rationale":"The Nernst equation predicts an increase of\napproximately 60 mV per 10-fold increase in \nsodium activity. For sodium:","difficulty":5},{"id":"HARR-5.1-Q040","topic":"5.1 Instrumentation","question":"Which of the electrodes below is a current- producing (amperometric) rather than a voltage-producing (potentiometric) electrode?","options":["Clark electrode","Severinghaus electrode","pH electrode","Ionized calcium electrode"],"answer":"A","rationale":"The Clark electrode is composed of two half cells \nthat generate current, not voltage. It is used to\nmeasure partial pressure of oxygen (PO2), and is \nbased upon an amperometric method called\npolarography. When –0.8 V is applied to the cathode,\nO2 is reduced, causing current to flow. Current is\nproportional to the PO2 of the sample.","difficulty":3},{"id":"HARR-5.1-Q041","topic":"5.1 Instrumentation","question":"Which of the following would cause a “response” error from an ion-selective electrode for sodium when measuring serum but not the calibrator?","options":["Interference from other electrolytes","Protein coating the ion-selective membrane","An overrange in sodium concentration","Protein binding to sodium ions"],"answer":"B","rationale":"Response is the time required for an electrode to\nreach maximum potential. Ion-selective analyzers \nuse a microprocessor to monitor electrode response,\nslope, drift, and noise. When an electrode gives \nan acceptable response time when measuring an\naqueous calibrator, but not when measuring \nserum, the cause is often protein buildup on the\nmembrane.","difficulty":5},{"id":"HARR-5.1-Q042","topic":"5.1 Instrumentation","question":"In polarography, the voltage needed to cause depolarization of the cathode is called the:","options":["Half-wave potential","Isopotential point","Decomposition potential","Polarization potential"],"answer":"C","rationale":"In polarography, a minimum negative voltage must\nbe applied to the cathode to cause reduction of\nmetal ions (or O2) in solution. This is called the\ndecomposition potential. It is concentration\ndependent (dilute solutions require greater \nnegative voltage), and can be determined using \nthe Nernst equation.","difficulty":2},{"id":"HARR-5.1-Q043","topic":"5.1 Instrumentation","question":"Persistent noise from an ion-selective electrode is most often caused by:","options":["Contamination of sample","Blocked junction at the salt bridge","Overrange from high concentration","Improper calibration"],"answer":"B","rationale":"Electrode noise most often results from an unstable\njunction potential. Most reference electrodes contain \na high concentration of KCl internal solution used to\nproduce the reference potential. This forms a salt\nbridge with the measuring half cell by contacting\nsample, but is kept from equilibrating via a barrier\ncalled a junction. When this junction becomes blocked\nby salt crystals, the reference potential will be unstable,\nresulting in fluctuation in the analyzer readout.","difficulty":2},{"id":"HARR-5.1-Q044","topic":"5.1 Instrumentation","question":"Which element is reduced at the cathode of a Clark polarographic electrode?","options":["Silver","Oxygen","Chloride","Potassium"],"answer":"B","rationale":"The Clark electrode is designed to measure oxygen.\nO2 diffuses through a gas-permeable membrane\ncovering the electrode. It is reduced at the cathode,\nwhich is made of platinum or other inert metal.\nElectrons are supplied by the anode, which is made\nof silver. The net reaction is:","difficulty":1},{"id":"HARR-5.1-Q045","topic":"5.1 Instrumentation","question":"Which of the following statements accurately characterizes the coulometric titration of chloride?","options":["The indicator electrodes generate voltage","Constant current must be present across the generator electrodes","Silver ions are formed at the generator cathode","Chloride concentration is inversely proportional to titration time"],"answer":"B","rationale":"The Cotlove chloridometer is based upon the principle\nof coulometric titration with amperometric detection.\nCharge in the form of silver ions is generated by\noxidation of silver wire at the generator anode. Silver\nions react with chloride ions, forming insoluble silver\nchloride (AgCl). When all of the chloride is titrated, free\nsilver ions are detected by reduction back to elemental\nsilver, which causes an increase in current across the\nindicator electrodes (a pair of silver electrodes with a\nvoltage difference of about 1.0 V DC). Charge or\ntitration time is directly proportional to chloride\nconcentration as long as the rate of oxidation remains\nconstant at the generator anode.","difficulty":5},{"id":"HARR-5.1-Q046","topic":"5.1 Instrumentation","question":"In the coulometric chloride titration:","options":["Acetic acid in the titrating solution furnishes the counter ion for reduction","The endpoint is detected by amperometry","The titrating reagent contains a phosphate buffer to keep pH constant","Nitric acid (HNO3) is used to lower the solubility of AgCl"],"answer":"B","rationale":"Reduction of Ag+ back to Ag° generates the current,\nwhich signals the endpoint. The titrating reagent\ncontains HNO3, acetic acid, H2O, and either gelatin \nor polyvinyl alcohol. The HNO3 furnishes nitrate,\nwhich is reduced at the generator cathode, forming\nammonium ions. The ammonium becomes oxidized\nback to nitrate at the indicator anode. Gelatin or\npolyvinyl alcohol is needed to prevent pitting of the\ngenerator anode. Acetic acid lowers the solubility of\nAgCl, preventing dissociation back to Ag+.","difficulty":3},{"id":"HARR-5.1-Q047","topic":"5.1 Instrumentation","question":"Which of the following compounds can interfere with the coulometric chloride assay?","options":["Bromide","Ascorbate","Acetoacetate","Nitrate"],"answer":"A","rationale":"Chloride assays based upon either coulometric or\nchemical titration are subject to positive interference\nfrom other anions and electronegative radicals that\nmay be titrated instead of chloride ions. These\ninclude other halogens such as bromide, cyanide, \nand cysteine.","difficulty":2},{"id":"HARR-5.1-Q048","topic":"5.1 Instrumentation","question":"All of the following compounds contribute to the osmolality of plasma except:","options":["Lipids","Creatinine","Drug metabolites","Glucose"],"answer":"A","rationale":"Osmolality is the concentration (in moles) of\ndissolved solute per kilogram solvent. Proteins and\nlipids are not in solution, and do not contribute to\nosmolality. The nonionized solutes such as glucose\nand urea contribute 1 osmole per mole per kilogram\nwater, whereas dissociated salts contribute 1 osmole\nper mole of each dissociated ion or radical.","difficulty":4},{"id":"HARR-5.1-Q049","topic":"5.1 Instrumentation","question":"One mole per kilogram H2O of any solute will cause all of the following except:","options":["Lower the freezing point by 1.86°C","Raise vapor pressure by 0.3 mm Hg","Raise the boiling point by 0.52°C","Raise osmotic pressure by 22.4 atm"],"answer":"B","rationale":"Both freezing point and vapor pressure are lowered\nby increasing solute concentration. Boiling point \nand osmotic pressure are raised. Increasing solute\nconcentration of a solution opposes a change in its\nphysical state and lowers the concentration of H2O\nmolecules.","difficulty":2},{"id":"HARR-5.1-Q050","topic":"5.1 Instrumentation","question":"What component of a freezing point osmometer measures the sample temperature?","options":["Thermistor","Thermocouple","Capacitor","Electrode"],"answer":"A","rationale":"A thermistor is a temperature-sensitive resistor. The\nresistance to current flow increases as temperature\nfalls. The temperature at which a solution freezes can\nbe determined by measuring the resistance of the\nthermistor. Resistance is directly proportional to the\nosmolality of the sample.","difficulty":3},{"id":"HARR-5.1-Q051","topic":"5.1 Instrumentation","question":"What type of measuring circuit is used in a freezing point osmometer?","options":["Electrometer","Potentiometer","Wheatstone bridge","Thermal conductivity bridge"],"answer":"C","rationale":"The resistance of the thermistor is measured using a\nnetwork of resistors called a Wheatstone bridge. When\nthe sample is frozen, the bridge is balanced using a\ncalibrated variable resistor, so that no current flows \nto the readout. The resistance required to balance the\nmeter is equal to the resistance of the thermistor.","difficulty":4},{"id":"HARR-5.1-Q052","topic":"5.1 Instrumentation","question":"Which measurement principle is employed in a vapor pressure osmometer?","options":["Seebeck","Peltier","Hayden","Darlington"],"answer":"A","rationale":"The Seebeck effect refers to the increase in voltage\nacross the two junctions of a thermocouple caused\nby a difference in the temperature at the junctions.\nIncreasing osmolality lowers the dew point of a\nsample. When sample is cooled to its dew point, the\nvoltage change across the thermocouple is directly\nproportional to osmolality.","difficulty":3},{"id":"HARR-5.1-Q053","topic":"5.1 Instrumentation","question":"The freezing point osmometer differs from the vapor pressure osmometer in that only the freezing point osmometer:","options":["Cools the sample","Is sensitive to ethanol","Requires a thermoelectric module","Requires calibration with aqueous standards"],"answer":"B","rationale":"Alcohol enters the vapor phase so rapidly that it\nevaporates before the dew point of the sample is\nreached. Therefore, ethanol does not contribute to\nosmolality as measured using the vapor pressure\nosmometer. Freezing-point osmometers measure\nalcohol and can be used in emergency department\nsettings to estimate ethanol toxicity.","difficulty":3},{"id":"HARR-5.1-Q054","topic":"5.1 Instrumentation","question":"The method for measuring iron or lead by plating the metal and then oxidizing it is called:","options":["Polarography","Coulometry","Anodic stripping voltometry","Amperometry"],"answer":"C","rationale":"Anodic stripping voltometry is used to measure lead\nand iron. The cation of the metal is plated onto a\nmercury cathode by applying a negative charge. The\nvoltage of this electrode is reversed until the plated\nmetal is oxidized back to a cation. Current produced\nby oxidation of the metal is proportional to\nconcentration.","difficulty":1},{"id":"HARR-5.1-Q055","topic":"5.1 Instrumentation","question":"The term isocratic is used in high-performance liquid chromatography (HPLC) to mean the:","options":["Mobile phase is at constant temperature","Stationary phase is equilibrated with the mobile phase","Mobile phase consists of a constant solvent composition","Flow rate of the mobile phase is regulated"],"answer":"C","rationale":"An isocratic separation uses a single mobile phase of\nconstant composition, pH, and polarity, and requires\na single pump. Some HPLC separations use a gradient\nmobile phase to increase distance between peaks.\nGradients are made by mixing two or more solvents\nusing a controller to change the proportions of\nsolvent components.","difficulty":2},{"id":"HARR-5.1-Q056","topic":"5.1 Instrumentation","question":"The term reverse phase is used in HPLC to indicate that the mobile phase is:","options":["More polar than the stationary phase","Liquid and the stationary phase is solid","Organic and the stationary phase is aqueous","A stronger solvent than the stationary phase"],"answer":"A","rationale":"In reverse-phase HPLC, the separation takes place\nusing a nonpolar sorbent (stationary phase) such as\noctadecylsilane (C18). Solutes that are nonpolar are\nretained longer than polar solutes. Most clinical\nseparations of drugs, hormones, and metabolites \nuse reverse phase because aqueous mobile phases\nare far less toxic and flammable.","difficulty":2},{"id":"HARR-5.1-Q057","topic":"5.1 Instrumentation","question":"What is the primary means of solute separation in HPLC using a C18 column?","options":["Anion exchange","Size exclusion","Partitioning","Cation exchange"],"answer":"C","rationale":"Stationary phases (column packings) used in \nHPLC separate solutes by multiple means, but in\nreverse-phase HPLC the relative solubility between\nthe mobile phase and stationary phase is most\nimportant and depends upon solvent polarity, pH,\nand ionic strength.","difficulty":4},{"id":"HARR-5.1-Q058","topic":"5.1 Instrumentation","question":"The most commonly used detector for clinical gas–liquid chromatography (GLC) is based upon:","options":["Ultraviolet light absorbance at 254 nm","Flame ionization","Refractive index","Thermal conductance"],"answer":"B","rationale":"Volatile solutes can be detected in GLC using flame\nionization, thermal conductivity, electron capture,\nand mass spectroscopy. In flame ionization, energy\nfrom a flame is used to excite the analytes as they\nelute from the column. The flame is made by igniting\na mixture of hydrogen, carrier gas, and air. Current is\nproduced when an outer shell electron is ejected\nfrom the excited analyte.","difficulty":3},{"id":"HARR-5.1-Q059","topic":"5.1 Instrumentation","question":"What type of detector is used in high-performance liquid chromatography with electrochemical detection (HPLC–ECD)?","options":["Calomel electrode","Conductivity electrode","Glassy carbon electrode","Polarographic electrode"],"answer":"C","rationale":"HPLC–ECD uses a glassy carbon measuring electrode\nand a silver–silver chloride reference. The analyte is\noxidized or reduced by holding the glassy carbon\nelectrode at a positive voltage (oxidization) or\nnegative voltage (reduction). The resulting current\nflow is directly proportional to concentration.\nPhenolic groups such as catecholamines can be\nmeasured by HPLC–ECD.","difficulty":3},{"id":"HARR-5.1-Q060","topic":"5.1 Instrumentation","question":"In gas chromatography, the elution order of volatiles is usually based upon the:","options":["Boiling point","Molecular size","Carbon content","Polarity"],"answer":"A","rationale":"The order of elution is dependent upon the velocity\nof the analyte. Usually, the lower the boiling point of\nthe compound, the greater its velocity or solubility in\ncarrier gas.","difficulty":1},{"id":"HARR-5.1-Q061","topic":"5.1 Instrumentation","question":"Select the chemical that is used in most HPLC procedures to decrease solvent polarity.","options":["Hexane","Nonane","Chloroform","Acetonitrile"],"answer":"D","rationale":"All of the compounds mentioned have nonpolar\nproperties. Because most HPLC is reverse phase \n(a polar solvent is used), hexane and nonane are too\nnonpolar. Acetonitrile is more polar and less toxic\nthan chloroform and along with methanol is a\ncommon polarity modifier for HPLC.","difficulty":1},{"id":"HARR-5.1-Q062","topic":"5.1 Instrumentation","question":"In thin-layer chromatography (TLC), the distance the solute migrates divided by the distance the solvent migrates is the:","options":["tR","Kd","Rf","pK"],"answer":"C","rationale":"Rf is the distance migrated by the solute divided by\nthe distance migrated by the solvent. The tR refers \nto the retention time of the solute in HPLC or gas\nchromatography (GC). The Kd is the partition\ncoefficient, and is a measure of the relative affinity \nof solutes for the stationary phase. The solute with\nthe greater Kd will be retained longer. The pK is the\nnegative logarithm of K, the ionization constant, and\nis a measure of ionization.","difficulty":4},{"id":"HARR-5.1-Q063","topic":"5.1 Instrumentation","question":"Which reagent is used in thin-layer chromatography (TLC) to extract cocaine metabolites from urine?","options":["Acid and sodium chloride","Alkali and organic solvent","Chloroform and sodium acetate","Neutral solution of ethyl acetate"],"answer":"B","rationale":"Alkaline drugs such as cocaine, amphetamine, and\nmorphine are extracted at alkaline pH. Ideally, the pH\nfor extracting alkaline drugs into an organic solvent\nshould be 2 pH units greater than the negative log of\ndissociation constant (pKa) of the drug. More than\n90% of the drug will be nonionized and will extract in\nethyl acetate or another organic solvent.","difficulty":2},{"id":"HARR-5.1-Q064","topic":"5.1 Instrumentation","question":"What is the purpose of an internal standard in HPLC and GC methods?","options":["To compensate for variation in extraction and injection","To correct for background absorbance","To compensate for changes in flow rate","To correct for coelution of solutes"],"answer":"A","rationale":"Internal standards should have the same affinity as\nthe analyte for the extraction reagents. Dividing \npeak height (or area) of all samples (standards and\nunknowns) by the peak height (or area) of the\ninternal standard reduces error caused by variation \nin extraction recovery and injection volume.","difficulty":2},{"id":"HARR-5.1-Q065","topic":"5.1 Instrumentation","question":"What is the confirmatory method for measuring drugs of abuse?","options":["HPLC","Enzyme-multiplied immunoassay technique (EMIT)","Gas chromatography with mass spectroscopy (GC-MS)","TLC"],"answer":"C","rationale":"GC-MS determines the mass spectrum of the\ncompounds eluting from the analytic column. Each\nsubstance has a unique and characteristic spectrum\nof mass fragments. This spectrum is compared to\nspectra in a library of standards to determine the\npercent match. A match of greater than 95% is\nconsidered confirmatory.","difficulty":1},{"id":"HARR-5.1-Q066","topic":"5.1 Instrumentation","question":"The fragments typically produced and analyzed in methods employing mass spectroscopy are typically:","options":["Of low molecular size ranging from 10–100 daltons","Cations caused by electron loss or proton attachment","Anions caused by bombarding the molecule with an electron source","Neutral species formed after excited molecules form a stable resonance structure"],"answer":"B","rationale":"In almost all MS applications, cations of the molecule\nare measured. Cations can be formed by various\nmethods, the most common of which is electron\nbombardment (electron ionization). The energy\ntransferred to the molecule causes ejection of an\nouter shell electron. MS can analyze sizes from trace\nmetals through macromolecules. Proteins are\nmeasured following conversion to cations by\nionization procedures such as matrix-assisted laser\ndesorption ionization (MALDI) in which energy from \na nitrogen laser causes transfer of a proton from the\nmatrix (an acid) to the protein.","difficulty":4},{"id":"HARR-5.1-Q067","topic":"5.1 Instrumentation","question":"What component is used in a GC-MS but not used in an LC-MS?","options":["Electron source","Mass filter","Detector","Vacuum"],"answer":"A","rationale":"The mass spectrometer requires a sample that is\nsuspended in a gas phase, and therefore, the sample\nfrom a GC can be directly injected into the mass\nspectrometer. While chemical ionization of the\nsample is possible, most GC-MS instruments utilize\nelectron ionization. Electrons are produced by\napplying 70 electron volts to a filament of tungsten \nor rhenium under vacuum. The electrons collide with\nthe neutral molecules coming from the GC, splitting\nthem into fragments. The array of fragments is a\nunique identifier of each molecule.","difficulty":4},{"id":"HARR-5.1-Q068","topic":"5.1 Instrumentation","question":"What process is most often used in LC-MS to introduce the sample into the mass filter?","options":["Electrospray ionization","Chemical ionization","Electron impact ionization","Fast atom bombardment"],"answer":"A","rationale":"HPLC instruments use solvent rather than gas to\nseparate molecules. The sample is converted into a\ngaseous state by electrospray ionization before it\nenters the mass filter. Electrospray ionization uses a\nsmall-bore tube that forms a 1–4 μ nozzle at the mass\nfilter inlet and which is charged by several kilovolts.\nThe sample enters the tube along with inert drying\ngas. The tube is heated to help evaporate solvent, but\nunlike electron impact used in GC-MS, the ionizer is\nnot under vacuum. When a droplet of the sample\nreaches the nozzle, it becomes highly charged. The\nsize of the droplet is decreased owing to evaporation.\nThis causes the charge density to become excessive,\nand the droplets break apart. The tiny charged\ndroplets repel each other and break apart again,\nforming a plume. These particles are drawn into the\nmass filter by “ion optics” (a system of repeller plates,\ncounter electrode, and magnets). ESI does not result\nin extensive fragmentation, producing mostly the\nparent or “molecular” ion, a process called soft\nionization.","difficulty":5},{"id":"HARR-5.1-Q069","topic":"5.1 Instrumentation","question":"In mass spectroscopy, the term base peak typically refers to:","options":["The peak with the lowest mass","The peak with the most abundance","A natural isotope of the molecular ion","The first peak to reach the mass detector"],"answer":"B","rationale":"The base peak is typically the “molecular ion” or\nparent ion, meaning that it is the initial fragment\nmade by releasing an electron. The cation thus\nformed has a charge of +1, and therefore, its m/z \nratio is equal to its mass. The base peak is used for\nselective ion monitoring (SIM). It is the most\nabundant and most stable ion, and gives the best\nsensitivity for quantitative analysis.","difficulty":2},{"id":"HARR-5.1-Q070","topic":"5.1 Instrumentation","question":"Which method is the most useful when screening for errors of amino and organic acid metabolism?","options":["Two-dimensional thin-layer chromatography","Gas chromatography","Electrospray ionization tandem-mass spectroscopy","Inductively charged coupled-mass spectroscopy"],"answer":"C","rationale":"While two-dimensional thin-layer chromatography \ncan separate both amino and organic acids, it is \nnot sufficiently sensitive for newborn screening.\nElectrospray ionization allows a small alcohol-extracted\nwhole-blood sample to be analyzed by two mass\nspectrometers without prior separation by liquid \nor gas chromatography. Disorders of both organic \nand fatty acid metabolism are identified by the \nspecific pattern of acylcarnitine ions produced. \nAmino acids are detected as amino species that have\nlost a carboxyl group during ionization, a process\ncalled neutral loss.","difficulty":4},{"id":"HARR-5.1-Q071","topic":"5.1 Instrumentation","question":"In tandem-mass spectroscopy, the first mass filter performs the same function as:","options":["The ion source","The chromatography column","Extraction","The vacuum system"],"answer":"B","rationale":"A tandem mass spectrometer uses two or more mass\nfilters in sequence. The first filter functions as an ion\ntrap. Once the sample is ionized, the filter selects\nmolecular or parent ions of interest by excluding ions\noutside a specified size range. Therefore, it effectively\nseparates the analyte(s) of interest from unwanted\ncompounds. Tandem MS uses ESI to introduce the\nsample into the first mass filter, usually a quadrapole.\nThe RF and DC voltages of the quadrapole are set to\noptimize the trajectory of the parent ions of interest\nand cause ejection of unwanted ions. The parent ions\nare drawn into a second mass filter where they are\nbombarded by argon atoms. The collisions result in\nthe formation of mass fragments called daughter ions.\nThis process is called collision-induced dissociation\nand the second filter is called a collision chamber. \nThe process can be repeated in a third mass filter \nthat generates granddaughter ions. A total-ion\nchromatogram is produced from these, enabling the\ncompound of interest to be identified and quantified.\nTandem MS is used to screen for inborn errors of fatty\nacid, amino acid, and organic acid metabolism.","difficulty":4},{"id":"HARR-5.1-Q072","topic":"5.1 Instrumentation","question":"SITUATION: A GC-MS analysis using nitrogen as the carrier gas shows an extensively noisy baseline. A sample of the solvent used for the extraction procedure, ethyl acetate, was injected and showed the same noise. Results of an Autotune test showed the appearance of a base peak at 16 with two smaller peaks at 17 and 18. These results indicate:","options":["The solvent is contaminated","The carrier gas is contaminated","There is electrical noise in the detector","The ion source is dirty"],"answer":"B","rationale":"All of these situations are sources of baseline noise \nin GC-MS. However, the peak at 16 indicates the\npresence of oxygen in the carrier gas. Oxygen in the\natmosphere also contains small quantities of two\nisotopes with molecular weights of 17 and 18 owing\nto one and two extra neutrons, respectively.","difficulty":5},{"id":"HARR-5.1-Q073","topic":"5.1 Instrumentation","question":"Why is vacuum necessary in the mass filter of a mass spectrometer?","options":["Ionization does not occur at atmospheric pressure","It prevents collision between fragments","It removes electrons from the ion source","It prevents contamination"],"answer":"B","rationale":"Vacuum is needed in the mass filter of the MS to\nprevent random collisions between ions that would\nalter their trajectory or time of flight. It is also needed\nin CG-MS instruments that use electron ionization.\nThe vacuum prevents collision between the carrier\ngas molecules and the ions. In spectrometers that use\nelectrospray ionization, chemical ionization, and laser\ndesorption ionization (MALDI and SELDI TOF), the ion\nsource is not under vacuum.","difficulty":2},{"id":"HARR-5.1-Q074","topic":"5.1 Instrumentation","question":"What method is used to introduce the sample into a mass spectrometer for analysis of a trace element?","options":["Electrospray ionization","Laser desorption","Inductively charged plasma (ICP) ionization","Direct injection"],"answer":"C","rationale":"Mass spectrometers can be used to measure trace\nmetals, but the atoms need to be vaporized and\nionized like molecules before they enter the mass\nfilter. This is done by introducing the sample into a\nvery hot plasma (6,000–10,000°K) called a torch. The\ntorch is made by circulating argon through inner and\nouter quartz tubes. The tubes are wrapped with a \ncoil of wire that receives a radio frequency. This\ncreates current flow through the wire and a magnetic\nfield at the torch end. Argon atoms are excited by the\ncurrent and magnetic field and ionize. When the\nargon is ignited by a spark, it forms the plasma. The\nsample is mixed with argon at the other end to create\nan aerosol. When it reaches the torch, the solvent is\nevaporated and the energy from the torch and\ncollisions with argon ions cause ejection of outer-\nshell electrons, forming cations of the element.\nICP-MS is used to measure any trace element that\nreadily forms cations.","difficulty":5},{"id":"HARR-5.1-Q075","topic":"5.1 Instrumentation","question":"Which component is needed for a thermal cycler to amplify DNA?","options":["Programmable heating and cooling unit","Vacuum chamber with zero head space","Sealed airtight constant-temperature chamber","Temperature-controlled ionization chamber"],"answer":"A","rationale":"The polymerase chain reaction for DNA amplification\nconsists of three phases. Denaturation requires \na temperature of 90°C–94°C and separates the \ndouble-stranded DNA. Annealing requires a\ntemperature between 40°C–65°C and allows the\nprimers to bind to the target base sequence.\nExtension requires a temperature of 72°C and allows\nthe heat-stable polymerase to add complementary\nbases to the primer in the 5’ to 3’ direction. A cycle\nconsists of each temperature stage for a specific\nnumber of minutes and most procedures require 30\nor more cycles to generate a detectable quantity of\ntarget DNA. Rapid heating and cooling is usually\nachieved using a thermoelectric block that is cooled\nby forced air flow.","difficulty":3},{"id":"HARR-5.1-Q076","topic":"5.1 Instrumentation","question":"In real-time PCR, what value is needed in order to determine the threshold?","options":["Background signal","Melt temperature","Maximum fluorescence","Threshold cycle"],"answer":"A","rationale":"In real-time PCR, the fluorescence of the reporter\nprobe is proportional to the concentration of PCR\nproducts. For quantitation of PCR products, a well\nfactor and background fluorescence must be\ndetermined. Well-factor values are analogous to\ncuvette blanks. They are used to correct the\nmeasurements from each well so that the same\nconcentration of fluorescent dye gives the same\nsignal intensity regardless of the well. The threshold \nis the lowest signal that indicates the presence \nof product. It can be calculated manually from a \nreal-time amplification curve by finding the average\nstandard deviation of the fluorescent signal (RFU)\nfrom cycles 2–10. This is multiplied by 10 to give the\nthreshold value in RFUs.","difficulty":4},{"id":"HARR-5.1-Q077","topic":"5.1 Instrumentation","question":"Given the following real-time PCR amplification curve, what is the threshold cycle?","options":["15","20","25","30"],"answer":"C","rationale":"The maximum curvature of the plot approximates \nthe threshold cycle. A line is drawn from the\nthreshold value on the y-axis through the curve, \nand a perpendicular dropped to the x-axis. The Ct is\ndetermined by the intersection point on the x-axis.\nThe threshold is usually determined by an algorithm\nbut can be calculated manually as 10 times the\naverage standard deviation of the RFUs for \ncycles 2–10.","difficulty":4},{"id":"HARR-5.1-Q078","topic":"5.1 Instrumentation","question":"In addition to velocity, what variable is also needed to calculate the relative centrifugal force (g force) of a centrifuge?","options":["Head radius","Angular velocity coefficient","Diameter of the centrifuge tube","Ambient temperature in degrees Centigrade"],"answer":"A","rationale":"The relative centrifugal force (number times the force\nof gravity) is proportional to the square of the rotor\nspeed in revolutions per minute and the radius in\ncentimeters of the head (distance from the shaft to\nthe end of the tube).","difficulty":5},{"id":"HARR-5.1-Q079","topic":"5.1 Instrumentation","question":"Which of the following situations is likely to cause an error when weighing with an electronic analytical balance?","options":["Failure to keep the knife edge clean","Failure to close the doors of the balance before reading the weight","Oxidation on the surface of the substitution weights","Using the balance without allowing it to warm up for at least 10 minutes"],"answer":"B","rationale":"Electronic balances do not use substitution weights\nor knife edges to balance the weight on the pan.\nInstead, they measure the displacement of the pan \nby the weight on it using electromagnetic force to\nreturn it to its reference position. Regardless of the\ntype of balance used, all need to be located on a \nfirm weighing table free of vibration. Doors must be\nclosed to prevent air currents from influencing the\nweighing, and the pan and platform must be clean\nand free of dust and chemical residue.","difficulty":4},{"id":"HARR-5.1-Q080","topic":"5.1 Instrumentation","question":"When calibrating a semiautomatic pipet that has a fixed delivery of 10.0 μL using a gravimetric method, what should be the average weight of deionized water transferred?","options":["10.0 μg","100.0 μg","1.0 mg","10.0 mg"],"answer":"D","rationale":"Gravimetric and spectrophotometric analysis are the\ntwo methods used to verify pipet volume accuracy\nand precision. Since spectrophotometric analysis\ninvolves dilution, gravimetric analysis is associated\nwith greater certainty. At 20°C, the density of pure\nwater is 0.99821 g/mL. Therefore, each microliter\nweighs almost exactly 1.0 mg.","difficulty":5},{"id":"HARR-5.2-Q001","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following represents the Henderson–Hasselbalch equation as applied to blood pH?","options":["pH = 6.1 + log HCO3 –/PCO2","pH = 6.1 + log HCO3 –/(0.03 × PCO2)","pH = 6.1 + log dCO2/HCO3 –","pH = 6.1 + log (0.03 × PCO2)/HCO3 –"],"answer":"B","rationale":"The Henderson–Hasselbalch equation describes \nthe pH of a buffer comprised of a weak acid and its\nsalt. pH = pKa + log salt/acid, where pKa is the\nnegative logarithm of the dissociation constant \nof the acid. In this case, the salt is sodium bicarbonate\nand the acid is the dissolved CO2, which is equal to\n0.03 (mmol/L per mm Hg) x PCO2. The pKa includes\nboth the hydration and dissociation constant for\ndissolved CO2 in blood, 6.1 and is termed pK ́.","difficulty":2},{"id":"HARR-5.2-Q002","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"What is the PO2 of calibration gas containing 20.0% O2, when the barometric pressure is 30 in.?","options":["60 mm Hg","86 mm Hg","143 mm Hg","152 mm Hg"],"answer":"C","rationale":"Convert barometric pressure in inches to mm Hg by\nmultiplying by 25.4 (mm/in.). Next, subtract the vapor\npressure of H2O at 37°C, 47 mm Hg, to give dry gas\npressure. Multiply dry gas pressure by the %O2:\n25.4 mm/in. × 30 in. = 762 mm Hg\n762 mm Hg – 47 mm Hg (vapor pressure) = \n715 mm Hg (dry gas pressure)\n0.20 × 715 mm Hg = 143 mm Hg PO2","difficulty":5},{"id":"HARR-5.2-Q003","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"What is the blood pH when the partial pressure of carbon dioxide (PCO2) is 60 mm Hg and the bicarbonate concentration is 18 mmol/L?","options":["6.89","7.00","7.10","7.30"],"answer":"C","rationale":"Solve using the Henderson–Hasselbalch equation. \npH = pK ́ + log HCO3–/(0.03 × PCO2), where pK ́, the\nnegative logarithm of the combined hydration \nand dissociation constants for dissolved CO2 and\ncarbonic acid, is 6.1 and 0.03 is the solubility\ncoefficient for CO2 gas.\npH = 6.1 + log 18/(0.03 × 60) = 6.1 + log 18/1.8\npH = 6.1 + log 10. Because log 10 = 1, pH = 7.10","difficulty":5},{"id":"HARR-5.2-Q004","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following best represents the reference (normal) range for arterial pH?","options":["7.35–7.45","7.42–7.52","7.38–7.68","6.85–7.56"],"answer":"A","rationale":"The reference range for arterial blood pH is 7.35–7.45\nand is only 0.03 pH units lower for venous blood\nowing to the buffering effects of hemoglobin (Hgb)\nknown as the chloride isohydric shift. Most\nlaboratories consider less than 7.20 and greater than\n7.60 the critical values for pH.","difficulty":3},{"id":"HARR-5.2-Q005","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"What is the normal ratio of bicarbonate to dissolved carbon dioxide (HCO3 –:dCO2) in arterial blood?","options":["1:10","10:1","20:1","30:1"],"answer":"C","rationale":"When the ratio of HCO3–:dCO2 is 20:1, the log of\nsalt/acid becomes 1.3. Substituting this in the\nHenderson–Hasselbalch equation and solving for pH\ngives pH = 6.1 + log 20; pH = 6.1 + 1.3 = 7.4. Acidosis\nresults when this ratio is decreased, and alkalosis\nwhen it is increased.","difficulty":4},{"id":"HARR-5.2-Q006","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"What is the PCO2 if the dCO2 is 1.8 mmol/L?","options":["24 mm Hg","35 mm Hg","60 mm Hg","72 mm Hg"],"answer":"C","rationale":"Dissolved CO2 is calculated from the measured \nPCO2 × 0.0306, the solubility coefficient for CO2 gas \nin blood at 37°C.","difficulty":2},{"id":"HARR-5.2-Q007","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"In the Henderson–Hasselbalch expression pH = 6.1 + log HCO3 –/dCO2, the 6.1 represents:","options":["The combined hydration and dissociation constants for CO2 in blood at 37°C","The solubility constant for CO2 gas","The dissociation constant of H2O","The ionization constant of sodium bicarbonate (NaHCO3)"],"answer":"A","rationale":"The equilibrium constant, Kh, for the hydration of \nCO2 (dCO2 + H2O →H2CO3) is only about 2.3 × 10–3M,\nmaking dCO2 far more prevalent than carbonic acid.\nThe dissociation constant, Kd, for the reaction H2CO3\n→H+ + HCO3– is about 2 × 10–4 M. The product of\nthese constants is the combined equilibrium\nconstant, K ́. The negative logarithm of K ́ is the pK ́,\nwhich is 6.103 in blood at 37°C.","difficulty":2},{"id":"HARR-5.2-Q008","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following contributes the most to the serum total CO2?","options":["PCO2","dCO2","HCO3 –","Carbonium ion"],"answer":"C","rationale":"The total CO2 is the sum of the dCO2, H2CO3 (carbonic\nacid or hydrated CO2), and bicarbonate (as mainly\nNaHCO3). When serum is used to measure total CO2,\nthe dCO2 is insignificant because all the CO2 gas has\nescaped into the air. Therefore, serum total CO2 is\nequivalent to the bicarbonate concentration. \nTotal CO2 is commonly measured by potentiometry.\nAn organic acid is used to release CO2 gas from\nbicarbonate and pCO2 is measured with a\nSeveringhaus electrode. Alternately, bicarbonate \ncan be measured by an enzymatic reaction using\nphosphoenol pyruvate carboxylase. The enzyme\nforms oxaloacetate and phosphate from\nphosphoenol pyruvate and bicarbonate. The\noxaloacetate is reduced to malate by malate\ndehydrogenase and NADH is oxidized to NAD+. \nThe negative reaction rate is proportional to plasma\nbicarbonate concentration.","difficulty":5},{"id":"HARR-5.2-Q009","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"In addition to sodium bicarbonate, what other substance contributes most to the amount of base in the blood?","options":["Hemoglobin concentration","Dissolved O2 concentration","Inorganic phosphorus","Organic phosphate"],"answer":"A","rationale":"The primary blood buffer bases preventing acidosis in\norder of concentration are bicarbonate,\ndeoxyhemoglobin, albumin, and monohydrogen\nphosphate. At physiological pH, there is significantly\nmore H2PO4–1 than HPO4–2, and phosphate is a more\nefficient buffer system at preventing alkalosis than\nacidosis. Since all of the blood buffer systems are in\nequilibrium, the pH can be calculated accurately from\nthe concentration of bicarbonate and dissolved CO2\nusing the Henderson–Hasselbalch equation.","difficulty":3},{"id":"HARR-5.2-Q010","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following effects results from exposure of a normal arterial blood sample to room air?","options":["PO2 increased PCO2 decreased pH increased","PO2 decreased PCO2 increased pH decreased","PO2 increased PCO2 decreased pH decreased","PO2 decreased PCO2 decreased pH decreased"],"answer":"A","rationale":"The PO2 of air at sea level (21% O2) is about \n150 mm Hg. The PCO2 of air is only about 0.3 mm Hg.\nConsequently, blood releases CO2 gas and gains O2\nwhen exposed to air. Loss of CO2 shifts the\nequilibrium of the bicarbonate buffer system to \nthe right, decreasing hydrogen ion concentration \nand blood becomes more alkaline.","difficulty":4},{"id":"HARR-5.2-Q011","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which of the following formulas for O2 content is correct?","options":["O2 content = %O2 saturation/100 × Hgb g/dL × 1.39 mL/g + (0.0031 × PO2)","O2 content = PO2 × 0.0306 mmol/L/mm","O2 content = O2 saturation × Hgb g/dL × 0.003 mL/g","O2 content = O2 capacity × 0.003 mL/g"],"answer":"A","rationale":"Oxygen content is the sum of O2 bound to Hgb and\nO2 dissolved in the plasma. It is dependent upon the\nHgb concentration and the percentage of Hgb\nbound to O2 (O2 saturation). Each gram of Hgb binds\n1.39 mL of O2. The dissolved O2 is determined from the\nsolubility coefficient of O2 (0.0031 mL per dL/mm Hg)\nand the PO2. O2 content = % Sat/100 × Hgb in g/dL ×\n1.39 mL/g + (0.0031 × PO2).","difficulty":1},{"id":"HARR-5.2-Q012","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"The normal difference between alveolar and arterial PO2 (PAO2–PaO2 difference) is:","options":["3 mm Hg","10 mm Hg","40 mm Hg","50 mm Hg"],"answer":"B","rationale":"The PAO2–PaO2 difference results from the low ratio \nof ventilation to perfusion in the base of the lungs.\nThe hemoglobin in the blood coming from the base\nof the lung has a lower O2 saturation. This blood \nwill take up O2 from the plasma of blood leaving \nwell-ventilated areas of the lung, thus lowering the\nmixed arterial PO2.","difficulty":2},{"id":"HARR-5.2-Q013","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"A decreased PAO2–PaO2 difference is found in:","options":["A/V (arteriovenous) shunting","V/Q (ventilation/perfusion) inequality","Ventilation defects","All of these options"],"answer":"C","rationale":"Patients with A/V shunts, V/Q inequalities, and cardiac\nfailure will have an increased PAO2–PaO2 difference.\nHowever, patients with ventilation problems have\nlow alveolar PO2 owing to retention of CO2 in the\nairway. This reduces the PAO2–PaO2 difference.","difficulty":1},{"id":"HARR-5.2-Q014","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"The determination of the oxygen saturation of hemoglobin is best accomplished by:","options":["Polychromatic absorbance measurements of a whole-blood hemolysate","Near infrared transcutaneous absorbance measurement","Treatment of whole blood with alkaline dithionite prior to measuring absorbance","Calculation using PO2 and total hemoglobin by direct spectrophotometry"],"answer":"A","rationale":"Measurement of oxyhemoglobin, deoxyhemoglobin\n(reduced hemoglobin), carboxyhemoglobin,\nmethemoglobin, and sulfhemoglobin can be\naccomplished by direct spectrophotometry at\nmultiple wavelengths and analysis of the absorptivity\ncoefficients of each pigment at various wavelengths.\nThe O2 saturation is determined by dividing the\nfraction of oxyhemoglobin by the sum of all\npigments. This eliminates much of the error that\noccurs in the other methods when the quantity \nof an abnormal hemoglobin pigment is increased.","difficulty":4},{"id":"HARR-5.2-Q015","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Correction of pH for a patient with a body temperature of 38°C would require:","options":["Subtraction of 0.015","Subtraction of 0.01%","Addition of 0.020","Subtraction of 0.020"],"answer":"A","rationale":"The pH decreases by 0.015 for each degree Celsius\nabove the 37°C. Because the blood gas analyzer\nmeasures pH at 37°C, the in vivo pH would be \n0.015 pH units below the measured pH.","difficulty":4},{"id":"HARR-5.2-Q016","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Select the anticoagulant of choice for blood gas studies.","options":["Sodium citrate 3.2%","Lithium heparin 100 U/mL blood","Sodium citrate 3.8%","Ammonium oxalate 5.0%"],"answer":"B","rationale":"Heparin is the only anticoagulant that does not \nalter the pH of blood; heparin salts must be used for\npH and blood gases. Solutions of heparin are air\nequilibrated and must be used sparingly to prevent\ncontamination of the sample by gas in the solution.","difficulty":1},{"id":"HARR-5.2-Q018","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"A patient’s blood gas results are as follows: These results would be classified as:","options":["Metabolic acidosis","Metabolic alkalosis","Respiratory acidosis","Respiratory alkalosis"],"answer":"C","rationale":"Imbalances are classified as respiratory when the\nprimary disturbance is with PCO2 because PCO2\nis regulated by ventilation. PCO2 = dCO2/0.03 or \n60 mm Hg (normal 35–45 mm Hg). Increased dCO2\nwill increase hydrogen ion concentration, causing\nacidosis. Bicarbonate is moderately increased, but a\nprimary increase in NaHCO3 causes alkalosis. Thus, \nthe cause of this acidosis is CO2 retention (respiratory\nacidosis), and it is partially compensated by renal\nretention of bicarbonate.","difficulty":4},{"id":"HARR-5.2-Q019","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"A patient’s blood gas results are: These results indicate:","options":["Respiratory acidosis","Metabolic alkalosis","Respiratory alkalosis","Metabolic acidosis"],"answer":"B","rationale":"A pH above 7.45 corresponds with alkalosis. Both\nbicarbonate and PCO2 are elevated. Bicarbonate is \nthe conjugate base and is under metabolic (renal)\ncontrol, while PCO2 is an acid and is under respiratory\ncontrol. Increased bicarbonate (but not increased CO2)\nresults in alkalosis; therefore, the classification is\nmetabolic alkalosis, partially compensated by\nincreased PCO2.","difficulty":3},{"id":"HARR-5.2-Q020","topic":"5.2 Blood Gases, pH, and Electrolytes","question":"Which set of results is consistent with uncompensated respiratory alkalosis?","options":["pH 7.70 HCO3 30 mmol/L PCO2 25 mm Hg","pH 7.66 HCO3 22 mmol/L PCO2 20 mm Hg","pH 7.46 HCO3 38 mmol/L PCO2 55 mm Hg","pH 7.36 HCO3 22 mmol/L PCO2 38 mm Hg"],"answer":"B","rationale":"Respiratory alkalosis is caused by hyperventilation,\ninducing low PCO2. Very often, in the early phase of an\nacute respiratory disturbance, the kidneys have not\nhad time to compensate, and the bicarbonate is\nwithin normal limits. In answer A, the bicarbonate is\nhigh and PCO2 low; thus, both are contributing to\nalkalosis and this would be classi
