to PTH and is\nassociated with normal or elevated serum PTH.","difficulty":3},{"id":"HARR-5.8-Q018","topic":"5.8 Clinical Endocrinology","question":"The best method of analysis for serum PTH involves using antibodies that detect:","options":["The amino-terminal fragment of PTH","The carboxy-terminal end of PTH","Both the amino-terminal fragment and intact PTH","All fragments of PTH as well as intact hormone"],"answer":"C","rationale":"PTH is a polypeptide comprised of 84 amino \nacids. The biological activity of the hormone resides\nin the N-terminal portion of the polypeptide, but\nthe hormone is rapidly degraded and produces \nN-terminal, middle, and C-terminal fragments.\nFragments lacking the N-terminal portion are\ninactive. Immunoassays for PTH using antibodies \nto different portions of the polypeptide will give\ndifferent results. The assay of choice is a two-site\ndouble-antibody sandwich method that measures\nonly intact PTH and active fragments. Methods that\nuse single antibodies may detect inactive as well as\nactive PTH fragments and are not as specific for\nparathyroid disease.","difficulty":4},{"id":"HARR-5.8-Q019","topic":"5.8 Clinical Endocrinology","question":"Which of the following is most often elevated in hypercalcemia associated with malignancy?","options":["Parathyroid-derived PTH","Ectopic PTH","Parathyroid hormone–related protein (PTHRP)","Calcitonin"],"answer":"C","rationale":"PTHRP is a peptide produced by many tissues and\nnormally present in the blood at a very low level. \nThe peptide has an N-terminal sequence of eight\namino acids that are the same as found in PTH and\nthat will stimulate the PTH receptors of bone. \nSome malignancies (e.g., squamous, renal, bladder,\nand ovarian cancers) secrete PTHRP, causing\nhypercalcemia-associated malignancy. Because \nthe region shared with PTH is small and poorly\nimmunoreactive, the peptide does not cross-react in\nmost assays for PTH. For this reason, and because\ntumors producing ectopic PTH are rare, almost all\npatients who have an elevated Cai and elevated PTH\nhave primary hyperparathyroidism. The immunoassay\nfor PTHRP will frequently be elevated in patients who\nhave not yet been diagnosed with malignancy but\nhave an elevated Cai, without an elevated serum PTH.\nCalcitonin is a hormone produced in the medulla of\nthe thyroid that opposes the action of PTH. However,\ncalcitonin levels do not greatly influence the serum\ncalcium. Assay of calcitonin is used exclusively to\ndiagnose medullary thyroid cancer, which produces\nvery high serum levels.","difficulty":5},{"id":"HARR-5.8-Q020","topic":"5.8 Clinical Endocrinology","question":"Which is normally the most abundant corticosteroid hormone secreted by the adrenal cortex?","options":["Cortisol","Dehydroepiandrosterone","Aldosterone","Corticosterone"],"answer":"A","rationale":"Cortisol is the most abundant adrenal hormone, \nand abnormal levels have pronounced effects on\ncarbohydrate and lipid metabolism. Cortisol is a \n21-carbon steroid with a dihydroxyacetone group at\nC17 and hydroxyl group at C11 that account for its\nglucocorticoid potency. Plasma and urinary cortisol\nmeasurements are used to diagnose most types of\nadrenocortical dysfunction. Dehydroepiandrosterone\n(DHEA), an adrenal androgen, is the next most\nabundant adrenal hormone. Aldosterone is the\nprincipal mineral corticoid made by the adrenals, \nand corticosterone is the immediate precursor to\naldosterone. Both regulate salt balance.","difficulty":3},{"id":"HARR-5.8-Q021","topic":"5.8 Clinical Endocrinology","question":"Which of the following statements regarding adrenal cortical dysfunction is true?","options":["Patients with Cushing’s syndrome usually have hyperkalemia","Cushing’s syndrome is associated with glucose intolerance","Addison’s disease is associated with hypernatremia","Addison’s disease is caused by elevated levels of cortisol"],"answer":"B","rationale":"Patients with Cushing’s syndrome have elevated\nlevels of cortisol and other adrenal corticosteroids.\nThis causes the characteristic cushingoid appearance\nthat includes obesity, acne, and humpback posture.\nOsteoporosis, hypertension, hypokalemia, and\nglycosuria are characteristics. Addison’s disease\nresults from adrenal hypoplasia and produces the\nopposite symptoms including hypotension,\nhyperkalemia, and hypoglycemia.","difficulty":2},{"id":"HARR-5.8-Q022","topic":"5.8 Clinical Endocrinology","question":"Which of the following statements about cortisol in Cushing’s syndrome is true?","options":["Twenty-four–hour urinary free cortisol is a more sensitive test than plasma total cortisol","Patients with Cushing’s disease show pronounced diurnal variation in serum cortisol","Free cortisol is increased by a high-serum cortisol-binding protein concentration","An elevated serum total cortisol level is diagnostic of Cushing’s syndrome"],"answer":"A","rationale":"Serum cortisol can be increased by factors such as\nstress, medications, and cortisol-binding protein, and\nthe cortisol level of normal patients will overlap those\nseen in Cushing’s syndrome because of pulse\nvariation. When cortisol levels become elevated,\ncortisol-binding protein becomes saturated, and free\n(unbound) cortisol is filtered by the glomeruli. Most is\nreabsorbed, but a significant amount reaches the\nurine as free cortisol. Twenty-four–hour urinary free\ncortisol avoids the diurnal variation that may affect\nplasma free cortisol levels and is a more sensitive test\nthan serum total or free cortisol.","difficulty":3},{"id":"HARR-5.8-Q023","topic":"5.8 Clinical Endocrinology","question":"Which of the following conditions is characterized by primary hyperaldosteronism caused by adrenal adenoma, carcinoma, or hyperplasia?","options":["Cushing’s syndrome","Addison’s disease","Conn’s syndrome","Pheochromocytoma"],"answer":"C","rationale":"Conn’s syndrome is characterized by hypertension,\nhypokalemia, and hypernatremia with increased\nplasma and urine aldosterone and decreased renin.\nCushing’s syndrome results from excessive\nproduction of cortisol, and Addison’s disease from\ndeficient production of adrenal corticosteroids.\nPheochromocytoma is a tumor of chromaffin cells\n(usually adrenal) that produces catecholamines.","difficulty":4},{"id":"HARR-5.8-Q024","topic":"5.8 Clinical Endocrinology","question":"Which of the following is the most common cause of Cushing’s syndrome?","options":["Pituitary adenoma","Adrenal hyperplasia","Overuse of corticosteroids","Ectopic adrenocorticotropic hormone (ACTH) production by tumors"],"answer":"C","rationale":"The most common cause of Cushing’s syndrome is\nthe administration of medications with cortisol or\nglucocorticoid activity. Excluding iatrogenic causes,\napproximately 60%–70% of Cushing’s syndrome\nresults from hypothalamic–pituitary misregulation\nand is called Cushing’s disease. Adrenal adenoma \nor carcinoma (non-ACTH-mediated Cushing’s\nsyndrome) comprise about 20% of cases, and ectopic\nACTH production accounts for 10%–20%.","difficulty":1},{"id":"HARR-5.8-Q025","topic":"5.8 Clinical Endocrinology","question":"Which of the following is the mechanism causing Cushing’s disease?","options":["Excess secretion of pituitary ACTH","Adrenal adenoma","Treatment with corticosteroids","Ectopic ACTH production by tumors"],"answer":"A","rationale":"Cushing’s disease refers to adrenal hyperplasia resulting\nfrom misregulation of the hypothalamic–pituitary \naxis. It is usually caused by small pituitary adenomas.\nCushing’s syndrome may be caused by Cushing’s\ndisease, adrenal adenoma or carcinoma, ectopic \nACTH-producing tumors, or excessive corticosteroid\nadministration. The cause of Cushing’s syndrome can\nbe differentiated using the ACTH and dexamethasone\nsuppression tests.","difficulty":2},{"id":"HARR-5.8-Q026","topic":"5.8 Clinical Endocrinology","question":"In which situation is the plasma or 24-hour urinary cortisol not consistent with the clinical picture?","options":["In pregnant patients","In patients with a positive overnight dexamethasone suppression test","In congenital adrenal hyperplasia","In Cushing’s syndrome caused by ectopic ACTH producing tumors"],"answer":"C","rationale":"Congenital adrenal hyperplasia (adrenogenital\nsyndrome) results from a deficiency of an enzyme\nrequired for synthesis of cortisol. Approximately 90%\nof cases are caused by a deficiency of 21-hydroxylase\nblocking conversion of 17-α hydroxyprogesterone \nto 11-deoxycortisol. Most other cases are caused by\n11-hydroxylase deficiency, which blocks conversion\nof 11-deoxycortisol to cortisol. Precursors of \ncortisol, usually either 17-α hydroxyprogesterone \nor 11-deoxycortisol are increased. This results in \nlow serum cortisol levels, but high levels of these\nintermediates (mainly 17-ketogenic steroids). The \ntwo most common features of CAH are salt wasting\ncaused by increased mineral corticoid activity and\nvirilization due to increased androgens.","difficulty":5},{"id":"HARR-5.8-Q027","topic":"5.8 Clinical Endocrinology","question":"Which test is used to distinguish Cushing’s disease (pituitary Cushing’s) from Cushing’s syndrome caused by adrenal tumors?","options":["Low-dose overnight dexamethasone suppression","Petrosal sinus sampling","Serum ACTH","Twenty-four–hour urinary free cortisol"],"answer":"C","rationale":"Serum ACTH assays are very helpful in distinguishing\nthe cause of Cushing’s syndrome. Patients with\nadrenal tumors have values approaching zero.\nPatients with ectopic ACTH tumors have values\ngreater than 200 pg/dL. Fifty percent of patients with\nCushing’s disease have high 8 a.m. ACTH levels\n(between 100–200 pg/dL). The high-dose\ndexamethasone suppression test is also used.\nPatients with Cushing’s disease show more than \n50% suppression of cortisol release after receiving an\n8-mg dose of dexamethasone, but patients with\nadrenal tumors or ACTH producing tumors do not.\nInferior petrosal sinus sampling (the petrosal sinuses\ndrain the pituitary) is used to determine if a high\nACTH is from the pituitary glands, or from an ectopic\nsource.","difficulty":4},{"id":"HARR-5.8-Q028","topic":"5.8 Clinical Endocrinology","question":"Which is the most widely used screening test for Cushing’s syndrome?","options":["Overnight low-dose dexamethasone suppression test","Corticotropin-releasing hormone stimulation test","Petrosal sinus sampling","Metyrapone stimulation test"],"answer":"A","rationale":"Dexamethasone is a synthetic corticosteroid that\nexhibits 30-fold greater negative feedback on the\nhypothalamus than cortisol. When an oral dose of \n1 mg of the drug is given to a patient at 11 p.m., \nthe 8 a.m. serum total cortisol level should be below\n5.0 μg/dL. Patients with Cushing’s syndrome almost\nalways exceed this cutoff. Therefore, a normal\nresponse to dexamethasone excludes Cushing’s\nsyndrome with a sensitivity of about 98%. CRH\nstimulation and petrosal sinus sampling are\nconfirmatory tests for Cushing’s disease, and are \nused when the high-dose dexamethasone\nsuppression test is inconclusive. The metyrapone\nstimulation test measures the patient’s ACTH reserve.\nMetyrapone blocks cortisol formation by inhibiting\n11-β hydroxylase. This causes an increase in ACTH\noutput in normals. A subnormal ACTH response is\nseen in persons with Addison’s disease caused by\npituitary failure.","difficulty":3},{"id":"HARR-5.8-Q029","topic":"5.8 Clinical Endocrinology","question":"Which test is the most specific for establishing a diagnosis of Cushing’s disease (pituitary Cushing’s)?","options":["Low-dose dexamethasone suppression","High-dose dexamethasone suppression","Twenty-four–hour urinary free cortisol","Petrosal sinus sampling following corticotropin-releasing hormone stimulation"],"answer":"D","rationale":"Although dexamethasone suppression tests have a\nhigh sensitivity, some patients without Cushing’s\nsyndrome have indeterminate results (e.g., values\nbetween 5 and 10 μg/dL) or abnormal results \nowing to medications or other conditions. When\ncorticotropin-releasing hormone is given\nintravenously, patients with Cushing’s disease \nhave an exaggerated ACTH response. Samples are\ndrawn from the sinuses draining the pituitary gland\nand from the peripheral blood. In patients with\npituitary tumors, the ACTH will be several times\nhigher in the sinus samples than in the peripheral\nblood samples.","difficulty":4},{"id":"HARR-5.8-Q030","topic":"5.8 Clinical Endocrinology","question":"Which of the following statements about the diagnosis of Addison’s disease is true?","options":["Patients with primary Addison’s disease show a normal response to ACTH stimulation","Primary and secondary Addison’s disease can often be differentiated by plasma ACTH","Twenty-four–hour urinary free cortisol is normal in Addison’s disease","Pituitary ACTH reserves are normal in secondary Addison’s disease"],"answer":"B","rationale":"ACTH (Cortrosyn) stimulation is used as a screening\ntest for Addison’s disease. A 250-μg dose of Cortrosyn\nis given intravenously. Normal patients show a \n2–5 times increase in serum cortisol. A subnormal\nresponse occurs in both primary and secondary\nAddison’s disease. Plasma ACTH is high in primary but\nis low in secondary Addison’s disease. Patients with\nsecondary Addison’s disease (pituitary failure) do not\nrespond to metyrapone because their ACTH reserve is\ndiminished.","difficulty":2},{"id":"HARR-5.8-Q031","topic":"5.8 Clinical Endocrinology","question":"Which of the following statements regarding the catecholamines is true?","options":["They are derived from tryptophan","They are produced by the zona glomerulosa of the adrenal cortex","Plasma levels show both diurnal and pulsed variation","They are excreted in urine primarily as free catecholamines"],"answer":"C","rationale":"Catecholamines—epinephrine, norepinephrine, \nand dopamine—are produced from the amino acid\ntyrosine by the chromaffin cells of the adrenal\nmedulla. Plasma and urinary catecholamines are\nmeasured in order to diagnose pheochromocytoma.\nSymptoms include hypertension, headache,\nsweating, and other endocrine involvement. \nPlasma catecholamines are oxidized rapidly to\nmetanephrines and VMA; only about 2% is excreted\nas free catecholamines. The zona glomerulosa is \nthe outermost portion of the adrenal cortex, where\naldosterone is mainly produced.","difficulty":2},{"id":"HARR-5.8-Q032","topic":"5.8 Clinical Endocrinology","question":"Which assay using 24-hour urine is considered the best single screening test for pheochromocytoma?","options":["Total urinary catecholamines","VMA","Homovanillic acid (HVA)","Metanephrines"],"answer":"D","rationale":"Catecholamines are metabolized to metanephrines\nand VMA. Urinary catecholamines are increased by\nexercise and dietary ingestion. Measurement of \n24-hour urinary metanephrine is about 95% sensitive\nfor pheochromocytoma, and is the best single \ntest. Specificity and sensitivity for detecting\npheochromocytoma approach 100% when both \nVMA and metanephrines are measured.","difficulty":4},{"id":"HARR-5.8-Q033","topic":"5.8 Clinical Endocrinology","question":"Which metabolite is most often increased in carcinoid tumors of the intestine?","options":["5-Hydroxyindolacetic acid (5-HIAA)","3-Methoxy-4-hydroxyphenylglycol (MHPG)","3-Methoxydopamine","HVA"],"answer":"A","rationale":"5-HIAA is a product of serotonin catabolism. Excess\nlevels are found in urine of patients with carcinoid\ntumors composed of argentaffin cells. Carcinoid\ntumors are usually found in the intestine or lung, \nand produce serotonin and 5-hydroxytryptophan, a\nserotonin precursor. Serotonin is deaminated by\nmonamine oxidase, forming 5-HIAA, and the 5-HIAA\nis excreted in the urine. Some carcinoid tumors\nproduce mainly 5-hydroxytryptophan because they\nlack an enzyme needed to convert it to serotonin. \nThe 5-hydroxytryptophan is converted by the kidneys\nto serotonin resulting in high urinary serotonin. \nBoth 5-HIAA and serotonin are usually measured by\nHPLC with EDC.","difficulty":3},{"id":"HARR-5.8-Q034","topic":"5.8 Clinical Endocrinology","question":"Which statement regarding the measurement of urinary catecholamines is true?","options":["An increased excretion of total urinary catecholamines is specific for pheochromocytoma","Twenty-four–hour urinary catecholamine assay avoids pulse variations associated with measurement of plasma catecholamines","Total urinary catecholamine measurement provides greater specificity than measurement of urinary free catecholamines","Total urinary catecholamines are not affected by exercise"],"answer":"B","rationale":"Measurement of total urinary catecholamines is not \na specific test for pheochromocytoma. Urine levels\nmay be increased by exercise and in muscular\ndiseases. Catecholamines in urine may also be\nderived from dietary sources rather than endogenous\nproduction. Most catecholamines are excreted as the\nglucuronide, and the urinary free catecholamines\nincrease only when there is increased secretion.\nMeasurement of free hormone in urine is equal in\nclinical sensitivity and specificity to measurement of\nmetanephrines. Twenty-four–hour urine is the sample\nof choice because plasma levels are subject to pulse\nvariation and affected by the patient’s psychological\nand metabolic condition at the time of sampling.","difficulty":3},{"id":"HARR-5.8-Q035","topic":"5.8 Clinical Endocrinology","question":"Which method is most often used to measure fractionated catecholamines (epinephrine, norepinephrine, and dopamine)?","options":["Measurement of fluorescence following oxidation by potassium ferricyanide","Measurement by HPLC with electrochemical detection","Measure of radioactivity after conversion by catechol-O-methyltransferase (COMT) to tritiated metanephrines","Measurement by HPLC with fluorescence detection"],"answer":"B","rationale":"HPLC–ECD separates catecholamines by reverse-\nphase chromatography, then detects them by\noxidizing the aromatic ring at +0.8 V to a quinone\nring. Current is proportional to epinephrine and\nnorepinephrine concentration. Fluorescent methods\nemploying ferricyanide (trihydroxyindole method) or\nethylenediamine (EDA method) show interference by\nAldomet and several other drugs and are obsolete.\nThe radioenzymatic assay of catecholamines is a\nspecific alternative to HPLC but requires a liquid\nscintillation counter. The method uses the enzyme\nCOMT to transfer a tritiated methyl group from \nS-adenosyl methionine to the catecholamines. This\nresults in formation of radiolabeled metanephrines\nthat are measured. HPLC with fluorescence detection\nis not as sensitive as HPLC–ECD. Electrospray\nionization tandem-mass spectroscopy is an\nalternative to HPLC–EDC for measurement of\nfractionated catecholamines and metanephrines.","difficulty":5},{"id":"HARR-5.8-Q036","topic":"5.8 Clinical Endocrinology","question":"Which statement about sample collection for catecholamines and metabolites is true?","options":["Blood for catecholamines is collected in the usual manner following a 12-hour fast","Twenty-four–hour urine for vanillylmandelic acid, catecholamines, or metanephrines is collected in 1 mL of boric acid","Twenty-four–hour urine creatinine should be measured with vanillylmandelic acid, homovanillic acid, or metanephrines","There is no need to discontinue medications if a 24-hour urine collection is used"],"answer":"C","rationale":"Stress, exercise, and an upright position induce\ncatecholamine elevation, and therefore, patients\nmust be resting supine for at least 30 minutes prior to\nblood collection. The preferred method of collection\nis catheterization, so that the anxiety of venipuncture\nis not a factor. A 4-hour fast is also recommended.\nMany drugs contain epinephrine, which may falsely\nelevate catecholamine measurements. In addition,\nmany drugs inhibit monoamine oxidase, which is\nneeded to convert metanephrines to VMA. Therefore,\nmedications should be removed prior to testing\nwhenever possible. Twenty-four–hour urine samples\nfor catecholamines are usually preserved with 10 mL\nof 6N HCl because some degradation occurs during\nstorage when pH is greater than 3. Renal clearance\naffects excretion of catecholamine metabolites; it is\npreferable to report VMA, HVA, and metanephrines, \nin μg/mg creatinine. The urinary creatinine\nmeasurement should be at least 0.8 g/day, to validate\nthe completeness of the 24-hour urine sample.","difficulty":5},{"id":"HARR-5.8-Q037","topic":"5.8 Clinical Endocrinology","question":"Which of the following statements applies to both measurement of VMA and metanephrines in urine?","options":["Both can be oxidized to vanillin and measured at 360 nm without interference from dietary compounds","Both can be measured immunochemically after hydrolysis and derivatization","Both require acid hydrolysis prior to measurement","Both can be measured by specific HPLC and MS assays"],"answer":"D","rationale":"VMA and metanephrines can both be measured as\nvanillin after oxidation with periodate. However, these\nmethods are affected by dietary sources of vanillin;\ncoffee, chocolate, bananas, and vanilla must be\nexcluded from the diet. Metanephrines, VMA, and\nHVA are most often measured by HPLC–EDC.","difficulty":2},{"id":"HARR-5.8-Q038","topic":"5.8 Clinical Endocrinology","question":"Urinary HVA is most often assayed to detect:","options":["Pheochromocytoma","Neuroblastoma","Adrenal medullary carcinoma","Psychiatric disorders such as manic depression"],"answer":"B","rationale":"HVA is the major metabolite of dopa, and urinary HVA\nis elevated in more than 75% of neuroblastoma\npatients. Neuroblastomas also usually produce VMA\nfrom norepinephrine. Thus, HVA and VMA are assayed\ntogether and this increases the sensitivity of\ndetection to around 90%.","difficulty":1},{"id":"HARR-5.8-Q039","topic":"5.8 Clinical Endocrinology","question":"Thyroid hormones are derived from the amino acid:","options":["Phenylalanine","Methionine","Tyrosine","Histidine"],"answer":"C","rationale":"Thyroid hormones are derived from the enzymatic\nmodification of tyrosine residues on thyroglobulin.\nTyrosine is halogenated enzymatically with \niodine, forming monoiodotyrosine (MIT) and\ndiiodotyrosine (DIT). Enzymatic coupling of these\nresidues form T3 (3,5,3 ́-triiodothyronine) and T4\n(3,5,3 ́,5 ́-tetraiodothyronine). These are hydrolyzed\nfrom thyroglobulin, forming active hormones.","difficulty":1},{"id":"HARR-5.8-Q040","topic":"5.8 Clinical Endocrinology","question":"Which statement regarding thyroid hormones is true?","options":["Circulating levels of T3 and T4 are about equal","T3 is about 10-fold more active than T4","The rate of formation of monoiodotyrosine and diiodotyrosine is about equal","Most of the T3 present in plasma is from its direct release from thyroid storage sites"],"answer":"B","rationale":"The rate of DIT synthesis is twice that of MIT and \nthe rate of coupling favors formation of T4. Levels \nof T4 are about 50 times those of T3, but T3 is\napproximately 10 times more active physiologically.\nEighty percent of circulating T3 is derived from\nenzymatic conversion of T4 by T4 5 ́-deiodinase.","difficulty":1},{"id":"HARR-5.8-Q041","topic":"5.8 Clinical Endocrinology","question":"Which of the following statements regarding thyroid hormones is true?","options":["Both protein-bound and free T3 and T4 are physiologically active","Total T3 and T4 are influenced by the level of thyroxine-binding globulin","Variation in thyroxine-binding protein levels affects both free T3 and T4","An elevated serum total T4 and T3 is diagnostic of hyperthyroidism"],"answer":"B","rationale":"Total serum T4 and T3 are dependent upon both\nthyroid function and the amount of thyroxine-binding\nproteins such as thyroxine-binding globulin (TBG).\nTotal T4 or T3 may be abnormal in a patient with\nnormal thyroid function, if the TBG level is abnormal.\nFor this reason, free T3 and T4 are more specific\nindicators of thyroid function than are measurements\nof total hormone. Only free hormone is physiologically\nactive.","difficulty":1},{"id":"HARR-5.8-Q042","topic":"5.8 Clinical Endocrinology","question":"Which of the following conditions will increase total T4 by increasing TBG?","options":["Acute illness","Anabolic steroid use","Nephrotic syndrome","Pregnancy or estrogens"],"answer":"D","rationale":"Pregnancy and estrogens are the most common\ncause of increased TBG. Other causes include\nhepatitis, morphine, and clofibrate therapy. Acute\nillness, anabolic steroids, and nephrotic syndrome\ndecrease the level of TBG. Normal pregnancy \ncauses an elevated serum total T4. Suitable assays \nare available that estimate free T4 and T3 and these\nshould be used instead of total hormone assays.","difficulty":2},{"id":"HARR-5.8-Q043","topic":"5.8 Clinical Endocrinology","question":"Select the most appropriate single screening test for thyroid disease.","options":["Free thyroxine index","Total T3 assay","Total T4","TSH assay"],"answer":"D","rationale":"TSH is produced by the anterior pituitary in response\nto low levels of free T4 or T3. A normal TSH rules out\nthyroid disease. TSH is low in primary hyperthyroidism\nand high in primary hypothyroidism.","difficulty":2},{"id":"HARR-5.8-Q044","topic":"5.8 Clinical Endocrinology","question":"The serum TSH level is almost absent in:","options":["Primary hyperthyroidism","Primary hypothyroidism","Secondary hyperthyroidism","Euthyroid sick syndrome"],"answer":"A","rationale":"Low TSH and a high T3 (and usually T4) occur in\nprimary hyperthyroidism, but may also occur in\nsystemic nonthyroid illnesses where T4 has been\nconverted to T3. A 2-fold increase in free hormone\ncan produce a 100-fold decrease in TSH. In primary\nhyperthyroidism, the TSH will be within a range \nof 0–0.02 mU/mL, while in nonthyroid illnesses it \nwill be 0.03 mU/mL or higher. A high TSH and \nlow T4 occur in primary hypothyroidism but can \nalso occur in an acutely ill patient without thyroid\ndisease, the euthyroid sick syndrome. Secondary\nhyperthyroidism is caused by pituitary hyperfunction,\nresulting in increased serum TSH.","difficulty":3},{"id":"HARR-5.8-Q045","topic":"5.8 Clinical Endocrinology","question":"Which assay is used to confirm difficult cases of hypothyroidism?","options":["Free T3 assay","Free thyroxine index","Thyrotropin-releasing hormone (TRH) stimulation test","TBG assay"],"answer":"C","rationale":"The TRH stimulation test is used to confirm borderline\ncases of abnormal thyroid function. In normal\npatients, intravenous injection of 500 μg of TRH\ncauses a peak TSH response within 30 minutes. In\npatients with primary hypothyroidism, there is an\nexaggerated response (>30 mU/L). Patients with\nhyperthyroidism do not show the expected rise in\nTSH after TRH stimulation.","difficulty":1},{"id":"HARR-5.8-Q046","topic":"5.8 Clinical Endocrinology","question":"Which of the following statements is true regarding reverse T3 (rT3)?","options":["Formed in the blood by degradation of T4","Physiologically active, but less than T3","Decreased in euthyroid sick syndrome","Interferes with the measurement of serum T3"],"answer":"A","rationale":"Reverse T3 is formed from the deiodination of \nT4 in the blood. It is an inactive isomer of T3, \n(3,3 ́,5 ́-triiodothyronine). Reverse T3 is increased \nin acute and chronic illness and is used to identify\npatients with euthyroid sick syndrome.","difficulty":2},{"id":"HARR-5.8-Q047","topic":"5.8 Clinical Endocrinology","question":"A patient has an elevated serum T3 and free T4 and undetectable TSH. What is the most likely cause of these results?","options":["Primary hyperthyroidism","Secondary hyperthyroidism","Euthyroid with increased thyroxine-binding proteins","Euthyroid sick syndrome"],"answer":"A","rationale":"An undetectable TSH with increased T3 is caused by\nprimary hyperthyroidism (suppression via high free\nthyroid hormone). In secondary hyperthyroidism, \nthe TSH will be elevated in addition to at least the \nT3. Patients with an increased thyroxine-binding\nprotein level will have an increase in total T3 but \nnot free T4 or TSH. Patients with euthyroid sick\nsyndrome usually have a low total T3 due to \ndeficient conversion of T4 to T3, normal free T4, \nand a normal or slightly elevated TSH.","difficulty":5},{"id":"HARR-5.8-Q048","topic":"5.8 Clinical Endocrinology","question":"A serum thyroid panel reveals an increase in total T4, normal TSH, and normal free T4. What is the most likely cause of these results?","options":["Primary hyperthyroidism","Secondary hyperthyroidism","Euthyroid with increased thyroxine-binding protein","Subclinical hypothyroidism"],"answer":"C","rationale":"Patients with a normal TSH are euthyroid, and most\ncommonly an increase in total T4 in these patients \nis caused by an increase in TBG. An increase in \nTBG causes an increase in total T4 but not free T4.\nSubclinical hypothyroidism is usually associated \nwith a high TSH, but normal free T3 and free T4. \nWhen TSH is indeterminate, the diagnosis is made \nby demonstrating an exaggerated response to the\nTRH stimulation test.","difficulty":5},{"id":"HARR-5.8-Q049","topic":"5.8 Clinical Endocrinology","question":"Which statement about TSH and T4 in early pregnancy is correct?","options":["TSH and thyroid hormones fall","TSH falls and thyroid hormones rise","TSH and thyroid hormones both rise","TSH rises and thyroid hormones fall"],"answer":"B","rationale":"Estrogens released in pregnancy cause an increase in\nTBG, which causes an increase in total T4 and T3. In\nearly pregnancy, the hCG produced by the placenta\nstimulates the thyroid, causing  an increase in free\nthyroid hormones. This suppresses TSH production. In\nthe second trimester, as hCG diminishes, free T4 levels\nfall, and may be lower than 0.8 ng/dL, the lower limit\nof the adult reference range due to expansion of \nthe blood volume. Therefore, both TSH and free \nT4 should be evaluated during pregnancy using\ntrimester-specific reference ranges. In early\npregnancy, a TSH above the first- trimester reference\nrange should be followed up with free T4 and thyroid\nperoxidase antibody levels to assess the need for\nthyroid treatment.","difficulty":4},{"id":"HARR-5.8-Q050","topic":"5.8 Clinical Endocrinology","question":"In which case might a very low plasma TSH result not correlate with thyroid status?","options":["Euthyroid sick syndrome","Congenital hypothyroidism","When TBG is elevated","After high-dose corticosteroid treatment"],"answer":"D","rationale":"In persons with severe chronic diseases or who have\nhCG-secreting tumors, TSH production may be\nsuppressed. Some drugs, especially high doses of\ncorticosteroids, will suppress TSH production. Low\nTSH levels not matching thyroid status can also be\nseen in patients who have recently been treated for\nhyperthyroidism because there is a delay in the\npituitary response. High-sensitivity TSH assays that\ncan measure as little as 0.01 mIU/L and free T4 and T3\ncan help differentiate these conditions from clinical\nhyperthyroidism. If the TSH is below .03 mIU/L and\nthe free hormone levels are increased, this points to\nhyperthyroidism. Lab values in euthyroid sick\nsyndrome may mimic mild hypothyroidism. In\neuthyroid sick syndrome, thyroid function will be\nnormal, but TSH may be slightly increased owing to\nlower levels of free T3. In euthyroid sick syndrome, \nthe rT3 will be increased.","difficulty":5},{"id":"HARR-5.9-Q001","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"In which of the following cases is qualitative analysis of the drug usually adequate?","options":["To determine whether the dose of a drug with a low therapeutic index is likely to be toxic","To determine whether a patient is complying with the physician’s instructions","To adjust dose if individual differences or disease alter expected response","To determine whether the patient has been taking amphetamines"],"answer":"D","rationale":"The purpose of therapeutic drug monitoring is to\nachieve a therapeutic blood drug level rapidly and\nminimize the risk of drug toxicity caused by overdose.\nTherapeutic drug monitoring is a quantitative\nprocedure performed for drugs with a narrow\ntherapeutic index (ratio of the concentration\nproducing the desired effect to the concentration\nproducing toxicity). Drug groups that require\nmonitoring because of high risk of toxicity include\naminoglycoside antibiotics, anticonvulsants,\nantiarrhythmics, antiasthmatics, immunosuppressive\nagents used for transplant rejection, and\npsychoactive drugs. When testing for abuse\nsubstances, the goal is usually to determine whether\nthe drug is present or absent. The most common\napproach is to compare the result to a cutoff\ndetermined by measuring a standard containing the\nlowest level of drug that is considered significant.","difficulty":4},{"id":"HARR-5.9-Q002","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"The term pharmacokinetics refers to the:","options":["Relationship between drug dose and the drug blood level","Concentration of drug at its sites of action","Relationship between blood concentration and therapeutic response","The relationship between blood and tissue drug levels"],"answer":"A","rationale":"Pharmacokinetics is the mathematical expression of\nthe relationship between drug dose and drug blood\nlevel. When the appropriate formula is applied to\nquantitative measures of drug dose, absorption,\ndistribution, and elimination, the blood concentration\ncan be accurately determined.","difficulty":1},{"id":"HARR-5.9-Q003","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"The term pharmacodynamics is an expression of the relationship between:","options":["Dose and physiological effect","Drug concentration at target sites and physiological effect","Time and serum drug concentration","Blood and tissue drug levels"],"answer":"B","rationale":"Pharmacodynamics is the relationship between the\ndrug concentration at the receptor site (tissue\nconcentration) and the response of the tissue to that\ndrug. For example, the relationship between\nlidocaine concentration in the heart muscle and the\nduration of the action potential of Purkinje fibers.","difficulty":1},{"id":"HARR-5.9-Q004","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"The study of pharmacogenomics involves which type of testing?","options":["Family studies to determine the inheritance of drug resistance","Testing drugs with cell cultures to determine the minimum toxic dosage","Testing for single nucleotide polymorphisms known to affect drug metabolism","Comparison of dose-response curves between family members"],"answer":"C","rationale":"Pharmacogenomics refers to the study of genes that\naffect the performance of a drug in an individual. One\nmethod is to test for single nucleotide\npolymorphisms (SNPs) using DNA microarrays in\ngenes such as those that code for the cytochrome\nP450 enzymes involved in the metabolism of many\ndrugs. Genetic variations of one such enzyme may\naccount for individual pharmacokinetic differences\nand can be used to predict the efficacy of the drug.","difficulty":1},{"id":"HARR-5.9-Q005","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Select the five pharmacological parameters that determine serum drug concentration.","options":["Absorption, anabolism, perfusion, bioactivation, excretion","Liberation, equilibration, biotransformation, reabsorption, elimination","Liberation, absorption, distribution, metabolism, excretion","Ingestion, conjugation, integration, metabolism, elimination"],"answer":"C","rationale":"Liberation is the release of the drug and \nabsorption is the transport of drug from the site of\nadministration to the blood. The percent of drug\nabsorption and the rate of absorption determine\nthe bioavailable fraction, f. This is the fraction of the\ndose that reaches the blood. Distribution refers to\nthe delivery of the drug to the tissues. It involves\ndilution and equilibration of the drug in various\nfluid compartments including the blood, and is\ninfluenced by binding to proteins and blood cells.\nMetabolism is the process of chemical modification\nof the drug by cells. This results in production of\nmetabolites with altered activity and solubility.\nExcretion is the process by which the drug and its\nmetabolites are removed from the body.","difficulty":5},{"id":"HARR-5.9-Q006","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Which route of administration is associated with 100% bioavailability?","options":["Sublingual","Intramuscular","Oral","Intravenous"],"answer":"D","rationale":"When a drug is administered intravenously, all the\ndrug enters the bloodstream, and therefore, the\nbioavailable fraction is 1.0. All other routes of\nadministration require absorption through cells,\nand this process reduces the bioavailable fraction.\nThe bioavailable fraction for a drug given orally \ncan be calculated by dividing the peak blood\nconcentration after oral administration by the peak\ndrug concentration after IV administration. A value\nof 0.7 or higher is desired for drugs given orally.","difficulty":4},{"id":"HARR-5.9-Q007","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"The phrase “first-pass hepatic metabolism” means that:","options":["One hundred percent of a drug is excreted by the liver","All drug is inactivated by hepatic enzymes after one pass through the liver","Some drug is metabolized from the portal circulation, reducing bioavailability","The drug must be metabolized in the liver to an active form"],"answer":"C","rationale":"Drugs given orally enter the blood via the portal\ncirculation and are transported directly to the liver.\nSome drugs are excreted by the liver, and a fraction\nwill be lost by hepatic excretion before the drug\nreaches the general circulation. An example is\npropranolol, a β-blocker that reduces heart rate \nand hypertension. The bioavailable fraction is \n0.2–0.4 when given orally because much of the\ndrug is removed by first-pass hepatic metabolism.","difficulty":2},{"id":"HARR-5.9-Q008","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Which formula can be used to estimate dosage needed to give a desired steady-state blood level?","options":["Dose per hour = clearance (milligrams per hour) × average concentration at steady state ÷ f","Dose per day = fraction absorbed – fraction excreted","Dose = fraction absorbed × (1/protein-bound fraction)","Dose per day = half-life × log Vd (volume distribution)"],"answer":"A","rationale":"After a patient receives a loading dose to rapidly\nbring the drug level up to the desired therapeutic\nrange, a maintenance dose must be given at\nconsistent intervals to maintain the blood drug level\nat the desired concentration. The dose per hour is\ndetermined by multiplying the clearance per hour \nby the desired average steady-state concentration,\nthen dividing by f (bioavailable fraction).","difficulty":3},{"id":"HARR-5.9-Q009","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Which statement is true regarding the volume distribution (Vd) of a drug?","options":["Vd is equal to the peak blood concentration divided by the dose given","Vd is the theoretical volume in liters into which the drug distributes","The higher the Vd, the lower the dose needed to reach the desired blood level of drug","The Vd is the principal determinant of the dosing interval"],"answer":"B","rationale":"The Vd of a drug represents the dilution of the drug\nafter it has been distributed in the body. The Vd is\nused to estimate the peak drug blood level expected\nafter a loading dose is given. The peak blood level\nequals the dose multiplied by f ÷ Vd. The Vd can be\ncalculated by dividing the dose, Xo, by the initial\nplasma drug concentration, Co, (Vd = Xo/Co) or by\ndividing the clearance rate by K, the elimination rate\nconstant (K = 0.693 divided by drug half-life). The\ngreater the Vd, the higher the dose that will be\nneeded to achieve the desired blood concentration\nof drug. The Vd is the principal determinant of the\ndose, and the clearance rate is the principal\ndeterminant of the dosing interval.","difficulty":2},{"id":"HARR-5.9-Q010","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"For drugs with first-order elimination, which statement about drug clearance is true?","options":["Clearance = elimination rate ÷ serum level","It is most often performed by the liver","It is directly related to half-life","Clearance rate is independent of dose"],"answer":"A","rationale":"First-order elimination represents a linear relationship\nbetween the amount of drug eliminated per hour\nand the blood level of drug. For drugs following linear\nkinetics, clearance equals the elimination rate divided\nby the drug concentration in blood. When clearance\n(in milligrams per hour) and f are known, the dose per\nhour needed to give a desired average drug level at\nsteady state can be calculated. Clearance is inversely\nrelated to the drug’s half-life and is accomplished\nmainly by the kidneys.","difficulty":3},{"id":"HARR-5.9-Q011","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Which statement about steady-state drug levels is true?","options":["The absorbed drug must be greater than the amount excreted","Steady state can be measured after two elimination half-lives","Constant intravenous infusion will give the same minima and maxima as an oral dose","Oral dosing intervals give peaks and troughs in the dose-response curve"],"answer":"D","rationale":"When drugs are infused intravenously, both the\ndistribution and elimination rates are constant. \nThis eliminates the peaks and troughs seen in the\ndose-response curve. Peak and trough levels are\ncharacteristics of intermittent dosing regimens. The\nsteady state is reached when drug in the next dose is\nsufficient only to replace the drug eliminated since\nthe last dose. Steady state can be measured after five\ndrug half-lives because blood levels will have reached\n97% of steady state.","difficulty":3},{"id":"HARR-5.9-Q012","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"If too small a peak–trough difference is seen for a drug given orally, then:","options":["The dose should be decreased","Time between doses should be decreased","Dose interval should be increased","Dose per day and time between doses should be decreased"],"answer":"C","rationale":"Increasing the dosing interval will reduce the trough\nconcentration of the drug, and increasing the dose\nwill increase the peak concentration of the drug,\nresulting in a greater peak–trough difference. The\npeak–trough ratio is usually adjusted to 2 with the\ndose interval set to equal the drug half-life. Under\nthese conditions, both peak and trough levels often\nfall within the therapeutic range.","difficulty":3},{"id":"HARR-5.9-Q013","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"If the peak level is appropriate but the trough level too low at steady state, then the dose interval should:","options":["Be lengthened without changing the dose per day","Be lengthened and dose rate decreased","Not be changed, but dose per day increased","Be shortened, but dose per day not changed"],"answer":"D","rationale":"Increasing the dose rate may result in peak drug\nlevels in the toxic range. Decreasing the dosing\ninterval will raise the trough level so that it is\nmaintained in the therapeutic range. The trough \nlevel is affected by the drug clearance rate. If\nclearance increases, then trough level decreases.","difficulty":4},{"id":"HARR-5.9-Q014","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"If the steady-state drug level is too high, the best course of action is to:","options":["Decrease the dose","Decrease the dose interval","Decrease the dose and decrease the dose interval","Change the route of administration"],"answer":"A","rationale":"Decreasing both dose and dosing interval will have\noffsetting effects on peak and trough blood levels.\nThe appropriate dose can be calculated if the\nclearance or Vd and f are known. For example, the\ninitial dose is calculated by multiplying the desired\npeak blood drug concentration by the Vd.","difficulty":4},{"id":"HARR-5.9-Q015","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"When should blood samples for trough drug levels be collected?","options":["30 minutes after peak levels","45 minutes before the next dose","1–2 hours after the last dose","Immediately before the next dose is given"],"answer":"D","rationale":"The trough concentration of a drug is the lowest\nconcentration obtained in the dosing interval. This\noccurs immediately before the absorption of the next\ndose given. Trough levels are usually collected just\nbefore the next dose is given.","difficulty":2},{"id":"HARR-5.9-Q016","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Blood sample collection time for peak drug levels:","options":["Varies with the drug, depending on its rate of absorption","Is independent of drug formulation","Is independent of the route of administration","Is 30 minutes after a bolus intravenous injection is completed"],"answer":"A","rationale":"The peak concentration of a drug is the highest\nconcentration obtained in the dosing interval. For\noral drugs, the time of peak concentration is\ndependent upon their rates of absorption and\nelimination and is determined by serial blood\nmeasurements. Peak levels for oral drugs are usually\ndrawn 1–2 hours after administration of the dose. \nFor drugs given intravenously, peak levels are\nmeasured immediately after the infusion is\ncompleted.","difficulty":3},{"id":"HARR-5.9-Q017","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Which could account for drug toxicity following a normally prescribed dose?","options":["Decreased renal clearance caused by kidney disease","Discontinuance or administration of another drug","Altered serum protein binding caused by disease","All of these options"],"answer":"D","rationale":"Therapeutic drug monitoring is necessary for drugs\nthat have a narrow therapeutic index. Individual\ndifferences alter pharmacokinetics, causing lack of\ncorrelation between dose and drug blood level.\nThese include age, diet, ingestion with or without\nfood, genetic factors, exercise, smoking, pregnancy,\nmetabolism of other drugs, protein binding, and\ndisease states.","difficulty":2},{"id":"HARR-5.9-Q018","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Select the elimination model that best describes most oral drugs.","options":["One compartment, linear first-order elimination","Michaelis–Menton or concentration-dependent elimination","Two compartment with a biphasic elimination curve","Logarithmic elimination"],"answer":"A","rationale":"Most drugs given orally distribute uniformly through\nthe tissues reaching rapid equilibrium, so both blood\nand tissues can be viewed as a single compartment.\nElimination according to Michaelis–Menton kinetics \nis nonlinear because at high concentrations, the\nhepatic enzyme system becomes saturated, reducing\nthe elimination efficiency.","difficulty":1},{"id":"HARR-5.9-Q019","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Drugs rapidly infused intravenously usually follow which elimination model?","options":["One compartment, first order","One compartment, logarithmic","Biphasic or two compartment with serum level rapidly falling in the first phase","Michaelis–Menton or concentration-dependent elimination"],"answer":"C","rationale":"Drugs rapidly infused intravenously follow a \ntwo-compartment model of elimination. The central\ncompartment is the blood and tissues that are \nwell perfused. The second consists of tissues for\nwhich distribution of drug is time dependent. In\ndetermining the loading dose, the desired serum\nconcentration should be multiplied by the volume \nof the central compartment to avoid toxic levels.","difficulty":2},{"id":"HARR-5.9-Q020","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Which fact must be considered when evaluating a patient who displays signs of drug toxicity?","options":["Drug metabolites (e.g., N-acetylprocainamide) may need to be measured as well as parent drug","If the concentration of total drug is within therapeutic limits, the concentration of free drug cannot be toxic","If the drug has a wide therapeutic index, then it will not be toxic","A drug level cannot be toxic if the trough is within the published therapeutic range"],"answer":"A","rationale":"Altered drug pharmacokinetics may result in toxicity\neven when the dose of drug is within the accepted\ntherapeutic range. Two common causes of this are\nthe presence of unmeasured metabolites that are\nphysiologically active, and the presence of a higher\nthan expected concentration of free drug. Because\nonly free drug is physiologically active, decreased\nbinding protein or factors that shift the equilibrium\nfavoring more unbound drug can result in toxicity\nwhen the total drug concentration is within the\ntherapeutic range. Some drugs with a wide\ntherapeutic index are potentially toxic because they\nmay be ingested in great excess with little or no initial\ntoxicity. For example, acetaminophen overdose does\nnot usually become apparent until 3–5 days after the\noverdose. This creates the potential for hepatic\ndamage to occur from continued use, especially in\npatients who have decreased hepatic or renal\nfunction because the drug half-life is extended.","difficulty":5},{"id":"HARR-5.9-Q021","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"When a therapeutic drug is suspected of causing toxicity, which specimen is the most appropriate for an initial investigation?","options":["Trough blood sample","Peak blood sample","Urine at the time of symptoms","Gastric fluid at the time of symptoms"],"answer":"B","rationale":"When a drug is suspected of toxicity, the peak blood\nsample (sample after absorption and distribution are\ncomplete) should be obtained because it is most\nlikely to exceed the therapeutic limit. If the peak level\nis above the upper therapeutic limit, then toxicity is\nconfirmed, and the drug dose is lowered. If the peak\ndrug concentration is within the therapeutic range,\ntoxicity is less likely, but cannot be ruled out. A high\nconcentration of free drug, the presence of active\nmetabolites, and abnormal response to the drug are\ncauses of drug toxicity that may occur when the\nblood drug level is within the published therapeutic\nrange.","difficulty":5},{"id":"HARR-5.9-Q022","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"For a drug that follows first-order pharmacokinetics, adjustment of dosage to achieve the desired blood level can be made using which formula?","options":["New dose = current dose × desired concentration concentration at steady state","New dose = current dose × concentration at steady state desired concentration","New dose = concentration at steady state × half-life desired concentration","New dose = concentration at steady state × desired current dose concentration"],"answer":"A","rationale":"Most drugs follow first-order pharmacokinetics,\nmeaning the clearance of drug is linearly related \nto the drug dose. The dose of such drugs can be\nadjusted by multiplying the ratio of the current \ndose to blood concentration by the desired drug\nconcentration, provided the blood concentration is\nmeasured at steady state.","difficulty":5},{"id":"HARR-5.9-Q023","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"For which drug group are both peak and trough measurements usually required?","options":["Antiarrhythmics","Analgesics","Tricyclic antidepressants","Aminoglycoside antibiotics"],"answer":"D","rationale":"Aminoglycoside antibiotics cause damage to the\neighth cranial nerve at toxic levels, resulting in\nhearing loss. When given at subtherapeutic doses,\nthey fail to resolve infection. Most drugs falling in the\nother classes have a narrow peak–trough difference\nbut are highly toxic when blood levels exceed the\ntherapeutic range. Usually, these can be safely\nmonitored by measuring trough levels.","difficulty":1},{"id":"HARR-5.9-Q024","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Which of the following statements about TLC for drug screening is true?","options":["Acidic drugs are extracted in an alkaline nonpolar solvent","A drug is identified by comparing its Rf value and staining to standards","Testing must be performed using a urine sample","Opiates and other alkaloids are extracted at an acid pH"],"answer":"B","rationale":"TLC can be performed on urine, serum, or gastric fluid\nand qualitatively identifies most drugs. Each has a\ncharacteristic Rf, which is the ratio of the distance\nmigrated by the drug to the solvent. The Rf of the\nsample must match the Rf of the drug standard.\nExtraction of drugs for TLC is highly pH dependent.\nThe pH must be adjusted to reduce the solubility\n(ionization) of the drug in the aqueous phase. \nUsually, alkaline drugs (e.g., opiates) are extracted at\npH 9.0 and acidic drugs (e.g., barbiturates) at pH 4.5.","difficulty":2},{"id":"HARR-5.9-Q025","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"The EMIT for drugs of abuse uses an:","options":["Antibody conjugated to a drug","Enzyme conjugated to an antibody","Enzyme conjugated to a drug","Antibody bound to a solid phase"],"answer":"C","rationale":"In EMIT, enzyme-labeled drug competes with drug in\nthe sample for a limited amount of reagent antibodies.\nWhen antibody binds to the enzyme–drug conjugate,\nit blocks the catalytic site of the enzyme. Enzyme\nactivity is directly proportional to sample drug\nconcentration because the quantity of unbound \ndrug–enzyme conjugate will be highest when drug is\npresent in the sample.","difficulty":1},{"id":"HARR-5.9-Q026","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Which statement about EMIT is true?","options":["Enzyme activity is inversely proportional to drug level","Formation of NADH is monitored at 340 nm","ALP is the commonly used conjugate","Assay use is restricted to serum"],"answer":"B","rationale":"EMIT is a homogenous immunoassay, meaning that\nfree antigen does not have to be separated from\nbound antigen. Most EMIT assays use a two-reagent\nsystem. Reagent A contains substrate (usually\nglucose-6-PO4), coenzyme (NAD+), and antibody to\nthe drug. Reagent B contains enzyme-labeled drug\n(usually G-6-PD-drug) and buffer. The rate of NADH\nproduction is proportional to the drug concentration.\nEMIT assays are commonly used to test for drugs of\nabuse in urine. In such cases, the enzyme activity of\nthe low calibrator (drug concentration equal to \nU.S. Substance Abuse and Mental Health Services\nAdministration minimum for a positive test) is used \nas the cutoff.","difficulty":1},{"id":"HARR-5.9-Q027","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Which statement regarding cloned enzyme donor immunoassay (CEDIA) is true?","options":["The enzyme used is glucose-6-phosphate dehydrogenase","The enzyme donor and acceptor molecules are fragments of β-galactosidase","Drug concentration is inversely related to fluorescence","The antibody is covalently linked to the enzyme donor"],"answer":"B","rationale":"CEDIA is a homogenous enzyme immunoassay that is\ncommonly used to measure drugs of abuse. Drug\nconjugated to a fragment of β-galactosidase that is\ncatalytically inactive competes with drug in the\nsample for a limited number of antibodies to the\ndrug. The fragment, called the enzyme donor (ED), and\nsubstrate (chlorophenol red-β-D-galactopyranose)\nare mixed with the sample. A second reagent\ncontaining monoclonal antibody and a second\nfragment of β-galactosidase called the enzyme\nacceptor (EA) is added. If the antibody is neutralized\nby drug from the sample, the ED and EA combine\nforming an active enzyme. The concentration of drug\nin the sample is directly proportional to the amount\nof chlorophenol red formed.","difficulty":3},{"id":"HARR-5.9-Q028","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Which statement is true regarding particle-enhanced turbidimetric inhibition immunoassay methods for therapeutic drugs?","options":["Drug concentration is proportional to light scatter","Magnetic separation is needed to remove unbound conjugate","When particle-bound drug binds to antibody, light scattering is increased","Two antibodies to the drug are needed"],"answer":"C","rationale":"Particle-enhanced turbidimetric inhibition\nimmunoassays are homogenous immunoassays\nfrequently used to measure proteins and therapeutic\ndrugs in serum or plasma. Polystyrene-modified latex\nparticles conjugated to the drug (particle-bound\ndrug) compete with drug in the sample for a limited\nnumber of antibodies. If drug concentration is low,\nmore of the antibody binds to the particle-bound\ndrug, increasing the turbidity of the reaction.\nTherefore, light scattering is inversely proportional \nto the drug concentration.","difficulty":4},{"id":"HARR-5.9-Q029","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Quantitation of a drug by gas chromatography–mass spectroscopy (GC-MS) is usually performed in which mode?","options":["Total ion chromatography","Selective ion monitoring","Ion subtraction","Selective reaction monitoring"],"answer":"B","rationale":"Most GC-MS instruments use an electron beam to\nsplit the drug emerging from the column into its\ncomponent ions. These are drawn into the mass\nanalyzer, usually a vacuum chamber containing two\npairs of charged rods (a positive pair and a negative\npair) called a quadrupole analyzer. By changing the\npotential and radio frequency applied to the rods, \nthe travel of ions will vary depending upon their \nmass to charge (m/z) ratio. As ions emerge from the\nmass filter, they are detected by an electron multiplier\ntube. CG-MS instruments can be operated in two\nmodes, total ion chromatography and selective ion\nmonitoring. A total ion chromatograph displays \nthe retention time of all ions detected and their\nabundance. It is primarily used for identification \nof unknown compounds. SIM mode measures the\nabundance of one or more principal ions that\nprovides sufficient specificity to eliminate potential\ninterfering substances and greater quantitative\nsensitivity. For example, tetrahydrocannabinol (THC)\ncan be identified by ions m/z 371.3, 372.3, and 473.3.","difficulty":5},{"id":"HARR-5.9-Q030","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"SITUATION: A urine sample is received in the laboratory with the appropriate custody control form, and a request for drug of abuse screening. Which test result would be cause for rejecting the sample?","options":["Temperature after collection 95°F","pH 5.0","Specific gravity 1.005","Creatinine 5 mg/dL"],"answer":"D","rationale":"Approximately 5 per 1,000 urine samples received \nfor DAU testing have been adulterated by either\ndilution, substitution, or addition of substances \nsuch as glutaraldehyde that interfere with testing. \nThe majority of these situations can be detected \nby determining temperature (90°F–100°F) pH \n(4.5–8.0), specific gravity (1.003–1.019), and creatinine\n(≥20 mg/dL). All of the values listed are within the\nlimits of an acceptable sample with the exception \nof creatinine. Dry reagent strips are available that \ntest for pH, specific gravity, creatinine, nitrite,\nperoxide, pyridinium, and glutaraldehyde.","difficulty":5},{"id":"HARR-5.9-Q031","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Which substance has the longest detection time?","options":["Amphetamines","Cocaine","Benzodiazepines","Marijuana"],"answer":"D","rationale":"Some drugs have a long half-life, and can be\ndetected for longer periods after use, but the\ndetection window also depends on other variables\nsuch as dosage, frequency of use, and method\nsensitivity. Marijuana is stored in fatty tissue and is\nmetabolized slowly. In persons who use marijuana\nseveral times per week, cannabinoids can be\ndetected several weeks after last use. For chronic daily\nusers, this extends to months after discontinuation.\nOther drugs with detection windows of a week or\nmore include long-acting barbiturates, LSD, anabolic\nsteroids, and phencyclidine (PCP).","difficulty":1},{"id":"HARR-5.9-Q032","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Which statement about the measurement of carboxyhemoglobin is true?","options":["Treatment with alkaline dithionite is used to convert carboxyhemoglobin to oxyhemoglobin","Oxyhemoglobin has no absorbance at 540 nm, but carboxyhemoglobin does","Bichromatic analysis is required in order to eliminate interference by oxyhemoglobin","Carboxyhemoglobin can be measured by potentiometry"],"answer":"C","rationale":"The absorbance spectras of oxy- and\ncarboxyhemoglobin pigments overlap, and\nbichromatic or multichromatic analysis is required\nin order to accurately measure carboxyhemoglobin.\nIn bichromatic analysis, oxyhemoglobin \nand methemoglobin are converted to\ndeoxyhemoglobin by the addition of alkaline\nsodium dithionite. The ratio of absorbance at\n541:555 nm is directly proportional to\ncarboxyhemoglobin concentration. Percent\ncarboxyhemoglobin is commonly determined \nfrom simultaneous absorbance measurements \nat 548, 568, and 578 nm, or other wavelength\ncombinations, a process called oximetry.","difficulty":2},{"id":"HARR-5.9-Q033","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Which of the following statements about blood alcohol measurement is correct?","options":["Symptoms of intoxication usually begin when the level exceeds 0.05% w/v","The skin puncture site should be disinfected with isopropanol","The reference method is based upon enzymatic oxidation of ethanol by alcohol dehydrogenase","Gas chromatography methods require extraction of ethanol from serum"],"answer":"A","rationale":"Alcohol dehydrogenase is not specific for ethanol,\nand in vitro interference can occur with some ADH\nmethods when skin is disinfected with other alcohols.\nFor this reason, and to avoid interference with the\ninterpretation of chromatograms for volatiles, blood\nsamples are collected after disinfecting the skin site\nwith benzalkonium chloride or other nonalcohol\nantiseptic. GLC is the legally accepted method of\nethanol analysis. The low boiling point of ethanol\npermits direct analysis on blood or plasma diluted\nwith water containing 1-propanol or other suitable\ninternal standard.","difficulty":3},{"id":"HARR-5.9-Q034","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Which specimen is the sample of choice for lead screening?","options":["Whole blood","Hair","Serum","Urine"],"answer":"A","rationale":"Lead accumulates in RBCs, bones, and neural tissues,\nand whole blood, hair, and urine are suitable for\ndemonstrating lead toxicity. Greatest sensitivity is\nobtained by using whole blood, which can detect\nexposure over time. Because lead is rapidly\neliminated from plasma, serum or plasma should \nnot be used to test for lead exposure. Lead binds \nto sulfhydryl groups of proteins such as \ndelta-aminolevulinic acid (Δ-ALA) dehydratase \nand ferrochelatase and interferes with heme\nsynthesis. This results in increased free erythrocyte\nprotoporphyrin, erythrocyte zinc protoporphyrin,\nurinary coproporphyrin III, and δ aminolevulinic acid,\nwhich are also useful markers for lead poisoning.\nWhen screening for lead poisoning in children, the\nmethod of choice is graphite furnace atomic\nabsorption spectrophotometry or inductively\ncoupled plasma mass spectroscopy because they\noffer the best analytical sensitivity. The CDC cutoff for\nnormal lead in children is less than 5.0 μg/dL.","difficulty":5},{"id":"HARR-5.9-Q035","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Which of the following enzymes can be used to measure plasma or serum salicylate?","options":["Peroxidase","Salicylate esterase","Salicylate hydroxylase","p-Aminosalicylate oxidase"],"answer":"C","rationale":"The enzymatic assay of salicylate uses salicylate\nhydroxylase, which reduces salicylate with NADH \nand forms catechol and NAD+. Salicylate can also be\nmeasured by HPLC and various immunoassays\nincluding EMIT. Salicylate toxicity causes an initial\nrespiratory alkalosis because the drug stimulates the\nrespiratory center. However, this is followed by\nmetabolic acidosis as the drug is metabolized.\nTherefore, it is imperative to identify salicylate as the\ncause of toxicity before treatment of an acid–base\nimbalance caused by aspirin overdose.","difficulty":4},{"id":"HARR-5.9-Q036","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Which of the following tests is least essential to the operation of an emergency department at a general hospital?","options":["Carboxyhemoglobin","Osmolality","Salicylate","Lead"],"answer":"D","rationale":"The vast majority of acute toxicology situations seen\nin the emergency department  (ED) involve\npoisoning with alcohol, acetaminophen, salicylate,\nabuse substances, or carbon monoxide. Emergency\ndepartments should offer a minimum of these tests.\nIn the absence of specific tests for abuse substances\nor a comprehensive drug screen, the serum\nosmolality measured by freezing point depression \nis a sensitive surrogate test for drug and alcohol\noverdose. In the ED environment, a difference\nbetween measured and calculated osmolality greater\nthan 10 mOsm/Kg almost always indicates drug or\nalcohol poisoning. Toxicity from lead poisoning and\nmost other trace metals is usually a chronic condition\nthat does not often require immediate access to\nlaboratory testing.","difficulty":5},{"id":"HARR-5.9-Q037","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Which of the following trace elements is considered an essential micronutrient?","options":["Thallium","Aluminum","Mercury","Selenium"],"answer":"D","rationale":"Trace elements can be divided into two categories,\nthose that have no known biological purpose and\nthose that do. The former include thallium, mercury,\nlead, cadmium, and aluminum. All others can be\nconsidered essential, including arsenic that has been\nshown necessary for normal methionine metabolism.\nMost trace elements are of medical importance\nbecause excessive levels lead to toxicity. However, a\ndeficiency of trace elements such as selenium, zinc,\nand copper are commonly caused by total parenteral\nnutrition and are medically important.","difficulty":2},{"id":"HARR-5.9-Q038","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"When measuring trace metals in blood other than lead, what type of tube should be used?","options":["Navy blue top","Green top","Purple top","Red top"],"answer":"A","rationale":"In order to avoid trace contamination by metals\npresent in the stopper lubricants, a tube with a navy\nblue top is used for measuring trace metals. These\ntubes are validated for most but not all trace metals.\nSuch tubes are available with or without EDTA for\nserum or whole-blood analysis, respectively. Tubes\nwith tan stoppers containing EDTA are used for lead\nassay because they are certified to contain no more\nthan 0.25 μg/dL lead. In addition, type 1 purity water\n(10 Mohm, 10 or less CFU/mL) and analytical reagent\ngrade chemicals are always used to prepare reagents\nsuch as matrix modifiers. Although most trace metals\nare measured in whole blood or serum, arsenic is\nusually measured in urine because it is metabolized\nand excreted within hours of ingestion.","difficulty":3},{"id":"HARR-5.9-Q039","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"Which whole-blood level is suggestive of excessive exposure to lead in children but not adults?","options":["4 μg/dL","14 μg/dL","28 μg/dL","32 μg/dL"],"answer":"B","rationale":"Because lead exposure in children leads to learning\nimpairment, the cutoff for exposure recommended by\nthe Centers for Disease Control is 5 μg/dL in venous\nwhole blood. Values of 5 μg/dL or more should be\nmonitored closely with follow-up testing, and if they\nincrease, steps should be taken to remove lead\ncontamination from the home and environment. For\nadults the recommended cutoff is 25 μg/dL. Because\nlead readily enters the red blood cells, and passes\nfrom plasma to urine quickly, whole blood is a more\nsensitive measure of exposure than plasma. Because\nlead from the fingers may contaminate the specimen,\na venous sample is preferred over a capillary sample\ncollected by finger stick.","difficulty":4},{"id":"HARR-5.9-Q040","topic":"5.9 Toxicology and Therapeutic Drug Monitoring","question":"What are the likely laboratory findings in a person suspected of having Wilson’s disease?","options":["Blood copper and ceruloplasmin low, urinary copper excretion high","Blood and urine copper concentration high, ceruloplasmin low","Blood and urine copper concentration high, ceruloplasmin high","Blood and urine copper concentration low, ceruloplasmin low"],"answer":"A","rationale":"Wilson’s disease is an autosomal recessive disease in\nwhich copper transport is abnormal. The gene causing\nthe disease codes for an ATPase (called Wilson’s protein\nor ATP7B) that is needed to excrete copper into bile and\nincorporate copper into ceruloplasmin. There are over\n200 reported mutations of this gene. The absence of\nWilson’s protein results in failure to load ceruloplasmin\nwith copper, dramatically reducing its half-life in blood.\nTherefore, blood levels of ceruloplasmin are low, and\nblood levels of copper are usually low because there is\nlittle ceruloplasmin to bind it. Copper deposits in\ntissues, particularly the liver and brain, causing necrosis,\nand excess is excreted in the urine.","difficulty":4},{"id":"HARR-5.10-Q001","topic":"5.10 Tumor Markers","question":"Which of the following tumor markers is classified as a tumor suppressor gene?","options":["BRCA-1","Carcinoembryonic antigen (CEA)","Human chorionic gonadotropin (hCG)","Nuclear matrix protein"],"answer":"A","rationale":"Tumor markers may be enzymes, hormones,\nreceptors, oncofetal (glycoprotein) antigens, or\noncogenes. BRCA-1 is located on the long arm of\nchromosome 17 and carries an 85% lifetime risk of\nbreast or ovarian cancer when present. Its product\nfunctions in DNA repair and slows cell proliferation.","difficulty":1},{"id":"HARR-5.10-Q002","topic":"5.10 Tumor Markers","question":"In general, in which of the following situations is the analysis of a tumor marker most useful?","options":["Testing for recurrence","Prognosis","Screening","Diagnosis"],"answer":"A","rationale":"Most tumor markers are expressed at very low levels\nso that the concentration in early malignancy\noverlaps that seen in normal individuals. This makes\nthem ineffective for screening. Three exceptions are\nhCG in males for testicular cancer, calcitonin for\nthyroid medullary cancer, and prostate-specific\nantigen (PSA) for prostate cancer. Most tumor\nmarkers are increased in nonmalignant disease, \nand this nonspecificity reduces their usefulness \nfor diagnosis of malignancy. In addition to the \nthree markers mentioned, the hormones insulin\n(insulinoma), gastrin (gastrinoma), and prolactin\n(prolactinoma), and the catecholamines\n(pheochromocytoma) have some diagnostic utility.\nSome tumor markers are useful predictors of disease\nprogression and response to treatment. These\ninclude BRCA-1, estrogen and progesterone\nreceptors, cathepsin-D, and the Philadelphia\nchromosome. The major use of tumor markers is \nto monitor recurrence and therapy. Successful\ntreatment reduces the concentration of the marker\nsignificantly or results in an undetectable level. A rise\nin level following treatment signals recurrence.","difficulty":4},{"id":"HARR-5.10-Q003","topic":"5.10 Tumor Markers","question":"Which of the following enzymes is increased in persons with prostate and small-cell lung cancer?","options":["Creatine kinase-1 (CK-1)","Gamma glutamyl transferase (GGT)","Amylase","Lactate dehydrogenase"],"answer":"A","rationale":"CK-1 (CK-BB) is not normally found in plasma or\nserum except in neonates. It may be present in\npersons with central nervous system damage and\nsome other disorders but its presence is often\nassociated with various malignancies, especially\nprostate cancer and small-cell carcinoma of the lung.\nSeveral other commonly measured enzymes are\nelevated by malignancy. ALP and LD are associated\nwith various tumors. GGT levels are very high in\nhepatoma, and amylase is elevated in pancreatic\ncancer.","difficulty":1},{"id":"HARR-5.10-Q004","topic":"5.10 Tumor Markers","question":"Which of the following is the best analyte to monitor for recurrence of ovarian cancer?","options":["CA-15-3","CA-19-9","CA-125","CEA"],"answer":"C","rationale":"CA-125 is an oncofetal antigen, meaning that it \nis produced by genes that are active during \nfetal development but minimally active after \nbirth except in malignant tissues. This group\nincludes α-fetoprotein (AFP), CEA, PSA, and the\ncarbohydrate-associated antigens (CA). CA-15-3\n(which shares the same antigenic determinant as\nCA-27.29) is used mainly to monitor breast cancer\ntreatment and recurrence. CA-19-9 (which shares\nthe same antigenic determinant as CA-50) is a\nglycoprotein shed from the surface of gastric,\npancreatic, and colorectal cancer cells.","difficulty":2},{"id":"HARR-5.10-Q005","topic":"5.10 Tumor Markers","question":"Which tumor marker is associated with cancer of the urinary bladder?","options":["CA-19-9","CA-72-4","Nuclear matrix protein","Cathepsin-D"],"answer":"C","rationale":"Nuclear matrix proteins (NMPs) are RNA-protein\ncomplexes. NMP-22 is shed into the urine in persons\nwith bladder carcinoma and is about 25-fold higher\nthan normal in this condition. It has a clinical\nsensitivity of about 70% but is likely to be negative\nwhen the tumor is low grade. Other markers used \nfor detection of bladder cancer include bladder\ntumor associated analytes (BTAs), a variant of the\ncomplement factor H protein; cytokeratin-20, a\nvariant cytokeratin (fibrous protein) in the cytoplasm\nof malignant bladder epithelium; and telomerase, \nan enzyme that adds nucleotides to the ends of\nchromosomes, preventing telomere degradation. The\nspecificity of these tests varies from approximately\n75%–80%. Bladder cancer can also be detected by\nFISH because it is associated with a high incidence of\nploidy and other chromosomal abnormalities that\ncan be detected by fluorescent-labeled DNA \nprobes. FISH specificity is over 94%, and like the\nimmunoassays its sensitivity is higher for high-grade\ntumors (approximately 78% for grade 2 and 94% for\ngrade 3 cancers).","difficulty":3},{"id":"HARR-5.10-Q006","topic":"5.10 Tumor Markers","question":"A person presents with a cushingoid appearance and an elevated 24-hour urinary cortisol level. The plasma adrenocotropic hormone (ACTH) is very elevated, and the physician suspects the cause is ectopic ACTH production. Which test would be most useful in substantiating this diagnosis?","options":["Plasma cortisol","CA-50","Alkaline phosphatase isoenzymes","AFP"],"answer":"C","rationale":"Most often, ectopic ACTH production occurs in lung\ncancer. Tumors of the lung are often associated with\nthe production of placental-like alkaline phosphatase,\nand a positive finding would support the diagnosis of\nan ectopic (nonpituitary) source of ACTH. Many other\ntumor markers, including neuron-specific enolase\nand parathyroid hormone-related protein, are also\nincreased in lung cancers. CA-50 (along with CA-19-9)\nshares the same antigenic determinant as Lewis A\nand is a marker for recurrence and treatment of\ngastrointestinal and pancreatic cancers. AFP is the\npredominant protein produced by the fetus, and\nplasma levels are increased primarily in yolk sac, liver,\nand testicular tumors.","difficulty":5},{"id":"HARR-5.10-Q007","topic":"5.10 Tumor Markers","question":"Which of the following tumor markers is used to monitor persons with breast cancer for recurrence of disease?","options":["Cathepsin-D","CA-15-3","Retinoblastoma gene","Estrogen receptor (ER)"],"answer":"B","rationale":"CA-15-3 shares the same antigenic determinant as\nCA-27.29. Both are present on MUC1, a mucinous\nprotein on the cell membrane of various tissues. \nThe markers are used to monitor treatment and\nrecurrence of breast cancer. However, abnormal\nplasma levels are seen in many nonmalignant\nconditions, and the test is not used for diagnostic\npurposes. CA-125 is a glycoprotein antigen shed \nby approximately 75% of ovarian cancers. It is an \nFDA-approved tumor marker for monitoring\nrecurrence of ovarian cancer and evaluating the\neffectiveness of chemotherapy. Cathepsin-D and ER\nassays are performed to determine the prognosis of\npersons with breast cancer. Overexpression of\ncathepsin-D is associated with a higher relapse \nrate. Breast tissue that is negative for ER is poorly\nresponsive to hormone suppression (tamoxifen)\ntherapy. The retinoblastoma gene (RB) is a \ntumor-suppressor gene found to be missing in\npersons with retinoblastoma. Various mutations \nof the gene have been reported in breast, lung,\nbladder, and other cancers.","difficulty":4},{"id":"HARR-5.10-Q008","topic":"5.10 Tumor Markers","question":"Which of the following statements regarding the Philadelphia chromosome is true?","options":["It is seen exclusively in chronic myelogenous leukemia","It results from a translocation","It appears as a short-arm deletion of chromosome 21","It is associated with a poor prognosis"],"answer":"B","rationale":"The Philadelphia chromosome (Ph1) is formed by\ntranslocation of the long arms of chromosomes 9\nand 22. The result is that part of the ABL gene of\nchromosome 9 becomes inserted into the BCR\ngene of chromosome 22. The ABL gene is an\noncogene and the product of the hybrid gene is a\ntyrosine kinase that signals cell proliferation. \nThe Ph1 chromosome appears on karyotyping \nas a long-arm deletion of chromosome 22 \nbecause only the terminal end of the long arm of\nchromosome 9 is exchanged for most of the long\narm of chromosome 22. The BCR/ABL translocation\ncan be detected using FISH hybridization probes.\nApproximately 95% of persons with chronic\nmyelogenous leukemia have the Ph1 chromosome.\nThose patients who do not demonstrate Ph1","difficulty":2},{"id":"HARR-5.10-Q009","topic":"5.10 Tumor Markers","question":"What is the primary clinical utility of measuring CEA?","options":["Diagnosis of liver cancer","Diagnosis of colorectal cancer","Screening for cancers of endodermal origin","Monitoring for recurrence of cancer"],"answer":"D","rationale":"CEA is a glycoprotein that is secreted into plasma \nby various cancers of endodermal origin, including\nbreast, lung, colorectal, and stomach cancer.\nHowever, it is present in only 40%–60% of such\ncancers, is present at low levels (<3.0 ng/mL) in\nnormal adults, and is increased by causes other than\ncancer (e.g., smoking). Its clinical use is to detect\nrecurrence and the need for second-look surgery in\npersons who have been treated and to evaluate the\nresponse to treatment.","difficulty":1},{"id":"HARR-5.10-Q010","topic":"5.10 Tumor Markers","question":"Which tumor marker is used to determine the usefulness of trastuzuma
