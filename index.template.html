<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Clinical Chemistry Adaptive Exam | BenchBright Learning</title>
<style>
:root{--navy:#112b4d;--teal:#087f84;--lime:#b3e5d8;--ink:#1a3047;--muted:#66788a;--paper:#f4f8fb;--white:#fff;--border:#dfe9ed;--red:#b53b45;--green:#137b58;--shadow:0 20px 54px rgba(18,49,74,.09)}
*{box-sizing:border-box}html{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}body{margin:0}button{font:inherit;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}.wrap{max-width:1050px;margin:0 auto;padding:0 24px}.top{background:#fff;border-bottom:1px solid var(--border)}.nav{display:flex;align-items:center;justify-content:space-between;min-height:79px;gap:12px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy)}.brandmark{display:grid;place-items:center;width:42px;height:42px;background:linear-gradient(135deg,#2db6b4,#0c608e);border-radius:12px;color:#fff;font-size:26px;font-weight:850}.brandname{font-weight:820;font-size:21px;line-height:1;letter-spacing:-.03em}.brandname span{color:var(--teal)}.brand small{display:block;font-size:10px;letter-spacing:.20em;color:var(--muted);margin-top:7px;font-weight:750}.navtag{color:var(--teal);font-size:12px;font-weight:760;letter-spacing:.08em;text-transform:uppercase}.main{padding-top:42px;padding-bottom:64px}.panel{background:#fff;border:1px solid var(--border);box-shadow:var(--shadow);border-radius:24px;overflow:hidden}.hero{padding:54px 56px 38px;background:radial-gradient(circle at 93% 20%,rgba(137,224,210,.36),transparent 36%),linear-gradient(115deg,#102b4d,#194967);color:white}.eyebrow{display:inline-block;font-size:12px;letter-spacing:.12em;font-weight:850;text-transform:uppercase;color:#71eddf;margin:0 0 13px}.hero h1{font-size:clamp(32px,5vw,54px);max-width:660px;line-height:1.11;margin:0 0 19px;letter-spacing:-.04em}.hero p{font-size:17px;line-height:1.65;color:#daeaf4;max-width:670px;margin:0}.tagline{font-size:13px;letter-spacing:.06em;color:#bee7eb;margin-top:25px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:27px 35px;border-bottom:1px solid var(--border)}.stat{border-right:1px solid var(--border);padding:5px 17px}.stat:last-child{border:0}.stat strong{font-size:30px;line-height:1;display:block;color:var(--navy)}.stat small{font-size:12px;color:var(--muted);display:block;margin-top:9px}.content{padding:34px 46px 42px}h2{font-size:24px;letter-spacing:-.03em;margin:0 0 16px}h3{font-size:18px;margin:0}.features{display:grid;grid-template-columns:1fr 1fr;gap:13px 22px;margin:23px 0 28px}.feature{display:flex;gap:11px;align-items:flex-start;line-height:1.5;font-size:14px}.check{flex:none;border-radius:50%;background:#d9f5ed;color:var(--green);width:25px;height:25px;display:grid;place-items:center;font-weight:850}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:16px}.btn{background:var(--teal);color:white;padding:14px 24px;border:1px solid var(--teal);border-radius:12px;font-size:15px;font-weight:760;box-shadow:0 7px 16px rgba(8,127,132,.14)}.btn:hover:not(:disabled){background:#05686f}.btn.secondary{color:var(--navy);background:white;border-color:#aac4d1;box-shadow:none}.btn.secondary:hover:not(:disabled){background:#edf7f8}.note{margin-top:22px;color:var(--muted);font-size:12px;line-height:1.65}.footer{color:var(--muted);text-align:center;font-size:12px;line-height:1.6;margin-top:28px}.badge{display:inline-block;color:var(--teal);background:#e3f5f2;padding:7px 11px;border-radius:99px;font-size:11px;font-weight:850;letter-spacing:.05em}.examhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.examhead b{font-size:15px;color:var(--navy)}.progress{background:#eaf1f5;height:9px;border-radius:20px;overflow:hidden;margin-bottom:30px}.progress >div{height:100%;background:linear-gradient(90deg,#088991,#5ed5bc);transition:width .3s}.prompt{font-size:clamp(20px,3vw,29px);font-weight:760;line-height:1.36;white-space:pre-line;margin:21px 0 25px;letter-spacing:-.015em}.option{width:100%;text-align:left;background:white;border:1.5px solid var(--border);border-radius:13px;display:flex;gap:17px;align-items:flex-start;padding:17px 19px;margin:12px 0;color:var(--ink);line-height:1.5;transition:.15s}.option:hover{border-color:#6bbebc;background:#f2fbf9}.option.selected{border-color:#0a7d83;background:#e6f6f3;box-shadow:0 0 0 2px rgba(14,131,137,.11)}.option .letter{flex:0 0 28px;height:28px;border:1px solid #bdd2d7;border-radius:7px;display:grid;place-items:center;font-weight:750;color:var(--teal)}.option.selected .letter{background:var(--teal);border-color:var(--teal);color:white}.examfoot{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:25px}.muted{color:var(--muted);font-size:12px}.results-top{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:10px 0 30px}.resultbox{background:#f2f8fa;border:1px solid var(--border);border-radius:14px;padding:20px}.resultbox strong{display:block;color:var(--navy);font-size:29px}.resultbox small{display:block;font-size:12px;color:var(--muted);margin-top:5px}.results-table{width:100%;border-collapse:collapse;margin:18px 0 26px;font-size:13px}.results-table th{text-align:left;background:#ecf4f6;color:var(--navy)}.results-table th,.results-table td{padding:13px 12px;border-bottom:1px solid var(--border)}.topic-label{font-size:12px;color:var(--muted)}.review{margin-top:16px}.review details{border:1px solid var(--border);border-radius:12px;margin:9px 0;background:#fff;overflow:hidden}.review summary{cursor:pointer;padding:16px 19px;font-weight:680;line-height:1.35}.review .answerbody{padding:0 20px 19px;line-height:1.6;font-size:14px}.review .answerbody p{margin:7px 0}.good{color:var(--green)}.bad{color:var(--red)}.review-question{font-weight:650;white-space:pre-line}.review-options{padding-left:20px;margin:12px 0}.review-options li{margin:5px 0}.mini-line{font-size:12px;color:var(--muted)}.chartbar{background:#e9eff2;height:8px;width:100%;border-radius:10px;overflow:hidden}.chartbar>i{height:100%;display:block;background:var(--teal);border-radius:10px}.alert{background:#fff9e8;border:1px solid #f3df9c;border-radius:12px;color:#785d19;padding:13px 15px;font-size:13px;line-height:1.5;margin-top:20px}@media(max-width:700px){.nav{min-height:67px}.brandname{font-size:17px}.brandmark{width:36px;height:36px;font-size:20px}.navtag{display:none}.main{padding-top:17px}.wrap{padding:0 12px}.hero{padding:33px 25px}.hero p{font-size:15px}.stats{padding:18px 10px;gap:0}.stat{padding:6px 10px}.stat strong{font-size:23px}.stat small{font-size:11px}.content{padding:26px 20px}.features{grid-template-columns:1fr}.results-top{grid-template-columns:1fr}.examfoot{flex-wrap:wrap}.examfoot .btn{width:100%}h2{font-size:21px}.results-table{font-size:11px}.results-table th,.results-table td{padding:10px 5px}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><a class="brand" href="#" id="brand-home" aria-label="BenchBright Learning exam home"><span class="brandmark">✦</span><span class="brandname">Bench<span>Bright</span><small>LEARNING · PRACTICE · SUCCEED</small></span></a><span class="navtag">MLS / MLT (ASCP) practice</span></div></header>
<main class="main wrap"><div class="panel" id="app" aria-live="polite"><div class="content">Preparing your exam…</div></div><div class="footer">BenchBright Learning · Independent educational practice · Not affiliated with or endorsed by ASCP®<br>Practice ability estimates are provisional and do not predict ASCP certification results.</div></main>
<script type="application/json" id="question-data">__QUESTION_DATA__</script>
<script>
(()=>{'use strict';
const DATA=JSON.parse(document.getElementById('question-data').textContent);
const BANK=DATA.questions;const VERSION=DATA.version;const COUNT=Math.min(100,BANK.length);
const KEY='benchbright-chemistry-cat-v1';const app=document.getElementById('app');
const lookup=new Map(BANK.map(q=>[q.id,q]));
let state=null;let chosen=null;let showingResults=false;
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const shuffle=a=>{const z=[...a];for(let i=z.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[z[i],z[j]]=[z[j],z[i]]}return z};
const sigmoid=x=>1/(1+Math.exp(-Math.max(-20,Math.min(20,x))));
const bval=q=>(Number(q.difficulty)-3)*.85;
function posterior(answered){const grid=[];let best=-Infinity;for(let theta=-4.0;theta<=4.001;theta+=.1){let lp=-(theta*theta)/(2*1.25**2);for(const a of answered){let q=lookup.get(a.id);if(!q)continue;let p=sigmoid(theta-bval(q));lp+=a.correct?Math.log(Math.max(1e-12,p)):Math.log(Math.max(1e-12,1-p))}grid.push([theta,lp]);best=Math.max(best,lp)}let w=0,m=0,second=0;for(let [t,p] of grid){let z=Math.exp(p-best);w+=z;m+=t*z;second+=t*t*z}m/=w;return {theta:m,se:Math.sqrt(Math.max(.00001,second/w-m*m))}}
function quotas(){let cats=[...new Set(BANK.map(q=>q.topic))].sort();let raw=cats.map(t=>{let count=BANK.filter(q=>q.topic===t).length;return {t,n:count,w:count/BANK.length*COUNT}});let remaining=COUNT;raw.forEach(x=>{x.target=Math.min(x.n,Math.floor(x.w));remaining-=x.target});raw.sort((a,b)=>(b.w-b.target)-(a.w-a.target));while(remaining>0){let found=false;for(const x of raw){if(x.target<x.n){x.target++;remaining--;found=true;if(!remaining)break}}if(!found)break}return shuffle(raw.flatMap(x=>Array(x.target).fill(x.t)))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(_){}}
function load(){try{let st=JSON.parse(localStorage.getItem(KEY));if(st&&st.version===VERSION&&Array.isArray(st.answers)&&st.plan?.length===COUNT&&(!st.current||lookup.has(st.current.id))&&st.answers.length<=COUNT)return st}catch(_){}return null}
function choice(){const ix=state.answers.length;if(ix>=COUNT){state.completed=true;state.current=null;return}let topic=state.plan[ix], used=new Set(state.answers.map(a=>a.id));let pool=BANK.filter(q=>q.topic===topic&&!used.has(q.id));if(!pool.length){pool=BANK.filter(q=>!used.has(q.id))}if(!pool.length){state.completed=true;state.current=null;return}let theta=posterior(state.answers).theta;let scored=pool.map(q=>({q,dist:Math.abs(theta-bval(q))})).sort((a,b)=>a.dist-b.dist);let top=scored.slice(0,Math.min(14,scored.length));let weights=top.map(item=>Math.exp(-1.45*item.dist));let total=weights.reduce((a,b)=>a+b,0);let roll=Math.random()*total;let pick=top[top.length-1].q;for(let i=0;i<top.length;i++){roll-=weights[i];if(roll<=0){pick=top[i].q;break}}state.current={id:pick.id, order:shuffle([0,1,2,3])};chosen=null}
function fresh(){state={version:VERSION,startedAt:new Date().toISOString(),completed:false,answers:[],plan:quotas(),current:null};choice();save();showingResults=false;render()}
function sectionLabel(t){return t.replace(/^5\.\d+\s+/,'')}
function stat(k,v){return `<div class="stat"><strong>${esc(v)}</strong><small>${esc(k)}</small></div>`}
function renderStart(){const saved=load();const canResume=!!saved&&!saved.completed&&saved.current&&saved.answers.length<COUNT;return `<div class="hero"><span class="eyebrow">New · computerized adaptive practice</span><h1>Clinical Chemistry<br>Adaptive Exam</h1><p>Build confidence with an exam that selects your next question based on your previous answers. Designed for MLS / MLT (ASCP) chemistry review.</p><div class="tagline">A SMARTER WAY TO STUDY CLINICAL CHEMISTRY</div></div><div class="stats">${stat('Reviewed items available',BANK.length)}${stat('Questions per attempt',COUNT)}${stat('Difficulty bands',5)}</div><div class="content"><h2>Make every question count</h2><div class="features"><div class="feature"><span class="check">✓</span><span>Adaptive selection recalculates estimated ability after each response.</span></div><div class="feature"><span class="check">✓</span><span>Questions and answer choices are randomized with no repeats per attempt.</span></div><div class="feature"><span class="check">✓</span><span>Questions span ${new Set(BANK.map(q=>q.topic)).size} clinical chemistry sections.</span></div><div class="feature"><span class="check">✓</span><span>Full results, subject strengths and explanations at the end.</span></div></div><div class="actions"><button class="btn" id="new-exam">Start ${COUNT}-question exam →</button>${canResume?'<button class="btn secondary" id="resume">Resume saved exam</button>':''}</div><div class="note">This exam is for educational practice, not a certified or psychometrically calibrated ASCP test. Question difficulty is provisionally assigned and may not match actual exam difficulty. Your progress stays in this browser.</div></div>`}
function renderQuestion(){if(!state?.current){return `<div class="content"><p>No question is available. Please start a new attempt.</p><button class="btn" id="new-exam">Start again</button></div>`}let q=lookup.get(state.current.id),idx=state.answers.length;let choices=state.current.order.map((oi,pos)=>`<button type="button" class="option ${chosen===oi?'selected':''}" data-opt="${oi}" aria-pressed="${chosen===oi}"><span class="letter">${'ABCD'[pos]}</span><span>${esc(q.options[oi])}</span></button>`).join('');return `<div class="content"><div class="examhead"><b>Question ${idx+1} of ${COUNT}</b><span class="badge">${esc(sectionLabel(q.topic))}</span></div><div class="progress" aria-label="Exam progress"><div style="width:${100*idx/COUNT}%"></div></div><div class="muted">Select the single best answer. You cannot return to answered questions.</div><div class="prompt">${esc(q.question)}</div><div id="choices">${choices}</div><div class="examfoot"><span class="muted">${COUNT-idx-1} questions after this one</span><button class="btn" id="submit-answer" ${chosen===null?'disabled':''}>Submit &amp; continue →</button></div></div>`}
function duration(){return state?.startedAt?Math.round((Date.now()-new Date(state.startedAt).getTime())/60000):0}
function exportCsv(){const fields=['Question number','Question ID','Subject','Question','Selected option','Correct option','Correct','Difficulty','Rationale'];let lines=[fields,...state.answers.map((a,i)=>{let q=lookup.get(a.id);return [i+1,q.id,sectionLabel(q.topic),q.question,q.options[a.selected],q.options['ABCD'.indexOf(q.answer)],a.correct?'Yes':'No',q.difficulty,q.rationale]})].map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');let blob=new Blob(['\ufeff',lines],{type:'text/csv;charset=utf-8'});let url=URL.createObjectURL(blob);let link=document.createElement('a');link.href=url;link.download='BenchBright_Chemistry_CAT_results.csv';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function renderResults(){const correct=state.answers.filter(a=>a.correct).length,score=Math.round(correct/COUNT*100),p=posterior(state.answers);let cats=[...new Set(state.answers.map(a=>lookup.get(a.id).topic))].sort();let table=cats.map(t=>{let a=state.answers.filter(x=>lookup.get(x.id).topic===t),c=a.filter(x=>x.correct).length,perc=Math.round(c/a.length*100);return `<tr><td>${esc(sectionLabel(t))}</td><td>${c}/${a.length}</td><td style="min-width:100px"><div class="chartbar"><i style="width:${perc}%"></i></div><div class="mini-line">${perc}%</div></td></tr>`}).join('');let items=state.answers.map((a,i)=>{let q=lookup.get(a.id),correctText=q.options['ABCD'.indexOf(q.answer)],yourText=q.options[a.selected];return `<details><summary><span class="${a.correct?'good':'bad'}">${a.correct?'✓':'✕'}</span> Q${i+1}: ${esc(q.question.slice(0,115))}${q.question.length>115?'…':''}</summary><div class="answerbody"><p class="topic-label">${esc(sectionLabel(q.topic))} · provisional difficulty ${q.difficulty}/5</p><p class="review-question">${esc(q.question)}</p><ol type="A" class="review-options">${q.options.map(o=>`<li>${esc(o)}</li>`).join('')}</ol><p><b>Your answer:</b> <span class="${a.correct?'good':'bad'}">${esc(yourText)}</span></p><p><b>Correct answer:</b> <span class="good">${esc(correctText)}</span></p><p><b>Rationale:</b> ${esc(q.rationale)}</p></div></details>`}).join('');return `<div class="content"><span class="badge">Exam completed</span><h2 style="margin-top:12px">Your Clinical Chemistry Results</h2><div class="results-top"><div class="resultbox"><strong>${score}%</strong><small>${correct} of ${COUNT} correct</small></div><div class="resultbox"><strong>${p.theta>=0?'+':''}${p.theta.toFixed(2)}</strong><small>Estimated ability θ (practice only)</small></div><div class="resultbox"><strong>± ${p.se.toFixed(2)}</strong><small>Estimated standard error (provisional)</small></div></div><h3>Performance by subject</h3><table class="results-table"><thead><tr><th>Subject</th><th>Correct</th><th>Accuracy</th></tr></thead><tbody>${table}</tbody></table><div class="actions"><button class="btn" id="new-exam">Start another ${COUNT}-question attempt</button><button class="btn secondary" id="download">Download results CSV ↓</button></div><div class="alert">The difficulty settings are approximate rather than calibrated using student-response data. The θ estimate and score are learning indicators, not official ASCP scaled scores or pass/fail predictions.</div><div class="review"><h3>Review every question</h3><p class="muted">Expand an item to see your answer, the correct option, and its rationale. Answers are shown only after completing the exam.</p>${items}</div></div>`}
function render(){app.innerHTML=showingResults&&state?.completed?renderResults():state&&!state.completed?renderQuestion():renderStart();let newbtn=app.querySelector('#new-exam');if(newbtn)newbtn.addEventListener('click',fresh);let resume=app.querySelector('#resume');if(resume)resume.addEventListener('click',()=>{state=load();chosen=null;showingResults=false;render()});let sub=app.querySelector('#submit-answer');if(sub)sub.addEventListener('click',()=>{if(chosen===null)return;let q=lookup.get(state.current.id);let correct='ABCD'[chosen]===q.answer;state.answers.push({id:q.id,selected:chosen,correct});chosen=null;state.current=null;if(state.answers.length>=COUNT){state.completed=true;showingResults=true}else{choice()}save();render();window.scrollTo?.(0,0)});app.querySelectorAll('[data-opt]').forEach(el=>el.addEventListener('click',()=>{chosen=Number(el.dataset.opt);render()}));let dl=app.querySelector('#download');if(dl)dl.addEventListener('click',exportCsv)}
document.getElementById('brand-home').addEventListener('click',e=>{e.preventDefault();if(state&&!state.completed){if(!confirm('Leave this in-progress exam? Your answers will remain saved.'))return}state=null;showingResults=false;render()});
if(BANK.length<100){app.innerHTML='<div class="content"><h2>Question bank needs review</h2><p>This exam needs at least 100 approved questions. Update the CSV and rebuild the site.</p></div>';return}
state=load();if(state?.completed){showingResults=true;render()}else if(state){state=null;showingResults=false;render()}else render();
})();
</script>
</body>
</html>
